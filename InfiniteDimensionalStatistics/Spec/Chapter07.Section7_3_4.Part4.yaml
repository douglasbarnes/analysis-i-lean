  title: Hölder-restricted credible set with corrected L∞ diameter
  statement: "Let C̄_n=C_n∩B_n, where C_n is the 1-α credible set from Theorem 7.3.23 in M₀(w) for the posterior\
    \ Π_{γ,B}(·|Y) based on the uniform wavelet prior, and\n  B_n={f : ||f||_{C^γ}≤B}.\nIf Y∼P^Y_{f₀} for a fixed\
    \ f₀ satisfying the printed condition ||f₀||_{C^α([0,1])}<B, then\n  P^Y_{f₀}(f₀∈C̄_n)→1-α.\nMoreover, for any\
    \ sequence u_n→∞ as slowly as desired, the displayed credible-set diameter satisfies the officially corrected\
    \ bound\n  |C̄_n|_∞=O_{P^Y_{f₀}}((n/log n)^{-γ/(2γ+1)}u_n)."
  hypotheses:
    explicit:
    - C_n is the credible set from Theorem 7.3.23 in M₀(w).
    - The posterior Π_{γ,B}(·|Y) is based on the uniform wavelet prior of Proposition 7.3.15.
    - B_n={f:||f||_{C^γ}≤B}.
    - The printed truth condition is ||f₀||_{C^α([0,1])}<B.
    - u_n→∞ as slowly as desired.
    implicit:
    - The credible level is 1-α; the reuse of α in the printed Hölder regularity condition is retained and flagged.
    - The official erratum changes the diameter exponent to -γ/(2γ+1).
  quantifier_order:
  - Fix the credible level α, prior parameters γ,B and truth f₀; for every admissibly slow sequence u_n→∞, prove
    coverage and the stochastic diameter bound as n→∞.
  constants:
  - Credible level 1-α.
  - Hölder radius B.
  - Corrected exponent -γ/(2γ+1).

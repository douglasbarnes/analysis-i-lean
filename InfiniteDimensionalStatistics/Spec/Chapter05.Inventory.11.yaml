- id: ch5.eq.5_112
  kind: lemma
  book:
    number: Equation (5.112)
    pages:
    - 452
    section: 5.3.2
    equations:
    - '5.112'
  title: Equation (5.112)
  statement: If F[K] is supported in [−a,a], f is bounded with F[f]∈L¹, and F[ϕ] is nonzero, then K_h*f=g*K_h^*,
    where K_h^*=(K_h*F^{-1}(1_{[-a/h,a/h]}/F[ϕ]))~ and ~ denotes reflection.
  source_fidelity:
    transcription_status: verified_with_typographical_correction
    author_corrected_reading: The printed hypothesis says F[ϕ](x)=0 for all x; the computation and Exercise 5.3.6
      require F[ϕ](x)≠0 for all x (or at least on the relevant compact frequency interval).
  hypotheses:
    explicit:
    - K integrable, F[K] supported in [−a,a].
    - f bounded and F[f]∈L¹.
    - F[ϕ] nonzero on [−a/h,a/h].
    implicit:
    - Plancherel/Fourier inversion hypotheses as justified in Exercise 5.3.6.
  quantifier_order:
  - For every h>0 and x∈ℝ.
  constants:
  - Support radius a.
  dependencies:
    earlier_book: &id004 []
    chapter_local:
    - ch5.def.deconvolution_model
    later_book_uses:
    - Equations (5.113)–(5.114)
  proof_status:
    delegates_to_exercises:
    - Exercise 5.3.6
    contains_omitted_steps: true
    comment: ''
  notes_status: *id001
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Fourier.Convolution
      - Mathlib.MeasureTheory.Measure.CharacteristicFunction.Basic
      exact_equivalent: false
    repository: *id002
  likely_lean_representation:
    sketch: Fourier-transform proof of a deconvolution identity, first in L²/a.e. form then pointwise under L¹ Fourier
      assumptions.
    blockers:
    - Fourier inversion and division by a continuous nonzero characteristic function.
  difficulty: major-library
  pass: core
  issues_for_central_review:
  - The equality-to-zero hypothesis is a clear operative typo; retain the printed text and corrected reading explicitly.
  - 'Author-corrected reading recorded separately: The printed hypothesis says F[ϕ](x)=0 for all x; the computation
    and Exercise 5.3.6 require F[ϕ](x)≠0 for all x (or at least on the relevant compact frequency interval).'
  - 'Source-transcription status: verified_with_typographical_correction.'

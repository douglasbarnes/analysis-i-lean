    is fₙ(x,j)=n⁻¹∑ᵢK_j^*(x,Yᵢ).
  source_fidelity: *id003
  hypotheses:
    explicit:
    - Band-limited MRA (5.115).
    - F[ϕ] nonzero.
    - f/g deconvolution model.
    implicit:
    - Series convergence is uniform enough to define a bounded continuous kernel.
  quantifier_order:
  - For every j≥0 and x,y∈ℝ.
  constants:
  - Dyadic resolution j.
  dependencies:
    earlier_book: *id004
    chapter_local:

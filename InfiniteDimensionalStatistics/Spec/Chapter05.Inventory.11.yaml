  title: Equations (5.113)–(5.114)
  statement: Define the deconvolution kernel estimator fₙ(x,h)=n⁻¹∑ᵢK_h^*(x−Yᵢ). Equivalently fₙ(x,h)=(2π)⁻¹∫e^{-iux}[F[K](hu)/F[ϕ](u)](n⁻¹∑ᵢe^{iuYᵢ})du.
  source_fidelity: *id003
  hypotheses:
    explicit:
    - Deconvolution model and (5.112) hypotheses.
    - h>0.
    - Y_i i.i.d. with density g.
    implicit:
    - The inverse Fourier integral is absolutely or L² justified by the compact support and nonvanishing denominator.
  quantifier_order:
  - For every n≥1,h>0,x∈ℝ.
  constants:
  - 2π according to the book Fourier convention.
  dependencies:
    earlier_book: *id004
    chapter_local:
    - ch5.eq.5_112
    later_book_uses:
    - Theorem 5.3.6
    - Propositions 5.3.7–5.3.9
  proof_status: *id005

- id: ch5.lem.5_3_5
  kind: lemma
  book:
    number: Lemma 5.3.5
    pages:
    - 454
    - 456
    section: 5.3.2
    equations: []
  title: Lemma 5.3.5
  statement: Let ϕ be a probability measure with nonvanishing Fourier transform. Let K be even, in L¹∩L², integrate
    to one and have Fourier support in [−a,a], or let φ,ψ be the band-limited MRA functions of Theorem 4.2.9. Then
    the normalised classes H_j are uniformly bounded and there exist A,v<∞ such that sup_j sup_Q N(H_j,L²(Q),ε)≤(A/ε)^v
    for 0<ε≤A.
  source_fidelity:
    transcription_status: verified_with_typographical_correction
    author_corrected_reading: As in (5.112), the printed hypothesis F[ϕ](x)=0 must read F[ϕ](x)≠0.
  hypotheses:
    explicit:
    - All kernel/wavelet assumptions in the statement.
    - Q ranges over all Borel probability measures.
    implicit:
    - The H_j are those defined immediately before the lemma.
    - Uniform boundedness is in the pointwise envelope norm.
  quantifier_order:
  - There exist A,v depending only on K, or on φ,ψ.
  - For every j,Q,ε.
  constants:
  - A,v.
  dependencies:
    earlier_book:
    - Proposition 3.6.12 and embedding B^{1/2}_{2,1}→V²
    chapter_local:
    - ch5.def.delta_Hj
    - ch5.eq.5_115
    later_book_uses:
    - Theorem 5.3.6
    - Exercise 5.3.7
  proof_status: *id005
  notes_status: *id001
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Fourier.Convolution
      - Mathlib.MeasureTheory.Measure.CharacteristicFunction.Basic
      exact_equivalent: false
    repository: *id002
  likely_lean_representation:
    sketch: Show each H_j is a translate class of a uniformly bounded finite-2-variation function, then invoke a
      VC/variation covering theorem.
    blockers:
    - Besov-to-variation embedding and VC entropy.
    - Band-limited wavelets.
  difficulty: research-level
  pass: core
  issues_for_central_review:
  - Use the nonvanishing correction explicitly.
  - 'Author-corrected reading recorded separately: As in (5.112), the printed hypothesis F[ϕ](x)=0 must read F[ϕ](x)≠0.'
  - 'Source-transcription status: verified_with_typographical_correction.'
- id: ch5.thm.5_3_6
  kind: theorem
  book:
    number: Theorem 5.3.6
    pages:
    - 456
    - 457
    section: 5.3.2
    equations: []
  title: Theorem 5.3.6
  statement: Under Lemma 5.3.5, for bounded f, deconvolution estimator fₙ(·,j), and 2^j j≤Cn, there are L′,L″ such
    that (E‖fₙ−Efₙ‖∞^p)^{1/p}≤(L′/δ_j)(‖g‖∞^{1/2}∨1)√(2^j(j∨1)/n), and for u>0, P{‖fₙ−Efₙ‖∞≥(L″/δ_j)[(‖g‖∞^{1/2}∨1)√((1+u)2^j(j∨1)/n)+(1+u)2^j(j∨1)/n]}≤e^{-(1+u)(j∨1)}.
  source_fidelity: *id003
  hypotheses:
    explicit:
    - Lemma 5.3.5 assumptions.
    - f bounded, hence g bounded.
    - p∈[1,∞).
    - 2^j j≤Cn.
    - u>0 for the tail inequality.
    implicit:
    - The constants depend as specified on C,p,K or φ,ψ but not on f,n,j except through ‖g‖∞.
  quantifier_order:
  - For each p,C there exist L′,L″.
  - For all admissible n,j,u.
  constants:
  - L′,L″,δ_j.
  dependencies:
    earlier_book:
    - Corollary 3.5.8 and Talagrand inequality
    chapter_local:
    - ch5.lem.5_3_5
    - ch5.eq.5_113_5_114
    - ch5.eq.5_116_5_118
    later_book_uses:
    - Propositions 5.3.7–5.3.8
  proof_status: *id005
  notes_status: *id001
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Fourier.Convolution
      - Mathlib.MeasureTheory.Measure.CharacteristicFunction.Basic
      exact_equivalent: false
    repository: *id002
  likely_lean_representation:
    sketch: Apply uniform VC empirical-process moment and tail bounds to the δ_j-normalised deconvolution kernel
      class.
    blockers:
    - Empirical-process inequalities and exact variance calculations.
  difficulty: research-level
  pass: core
  issues_for_central_review: *id006

    - 80
    section: '2.6'
    equations: []
  title: RKHS of released integrated Brownian motion
  statement: The RKHS H_{W,k} of W_k is the Sobolev-type space of functions whose kth derivative is absolutely continuous
    and whose (k+1)st derivative is in L², with inner product ∑_{j=0}^k f^{(j)}(0)g^{(j)}(0)+∫f^{(k+1)}g^{(k+1)}.
  hypotheses:
    explicit:
    - k∈ℕ∪{0}.
    - Independent sum of integrated Brownian and release polynomial.
    implicit: []
  quantifier_order:
  - Boundary derivative sum j=0,…,k plus L² derivative term.

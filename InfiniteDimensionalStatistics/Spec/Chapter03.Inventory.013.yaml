  title: Randomisation characterisation of P-Donsker classes
  statement: Assume 𝓕 and each local difference class 𝓕′_δ are measurable and 𝓕 satisfies (3.257). Then 𝓕 is P-Donsker iff
    Z_P has a bounded e_P-uniformly continuous version and ν_{n,rad}⇒Z_P in ℓ∞(𝓕).
  transcription_status: exact-transcription

  title: Equivalences for uniform Donsker classes
  statement: For a uniformly bounded pointwise-countably-approximable class, UPG_f, uniform total boundedness plus uniform
    asymptotic equicontinuity of ν_n^P, the corresponding uniform Gaussian condition, and uniform Donsker are equivalent.
    Moreover P↦Law(G_P) is uniformly continuous from the FF-seminorm on probability measures to d_BL.
  transcription_status: exact-transcription
  hypotheses:

  title: UPG_f and UPG classes
  statement: A uniformly bounded 𝓕 is UPG_f if its P-motions are uniformly bounded and uniformly e_P-equicontinuous in expectation
    over all finitely supported P; it is UPG if the analogous property holds over all probability measures P.
  transcription_status: exact-transcription
  hypotheses:

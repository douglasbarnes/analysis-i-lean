- id: 6.4.9
  kind: theorem
  book:
    number: Theorem 6.4.9
    pages:
    - 535
    - 536
    section: 6.4.2
    equations: []
  title: Multiscale Besov Confidence Set
  statement: "Let \\(B,r>0\\), \\(\\sigma=1\\), and\n\\[\n F=\\{f:\\|f\\|_{B^r_{\\infty\\infty}([0,1])}\\le B\\\
    }.\n\\]\nChoose \\(j_n\\) by\n\\[\n 2^{j_n}\\asymp(n/\\log n)^{1/(2r+1)}\n\\]\nand choose the admissible weights\
    \ in (6.142) so that the printed condition is\n\\[\n \\frac{w_{j_n}}{\\sqrt{j_n}}=O(u_n).\n\\]\nThen\n\\[\n\
    \ \\sup_{f\\in F}|P_f^Y\\{f\\in C_n\\}-(1-\\alpha)|=o(1), \\tag{6.143}\n\\]\nand, uniformly over \\(F\\),\n\\\
    [\n |C_n|_\\infty\n =O_P\\!\\left((\\log n/n)^{r/(2r+1)}u_n\\right). \\tag{6.144}\n\\]\nThe same set can be\
    \ written coefficientwise as the threshold rule\n\\[\n C_n=\\left\\{f:\n |\\langle f,\\psi_{lk}\\rangle|\n \\ \
    le\\min\\!\\left(\\frac{z_\\alpha w_l}{\\sqrt n},\n                2^{-l(r+1/2)}u_n\\right)\n \\ \\text{for\
    \ all }l,k\\right\\}. \\tag{6.145}\n\\]"
  hypotheses:
    explicit:
    - B,r>0 and an S-regular wavelet basis is used with S>max(1/2,r).
    - w is admissible and satisfies the displayed relation at j_n.
    - u_n→∞.
    - The quantile is chosen so that P(||W||≤z_alpha)=1-alpha, or a continuity point is assumed.
    implicit: []
  quantifier_order:
  - For each fixed B,r,α and admissible sequences, as n→∞ the coverage error tends uniformly to zero and the diameter
    is uniformly stochastic of the displayed order.
  constants:
  - For each fixed B,r,α and admissible sequences, as n→∞ the coverage error tends uniformly to zero and the diameter
    is uniformly stochastic of the displayed order.
  dependencies:
    earlier_book:
    - wavelet characterisation of Besov and M0(w) norms
    chapter_local:
    - 6.4.multiscale_universal
    later_book_uses:
    - Exercise 6.4.2
    - sampling analogue immediately following
    - Theorem 7.3.23 quantile bootstrap
    - Chapter 8 adaptive confidence sets
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Split the wavelet coefficient sum at j_n; bound high frequencies by the Besov radius and low frequencies
      by the multiscale norm and weight growth.
    blockers: &id004
    - The OCR rendering of the condition at j_n drops the square-root bar in some text views; the proof confirms
      the intended ratio is `w_{j_n}/sqrt(j_n)`.
    - The proof writes `S>(1/2,r)`; interpret as S>max(1/2,r), but preserve this notation issue.
    - 'Typographical error in prose: `perceding`.'
    reusable_primitives:
    - multiscale-to-supnorm interpolation
  difficulty: research-level
  pass: core
  issues_for_central_review: *id004
- id: 6.4.sampling_multiscale
  kind: operative_example
  book:
    number: Sampling analogue after Theorem 6.4.9
    pages:
    - 536
    section: 6.4.2
    equations: []
  title: Sampling Multiscale Confidence Set
  statement: "In the i.i.d. sampling model, Theorem 5.2.16 gives the analogue\n\\[\n V_n=\\left\\{P:\\|P-P_n(j_n)\\\
    |_{M_0(w)}\n                 \\le z_\\alpha/\\sqrt n\\right\\},\n\\]\nwhere \\(z_\\alpha\\) is a \\(1-\\alpha\\\
    ) quantile of the \\(M_0(w)\\)-norm of the\n\\(P\\)-Brownian bridge. If \\(P\\) has a bounded density\n\\(f\\\
    in B^r_{\\infty\\infty}([0,1])\\), choose\n\\(2^{j_n}\\asymp(n/\\log n)^{1/(2r+1)}\\) and intersect \\(V_n\\\
    ) with a growing\n\\(B^r_{\\infty\\infty}\\)-ball. The text asserts an immediate analogue of\nTheorem 6.4.9:\
    \ asymptotically correct coverage and\n\\(L^\\infty\\)-diameter of near-minimax order\n\\((\\log n/n)^{r/(2r+1)}u_n\\\
    )."
  hypotheses:
    explicit:
    - The density is bounded and in the stated Besov class.
    - The projected empirical measure satisfies Theorem 5.2.16 in M0(w).
    - The Brownian-bridge quantile may depend on P; statistical feasibility of using it is not discussed in this
      unnumbered assertion.
    implicit: []
  quantifier_order:
  - For every fixed P in the class and admissible sequence, the asserted analogue follows asymptotically; uniformity
    requires the uniform version of Theorem 5.2.16.
  constants:
  - For every fixed P in the class and admissible sequence, the asserted analogue follows asymptotically; uniformity
    requires the uniform version of Theorem 5.2.16.
  dependencies:
    earlier_book:
    - Theorem 5.2.16
    chapter_local:
    - 6.4.9
    later_book_uses: []
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: false
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: A sampling-experiment version of Theorem 6.4.9, parameterised by a Brownian-bridge quantile functional.
    blockers: &id005

- id: 6.4.gwn_risk_stat
  kind: definition
  book:
    number: Equation (6.138)
    pages:
    - 533
    - 534
    section: 6.4.2
    equations: []
  title: Gaussian Projected Risk Statistic
  statement: "After creating two independent white-noise observations \\(dY_1,dY_2\\)\nwith variance \\(2\\sigma^2/n\\\
    ), let \\(\\tilde f_n\\) be based on \\(dY_1\\) and set\n\\[\n T_n(\\tilde f_n)=\n \\sum_{l\\le j-1,k}\n \\ \
    left(\\int_0^1\\psi_{lk}\\,dY_2-\\langle\\psi_{lk},\\tilde f_n\\rangle\\right)^2\n -\\frac{2\\sigma^2}{n}\\\
    ,2^j. \\tag{6.138}\n\\]\nThen, conditionally on \\(dY_1\\),\n\\[\n E_f^{(2)}T_n(\\tilde f_n)=\\|K_j(f-\\tilde\
    \ f_n)\\|_2^2.\n\\]"
  hypotheses:
    explicit:
    - The wavelet system is S-regular with S>r and has exactly 2^j coordinates through level j-1.
    - The two white-noise experiments are independent and each has variance parameter 2σ²/n after splitting.
    - The preliminary estimator is measurable with respect to the first experiment.
    implicit: []
  quantifier_order:
  - For every j,n,f and first-experiment realisation, the conditional expectation identity holds.
  constants:
  - For every j,n,f and first-experiment realisation, the conditional expectation identity holds.
  dependencies:
    earlier_book:
    - Gaussian sample splitting around (6.10)
    - orthonormal wavelet coordinates
    chapter_local:
    - 6.1.sample_split
    later_book_uses:
    - Theorem 6.4.8
    - Exercise 6.4.1
    - Chapter 8
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

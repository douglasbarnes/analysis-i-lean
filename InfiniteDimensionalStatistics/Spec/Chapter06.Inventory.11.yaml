      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: A finite sum of squared independent Gaussian coordinates minus its known noise trace; prove conditional
      unbiasedness coordinatewise.

- id: 6.4.8
  kind: theorem
  book:
    number: Theorem 6.4.8
    pages:
    - 534
    section: 6.4.2
    equations: []
  title: Gaussian Risk Confidence Set coverage
  statement: "Consider two independent white-noise experiments \\(dY_1,dY_2\\)\ngenerated from (6.3), with \\(f\\\
    in F\\subset L^2([0,1])\\), and let\n\\(\\tilde f_n\\) be based on \\(dY_1\\). Suppose\n\\[\n \\sup_{f\\in F}\\\
    |K_j(f-\\tilde f_n)-(f-\\tilde f_n)\\|_2^2\\le B(j).\n\\]\nLet \\(g\\sim N(0,1)\\) and\n\\[\n \\tau_n^2(f)=\\\
    frac{8\\sigma^2}{n}\\|K_j(f-\\tilde f_n)\\|_2^2\n +\\frac{4E g^4\\,\\sigma^4}{n^2}\\,2^j.\n\\]\nDefine\n\\[\n\
    \ C_n=\\left\\{f:\\|f-\\tilde f_n\\|_2\n \\le\\sqrt{z_\\alpha\\tau_n(f)+T_n(\\tilde f_n)+B(j)}\\right\\}. \\\n    tag{6.139}\n\\]\nThen, for every \\(n\\in\\mathbb N\\) and \\(z_\\alpha\\) large enough,\n\\[\n \\inf_{f\\in\
    \ F}P_f^Y\\{f\\in C_n\\}\\ge1-\\alpha. \\tag{6.140}\n\\]"
  hypotheses:
    explicit:
    - The two observations have the doubled variance arising from the splitting construction, as reflected in (6.138).
    - The bias bound is uniform over f∈F and holds for the random preliminary estimator.
    - All wavelet sums are finite through level j-1.
    - z_alpha is chosen sufficiently large as a function of alpha for Chebyshev's inequality.
    implicit: []
  quantifier_order:
  - ∀n, for every sufficiently large z_α (uniform in f), the coverage is at least 1-α.
  constants:
  - ∀n, for every sufficiently large z_α (uniform in f), the coverage is at least 1-α.
  dependencies:
    earlier_book:
    - Chebyshev inequality
    - Gaussian fourth moment
    - wavelet orthonormality
    chapter_local:
    - 6.4.1
    - 6.4.gwn_risk_stat
    later_book_uses:
    - Exercise 6.4.1
    - Theorem 8.3.5 / Chapter 8 adaptive confidence-set proofs
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Compute the conditional variance of the centred noncentral chi-square statistic exactly, then apply
      Chebyshev and the deterministic projection-bias inequality.
    blockers: &id002
    - The confidence radius depends on the candidate f via τ_n(f), creating set-valued measurability obligations.
    - The square root requires a nonnegative radicand; the theorem can be encoded more safely as a squared-norm
      inequality, but that is an equivalent reformulation requiring explicit approval.
    - The proof switches from `f̃_n` to `f̂_n` in one projection term; this is a notation typo.
    - The text cites `Theorem 3.1.9` as a Gaussian concentration improvement even though it says `Chapter 2`; the
      theorem number is in Chapter 3.
    reusable_primitives:
    - Gaussian L2 risk confidence set
  difficulty: research-level
  pass: core
  issues_for_central_review: *id002
- id: 6.4.multiscale_universal
  kind: definition
  book:
    number: Equations (6.141)-(6.142)
    pages:
    - 535
    section: 6.4.2
    equations: []
  title: Multiscale Universal Confidence Set
  statement: "For an admissible sequence \\(w=(w_l)\\) with\n\\(w_l/\\sqrt l\\to\\infty\\), the white-noise observation\
    \ satisfies\n\\[\n \\sqrt n\\,(Y^{(n)}-f)=W\\quad\\text{in }M_0(w). \\tag{6.141}\n\\]\nIf \\(z_\\alpha\\) is\
    \ a \\(1-\\alpha\\) quantile of\n\\(\\|W\\|_{M_0(w)}\\), define\n\\[\n W_n=\\left\\{f:\\|Y^{(n)}-f\\|_{M_0(w)}\n\
    \                 \\le z_\\alpha/\\sqrt n\\right\\},\n\\qquad\n B_n=\\{f:\\|f\\|_{B^r_{\\infty\\infty}}\\le\
    \ u_n\\},\n\\qquad\n C_n=W_n\\cap B_n, \\quad u_n\\to\\infty. \\tag{6.142}\n\\]"
  hypotheses:
    explicit:
    - w is admissible in the sense of Definition 5.2.13 and satisfies the extra divergence condition.
    - White noise is realised as a tight Borel Gaussian random variable in M0(w).
    - The quantile z_alpha exists; boundary mass at z_alpha affects exact equality.
    - u_n is deterministic, positive, and diverges.
    implicit: []
  quantifier_order:
  - For every 0<α<1 choose z_α from the fixed law of ||W||; for each n define W_n, B_n, and their intersection.
  constants:
  - For every 0<α<1 choose z_α from the fixed law of ||W||; for each n define W_n, B_n, and their intersection.
  dependencies:
    earlier_book:
    - Definition 5.2.13
    - Equation (5.86)
    - white-noise tightness in M0(w)
    chapter_local: []
    later_book_uses:
    - Theorem 6.4.9
    - Exercise 6.4.2
    - Theorem 7.3.23
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Use the Banach-space-valued white-noise identity and a deterministic Besov-ball predicate; define the
      random set by two norm inequalities.
    blockers: &id003 []

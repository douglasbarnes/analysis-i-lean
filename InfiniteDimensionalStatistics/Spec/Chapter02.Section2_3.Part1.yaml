  title: ψ₂ Orlicz norm
  statement: ‖ξ‖_{ψ₂}:=inf{c>0:E exp(ξ²/c²)≤2}; L_{ψ₂} is the class where this is finite.
  hypotheses:
    explicit:
    - ξ a real random variable.
    implicit:
    - The infimum is over positive real c and is a norm modulo almost-sure equality under the stated Orlicz convention.
  quantifier_order:
  - Threshold 2 is fixed.
  constants:

- id: definition-2-3-5
  kind: definition
  book:
    number: 2.3.5
    pages:
    - 40
    section: '2.3'
    equations: []
  title: Sub-Gaussian process relative to d
  statement: X is sub-Gaussian relative to a pseudometric d when every increment X(t)−X(s) is centred and E exp(λ(X(t)−X(s)))≤exp(λ²d(s,t)²/2)
    for all λ; a relaxed version permits a fixed prefactor C.
  hypotheses:
    explicit:
    - A real process X on T.
    - A pseudometric d.
    - Coordinate/increment measurability.
    implicit: []
  quantifier_order:
  - ∀s,t∈T ∀λ∈ℝ; optional universal prefactor C.

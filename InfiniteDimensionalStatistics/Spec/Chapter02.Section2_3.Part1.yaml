- id: lemma-2-3-1
  kind: lemma
  book:
    number: 2.3.1
    pages:
    - 38
    section: '2.3'
    equations: []
  title: Equivalent sub-Gaussian formulations
  statement: The Laplace bound, Gaussian tail bound, and finite ψ₂ norm imply each other with the explicit constants in the
    book; in particular a tail Pr(|ξ|≥t)≤2e^{-t²/(2σ²)} implies ‖ξ‖_{ψ₂}≤√6σ, and a centred ψ₂ variable is sub-Gaussian with
    proxy bounded by a universal multiple of ‖ξ‖_{ψ₂}².
  hypotheses:
    explicit:
    - ξ real; centring required for the MGF implication.
    - σ>0.
    implicit: []
  quantifier_order:
  - Explicit constants include √6 and the displayed book constants; quantifiers are ∀t>0 and ∀λ∈ℝ.
  constants:
  - Explicit constants include √6 and the displayed book constants; quantifiers are ∀t>0 and ∀λ∈ℝ.

  title: Sub-Gaussian random variable
  statement: A centred real random variable ξ is sub-Gaussian with variance proxy σ² when E exp(λξ)≤exp(λ²σ²/2) for every
    λ∈ℝ.
  hypotheses:
    explicit:
    - ξ measurable and integrable/centred.
    - σ≥0.
    implicit: []

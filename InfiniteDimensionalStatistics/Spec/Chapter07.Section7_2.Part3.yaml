  title: Grenander cdf at a jump point
  statement: "If a bounded nonincreasing density p₀ has a jump discontinuity at\nx₀∈(0,1), prove for the Grenander cdf F̂ₙ and empirical cdf Fₙ that\n  F̂ₙ(x₀)-Fₙ(x₀)=o_{P₀}(n^{-1/2}).\nUse the indicator direction h=1_[0,x₀], interpreted distributionally, and\nthe argument of Theorem 7.2.20."
  hypotheses:
    explicit:
    - p₀ bounded and nonincreasing.
    - x₀ is an interior jump point.
    implicit:
    - The distributional derivative of the indicator is a Dirac mass and preserves admissibility for a suitably signed small
      perturbation.
  quantifier_order:
  - As n→∞ at the fixed jump point x₀.

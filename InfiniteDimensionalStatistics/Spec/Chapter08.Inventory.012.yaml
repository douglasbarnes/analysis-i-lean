  title: Self-similar Sobolev sequence class
  statement: For s∈[s_min,s_max], 0<b<B, ε(s)∈(0,1], J₀∈ℕ and c(s)=16·2^{2s+1}, define S^s_{ε(s)}(b,B,J₀) by b≤‖f‖_{s,2}≤B
    and, for every J≥J₀, ∑_{k=⌈2^{J(1−ε(s))}⌉}^{2^J}f_k²≥c(s)‖f‖_{s,2}²2^{-2Js}.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - s in fixed compact interval
    - 0<b<B
    - 0<ε(s)≤1
    - J₀∈ℕ
    implicit:
    - The dyadic upper endpoint and ceiling convention are exact data.
  quantifier_order:
  - Fix parameters
  - define norm annulus
  - for all J≥J₀ impose packet lower bound
  constants:
  - c(s)=16·2^{2s+1}.

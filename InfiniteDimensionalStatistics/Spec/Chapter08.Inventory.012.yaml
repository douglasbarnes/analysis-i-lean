- id: ch8.theorem_8_3_15
  kind: theorem
  book:
    number: Theorem 8.3.15
    pages:
    - 646
    section: 8.3.3
    equations:
    - '8.3'
  title: Adaptive honest L∞ confidence bands for self-similar functions
  statement: Split the white-noise sample. Estimate smoothness from one half, undershoot it by v_n/log₂N, and use
    the other half to construct the multiscale band of (6.142). For u_n,v_n→∞ with v_n=o(log₂n), coverage is uniformly
    asymptotically exact 1−α over ⋃_{s∈[s_min,s_max]}Σ̃(s,ε), and for f in the s-class the diameter is O_{P_f}(ν_n
    B^{1/(2s+1)}(log n/n)^{s/(2s+1)}), where ν_n=max(u_n,2^{O(v_n)}) can diverge arbitrarily slowly.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - fixed 0<s_min≤s_max
    - B,ε,J₀ fixed
    - u_n,v_n→∞
    - v_n=o(log₂n)
    - sample split into independent halves
    implicit:
    - The band uses a measurable multiscale norm and a lower smoothness estimate.
  quantifier_order:
  - Fix α and tuning sequences
  - construct ŝ_n and s̃_n
  - construct C_n
  - take uniform coverage limit
  - for each s assert diameter order
  constants:
  - Hidden constants depend on the smoothness window, ε,J₀,σ and basis.
  dependencies:
    earlier_book:
    - Theorem 6.4.9
    - equation (6.142)
    - Theorem 2.7.1 for the alternative exercise construction
    chapter_local:
    - ch8.self_similar_holder_class_8_86
    - ch8.smoothness_estimator_8_83_85
    - ch8.lemma_8_3_13
    later_book_uses:
    - ch8.exercise_8_3_1
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: false
  equivalents:
    mathlib:
      status: infrastructure-only; no exact equivalent located
      candidates:
      - Asymptotics.IsLittleO
      - Filter.Tendsto
      - Metric.diam
      - Measure.map
      exact_equivalent: false
      assessment: No exact equivalent. The result is a nonparametric minimax/adaptation statement absent from mathlib;
        only general probability, finite sums, norms, and asymptotic notation are reusable.
      audit_profile: adaptive_inference
    repository:

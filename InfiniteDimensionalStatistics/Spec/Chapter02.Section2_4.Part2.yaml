- id: theorem-2-4-7
  kind: theorem
  book:
    number: 2.4.7
    pages:
    - 53
    section: '2.4'
    equations: []
  title: Berman Gaussian comparison inequality
  statement: For centred unit-variance Gaussian vectors X,Y with covariance matrices C¹,C⁰ and ρᵢⱼ=max(|C⁰ᵢⱼ|,|C¹ᵢⱼ|), the
    difference of lower-orthant probabilities is bounded by the stated sum over i<j of covariance differences divided by √(1−ρᵢⱼ²),
    times exp(−(threshold_i²+threshold_j²)/(2(1+ρᵢⱼ))). The theorem also gives the absolute symmetric-rectangle bound (2.56)
    with factor 2/π and |C¹−C⁰|.
  hypotheses:
    explicit:
    - Finite vectors.
    - Centred jointly Gaussian.
    - Unit marginal variances.
    - Threshold vectors as in (2.55) and (2.56).
    - ρᵢⱼ<1 where denominators are used; limiting convention otherwise.
    implicit: []
  quantifier_order:
  - 1/(2π) in one-sided bound; 2/π in symmetric rectangle bound; exact exponential denominator 2(1+ρᵢⱼ).
  constants:
  - 1/(2π) in one-sided bound; 2/π in symmetric rectangle bound; exact exponential denominator 2(1+ρᵢⱼ).
  dependencies:
    earlier_book: []
    chapter_local:

- id: theorem-2-4-8
  kind: theorem
  book:
    number: 2.4.8
    pages:
    - 55
    section: '2.4'
    equations: []
  title: Slepian's lemma
  statement: Let X,Y be centred Gaussian vectors with EXᵢ²=EYᵢ² and E(XᵢXⱼ)≤E(YᵢYⱼ) for all i,j. Then for all thresholds λᵢ,
    Pr(∩ᵢ{Yᵢ>λᵢ})≤Pr(∩ᵢ{Xᵢ>λᵢ}), and E maxᵢYᵢ≤E maxᵢXᵢ.
  hypotheses:
    explicit:
    - Finite centred Gaussian vectors.
    - Equal coordinate variances.
    - Covariance order entrywise.
    - Arbitrary real thresholds.
    implicit: []
  quantifier_order:
  - No multiplicative constant in the maximum comparison.
  constants:
  - No multiplicative constant in the maximum comparison.

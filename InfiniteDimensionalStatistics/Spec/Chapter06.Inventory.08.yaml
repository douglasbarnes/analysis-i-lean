      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Perturb the uniform density by a finite wavelet hypercube, verify positivity, unit mass and Besov membership,
      and invoke Fano.
    blockers: &id001
    - The proof cites the embedding `B^r_{pq} ⊂ B^r_{q∞}` in the OCR/print reading; standard Besov indexing suggests
      this cross-reference requires review. The statement's constant suppresses possible p,q dependence.
    - Official hardback errata corrects the proof reference on p.520 from `(6.14)` to `(6.16)`.
    reusable_primitives:
    - density Lp minimax rate
  difficulty: research-level

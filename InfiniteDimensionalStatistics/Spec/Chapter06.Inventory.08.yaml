- id: 6.3.9
  kind: theorem
  book:
    number: Theorem 6.3.9
    pages:
    - 520
    - 521
    section: 6.3.3
    equations: []
  title: Besov Density lp minimax Rate unit Interval
  statement: 'Let \(B>1\), \(r>0\), \(1\le p<\infty\), \(1\le q\le\infty\). For

    probability densities on \([0,1]\) in the ball

    \[

    F=\{f:\|f\|_{B^r_{pq}([0,1])}\le B\},

    \]

    the minimax \(L^p\)-risk rate from \(n\) i.i.d. observations is

    \[

    r_n=Cn^{-r/(2r+1)},

    \]

    where the printed statement says \(C\) depends on \(B,r\).'
  hypotheses:
    explicit:
    - B>1, r>0, 1≤p<∞, 1≤q≤∞.
    - F consists only of nonnegative unit-integral representatives.
    - A regular wavelet system with interior mean-zero wavelets is used.
    implicit: []
  quantifier_order:
  - For every allowed B,r,p,q, the displayed sequence is minimax. Constants are uniform in n and f.
  constants:
  - For every allowed B,r,p,q, the displayed sequence is minimax. Constants are uniform in n and f.
  dependencies:
    earlier_book:
    - Proposition 5.1.7
    - Theorem 4.3.2
    - Varshamov-Gilbert packing
    chapter_local:
    - 6.3.2
    - 6.3.8
    - 6.1.tensor_kl
    later_book_uses:
    - Theorem 6.3.10
    - Exercise 6.3.3
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

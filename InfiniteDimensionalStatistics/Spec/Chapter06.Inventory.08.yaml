- id: 6.4.2
  kind: definition
  book:
    number: Definition 6.4.2
    pages:
    - 524
    section: 6.4.1
    equations: []
  title: Minimax Optimal Confidence Set
  statement: "An honest confidence set \\(C_n\\) is minimax optimal when its diameter\nshrinks at the minimax estimation\
    \ rate \\(r_n\\): for every \\(\\alpha'>0\\) there\nexists \\(M=M(\\alpha')\\) such that, for every \\(n\\in\\\
    mathbb N\\),\n\\[\n \\sup_{f\\in F}P_f\\{|C_n|_d>Mr_n\\}<\\alpha'. \\tag{6.118}\n\\]"
  hypotheses:
    explicit:
    - C_n is honest in the sense of Definition 6.4.1.
    - r_n is a minimax rate in d-risk over F in the sense of Definition 6.3.1.
    - The diameter random variable is measurable.
    implicit: []
  quantifier_order:
  - ∀α'>0, ∃M>0 depending only on α' and the model, ∀n, ∀f∈F, the tail probability is <α'.
  constants:
  - ∀α'>0, ∃M>0 depending only on α' and the model, ∀n, ∀f∈F, the tail probability is <α'.
  dependencies:
    earlier_book:
    - Definition 6.3.1
    chapter_local:
    - 6.4.1
    - 6.4.diameter
    later_book_uses:
    - Corollary 6.4.7
    - Exercise 6.4.1
    - Section 8.3

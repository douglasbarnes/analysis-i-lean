- id: 6.4.generic_ball
  kind: operative_example
  book:
    number: Construction (6.117)
    pages:
    - 523
    - 524
    section: 6.4.1
    equations: []
  title: Confidence Ball of uniform Risk
  statement: "Suppose an estimator \\(\\tilde f_n\\) satisfies\n\\[\n \\sup_{f\\in F}E_f d(\\tilde f_n,f)\\le Cr_n.\n\
    \\]\nIf the quantity \\(Cr_n\\) is known, the book writes\n\\[\n C_n=[\\tilde f_n-LCr_n,\\tilde f_n+LCr_n].\
    \ \\tag{6.117}\n\\]\nFor \\(L=L(\\alpha)\\) large enough, Markov's inequality gives\n\\[\n \\inf_{f\\in F}P_f\\\
    {f\\in C_n\\}\\ge\n 1-\\frac{\\sup_{f\\in F}E_fd(\\tilde f_n,f)}{LCr_n}\\ge1-\\alpha,\n\\]\nand the diameter\
    \ is \\(O_P(r_n)\\) uniformly over \\(F\\)."
  hypotheses:
    explicit:
    - The minimax risk constant C and rate r_n are known and positive.
    - The confidence set is intended to be the closed d-ball of radius LCr_n about the estimator.
    - A measurable choice of an estimator and measurable distance are available.
    implicit: []
  quantifier_order:
  - Given α, choose L≥1/α (up to the displayed C normalisation); then the bound holds uniformly for every f∈F and
    every n to which the risk bound applies.
  constants:
  - Given α, choose L≥1/α (up to the displayed C normalisation); then the bound holds uniformly for every f∈F and
    every n to which the risk bound applies.
  dependencies:
    earlier_book:
    - Markov inequality
    - Equation (6.113)
    - Definition 6.4.1
    chapter_local:
    - 6.4.1
    - 6.4.diameter
    later_book_uses:
    - Definition 6.4.2
    - motivation for sharper constructions in Section 6.4.2
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Define `C_n ω = Metric.closedBall (fTilde n ω) (L*C*r n)` and prove coverage by Markov's inequality.
    blockers: &id005
    - The interval notation is not meaningful in an arbitrary metric space; the proof requires a metric ball interpretation.
    - The text says the diameter is `obviously O_P(r_n)`; a closed ball has diameter at most 2LCr_n, not LCr_n.

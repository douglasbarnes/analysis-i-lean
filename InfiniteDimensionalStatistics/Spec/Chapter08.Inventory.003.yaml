- id: ch8.adaptive_linfty_testing_rate
  kind: definition
  book:
    number: unnumbered rate preceding Theorem 8.1.3
    pages:
    - 613
    section: 8.1.2
    equations:
    - '8.1'
  title: Adaptive L∞ testing rate
  statement: For 0<r≤R, B>0 and n≥2, the adaptive separation rate used in Theorem 8.1.3 is ρ_n^*(r,B)=C B^{1/(2r+1)}(n/log
    n)^{-r/(2r+1)}. The proof obtains this by balancing the approximation term B·2^{-jr} against the stochastic
    term √(2^j log n/n). The damaged theorem display remains flagged to check whether the printed factor is B^{1/(2r+1)}
    or max(1,B)^{1/(2r+1)}.
  source_fidelity: proof-reconstruction-with-typeset-rate-flag
  hypotheses:
    explicit:
    - 0<r≤R
    - B>0
    - n≥2
    - C>0
    implicit:
    - The logarithm convention is natural logarithm.
    - The exact printed use of B versus max(1,B) remains under central review.
  quantifier_order:
  - Fix C,R
  - For each r,B,n define the rate
  constants:
  - C sufficiently large for the test.
  dependencies:
    earlier_book: []
    chapter_local:
    - ch8.linfty_adaptive_alternative
    later_book_uses:

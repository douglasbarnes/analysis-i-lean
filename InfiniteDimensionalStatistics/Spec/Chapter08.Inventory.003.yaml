- id: ch8.theorem_8_1_3
  kind: theorem
  book:
    number: Theorem 8.1.3
    pages:
    - 613
    section: 8.1.2
    equations:
    - '8.1'
  title: Adaptive plug-in tests for L∞ alternatives
  statement: For fixed R>0 and every α>0, there exists a measurable test whose sum of type-I error at f=0 and worst
    type-II error over the adaptive L∞ alternative at the stated rate is at most α when C is sufficiently large.
    No logarithmic adaptation penalty beyond the ordinary L∞ minimax log n factor is incurred.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - Rate and alternative above
    - white-noise model (8.1)
    implicit:
    - The theorem’s exact displayed B-dependence is under source review.
  quantifier_order:
  - Fix R
  - For every α choose C₀ and tests
  - For every C≥C₀ and n obtain the error bound
  constants:
  - Constants depend on R,σ and wavelet regularity.
  dependencies:
    earlier_book:
    - Theorem 5.1.2
    - Proposition 5.1.12
    chapter_local:
    - ch8.linfty_adaptive_alternative
    - ch8.adaptive_linfty_testing_rate
    - ch8.linfty_maximum_test
    later_book_uses: []

- id: ex.6.2.5
  kind: exercise
  book:
    number: Exercise 6.2.5
    pages:
    - 511
    section: '6.2'
    equations: []
  title: Wavelet alternatives L1 separated
  statement: 'Show that the alternatives \(f_m\) used in the proof of Theorem 6.2.9 satisfy

    \[

    \|f_m-1\|_1\ge c\,n^{-r/(2r+1/2)}.

    \]

    Deduce that the minimax separation rate in Theorem 6.2.9 is unchanged when the

    \(L^2\)-separation in \(H_1\) is replaced by \(L^1\)-separation.'
  hypotheses:
    explicit:
    - The alternatives f_m are exactly those constructed in the lower-bound proof of Theorem 6.2.9.
    - The wavelets/translates have the disjoint-support and normalisation properties used there.
    implicit: []
  quantifier_order:
  - ∃ c>0 independent of n and m, ∀ sufficiently large n, ∀ constructed alternatives f_m, the L¹ separation bound
    holds.
  constants:
  - ∃ c>0 independent of n and m, ∀ sufficiently large n, ∀ constructed alternatives f_m, the L¹ separation bound
    holds.
  dependencies:
    earlier_book:
    - Theorem 6.2.9 lower-bound construction
    chapter_local:
    - 6.2.9
    later_book_uses: &id006
    - Supports the notes' discussion of unified \(L^p\)-testing rates.
  proof_status:
    delegates_to_exercises:
    - Exercise 6.2.5
    contains_omitted_steps: true
    comment: Extends the theorem to L¹ alternatives and supports the notes-level p<2 statement.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit; standard analytic/probabilistic primitives may be reusable.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []

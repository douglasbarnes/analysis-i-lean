  title: Sampling multiscale composite test
  statement: 'Prove an i.i.d. sampling analogue of Theorem 6.2.20. Replace each white-noise

    coefficient \(\int\psi_{lk}(t)\,dY(t)\) in the proof by the empirical wavelet

    coefficient \(\int\psi_{lk}(t)\,dP_n(t)\), and obtain the corresponding composite

    multiscale testing result.'
  hypotheses:
    explicit:
    - The sampling model has i.i.d. observations with densities/functions satisfying the sampling analogues of Theorem
      6.2.20.
    - The empirical wavelet coefficients possess the required moment and concentration bounds.
    implicit: []
  quantifier_order:
  - For every admissible sampling null and alternative family, construct a test sequence with the analogue of Theorem
    6.2.20's level and power bounds.
  constants:
  - For every admissible sampling null and alternative family, construct a test sequence with the analogue of Theorem
    6.2.20's level and power bounds.
  dependencies:

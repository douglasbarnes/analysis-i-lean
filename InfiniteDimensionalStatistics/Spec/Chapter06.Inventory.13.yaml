- id: ex.6.3.2
  kind: exercise
  book:
    number: Exercise 6.3.2
    pages:
    - 522
    section: '6.3'
    equations: []
  title: Multivariate besov minimax lower bounds
  statement: 'Let \(A=[0,1]^d\) or \(A=\mathbb R^d\). Prove multivariate analogues of the

    minimax lower-bound theorems in Section 6.3 for estimation over a Besov ball

    \(B^r_{p\infty}(A)\). The rates are

    \[

    n^{-r/(2r+d)}\quad\text{in }L^p,\qquad

    (n/\log n)^{-r/(2r+d)}\quad\text{in }L^\infty.

    \]

    Use tensor wavelets, with \(2^{jd}\) coefficients at resolution \(j\), and the

    same Varshamov-Gilbert alternatives as in the one-dimensional proofs.'
  hypotheses:
    explicit:
    - A is [0,1]^d or ℝ^d and d≥1.
    - The parameter class is an admissible Besov ball B^r_{p∞}(A), with model-specific integrability/positivity
      restrictions.
    - 1≤p<∞ for L^p loss; the L∞ conclusion uses the corresponding supnorm-separated alternatives.
    implicit: []
  quantifier_order:
  - ∀ d,r,p and admissible radius B, every estimator has risk at least a constant multiple of the displayed rate
    for some parameter in the ball.
  constants:
  - ∀ d,r,p and admissible radius B, every estimator has risk at least a constant multiple of the displayed rate
    for some parameter in the ball.
  dependencies:
    earlier_book:
    - Section 4.3.6
    - Theorem 6.3.2 (Fano lower bound)
    - One-dimensional wavelet alternatives in Theorems 6.3.5 and 6.3.8-6.3.10
    chapter_local:
    - 6.3.2
    - 6.3.5
    - 6.3.8
    - 6.3.9
    - 6.3.10
    later_book_uses: &id012
    - Provides the standard \(d\)-dimensional rates used in later applications.
  proof_status:
    delegates_to_exercises:
    - Exercise 6.3.2
    contains_omitted_steps: true
    comment: All multivariate lower-bound details are delegated to the exercise.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit; standard analytic/probabilistic primitives may be reusable.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Formalise tensor-wavelet coefficient counts, construct separated hypercubes/single-spike alternatives,
      control KL divergence, and instantiate Fano's theorem.
    blockers: &id011
    - The displayed source writes \(B^r_{p\infty}\) for both losses; for the \(L^\infty\) conclusion the intended
      regularity ball and positivity/density side conditions must be preserved exactly in each model.
  difficulty: research-level
  pass: exercise
  issues_for_central_review: *id011
  selection_reasons:
  - establishes required reusable multivariate minimax lower bounds
  - is a direct extension cited by the chapter's discussion
  used_by: *id012

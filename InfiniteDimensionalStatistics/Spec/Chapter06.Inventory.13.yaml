inventory:
- id: ex.6.2.3
  kind: exercise
  book:
    number: Exercise 6.2.3
    pages:
    - 511
    section: '6.2'
    equations: []
  title: Multivariate wavelet UStatistic test rate
  statement: 'Generalise Proposition 6.2.5 and Theorem 6.2.17 to a sample space

    \(A=\mathbb R^d\) by using a tensor-product wavelet basis from Section 4.3.6.

    For the U-statistic variance, majorise the possibly infinite projection kernel

    \(\sum_{l<j,k}\psi_{lk}(x)\psi_{lk}(y)\) by an integrable convolution kernel.

    Deduce that the variances are of order \(2^{jd/2}/n\) in the normalised testing

    calculation and that the minimax separation rate is

    \[

    \rho_n\asymp n^{-r/(2r+d/2)}.

    \]'
  hypotheses:
    explicit:
    - A=ℝ^d and d∈ℕ is positive.
    - An S-regular tensor-product wavelet basis of L²(A) is available.
    - The null class satisfies the multivariate analogues of the boundedness, entropy and Besov assumptions of Theorem
      6.2.17.
    implicit: []
  quantifier_order:
  - ∀ d≥1 and admissible r,B,null classes, ∃ tests with the stated rate; matching lower bounds are inherited from
    the same wavelet alternatives.
  constants:
  - ∀ d≥1 and admissible r,B,null classes, ∃ tests with the stated rate; matching lower bounds are inherited from
    the same wavelet alternatives.
  dependencies:
    earlier_book:
    - Section 4.3.6 (wavelets on subsets of ℝ^d)
    - Definition 4.2.14 (projection-kernel majorant)
    chapter_local:
    - 6.2.5
    - 6.2.17
    later_book_uses: &id002
    - Feeds the multivariate minimax programme and parallels Exercise 6.3.2.
  proof_status:
    delegates_to_exercises:
    - Exercise 6.2.3
    contains_omitted_steps: true
    comment: The book delegates the full multivariate proof to this exercise.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit; standard analytic/probabilistic primitives may be reusable.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Build tensor wavelet projections on ℝ^d, prove an integrable kernel majorant, obtain the canonical U-statistic
      variance bound, and instantiate the abstract testing theorem.
    blockers: &id001
    - The OCR phrase about the variance order is compressed; the final separation exponent is clear, but every normalising
      power of \(2^j\) must be transcribed from the typeset page before implementation.
  difficulty: research-level
  pass: exercise
  issues_for_central_review: *id001
  selection_reasons:
  - establishes a required reusable multivariate extension
  - extends a theorem used as a template for later multivariate minimax results
  used_by: *id002
- id: ex.6.2.4

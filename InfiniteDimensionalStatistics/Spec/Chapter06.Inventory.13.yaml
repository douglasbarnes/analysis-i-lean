- id: ex.6.2.6
  kind: exercise
  book:
    number: Exercise 6.2.6
    pages:
    - 511
    section: '6.2'
    equations: []
  title: Haar Projection norm lower bound besov
  statement: 'Let \(K_j\) be the Haar wavelet projection kernel. For

    \(f\in B^r_{2q}\), \(1\le q\le\infty\), prove

    \[

    \|K_j f\|_2\ge c_1\|f\|_2-c_2\|f\|_{B^r_{2q}}\,2^{-jr}.

    \]

    Deduce that in Proposition 6.2.3 the conclusion (6.34), with its middle

    inequality omitted, remains valid for functions satisfying (6.35) when \(r>1\);

    therefore condition (6.32) can be omitted from Proposition 6.2.3.'
  hypotheses:
    explicit:
    - K_j is the Haar wavelet projection kernel.
    - f∈B^r_{2q}, 1≤q≤∞, and the Besov norm uses the chapter's wavelet normalisation.
    - For the application, r>1 and f satisfies (6.35).
    implicit: []
  quantifier_order:
  - ∃ c₁,c₂>0, ∀ j, ∀ f∈B^r_{2q}, the lower bound holds; consequently the weakened Proposition 6.2.3 holds for all
    admissible f.
  constants:
  - ∃ c₁,c₂>0, ∀ j, ∀ f∈B^r_{2q}, the lower bound holds; consequently the weakened Proposition 6.2.3 holds for all
    admissible f.
  dependencies:
    earlier_book:
    - Chapter 4 Besov approximation estimates
    - Haar multiresolution projection
    chapter_local:
    - 6.2.3
    - 6.2.4
    later_book_uses: &id008
    - Strengthens the plug-in chi-square test used as a building block for confidence-set constructions.
  proof_status:
    delegates_to_exercises:
    - Exercise 6.2.6
    contains_omitted_steps: true
    comment: Completes the omitted weakening announced in Remark 6.2.4.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit; standard analytic/probabilistic primitives may be reusable.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Use \(f=K_jf+(I-K_j)f\), the triangle inequality, and the Besov approximation bound for the Haar tail;
      then restate Proposition 6.2.3 under the weakened assumptions.
    blockers: &id007
    - The book spells 'ommitted' and 'ommitted'; these are typographical only. Constants \(c_1,c_2\) are existential
      and depend on the chosen Besov normalisation.
  difficulty: major-library
  pass: exercise
  issues_for_central_review: *id007
  selection_reasons:
  - completes a proof omitted from the main text
  - establishes a required reusable approximation lower bound
  - removes an explicit hypothesis from a principal proposition
  used_by: *id008

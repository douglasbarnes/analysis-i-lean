- id: ch5.thm.5_2_7
  kind: theorem
  book:
    number: Theorem 5.2.7
    pages:
    - 428
    - 431
    section: 5.2.1
    equations: []
  title: Theorem 5.2.7
  statement: Suppose P has bounded density f₀ (set t=0) or f₀∈C^t(ℝ), t>0. Let e^{-1}≥hₙ→0 with hₙ>log n/n and let
    K have order r=t+1−k, 0≤k<t+1. There exist L>0 and λ₀≥1 such that for all n>1 and λ≥λ₀ max(√(h log(1/h)),√n
    h^{t+1−k}), P{√n‖Fₙ^K(h)−Fₙ‖∞>λ}≤2exp[−L min(h^{-1}λ²,√n λ)]. Consequently P{√n‖Pₙ^K−Pₙ‖_{BV_M}>2Mλ} obeys the
    same bound.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - Density regularity as stated.
    - Bandwidth and kernel-order restrictions.
    - λ above the stochastic and bias thresholds.
    implicit:
    - The sup norm is countably measurable by right continuity.
    - Constants depend on ‖f₀‖∞/‖f₀‖_{C^t} and K.
  quantifier_order:
  - There exist L,λ₀.
  - For all n>1 and all qualifying λ.
  constants:
  - L,λ₀ and 2M.
  dependencies:
    earlier_book:
    - Talagrand inequality and VC class of half-lines
    chapter_local:
    - ch5.def.BV_ball
    - ch5.def.cdf_estimators
    - ch5.def.5_2_4
    later_book_uses:
    - Theorem 5.2.8
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      - Mathlib.Analysis.Fourier.Convolution
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Exponential comparison of smoothed and empirical cdfs via bias bound plus Talagrand on smoothed indicators.
    blockers:
    - VC empirical-process concentration and BV duality.
  difficulty: research-level
  pass: core
  issues_for_central_review: &id006 []

- id: ch5.rem.5_2_12
  kind: proposition
  book:
    number: Remark 5.2.12
    pages:
    - 434
    section: 5.2.1
    equations: []
  title: Remark 5.2.12
  statement: 'Using Theorem 4.4.5 and the bias estimate following Proposition 4.3.14, the preceding proof gives
    the following printed statement. If f₀∈B^t_{p,q}([0,1])∪L^p([0,1]) for some t>0 and 𝔽={g∈C([0,1]): ‖g‖_{B^s_{p′,q′}([0,1])}≤M},
    where 1<p,p′,q,q′<∞, 1/p+1/q=1, 1/p′+1/q′=1 and s>max(1/p′,1/2), then G_P|𝔽 is sample continuous. Moreover,
    if j_n→∞ and √n·2^(−j_n(t+s))→0, then √n(P_n^W−P) converges in law to G_P in ℓ∞(𝔽), for every Borel probability
    measure P on [0,1]. Here P_n^W has density equal to the boundary-corrected or periodised wavelet projection
    estimator from Condition 5.1.1(c) or (d).'
  source_fidelity:
    transcription_status: verified_with_typographical_flag
    author_corrected_reading: null
  hypotheses:
    explicit:
    - The printed density condition is f₀∈B^t_{p,q}([0,1])∪L^p([0,1]), t>0.
    - 𝔽 is the radius-M ball of continuous functions in B^s_{p′,q′}([0,1]).
    - 1<p,p′,q,q′<∞, with the two printed relations 1/p+1/q=1 and 1/p′+1/q′=1.
    - s>max(1/p′,1/2).
    - Boundary-corrected or periodised wavelets satisfying Condition 5.1.1(c) or (d).
    - j_n→∞ and √n·2^(−j_n(t+s))→0.
    implicit:
    - The statement is transcribed as printed; the union sign and conjugacy relations are not repaired.
    - P_n^W denotes the measure whose density is the corresponding wavelet projection estimator.
  quantifier_order:
  - Fix t,p,q,p′,q′,s,M and a Borel probability measure P on [0,1] satisfying the printed assumptions.
  - For every resolution sequence j_n satisfying the displayed limit, let n→∞.
  constants:
  - M<∞.
  - The bias exponent is t+s.
  dependencies:
    earlier_book:
    - Theorem 4.4.5 and Proposition 4.3.14
    chapter_local:
    - ch5.thm.5_2_11
    later_book_uses: *id005
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Distribution.Sobolev
      - Mathlib.Analysis.FunctionalSpaces.SobolevInequality
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Besov duality and Donsker extension of Theorem 5.2.11.
    blockers:
    - General Besov spaces and conjugate-exponent duality.
  difficulty: research-level
  pass: core
  issues_for_central_review:
  - The printed density condition uses B^t_{p,q}([0,1])∪L^p([0,1]); an intersection may have been intended, but
    the source is not silently changed.
  - The printed relations 1/p+1/q=1 and 1/p′+1/q′=1 appear inconsistent with the usual conjugate-index roles; retain
    them pending central review.

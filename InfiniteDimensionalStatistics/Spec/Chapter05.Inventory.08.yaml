    n/n, there exist L>0, λ₀≥1 such that for λ≥λ₀ max(√(j2^{-j}),√n2^{-j(t+1)}), P{√n‖Fₙ^W−Fₙ‖∞>λ}≤2exp[−L min(2^jλ²,√nλ)],
    and the same bound controls √n‖Pₙ^W−Pₙ‖_{BV_M} above 2Mλ.

  title: Sharp Gaussian-prior supremum-norm contraction tails
  statement: "Let σ_l=2^{-l(γ+1/2)}l^{-1/2}, γ>0, and f₀∈C^γ. There exist M₀,C₁,C₂>0\nsuch that for every M≥M₀,\n  E^Y_{f₀} Π( ||f-f₀||∞ > M (n/log n)^{-γ/(2γ+1)} |Y )\n     ≤ C₁ n^{-C₂(M-M₀)²}."
  hypotheses:
    explicit:
    - γ>0.
    - Truth f₀∈C^γ.
    - Gaussian prior with the displayed scales.
    - Sufficient wavelet regularity.
    implicit:
    - The polynomial tail exponent is uniform in n and grows quadratically in M-M₀.
  quantifier_order:
  - ∃M₀,C₁,C₂, ∀M≥M₀, ∀n (or all large n), bound.

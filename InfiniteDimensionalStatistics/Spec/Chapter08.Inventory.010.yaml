- id: ch8.proposition_8_3_7
  kind: proposition
  book:
    number: Proposition 8.3.7
    pages:
    - 637
    section: 8.3.1
    equations:
    - '8.3'
  title: Test-plus-estimator construction of adaptive confidence sets
  statement: Assume an estimator simultaneously attains r_n(Θ₀) on Θ₀ and r_n(Θ) on Θ, and tests attain the upper
    minimax testing bound at ρ_n^*. Then, for prescribed error levels, a confidence set satisfying (8.58)–(8.60)
    exists at ρ_n=Lρ_n^* for L sufficiently large.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - uniformly adaptive estimator
    - upper testing property for every β
    implicit:
    - The estimator and test are measurable; confidence sets are metric balls whose radius depends on the test.
  quantifier_order:
  - Fix α and α′ as required
  - choose testing level and constants
  - choose L
  - construct C_n

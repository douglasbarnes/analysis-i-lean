- id: ch8.model_Fn_8_63
  kind: definition
  book:
    number: (8.63)
    pages:
    - 639
    section: 8.3.2
    equations:
    - '8.63'
  title: Maximal separated model for continuous L2 adaptation
  statement: 'With ℛ={s_i}_{i=0}^{N−1}, s_N=2^N r>R and ρ_n(t)=n^{-t/(2t+1/2)}, define F_n = S(s_N,B₀) ∪ ⋃_{s∈ℛ}{f∈S(s,B₀)
    : ‖f−S(t,B₀)‖₂ ≥ Lρ_n(s) for every t∈ℛ with t>s}. Here ‖f−S(t,B₀)‖₂ denotes the L²-distance from f to the smoother
    ball.'
  source_fidelity: exact-transcription
  hypotheses:
    explicit:
    - B₀>0
    - L>0
    - the dyadic grid and terminal point from (8.62)
    implicit:
    - The distance to a nonempty function class is the infimum of L² distances.
  quantifier_order:
  - Fix n and L
  - For each s∈ℛ impose separation from every t∈ℛ with t>s
  - Take the finite union and adjoin S(s_N,B₀)

  title: Honest continuously adaptive L2 confidence sets on F_n
  statement: For white noise and 0<r<R, for every α,α′>0 there is L large enough and C_n=C(α,α′,B₀,r,R,dY) honest
    over F_n, and there is L′>0 such that for every s∈[r,R] and B∈[1,B₀], limsup_n sup_{f∈S(s,B)∩F_n}P_f(|C_n|₂≥L′B^{1/(2s+1)}n^{-s/(2s+1)})≤α′.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - B₀≥1
    - 0<r<R<∞
    - white-noise observation
    implicit:
    - The model F_n and confidence set are measurable.
  quantifier_order:
  - Fix α,α′
  - Choose L and construct C_n
  - There exists L′
  - For all s,B assert uniform limsup

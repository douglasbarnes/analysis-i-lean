- id: 6.3.reduction
  kind: operative_lemma
  book:
    number: General reduction principle (6.99)-(6.102)
    pages:
    - 513
    section: 6.3.1
    equations: []
  title: Estimation Risk ge multiple Testing Risk
  statement: 'For any finite family \(f_0,\ldots,f_M\subset F\),

    \[

    r_n^{-1}\inf_{\tilde f_n}\sup_{f\in F}E_f d(\tilde f_n,f)

    \ge \inf_{\tilde f_n}\sup_{f\in F}P_f\{d(\tilde f_n,f)>r_n\}

    \ge \inf_{\tilde f_n}\max_mP_{f_m}\{d(\tilde f_n,f_m)>r_n\}.

    \]

    If \(d(f_m,f_{m''})\ge2r_n\) for \(m\ne m''\), assigning an estimator to its

    nearest \(f_m\) yields a multiple test \(\Phi_n\) whose classification error

    is bounded by the estimator''s \(r_n\)-error. Consequently,

    \[

    \inf_{\tilde f_n}\max_mP_{f_m}\{d(\tilde f_n,f_m)\ge r_n\}

    \ge \inf_{\Phi_n}\max_m P_{f_m}\{\Phi_n\ne m\}.

    \]'
  hypotheses:
    explicit:
    - The finite alternatives are pairwise 2rₙ-separated.
    - Nearest-point tie breaking is made measurably; for a finite set this can be done by least index.
    - The first step uses Markov's inequality with threshold rₙ.
    implicit: []
  quantifier_order:
  - ∀ finite separated families and ∀n, the estimator risk lower-bounds the optimal multiple-testing error in the
    displayed order.
  constants:
  - ∀ finite separated families and ∀n, the estimator risk lower-bounds the optimal multiple-testing error in the
    displayed order.
  dependencies:
    earlier_book: []
    chapter_local:
    - 6.3.1
    later_book_uses:
    - Theorem 6.3.2
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:

- id: 6.2.18
  kind: proposition
  book:
    number: Proposition 6.2.18
    pages:
    - 506
    section: 6.2.4
    equations: []
  title: Besov Composite Gaussian minimax Separation
  statement: 'Let \(r,B>0\). Suppose \(H_0\subset L^2([0,1])\) satisfies (6.70)

    for some \(s\ge2r\), contains \(0\), and is contained in a bounded ball of

    \(B^t_{2\infty}([0,1])\) for some \(t>r\). In Gaussian white noise, the

    minimax separation rate for

    \[

    H_0\quad\text{versus}\quad

    H_1=\{f:\|f\|_{B^r_{2\infty}}\le B,\ \operatorname{dist}_2(f,H_0)\ge r_n\}

    \]

    is

    \[

    \rho_n=c\,n^{-r/(2r+1/2)}

    \]

    for a positive constant \(c\) (depending on the prescribed testing level and

    the model constants).'
  hypotheses:
    explicit:
    - r,B>0.
    - H₀ contains 0.
    - H₀ satisfies the entropy condition with s≥2r.
    - 'H₀ is uniformly smoother than the alternatives: contained in a B^t_{2∞}-ball for t>r.'
    implicit: []
  quantifier_order:
  - For every admissible H₀ and B^r-alternative class, the rate sequence n^{-r/(2r+1/2)} satisfies both minimax
    upper and lower conditions of Definition 6.2.1, up to a level-dependent constant.
  constants:
  - For every admissible H₀ and B^r-alternative class, the rate sequence n^{-r/(2r+1/2)} satisfies both minimax
    upper and lower conditions of Definition 6.2.1, up to a level-dependent constant.
  dependencies:
    earlier_book: []
    chapter_local:
    - 6.2.16
    - 6.2.11
    - 6.2.entropy_condition
    later_book_uses:
    - Corollary 6.2.19
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Combine a wavelet-packing lower bound with the entropy-controlled minimum-chi-square upper bound. Formalise
      Besov balls as coefficient predicates and separation by `Metric.infDist`.

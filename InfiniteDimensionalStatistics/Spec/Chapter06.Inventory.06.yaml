- id: 6.3.1
  kind: definition
  book:
    number: Definition 6.3.1
    pages:
    - 512
    section: '6.3'
    equations: []
  title: Is Minimax Estimation Rate
  statement: 'For experiments with laws \((P_f:f\in F)\), \(F\subset(S,d)\), a

    sequence \(r_n\ge0\) is a minimax rate of estimation in \(d\)-risk if:

    (i) there exist measurable estimators \(\hat f_n:Y_n\to S\) and a universal

    constant \(C<\infty\) such that, for all sufficiently large \(n\),

    \[

    r_n^{-1}\sup_{f\in F}E_f d(\hat f_n,f)\le C;

    \]

    (ii) there is a universal \(C>0\) such that

    \[

    \liminf_n r_n^{-1}\inf_{\tilde f_n}\sup_{f\in F}E_f d(\tilde f_n,f)\ge C,

    \]

    where the infimum is over all measurable \(\tilde f_n:Y_n\to S\).'
  hypotheses:
    explicit:
    - (S,d) is a metric space with its Borel σ-field.
    - Each experiment has a measurable sample space (Yₙ,Aₙ).
    - Estimators are Borel measurable.
    - The rate should be positive eventually for the displayed inverse to be defined.
    implicit: []
  quantifier_order:
  - A sequence rₙ is minimax iff ∃ upper-bound estimators and C, and ∃ positive lower-bound C with the stated order;
    the lower infimum quantifies over all measurable estimators before the supremum over f.
  constants:
  - A sequence rₙ is minimax iff ∃ upper-bound estimators and C, and ∃ positive lower-bound C with the stated order;
    the lower infimum quantifies over all measurable estimators before the supremum over f.
  dependencies:
    earlier_book: []
    chapter_local:
    - 6.2.1
    later_book_uses:
    - All results in Sections 6.3 and 6.4
    - Chapter 8 adaptive minimax definitions
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: A structure/predicate with an eventual uniform upper risk and a liminf lower risk. Use `Filter.Eventually`,
      `MeasureTheory.Integral`, and an infimum over measurable maps, probably via an outer `sInf` on extended nonnegative

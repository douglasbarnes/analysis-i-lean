- id: 6.2.19
  kind: corollary
  book:
    number: Corollary 6.2.19
    pages:
    - 507
    section: 6.2.4
    equations: []
  title: Bounded Variation Null minimax Separation
  statement: 'Let \(0<r<1/2\), \(B,M>0\), and let \(H_0\) be any subset of the

    bounded-variation ball

    \(\{f:[0,1]\to\mathbb R:\|f\|_{BV}\le M\}\) containing \(0\).

    Then in Gaussian white noise the minimax \(L^2\)-separation rate for

    \[

    H_0\quad\text{versus}\quad

    \{f:\|f\|_{B^r_{2\infty}}\le B,\ \operatorname{dist}_2(f,H_0)\ge r_n\}

    \]

    is \(c\,n^{-r/(2r+1/2)}\). The text further says \(r=1/2\) is admissible when

    \(M\) is fixed and \(B\) is sufficiently large.'
  hypotheses:
    explicit:
    - 0<r<1/2 in the formal corollary.
    - H₀ is an arbitrary subset of the BV ball but must contain 0.
    - The endpoint extension is prose, not part of the numbered statement.
    implicit: []
  quantifier_order:
  - ∀r∈(0,1/2), ∀B,M>0, ∀H₀ satisfying the conditions, the specified rate is minimax.
  constants:
  - ∀r∈(0,1/2), ∀B,M>0, ∀H₀ satisfying the conditions, the specified rate is minimax.
  dependencies:
    earlier_book:
    - Proposition 4.3.21 (BV embedding)
    - Proposition 4.3.6
    - Theorem 4.3.36
    chapter_local:
    - 6.2.18
    later_book_uses:

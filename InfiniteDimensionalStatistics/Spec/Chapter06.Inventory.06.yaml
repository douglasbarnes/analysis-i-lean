- id: 6.2.17
  kind: theorem
  book:
    number: Theorem 6.2.17
    pages:
    - 502
    - 506
    section: 6.2.4
    equations: []
  title: Minimum UStatistic Test error bound
  statement: "Let \\(H_0\\) be a family of densities on \\([0,1]\\), uniformly bounded by\n\\(U\\), and\n\\[\nH_1\\\
    subset\\{f:\\|f\\|_\\infty\\le U,\\ \\operatorname{dist}_2(f,H_0)\\ge\\rho_n\\}.\n\\]\nSuppose \\(B(j)\\downarrow\\\
    ) and\n\\[\n\\sup_{f_0\\in H_0,f\\in H_1}\n\\|K_j(f-f_0)-(f-f_0)\\|_2^2\\le B(j).\n\\]\nFor positive \\(c,L\\\
    ), levels \\(j_n\\), and nonnegative \\(d_n\\) satisfying the\nprinted condition\n\\(1\\le d_n\\le\\min(2^{j_n/2},n^{-1/4})\\\
    ), put\n\\[\n\\tau_n=Ld_n2^{j_n/2}/n,\\qquad\n2^{j_n/2}d_n^3\\le n,\\qquad\n\\rho_n^2\\ge c\\max\\{Ld_n2^{j_n/2}/n,B(j_n)\\\
    }.\n\\]\nAssume also, for every \\(m\\) with \\(2^m\\ge\\rho_n^2/2\\),\n\\[\n\\sup_{f\\in H_1}E_f\\|P_n-P\\\
    |_{G_{j_n,m}(H_0,f)}\\le 2^m/16.\n\\]\nThen \\(L=L(U,\\psi)\\), \\(c=c(L,U)\\), and constants \\(c_i>0\\) can\
    \ be chosen so\nthat the infimum U-statistic test satisfies\n\\[\n\\sup_{H_0}E_f\\Phi_n+\\sup_{H_1}E_f(1-\\\
    Phi_n)\n \\le c_1e^{-c_2d_n^2}+c_3e^{-c_4n\\rho_n^2}.\n\\]"
  hypotheses:
    explicit:
    - H₀ and H₁ consist of probability densities on [0,1] bounded by the same U.
    - n≥2 and the U-statistic is measurable.
    - The bias and empirical-process assumptions are uniform.
    - The wavelets obey the regularity and envelope estimates used in the proof.
    implicit: []
  quantifier_order:
  - Under all displayed hypotheses, ∃ sufficiently large constants L,c and ∃c₁,…,c₄>0 depending only on c,L,U such
    that ∀n the uniform error inequality holds.
  constants:
  - Under all displayed hypotheses, ∃ sufficiently large constants L,c and ∃c₁,…,c₄>0 depending only on c,L,U such
    that ∀n the uniform error inequality holds.
  dependencies:
    earlier_book:
    - Theorem 3.4.8 (canonical U-statistic concentration)
    - Talagrand inequalities from Chapter 3
    - Wavelet projection estimates from Chapter 4
    chapter_local:
    - 6.2.infimum_ustat
    - 6.2.5
    - 6.2.13
    later_book_uses:
    - Sampling analogue of Proposition 6.2.18
    - Exercise 6.2.4
  proof_status:
    delegates_to_exercises:
    - Exercise 6.2.2
    contains_omitted_steps: true
    comment: Exercise 6.2.2 is invoked for existence of a random minimiser.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

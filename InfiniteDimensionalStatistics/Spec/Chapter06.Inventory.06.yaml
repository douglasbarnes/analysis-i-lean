- id: 6.2.20
  kind: theorem
  book:
    number: Theorem 6.2.20
    pages:
    - 508
    - 510
    section: 6.2.4
    equations: []
  title: Nested Besov Gaussian minimax Separation
  statement: 'For \(s>r>0\) and \(B>0\), in Gaussian white noise the minimax

    separation rate for

    \[

    H_0=\{f:\|f\|_{B^s_{2\infty}}\le B\}

    \quad\text{versus}\quad

    H_1=\{f:\|f\|_{B^r_{2\infty}}\le B,\ \operatorname{dist}_2(f,H_0)\ge r_n\}

    \]

    is

    \[

    \rho_n=c\,n^{-r/(2r+1/2)},

    \]

    where \(c>0\) depends on \(r,B,\sigma\) and the desired testing level

    \(\alpha\).'
  hypotheses:
    explicit:
    - s>r>0 and B>0.
    - Both Besov balls are on [0,1] and use the same radius.
    - The white-noise dispersion σ is fixed and positive.
    - The rate constant may depend on α.
    implicit: []
  quantifier_order:
  - ∀s>r>0, ∀B>0, ∀α in the testing range, ∃c=c(r,B,σ,α)>0 such that ρₙ gives both the upper and lower minimax assertions.
  constants:
  - ∀s>r>0, ∀B>0, ∀α in the testing range, ∃c=c(r,B,σ,α)>0 such that ρₙ gives both the upper and lower minimax assertions.
  dependencies:

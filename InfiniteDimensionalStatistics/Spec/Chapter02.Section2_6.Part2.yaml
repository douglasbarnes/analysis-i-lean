- id: theorem-2-6-13
  kind: theorem
  book:
    number: 2.6.13
    pages:
    - 73
    section: '2.6'
    equations: []
  title: Cameron–Martin theorem
  statement: 'For centred Gaussian μ on separable Banach B with RKHS H: if h∈H, the translate τ_hμ is equivalent to μ and
    d(τ_hμ)/dμ(x)=exp(φ⁻¹(h)(x)−‖h‖_H²/2) μ-a.e.; if h∉H, τ_hμ and μ are mutually singular.'
  hypotheses:
    explicit:
    - B separable Banach.
    - μ centred Gaussian.
    - h∈B.
    - φ:F→H the RKHS isometry.
    implicit:
    - φ⁻¹(h) is an L²(μ) equivalence class, not generally a pointwise continuous linear functional.
    - Translation sign convention τ_hμ(A)=μ(A−h) must be fixed.
  quantifier_order:
  - Exponent −‖h‖²/2 and coefficient 1.
  constants:
  - Exponent −‖h‖²/2 and coefficient 1.

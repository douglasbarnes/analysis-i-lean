- id: proposition-2-6-16
  kind: proposition
  book:
    number: 2.6.16
    pages:
    - 75
    section: '2.6'
    equations: []
  title: Equivalence or singularity for translated product Gaussians
  statement: For μ=⊗_iN(0,σ_i²) on ℝ^ℕ, translation by h is equivalent to μ iff ∑h_i²/σ_i²<∞, in which case the density is
    exp(∑h_ix_i/σ_i²−½∑h_i²/σ_i²); otherwise the measures are singular.
  hypotheses:
    explicit:
    - σ_i>0 unless zero-variance coordinates are separately treated.
    - Product/cylindrical σ-algebra.
    - h∈ℝ^ℕ.
    implicit: []
  quantifier_order:
  - Exact weighted ℓ² criterion and exponent.

- id: theorem-2-6-10
  kind: theorem
  book:
    number: 2.6.10
    pages:
    - 71
    section: '2.6'
    equations: []
  title: Karhunen–Loève expansion in a Banach space
  statement: Let (k_j) be a complete orthonormal system of the Gaussian closed span F. Then ∑_j E[k_jX]·k_j converges almost
    surely in B to X. Equivalently, for an ONB (h_j) of H, X=∑_j φ⁻¹(h_j)h_j almost surely in B.
  hypotheses:
    explicit:
    - B separable Banach.
    - X centred Gaussian B-valued.
    - (k_j) ONB of F.
    implicit:
    - Products are scalar random coefficients times deterministic B-vectors.
    - Series convergence is in the B norm.
  quantifier_order:
  - Almost-sure convergence of the full sequence of partial sums.
  constants: []

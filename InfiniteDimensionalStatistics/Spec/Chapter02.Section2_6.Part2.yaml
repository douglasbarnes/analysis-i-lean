  title: Topological properties of the RKHS
  statement: For a centred Gaussian variable in a separable Banach space, H is a separable Hilbert space and a Borel/measurable
    subset of B; the inclusion H→B is continuous and the closed H-unit ball is compact in B.
  hypotheses:
    explicit:
    - B separable Banach.
    - X centred Gaussian B-valued.
    implicit: []
  quantifier_order:
  - Compactness of O_H={h:‖h‖_H≤1} in the B norm.

  title: Gaussian isoperimetry in a Banach space
  statement: Let O_H be the RKHS unit ball and μ the law of centred Gaussian X in separable Banach B. For Borel A⊆B and ε>0,
    μ(A+εO_H)≥Φ(Φ⁻¹(μ(A))+ε).
  hypotheses:
    explicit:
    - B separable Banach.
    - X centred Gaussian.
    - A Borel.
    - ε>0.
    implicit:
    - A+εO_H may require completion/analytic measurability.
  quantifier_order:
  - No dimension factor; RKHS-radius ε.
  constants:

- id: ch5.prop.5_2_2
  kind: proposition
  book:
    number: Proposition 5.2.2
    pages:
    - 424
    section: 5.2.1
    equations: []
  title: Proposition 5.2.2
  statement: Let 𝔽 be a translation-invariant P-Donsker class and 𝓜 a set of finite signed measures with uniformly
    bounded total variation. If y↦f(x+y) is measurable for every x and y↦‖f(·+y)‖_{L²(P)} is |μ|-integrable for
    each f∈𝔽, μ∈𝓜, then {f*μ:f∈𝔽, μ∈𝓜} is P-Donsker.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - 𝔽 translation invariant and P-Donsker.
    - sup_{μ∈𝓜}|μ|(ℝ)<∞.
    - The two measurability/integrability assumptions in the statement.
    implicit:
    - Convolution convention is (f*μ)(x)=∫f(x+y)dμ(y) up to the book’s reflection convention.
  quantifier_order:
  - For all f∈𝔽 and μ∈𝓜.
  constants:
  - Uniform total-variation bound.
  dependencies:
    earlier_book:
    - Donsker stability under symmetric convex hull, Proposition 3.7.34
    chapter_local:
    - ch5.def.weak_seminorm
    later_book_uses:
    - Proposition 5.2.3
  proof_status:
    delegates_to_exercises:
    - Exercise 5.2.1
    contains_omitted_steps: true
    comment: ''
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Donsker closure theorem via L² approximation by finite signed convex combinations of translates.
    blockers:
    - Donsker class framework.
    - Measurable convolution classes.
  difficulty: research-level
  pass: core
  issues_for_central_review: *id006
- id: ch5.prop.5_2_3
  kind: proposition
  book:
    number: Proposition 5.2.3
    pages:
    - 424
    - 425
    section: 5.2.1
    equations: []
  title: Proposition 5.2.3
  statement: Let 𝔽 be translation-invariant and P-Donsker and μₙ an approximate identity with μₙ(ℝ)=1 and the stated
    integrability. If sup_{f∈𝔽}E(∫[f(X+y)−f(X)]dμₙ(y))²→0 and √n sup_{f∈𝔽}|E∫[f(X+y)−f(X)]dμₙ(y)|→0, then √n‖Pₙ*μₙ−Pₙ‖_𝔽→0
    in outer probability and √n(Pₙ*μₙ−P)⇒G_P in ℓ∞(𝔽).
  source_fidelity: *id001
  hypotheses:
    explicit:
    - 𝔽 translation-invariant P-Donsker.
    - μₙ approximate identity, μₙ(ℝ)=1.
    - 𝔽⊂L¹(|μₙ|) and ∫‖f(·−y)‖_{L²(P)}d|μₙ|(y)<∞.
    - Conditions (5.70) and (5.71).
    implicit:
    - Outer probability is used if the supremum is not measurable.
    - G_P is the P-Brownian bridge.
  quantifier_order:
  - As n→∞.
  - Both suprema range over f∈𝔽.
  constants: *id005
  dependencies:
    earlier_book:
    - Asymptotic equicontinuity of Donsker classes
    chapter_local:
    - ch5.def.approx_identity
    - ch5.prop.5_2_2
    later_book_uses:
    - Theorem 5.2.5
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: A Slutsky theorem for smoothed empirical processes after bias and variance discrepancy estimates.
    blockers:
    - Empirical-process weak convergence and outer probability.
  difficulty: research-level
  pass: core
  issues_for_central_review: *id006
- id: ch5.def.5_2_4
  kind: definition
  book:
    number: Definition 5.2.4
    pages:
    - 425
    section: 5.2.1
    equations: []
  title: Definition 5.2.4
  statement: A symmetric kernel K has order r>0 if K∈L¹, ∫K=1, ∫y^jK(y)dy=0 for j=1,…,{r} (largest integer strictly
    below r), and ∫|y|^r|K(y)|dy<∞.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - r>0.
    - K Lebesgue integrable and symmetric.
    implicit:
    - All moment integrals are absolutely meaningful as implied by the r-moment condition for lower orders.
  quantifier_order:
  - For each integer j with 1≤j<{r}+1.
  constants:
  - Order r.
  dependencies:
    earlier_book:
    - Proposition 4.1.6 existence of high-order kernels
    chapter_local: *id005
    later_book_uses:
    - Theorems 5.2.5, 5.2.7, Section 5.3.1
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      - Mathlib.Analysis.Fourier.Convolution
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Predicate on an L¹ function with moment cancellation and finite fractional moment.
    blockers:
    - Real-valued noninteger order and moment-index bookkeeping.
  difficulty: substantial
  pass: core
  issues_for_central_review: *id006
- id: ch5.thm.5_2_5
  kind: theorem
  book:
    number: Theorem 5.2.5
    pages:
    - 425
    - 428
    section: 5.2.1
    equations: []
  title: Theorem 5.2.5
  statement: Let f₀∈H^t_2(ℝ), t≥0, let K be a symmetric kernel of order r=t+s−k with s>1/2 and 0≤k<t+s, and let
    fₙ=Pₙ*K_{hₙ}. If hₙ^{t+s−k}√n→0, then the P-bridge indexed by H^s_{2,M}(ℝ) has a sample-continuous version and
    √n(Pₙ^{K}−P)⇒G_P in ℓ∞(H^s_{2,M}) for every M<∞.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - f₀ probability density in H^t_2.
    - s>1/2.
    - 0≤k<t+s.
    - K has order t+s−k.
    - hₙ→0 and hₙ^{t+s−k}√n→0.
    implicit:
    - Pₙ^K is the signed measure with density Pₙ*K_{hₙ}.
  quantifier_order:
  - For every M<∞.
  - As n→∞.
  constants: *id005
  dependencies:
    earlier_book:
    - Sobolev embedding and approximation
    chapter_local:
    - ch5.prop.5_2_3
    - ch5.def.5_2_4
    - ch5.def.sobolev_ball
    later_book_uses:

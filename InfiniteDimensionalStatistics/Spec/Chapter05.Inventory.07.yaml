- id: ch5.prop.5_2_1
  kind: proposition
  book:
    number: Proposition 5.2.1
    pages:
    - 422
    - 423
    section: 5.2.1
    equations: []
  title: Proposition 5.2.1
  statement: For boundary-corrected or periodised wavelets of regularity S>s and f∈B^s_{∞∞} with 2^{-jₙ(s+1)}√n→0,
    the white-noise projection measure Qₙ(dx)=fₙ(x)dx satisfies √n(Qₙ−Q)⇒σW in ℓ∞(BV_M). The same conclusion holds
    in ℓ∞(H^s_{2,M}) for s>1/2 under the corresponding approximation condition.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - White-noise model (5.5).
    - Boundary or periodised wavelet basis with sufficient regularity.
    - f in the stated Besov class.
    - Bias condition 2^{-jₙ(s+1)}√n→0 for BV; analogous Sobolev exponent as printed.
    - M<∞.
    implicit:
    - W acts on the index class by g↦∫g dW.
    - The limiting Gaussian process has a sample-continuous version.
  quantifier_order:
  - For every fixed M.
  - As n→∞.
  constants:
  - σ.
  dependencies:
    earlier_book:
    - Chapter 4 Donsker properties and wavelet approximation
    chapter_local:
    - ch5.eq.5_6_5_8
    - ch5.def.BV_ball
    - ch5.def.sobolev_ball
    later_book_uses: &id005 []
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Weak convergence of random signed measures in a function-indexed ℓ∞ space via exact Gaussian noise plus
      vanishing bias.
    blockers:
    - Weak convergence in nonseparable function spaces.
    - White-noise random distributions.
  difficulty: research-level
  pass: core
  issues_for_central_review: &id006 []
- id: ch5.def.approx_identity
  kind: definition
  book:
    number: 'Unnumbered definition: approximate convolution identity'
    pages:
    - 423
    section: 5.2.1
    equations: []
  title: 'Unnumbered definition: approximate convolution identity'
  statement: A sequence of finite signed measures μₙ is an approximate convolution identity if μₙ(ℝ)=1 and ∫g dμₙ→g(0)
    for every bounded continuous g. It is proper if |μₙ|([−a,a]^c)→0 for every a>0.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - μₙ finite signed Borel measures.
    implicit:
    - The book first states the mass-one and weak-convergence conditions; “proper” adds concentration in total variation.
  quantifier_order:
  - For every bounded continuous g.
  - For properness, for every a>0.
  constants: *id005
  dependencies:
    earlier_book: *id005
    chapter_local: *id005
    later_book_uses:
    - Proposition 5.2.3
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:

- id: uncentred_empirical_process
  kind: definition
  book:
    number: Eq. (3.2)
    pages:
    - 110
    section: '3.1'
    equations:
    - '3.2'
  title: Uncentred empirical process
  statement: For a class 𝓕 of measurable functions, the uncentred empirical process is the random map f↦Pₙf indexed
    by f∈𝓕.
  transcription_status: exact-transcription
  hypotheses:
    explicit:
    - 𝓕 is a class of measurable real functions
    implicit:
    - Measurability as an ℓ∞(𝓕)-valued map is not automatic.

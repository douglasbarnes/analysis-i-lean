    - 109
    section: '3.1'
    equations:
    - '3.1'
  title: Empirical measure
  statement: For observations X₁,…,Xₙ in (S,𝒮), define Pₙ:=n⁻¹∑_{i=1}^n δ_{Xᵢ}; consequently Pₙf=n⁻¹∑_{i=1}^n f(Xᵢ)
    whenever the evaluations are defined.
  transcription_status: exact-transcription
  hypotheses:
    explicit:
    - n∈ℕ, n≥1
    - Xᵢ are S-valued observations
    implicit:
    - A measurable space (S,𝒮) is fixed.
  quantifier_order:

- id: uniform_deviation
  kind: definition
  book:
    number: Unnumbered definition, p. 110
    pages:
    - 110
    section: '3.1'
    equations: []
  title: Uniform empirical deviation seminorm
  statement: For a signed set function Q and class 𝓕, set ‖Q‖𝓕:=sup_{f∈𝓕}|Qf|; in particular ‖Pₙ−P‖𝓕=sup_{f∈𝓕}|Pₙf−Pf|.
  transcription_status: exact-transcription
  hypotheses:
    explicit: []
    implicit:
    - The raw supremum may fail to be measurable for uncountable 𝓕.

    - 110
    section: '3.1'
    equations:
    - '3.3'
  title: Centred normalised empirical process
  statement: For i.i.d. Xᵢ∼P and f∈𝓕, define νₙ(f):=√n(Pₙf−Pf)=n⁻¹ᐟ²∑_{i=1}^n(f(Xᵢ)−Pf).
  transcription_status: exact-transcription
  hypotheses:
    explicit:
    - X₁,…,Xₙ are i.i.d. P
    - Pf exists for every f∈𝓕
    implicit:
    - The process may be nonmeasurable as an ℓ∞(𝓕)-valued map.

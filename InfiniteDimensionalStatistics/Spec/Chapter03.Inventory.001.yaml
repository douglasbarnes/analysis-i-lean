- id: kde_example
  kind: example
  book:
    number: Eq. (3.4)
    pages:
    - 110
    - 111
    section: '3.1'
    equations:
    - '3.4'
  title: Kernel density estimator as empirical process
  statement: For a measurable kernel K and h>0, fₙ(x):=(nh)⁻¹∑_{i=1}^nK((x−Xᵢ)/h)=Pₙ[K_h(x−·)], K_h(u):=h⁻¹K(u);
    uniform stochastic error is an empirical-process supremum over its translate class.
  transcription_status: exact-transcription
  hypotheses:
    explicit:
    - Xᵢ real-valued
    - K measurable
    - h>0
    implicit: []

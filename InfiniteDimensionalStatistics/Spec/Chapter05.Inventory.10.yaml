- id: ch5.thm.5_3_1
  kind: theorem
  book:
    number: Theorem 5.3.1
    pages:
    - 441
    - 443
    section: 5.3.1
    equations: []
  title: Rates and efficient CLT for the white-noise quadratic functional
  statement: Let B(α,R) be the radius-R ball used in the book, so that ‖(I−K_j)f‖₂≤C R2^{-jα}. Uniformly for f∈B(α,R), E_f(T_n(j)−‖f‖₂²)²≤C(R,σ)(2^{-4jα}+n^{-1}+2^j
    n^{-2}). If 0<α≤1/4 and 2^{j_n} is of order n^{2/(4α+1)}, sup_{f∈B(α,R)}E_f(T_n(j_n)−‖f‖₂²)²=O(n^{-8α/(4α+1)}). If α>1/4, 2^{j_n}/n→0
    and √n 2^{-2αj_n}→0, then for every fixed f∈B(α,R), √n(T_n(j_n)−‖f‖₂²)⇒N(0,4σ²‖f‖₂²).
  source_fidelity:
    transcription_status: verified_by_exact_coefficient_risk_decomposition
    author_corrected_reading: null
  hypotheses:
    explicit:
    - f belongs to the displayed radius-R Besov/Sobolev ball.
    - The projection approximation bound ‖(I−K_j)f‖₂≤CR2^{-jα}.
    - The displayed resolution conditions.
    implicit:
    - Projection dimension |Λ_j| is comparable to 2^j.
    - The CLT is pointwise; the risk bound is uniform.
  quantifier_order:
  - First uniformly over f in the ball for the risk statements.
  - Then for every fixed f for the regular-regime CLT.
  constants:
  - Elbow α=1/4.
  - Low-smoothness MSE exponent 8α/(4α+1).
  - Limit variance 4σ²‖f‖₂².
  dependencies:
    earlier_book:
    - Besov projection approximation
    - Gaussian triangular-array CLT
    chapter_local:
    - ch5.def.quadratic_white_noise
    later_book_uses:
    - Chapter 6 minimax lower bounds and efficiency
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: Use the exact bias/variance decomposition and a Gaussian triangular-array CLT.
  notes_status:
    discussed_or_extended_in_notes: true
    note_summary: The limiting covariance is semiparametrically efficient.
    used_later_in_book: true
  equivalents:
    mathlib:
      status: not-found
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository:
      status: not-found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: Uniform projection-bias/MSE theorem plus a pointwise CLT for linear and centred chi-square components.
    blockers:
    - Besov tail bounds and triangular-array CLT.

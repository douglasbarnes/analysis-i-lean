    - f in the stated Besov/Hölder classes and bounded as required.
    - ψ satisfies the stated regularity and boundedness.
    - Smoothing and sample-splitting conditions.
    - Smoothness >1/4 for CLT.
    implicit:
    - Influence function is 2(ψf−P(ψf)).

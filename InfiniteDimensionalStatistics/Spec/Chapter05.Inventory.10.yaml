- id: ch5.def.deconvolution_model
  kind: definition
  book:
    number: Unnumbered deconvolution observation model
    pages:
    - 451
    section: 5.3.2
    equations: []
  title: Unnumbered deconvolution observation model
  statement: Observe Y=X+ε, where X has unknown density f, ε is independent with known distribution/density ϕ, and
    Y has density g=f*ϕ. Recovery of f is based on F[g]=F[f]F[ϕ] and division by the nonvanishing error characteristic
    function.
  source_fidelity: *id004
  hypotheses:
    explicit:
    - X and ε independent.
    - f is an unknown density.
    - ϕ is known.
    - F[ϕ](u)≠0 on the frequencies used.
    implicit:
    - Fourier transform convention is the one fixed in Chapter 4.
  quantifier_order:
  - For every observation Y_i generated independently from g.
  constants:
  - Known error law ϕ.
  dependencies:
    earlier_book:
    - Fourier convolution theorem
    chapter_local: *id005
    later_book_uses:
    - All of Section 5.3.2
  proof_status: *id001
  notes_status: *id002
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Fourier.Convolution
      - Mathlib.MeasureTheory.Measure.CharacteristicFunction.Basic
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: Probability convolution model and characteristic-function identity.
    blockers:
    - Probability distribution convolution and Fourier transform of measures/functions.
  difficulty: substantial
  pass: core
  issues_for_central_review: *id006

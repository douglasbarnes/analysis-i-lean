- id: ch5.def.general_integral_estimator
  kind: operative_definition
  book:
    number: Equation (5.107)
    pages:
    - 449
    - 450
    section: 5.3.1
    equations:
    - '5.107'
  title: Second-order estimator of a smooth integral functional
  statement: Let Φ(f)=∫F(f(x),x)dx with F(y,x)=yφ(y,x), and let g=\hat f be an independent pilot. Put F_1(g,x)=φ(g(x),x)+g(x)∂_1φ(g(x),x)
    and F_2(g,x)=2∂_1φ(g(x),x)+g(x)∂_1²φ(g(x),x). Using the evaluation sample, define T_n=P_n F_1(g,·)+∫[F(g(x),x)−g(x)F_1(g,x)]dx+(1/2)T_{n,F_2(g,·)}(f−g),
    where the final term is the residual weighted quadratic estimator (5.103). Since F(g)−gF_1(g)=−g²∂_1φ(g), this is the second-order
    Taylor/von Mises estimator in (5.107).
  source_fidelity:
    transcription_status: verified_by_exact_second_order_Taylor_identity
    author_corrected_reading: null
  hypotheses:
    explicit:
    - φ is twice differentiable in its first variable on a range containing f and g.
    - The derivative functions are measurable and integrable.
    - g is independent of the evaluation sample.
    - The weighted quadratic correction with weight F_2(g,·) is well-defined.
    implicit:
    - The third-order Taylor remainder is handled in Theorem 5.3.4.
  quantifier_order:
  - Fix an admissible f and condition on pilot g.
  - Define derivative weights pointwise, then the empirical, integral and quadratic terms.
  constants:
  - F_1=∂_y(yφ(y,x)).
  - F_2=∂_y²(yφ(y,x)).
  dependencies:
    earlier_book:
    - Second-order Taylor formula
    chapter_local:
    - ch5.def.weighted_quadratic
    - ch5.thm.5_3_3
    later_book_uses:
    - ch5.thm.5_3_4
    - ch5.ex.5_3_3
    - ch5.ex.5_3_4
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: Definition obtained by substituting estimators into the exact Taylor identity. Why the remainder is negligible is Theorem
      5.3.4.
  notes_status:
    discussed_or_extended_in_notes: true
    note_summary: The exposition adapts Laurent’s orthogonal-projection construction to kernel estimators.
    used_later_in_book: true
  equivalents:
    mathlib:
      status: not-found
      candidates: []
      exact_equivalent: false
    repository:
      status: not-found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: Bundle F,F_1,F_2 and a uniform third-order remainder; combine empirical and U-statistic terms.
    blockers:
    - Measurable parameterised Taylor theorem and weighted U-statistics.

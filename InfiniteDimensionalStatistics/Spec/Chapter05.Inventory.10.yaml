- id: ch5.thm.5_3_1
  kind: theorem
  book:
    number: Theorem 5.3.1
    pages:
    - 441
    - 443
    section: 5.3.1
    equations: []
  title: Theorem 5.3.1
  statement: The debiased quadratic-functional estimator in the Gaussian white-noise model attains the nonparametric
    quadratic-functional rate below the smoothness threshold and, when the smoothness exceeds 1/4 and the projection
    bias is o(n^{-1/2}), satisfies √n(Tₙ−‖f‖²₂)⇒N(0,4σ²‖f‖²₂), the efficient limit for Q(f).
  source_fidelity:
    transcription_status: central_review_required
    author_corrected_reading: null
  hypotheses:
    explicit:
    - f belongs to the Sobolev/Besov smoothness class and radius stated in the theorem.
    - Resolution jₙ satisfies the theorem’s variance and bias conditions.
    - For the CLT regime, smoothness α>1/4.
    implicit:
    - At f=0 the limiting variance degenerates.
    - The below-threshold rate is stated in the book with an exact risk convention that must be retained.
  quantifier_order:
  - Uniform risk statement over the displayed smoothness ball.
  - Pointwise CLT for each fixed f in the regular regime.
  constants:
  - Threshold α=1/4; variance 4σ²‖f‖²₂.
  dependencies:
    earlier_book:
    - Gaussian quadratic-form concentration/CLT
    chapter_local:
    - ch5.def.quadratic_white_noise
    later_book_uses:
    - Chapter 6 minimax lower bounds and efficiency discussion
  proof_status: *id001
  notes_status: *id002
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: 'Analyse a finite noncentral chi-square sum: exact bias/variance, CLT for linear part, negligibility
      of degenerate quadratic noise.'
    blockers:
    - Triangular-array Gaussian quadratic forms.
    - Besov tail bias.
  difficulty: research-level
  pass: core
  issues_for_central_review:
  - Exact ball notation, low-smoothness exponent, and resolution conditions must be transcribed from pp.441–443.
  - 'Source-transcription status: central_review_required.'
- id: ch5.def.U_quadratic
  kind: operative_definition
  book:
    number: Equation (5.93)
    pages:
    - 443
    - 444
    section: 5.3.1
    equations:
    - '5.93'
  title: Equation (5.93)
  statement: For a symmetric smoothing kernel/projection kernel K_h, define the order-two U-statistic Tₙ(h)=[n(n−1)]⁻¹∑_{i≠j}K_h(X_i−X_j)
    (equivalently 2/[n(n−1)]∑_{i<j}), which estimates ∫f² through E Tₙ(h)=∫(K_h*f)f.
  source_fidelity: *id004
  hypotheses:
    explicit:
    - X_i i.i.d. with density f.
    - K_h symmetric and integrable.
    - n≥2.
    implicit:
    - The book may write a projection-kernel form K_j(X_i,X_j); both are instances of a symmetric kernel U-statistic.
  quantifier_order:
  - For every n≥2 and smoothing parameter.
  constants:
  - Normalisation n(n−1).
  dependencies:
    earlier_book: &id005 []
    chapter_local:
    - ch5.eq.5_1
    later_book_uses:
    - Theorem 5.3.2
  proof_status: *id001
  notes_status: *id002
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      - Mathlib.Analysis.Fourier.Convolution
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: A degree-two U-statistic over unordered pairs, with expectation computed by Fubini.
    blockers:
    - Reusable U-statistic definition and Hoeffding decomposition.
  difficulty: major-library
  pass: core
  issues_for_central_review: &id006 []
- id: ch5.thm.5_3_2
  kind: theorem
  book:
    number: Theorem 5.3.2
    pages:
    - 444
    - 447
    section: 5.3.1
    equations: []
  title: Theorem 5.3.2
  statement: For the U-statistic (5.93), under the stated boundedness, Besov smoothness and kernel assumptions,
    if smoothness α>1/4 and the smoothing sequence makes the quadratic bias o(n^{-1/2}) while the degenerate U-statistic
    part is o_P(n^{-1/2}), then √n(Tₙ−∫f²)⇒N(0,4 Var_f(f(X))). The theorem also gives the optimal low-smoothness
    risk/rate when α≤1/4.
  source_fidelity:
    transcription_status: central_review_required
    author_corrected_reading: null
  hypotheses:
    explicit:
    - f is a bounded density in the precise Besov ball stated in the theorem.
    - K is the stated convolution/projection kernel.
    - Smoothing sequence satisfies the displayed conditions.
    - α>1/4 for the CLT part.
    implicit:
    - The linear Hoeffding projection is 2[(K_h*f)(X)−E Tₙ].
    - Semiparametric efficiency is asserted when the variance is nonzero.
  quantifier_order:
  - Uniform risk over the smoothness ball; pointwise CLT at fixed f.
  constants:
  - Limit variance 4 Var_f(f(X)); threshold 1/4.
  dependencies:
    earlier_book:
    - Hoeffding decomposition and U-statistic moment inequalities
    chapter_local:
    - ch5.def.U_quadratic
    later_book_uses:
    - Exercises 5.3.2 and Chapter 6 efficiency/minimax discussion
  proof_status: *id001
  notes_status: *id002
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      - Mathlib.Analysis.Fourier.Convolution
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: Hoeffding-decompose Tₙ, prove CLT for the linear projection and control the canonical quadratic component.
    blockers:
    - U-statistic theory absent at needed strength.
    - Besov convolution bias for f*f.
  difficulty: research-level
  pass: core
  issues_for_central_review:
  - Exact kernel conditions, low-smoothness exponent and bandwidth/resolution inequalities require direct PDF transcription.
  - 'Source-transcription status: central_review_required.'

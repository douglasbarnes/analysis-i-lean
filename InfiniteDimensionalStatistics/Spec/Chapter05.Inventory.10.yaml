- id: ch5.thm.5_3_2
  kind: theorem
  book:
    number: Theorem 5.3.2
    pages:
    - 444
    - 447
    section: 5.3.1
    equations:
    - '5.93'
  title: Rates and efficient CLT for the quadratic density functional
  statement: Let T_n(h)=2/[n(n−1)h] Σ_{1≤i<k≤n} K((X_i−X_k)/h), where K is bounded, symmetric, ∫K=1 and ∫|K(u)||u|du<∞. If f is bounded
    and f∈H_2^α(R), 0<α≤1/2, then E_f(T_n(h)−∫f²)²≤C(h^{4α}+n^{-1}+(n²h)^{-1}). For 0<α≤1/4 and h_n of order n^{-2/(4α+1)}, the MSE
    is O(n^{-8α/(4α+1)}). For α>1/4, if √n h_n^{2α}→0 and n h_n→∞, then √n(T_n(h_n)−∫f²)⇒N(0,4τ²), τ²=∫f³−(∫f²)²=Var_f(f(X)); if τ²>0
    the estimator is efficient.
  source_fidelity:
    transcription_status: verified_against_Gine_Nickl_2008a
    author_corrected_reading: null
  hypotheses:
    explicit:
    - X_i are i.i.d. with bounded density f.
    - f∈H_2^α(R), 0<α≤1/2.
    - K is bounded, symmetric, integrates to one, and has finite first absolute moment.
    - Bandwidth conditions as displayed.
    implicit:
    - The theorem’s Besov formulation follows because the cited Sobolev class embeds in the book’s B_{2∞}^α framework.
  quantifier_order:
  - Uniform MSE over bounded smoothness balls.
  - Pointwise CLT for fixed f in the regular regime.
  constants:
  - Elbow α=1/4.
  - MSE exponent 8α/(4α+1).
  - τ²=Var_f(f(X)).
  dependencies:
    earlier_book:
    - Hoeffding decomposition and U-statistic bounds
    chapter_local:
    - ch5.def.U_quadratic
    later_book_uses:
    - ch5.def.weighted_quadratic
    - Chapter 6 efficiency/minimax discussion
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: The proof uses the extra smoothness of f*f to control the bias without pilot debiasing.
  notes_status:
    discussed_or_extended_in_notes: true
    note_summary: Attributed to Giné and Nickl (2008a); the notes emphasise that ψ=1 requires no pilot debiasing.
    used_later_in_book: true
  equivalents:
    mathlib:
      status: not-found
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      exact_equivalent: false
    repository:
      status: not-found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: Hoeffding decomposition, convolution bias estimate, degenerate U-statistic variance, scalar CLT.
    blockers:

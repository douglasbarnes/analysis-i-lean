- id: ch5.thm.5_3_4
  kind: theorem
  book:
    number: Theorem 5.3.4
    pages:
    - 450
    - 451
    section: 5.3.1
    equations: []
  title: Efficient CLT for smooth integral functionals
  statement: Let Φ(f)=∫φ(f(x),x)f(x)dx and let T_n be (5.107). Assume f is bounded, belongs to B_{2,∞}^α and to the auxiliary Hölder/Besov
    class required for products and composition, with α>1/4; assume any positive lower bound required by φ (for example for log-type
    functionals); assume F(y,x)=yφ(y,x) has three first-variable derivatives on the relevant range with a uniform third-order remainder;
    and choose the pilot and projection levels so that the pilot Taylor remainder, projection bias and degenerate U-statistic part are
    o_P(n^{-1/2}). Then T_n−Φ(f)=n^{-1}Σ_{i=1}^n[IF_f(X_i)−P_fIF_f]+o_P(n^{-1/2}), where IF_f(x)=φ(f(x),x)+f(x)∂_1φ(f(x),x). Hence √n(T_n−Φ(f))⇒N(0,Var_f(IF_f(X))).
    The covariance attains the semiparametric Cramér–Rao bound.
  source_fidelity:
    transcription_status: verified_by_Laurent_von_Mises_expansion_and_book_exercises
    author_corrected_reading: null
  hypotheses:
    explicit:
    - α>1/4 and f lies in the exact smoothness intersection used in the subsection.
    - Pointwise lower/upper bounds on f whenever required by φ.
    - F(y,x)=yφ(y,x) has three first-variable derivatives with uniform integrable Taylor remainder.
    - Pilot and projection/split sequences satisfy the o_P(n^{-1/2}) remainder conditions.
    implicit:
    - Degenerate zero-variance cases are allowed.
    - The influence function is centred by its P_f-mean.
  quantifier_order:
  - For every fixed admissible f and functional φ.
  - As n→∞ along admissible pilot and smoothing sequences.
  constants:
  - IF_f(x)=φ(f(x),x)+f(x)∂_1φ(f(x),x).
  - Limit variance Var_f(IF_f(X)).
  dependencies:
    earlier_book:
    - Scalar i.i.d. CLT and Taylor expansion
    chapter_local:
    - ch5.def.general_integral_estimator
    - ch5.thm.5_3_3
    - ch5.ex.5_3_1
    later_book_uses:
    - ch5.ex.5_3_3
    - ch5.ex.5_3_4
  proof_status:
    delegates_to_exercises:
    - Exercise 5.3.1
    contains_omitted_steps: true
    comment: Exercise 5.3.1 completes the remainder analysis by decomposing the quadratic terms as indicated in the hint.
  notes_status:
    discussed_or_extended_in_notes: true
    note_summary: Adapted from Laurent (1996); the limiting covariance is efficient.
    used_later_in_book: true
  equivalents:
    mathlib:
      status: not-found
      candidates: []
      exact_equivalent: false
    repository:
      status: not-found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: Second-order von Mises expansion plus conditional U-statistic remainder estimates and scalar CLT.
    blockers:
    - Smooth composition on Besov classes and high-order stochastic remainders.
  difficulty: research-level

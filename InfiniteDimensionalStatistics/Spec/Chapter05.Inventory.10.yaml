- id: ch5.def.weighted_quadratic
  kind: operative_definition
  book:
    number: 'Equation (5.103): weighted/debiased quadratic estimator'
    pages:
    - 447
    - 449
    section: 5.3.1
    equations:
    - '5.103'
  title: Sample-split debiased estimator of a weighted quadratic functional
  statement: For Q_ψ(f)=∫ψf², split the observations into an independent pilot sample and an evaluation sample of size m, and let g=\hat
    f be the pilot. For a projection kernel K_j define R_{j,g,ψ}(x,y)=∫ψ(u)(K_j(u,x)−g(u))(K_j(u,y)−g(u))du and U_{m,j}(g,ψ)=2/[m(m−1)]Σ_{i<k}R_{j,g,ψ}(X_i,X_k).
    Define T_{m,j,ψ}=2P_m(ψg)−∫ψg²+U_{m,j}(g,ψ). Conditionally on g, the first two terms implement Q_ψ(f)=2P_f(ψg)−Q_ψ(g)+Q_ψ(f−g),
    while U_{m,j} estimates the projected residual quadratic term.
  source_fidelity:
    transcription_status: verified_by_second_order_debiasing_identity
    author_corrected_reading: null
  hypotheses:
    explicit:
    - ψ is bounded and has the regularity required by Theorem 5.3.3.
    - g is based on an independent pilot sample.
    - K_j is the chosen convolution/projection kernel.
    - m≥2.
    implicit:
    - Fubini integrability of R_{j,g,ψ}.
    - The projection bias between K_jf and f is handled in the theorem.
  quantifier_order:
  - Condition on the pilot g.
  - For each evaluation sample size m and resolution j define the U-statistic and the full estimator.
  constants:
  - Normalisation 2/[m(m−1)].
  - Weight ψ and split sizes.
  dependencies:
    earlier_book: []
    chapter_local:
    - ch5.def.U_quadratic
    later_book_uses:
    - ch5.thm.5_3_3
    - ch5.def.general_integral_estimator
    - ch5.ex.5_3_2
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: Definition justified by the exact quadratic identity around the pilot.
  notes_status:
    discussed_or_extended_in_notes: true
    note_summary: The notes relate the debiasing device to Bickel–Ritov and Laurent.
    used_later_in_book: true
  equivalents:

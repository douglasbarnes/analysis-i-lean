- id: ch5.thm.5_3_3
  kind: theorem
  book:
    number: Theorem 5.3.3
    pages:
    - 447
    - 449
    section: 5.3.1
    equations: []
  title: Rates and efficient CLT for weighted quadratic functionals
  statement: For the estimator T_{m,j,ψ} in (5.103), assume f belongs to the displayed bounded Besov/Sobolev ball of smoothness α, ψ
    has the displayed bounded multiplier regularity, and the pilot and projection levels satisfy the stated product-remainder conditions.
    Then uniformly over the class, E_f(T_{m,j,ψ}−Q_ψ(f))²≤C(2^{-4jα}+m^{-1}+2^j m^{-2}+pilot-remainder²). Consequently the optimal low-smoothness
    MSE is of order n^{-8α/(4α+1)} for α≤1/4. If α>1/4 and all projection and pilot remainders are o(n^{-1/2}), then √n(T_{n,ψ}−Q_ψ(f))⇒N(0,4
    Var_f(ψ(X)f(X))), and the estimator is efficient when the variance is positive.
  source_fidelity:
    transcription_status: verified_by_weighted_Hoeffding_and_debiasing_expansion
    author_corrected_reading: null
  hypotheses:
    explicit:
    - f is bounded and belongs to the displayed α-smoothness class.
    - ψ is a bounded multiplier of the required regularity.
    - Pilot is independent and consistent at the displayed rates.
    - Projection and split-size conditions make all remainders negligible.
    implicit:
    - The limiting influence function is 2(ψf−P_f(ψf)).
  quantifier_order:
  - Uniform risk over the smoothness class.
  - Pointwise CLT for each fixed admissible f.
  constants:
  - Elbow α=1/4.
  - Limit variance 4 Var_f(ψ(X)f(X)).
  dependencies:
    earlier_book:
    - Weighted projection approximation and U-statistic bounds
    chapter_local:
    - ch5.def.weighted_quadratic
    - ch5.thm.5_3_2
    later_book_uses:
    - ch5.def.general_integral_estimator
    - ch5.thm.5_3_4
    - ch5.ex.5_3_2
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: Weighted Hoeffding decomposition plus pilot-error product control.
  notes_status:
    discussed_or_extended_in_notes: true
    note_summary: The rates and covariance are described as minimax and semiparametrically efficient.
    used_later_in_book: true
  equivalents:

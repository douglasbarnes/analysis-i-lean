- id: ch5.thm.5_3_4
  kind: theorem
  book:
    number: Theorem 5.3.4
    pages:
    - 450
    - 451
    section: 5.3.1
    equations: []
  title: Theorem 5.3.4
  statement: Under the stated lower/upper bounds and Besov/Hölder regularity of f, smoothness and remainder conditions
    on φ, and α>1/4, the estimator (5.107) is asymptotically linear with efficient influence function x↦φ(f(x),x)+f(x)∂₁φ(f(x),x)
    minus its P-mean. Hence √n(Tₙ−Φ(f)) converges to a centred normal law with variance Var_f(φ(f(X),X)+f(X)∂₁φ(f(X),X)).
  source_fidelity:
    transcription_status: central_review_required
    author_corrected_reading: null
  hypotheses:
    explicit:
    - f belongs to the exact intersection of smoothness classes and satisfies the pointwise bounds in the theorem.
    - α>1/4.
    - φ has the displayed derivatives and uniform Taylor remainder.
    - Pilot and smoothing sequences satisfy the theorem conditions.
    implicit:
    - The efficient influence function is centred by its P-expectation.
    - Degenerate zero-variance cases are allowed.
  quantifier_order:
  - For each fixed admissible f.
  - As n→∞.
  constants:
  - Limit variance as displayed.
  dependencies:
    earlier_book: *id005
    chapter_local:
    - ch5.def.general_integral_estimator
    - ch5.thm.5_3_3
    later_book_uses:
    - Exercises 5.3.1, 5.3.3, 5.3.4
  proof_status:
    delegates_to_exercises:
    - Exercise 5.3.1
    contains_omitted_steps: true
    comment: ''
  notes_status: *id002
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      - Mathlib.Analysis.Fourier.Convolution
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: Second-order von Mises/Taylor expansion; prove all pilot remainder terms o_P(n^{-1/2}) and apply the
      scalar CLT to the influence function.
    blockers:

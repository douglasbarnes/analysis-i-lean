  title: Integrated-Brownian L² contraction rates
  statement: 'Let W_k be k-times integrated Brownian motion released at zero, k∈ℕ₀, and set

    α=k+1/2. If f₀∈B^α_{22}, then in Gaussian white noise the posterior based on W_k

    contracts in L² at the minimax rate n^{-α/(2α+1)}.'
  hypotheses:
    explicit:
    - k∈ℕ₀; α=k+1/2.
    - Truth f₀∈B^α_{22}.
    - Released integrated-Brownian prior.
    implicit:
    - The release term spans the polynomial null space required by the RKHS.
  quantifier_order:
  - For M sufficiently large, posterior mass outside M n^{-α/(2α+1)} tends to zero.
  constants: []
  dependencies:
    earlier_book:
    - Integrated Brownian RKHS and small-ball results in §2.6.3
    chapter_local:
    - ch7.thm.7.3.6
    - ch7.example.releasedBrownianPrior

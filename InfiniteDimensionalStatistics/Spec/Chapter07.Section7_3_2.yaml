  title: Uniform-norm control of exponential-density distances
  statement: 'For measurable v,w and p_v,p_w as in (7.107), with a=||v-w||∞:

    (a) h(p_v,p_w) ≤ a e^{a/2};

    (b) -∫ log(p_v/p_w) p_w dμ ≤ a² e^a(1+a);

    (c) ∫ [log(p_v/p_w)]² p_w dμ ≤ a² e^a(1+a)².'
  hypotheses:
    explicit:
    - v,w are essentially bounded relative to one another so a<∞.
    - Both normalising constants are finite and positive.
    implicit:
    - The source OCR is poor; constants and powers have been reconstructed from the printed formula and must be visually checked before implementation.
  quantifier_order:
  - ∀ admissible v,w.

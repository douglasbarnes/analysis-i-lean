    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Hellinger contraction for log-density integrated-Brownian priors
  statement: "Let Π be the law of p_{W_k} with W_k a k-times integrated Brownian motion released\nat zero, α=k+1/2. If X_i are i.i.d. from p₀ and p₀ and w₀=log p₀ belong to\nB^α_{∞∞}([0,1]), then for M sufficiently large,\n  Π(p:h(p,p₀)>M n^{-α/(2α+1)} | X₁,…,Xₙ)→0\nin P₀^n-probability."
  hypotheses:
    explicit:
    - k∈ℕ₀; α=k+1/2.
    - p₀ is a density and both p₀,log p₀ have the stated Hölder/Besov regularity.
    implicit:
    - The regularity ensures p₀ is bounded and bounded away from zero.
    - The prior is pushed forward through w↦p_w.
  quantifier_order:
  - For M sufficiently large.
  constants: []
  dependencies:
    earlier_book:
    - Gaussian small-ball/isoperimetric results
    - Corollary 4.3.38

- id: ch5.prop.5_1_18
  kind: proposition
  book:
    number: Proposition 5.1.18
    pages: [409, 410]
    section: 5.1.2
    equations: []
  title: Almost-sure Lp limsup for centred estimators
  statement: Under Theorem 5.1.5, if n2^(−j_n)→∞ and j_n/log log n→∞, then for every 1≤p<∞ there exists a deterministic C_p≤L_p such that limsup_n √(n/2^(j_n))‖f_n−Ef_n‖_p=C_p almost surely.
  source_fidelity:
    transcription_status: verified
    author_corrected_reading: null
  hypotheses:
    explicit:
    - The hypotheses of Theorem 5.1.5.
    - The integer-valued resolution sequence satisfies n2^(−j_n)→∞.
    - j_n/log log n→∞.
    - 1≤p<∞.
    implicit:
    - The density need not be bounded.
  quantifier_order:
  - For each p there exists C_p.
  - The limsup equality holds almost surely as n→∞.
  constants:
  - C_p≤L_p.

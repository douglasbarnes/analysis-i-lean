- id: ch5.prop.5_1_17
  kind: proposition
  book:
    number: Proposition 5.1.17
    pages: [409]
    section: 5.1.2
    equations: []
  title: Fluctuations of the L1 estimation error
  statement: For any density f, ‖f_n−f‖₁−E‖f_n−f‖₁=O_P(n^(−1/2)); if √n E‖f_n−f‖₁→∞, then ‖f_n−f‖₁/E‖f_n−f‖₁→1 in probability. Moreover, limsup_n √(n/log n)|‖f_n−f‖₁−E‖f_n−f‖₁|≤2‖Φ‖₁ almost surely; if √(n/log n)E‖f_n−f‖₁→∞, then the same ratio tends to one almost surely.
  source_fidelity:
    transcription_status: verified
    author_corrected_reading: null
  hypotheses:
    explicit:
    - A sample-based kernel or projection estimator covered by Remark 5.1.14.
    - For the displayed constant, the real-line envelope Φ is used.
    implicit:
    - The two divergence assumptions are separate sufficient conditions for the probability and almost-sure ratio conclusions.
  quantifier_order:
  - Let n tend to infinity along the estimator sequence.
  constants:
  - The almost-sure fluctuation constant is 2‖Φ‖₁.
  dependencies:
    earlier_book:
    - Borel–Cantelli lemma
    chapter_local:
    - ch5.rem.5_1_14
    later_book_uses: []
  proof_status:
    delegates_to_exercises: []

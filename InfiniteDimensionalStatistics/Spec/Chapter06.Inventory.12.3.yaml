  title: Integral log rn Deriv neg Part le total Variation
  statement: |-
    For \(a\in\mathbb R\), write \(a^-=\max(0,-a)\) and
    \(a^+=\max(0,a)\). If \(P\ll Q\), prove
    \[
    \int \bigl[\log(dP/dQ)\bigr]^-\,dP\le \|P-Q\|_{\mathrm{TV}},
    \]
    and hence, for common densities \(p,q\),
    \[
    K(P,Q)=\int_{\{pq>0\}}p[\log(p/q)]^+\,d\mu
           -\int_{\{pq>0\}}p[\log(p/q)]^-\,d\mu .
    \]
  hypotheses:
    explicit:
    - P and Q are probability measures on a common measurable space.
    - P is absolutely continuous with respect to Q.
    - For the density formula, μ is a common dominating measure and p,q are the corresponding densities.
    implicit: []
  quantifier_order:
  - ∀ P,Q with P≪Q, the negative-part inequality holds; then ∀ common μ, the signed positive/negative decomposition of K(P,Q) follows.
  constants:
  - ∀ P,Q with P≪Q, the negative-part inequality holds; then ∀ common μ, the signed positive/negative decomposition of K(P,Q) follows.

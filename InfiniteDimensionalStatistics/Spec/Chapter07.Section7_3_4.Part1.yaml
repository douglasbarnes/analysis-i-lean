    comment: none
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: No notes-only mathematical declaration is used here.
    used_later_in_book: true
  equivalents:
    mathlib:
      status: none_exact
      candidates:
      - Weak convergence of probability measures
      - Gaussian measures on normed spaces
      exact_equivalent: false
    repository:
      status: none_found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: 'A specification interface for random posterior measures: apply the map f ↦ √n(f-Tₙ) and require weak convergence in probability to a fixed centred Gaussian probability measure on a separable Banach/Hilbert space.'
    blockers: []

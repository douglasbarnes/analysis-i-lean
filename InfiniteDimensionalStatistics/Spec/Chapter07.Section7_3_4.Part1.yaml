- id: ch7.def.finiteDimensionalPosteriorShift
  kind: definition
  book:
    number: Definition in the discussion preceding Theorem 7.3.18
    label: Definition in the discussion preceding Theorem 7.3.18
    pages:
    - 592
    - 593
    section: 7.3.4

- id: ch7.thm.7.3.18
  kind: theorem
  book:
    number: Theorem 7.3.18
    pages:
    - 593
    - 594
    section: 7.3.4
    equations: []
  title: Finite-dimensional Bernstein–von Mises theorem
  statement: "Under Condition 7.3.17, for fixed finite-dimensional V, let\n  T_{Y,V}(f)=√n π_V(f-Y).\nThen\n  || Π(·|Y)∘T_{Y,V}^{-1} - N_V(0,I) ||_{TV} →0\nin P^Y_{f₀}-probability."
  hypotheses:
    explicit:
    - Fixed f₀ and V.
    - Condition 7.3.17.
    - White-noise experiment.
    implicit:
    - The centring Y is projected onto V.
    - Total variation is between probability measures on V.
  quantifier_order:
  - For each fixed V, as n→∞.
  constants: []
  dependencies:

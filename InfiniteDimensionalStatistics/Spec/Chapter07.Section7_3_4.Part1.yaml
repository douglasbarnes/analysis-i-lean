- id: ch7.remark.nonparametricBvMTarget
  kind: remark
  book:
    number: unnumbered
    pages:
    - 591
    section: 7.3.4
    equations: []
  title: Nonparametric Bernstein–von Mises target
  statement: 'The Bernstein–von Mises principle sought in §7.3.4 is that, after centring

    at the likelihood estimator (or, by the official correction, any efficient

    estimator) and scaling by √n, the posterior distribution is asymptotically

    Gaussian with covariance equal to the inverse information/Cramér–Rao

    covariance, in a topology weak enough for the infinite-dimensional

    Gaussian limit to be a tight Borel probability measure.'
  hypotheses:
    explicit:
    - A dominated statistical experiment with a locally asymptotically normal likelihood.
    - An efficient centring estimator.
    - A chosen separable topology in which the Gaussian limit is tight.
    implicit:
    - The assertion is a programme/target, not a theorem at this point.
    - Strong total-variation convergence in the full infinite-dimensional parameter
      norm is generally unavailable.
  quantifier_order:
  - For n→∞ after √n rescaling and efficient centring.
  constants:
  - Scaling constant √n.
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.def.whiteNoisePosterior
    later_book_uses: []

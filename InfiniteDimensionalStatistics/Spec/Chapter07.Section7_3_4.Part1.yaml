- id: ch7.condition.7.3.17
  kind: condition
  book:
    number: Condition 7.3.17
    pages:
    - 592
    section: 7.3.4
    equations: []
  title: Finite-dimensional prior regularity and posterior tightness
  statement: "For every fixed finite-dimensional coordinate subspace V:\n(i) the projected prior Π∘π_V^{-1} has a Lebesgue density continuous and strictly\n    positive at π_V f₀;\n(ii) for every δ>0 there is a fixed L²-ball C_δ⊂V such that for all large n,\n    E^Y_{f₀} Π( √n π_V(f-f₀)∉C_δ |Y )<δ."
  hypotheses:
    explicit:
    - V is fixed and finite-dimensional.
    - A Lebesgue measure on V is chosen.
    - Projected density is locally continuous and positive.
    - Uniform finite-dimensional posterior tightness.
    implicit:
    - The condition is required for every finite-dimensional span used in the projective
      limit argument.
  quantifier_order:
  - ∀ finite-dimensional V, (i); ∀δ>0, ∃C_δ, eventually (ii).

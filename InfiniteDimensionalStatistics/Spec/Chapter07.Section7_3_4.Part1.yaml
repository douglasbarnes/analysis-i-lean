    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Negative weighted Sobolev space H(δ)
  statement: "Define H_2^{s,δ} by the coefficient norm\n  ||f||_{s,2,δ}²=∑_{l,k} a_l^{2s}(log a_l)^{-2δ}|f_{lk}|²,\nand set H(δ)=H_2^{-1/2,δ}. White noise is a tight Borel Gaussian random element of\nH(δ) only for δ>1/2 (official correction)."
  hypotheses:
    explicit:
    - An S-regular basis and scales a_l.
    - δ>1/2 for white-noise support.
    implicit:
    - At low frequencies log a_l is nonzero because a_l≥2.
  quantifier_order:
  - Define for all s,δ; BvM use δ>1/2.

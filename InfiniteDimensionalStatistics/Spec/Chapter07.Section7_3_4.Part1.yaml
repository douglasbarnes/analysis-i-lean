    section_title: Nonparametric Bernstein–von Mises Theorems
    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Finite-dimensional posterior shift
  statement: "For a finite-dimensional subspace V, a centre z in the ambient coefficient\nspace, and the orthogonal projection π_V, define\n  T_{z,V}(f) = √n · π_V(f-z).\nThe finite-dimensional Bernstein–von Mises theorem studies the pushforward\nposterior Π(·|Y)∘T_{z,V}^{-1}, principally for z=Y or an efficient centre."
  hypotheses:
    explicit:
    - V is a fixed finite-dimensional subspace generated by finitely many basis vectors.
    - π_V is the orthogonal coordinate projection.
    - z and f belong to an ambient linear coefficient space.
    implicit:
    - The map is Borel measurable.
    - The dimension of V is fixed while n→∞ in Theorem 7.3.18.
  quantifier_order:
  - Fix V and z; for every n and f define T_{z,V}(f).
  constants:
  - Scaling √n.
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.def.whiteNoiseSequenceModel
    later_book_uses:
    - ch7.thm.7.3.18
    - ex7.3.6
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: none
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: No notes-only mathematical declaration is used here.
    used_later_in_book: true
  equivalents:

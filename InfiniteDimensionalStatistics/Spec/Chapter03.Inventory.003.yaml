  title: Moment comparison for sums of independent processes
  statement: For 1≤p≤q<∞, the L^q norm of ‖∑Xᵢ‖_T is bounded by K_{p,q} times its L^p norm plus the L^q norm of
    max_i‖Xᵢ‖_T.

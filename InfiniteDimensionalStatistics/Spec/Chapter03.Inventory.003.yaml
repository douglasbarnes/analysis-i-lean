- id: proposition_3_1_11
  kind: proposition
  book:
    number: Proposition 3.1.11
    pages:
    - 123
    section: '3.1'
    equations: []
  title: Lévy maximal inequality for symmetric processes
  statement: For independent symmetric sample-bounded processes Xᵢ and partial sums S_k, Pr{max_{k≤n}‖S_k‖_T>u}≤2Pr{‖S_n‖_T>u};
    the corresponding L^p maximal inequality follows.
  transcription_status: exact-transcription
  hypotheses:

- id: proposition_3_1_12
  kind: proposition
  book:
    number: Proposition 3.1.12
    pages:
    - 124
    section: '3.1'
    equations: []
  title: Lévy–Ottaviani inequality
  statement: For independent sample-bounded processes with partial sums S_k, the one-sided maximal probability is
    bounded by the terminal-sum probability divided by the infimum of the relevant remaining-increment probabilities,
    in the exact Ottaviani form displayed.

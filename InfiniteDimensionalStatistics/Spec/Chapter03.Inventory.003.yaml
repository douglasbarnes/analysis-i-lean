- id: lemma_3_1_13
  kind: lemma
  book:
    number: Lemma 3.1.13
    pages:
    - 125
    section: '3.1'
    equations: []
  title: Hoffmann–Jørgensen tail recursion
  statement: For independent sample-bounded processes, the tail of ‖S_n‖ above a sum of thresholds is bounded by
    a product/square of lower-threshold tails plus the tail of max_i‖Xᵢ‖; this is the recursion used for moment
    comparison.
  transcription_status: precise-structural-statement-page-image-check

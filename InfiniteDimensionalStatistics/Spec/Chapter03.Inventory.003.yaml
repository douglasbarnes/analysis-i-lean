  title: Concentration of Gaussian quadratic forms
  statement: For independent standard normal gᵢ and aᵢ≥0, the centred weighted chi-square ∑aᵢ(gᵢ²−1) satisfies the
    displayed exact log-mgf inequality and the resulting upper and lower concentration inequalities governed by
    (∑aᵢ²)^{1/2} and maxᵢaᵢ.

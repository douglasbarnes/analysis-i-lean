  title: L^p packing bounds for VC-subgraph classes
  statement: 'Let 𝓕 be VC-subgraph of index v with envelope F. For 0<ε≤1, p>0, 0<PF^p<∞ and every w>v−1, the packing/covering
    bounds (3.233)–(3.235) are polynomial: exponent wp for p≥1 and exponent w for 0<p<1, with the displayed m_{v,w} and powers
    of 2.'
  transcription_status: exact-transcription

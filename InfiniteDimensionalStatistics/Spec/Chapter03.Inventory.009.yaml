  title: VC-type class
  statement: A class 𝓕 with envelope F is VC type with characteristics (A,v) if for every finitely supported probability Q
    and 0<ε≤1, N(𝓕,L²(Q),ε‖F‖_{L²(Q)})≤(A/ε)^v.

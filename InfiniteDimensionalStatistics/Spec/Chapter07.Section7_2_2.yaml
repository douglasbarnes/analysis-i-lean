- id: ch7.prop.7.2.4
  kind: proposition
  book:
    number: Proposition 7.2.4
    pages:
    - 552
    - 553
    section: 7.2.2
    equations: []
  title: Fréchet derivatives of sample and population log-likelihoods
  statement: "For U(x₁,…,xₙ)={f∈L∞:min_i f(xᵢ)>0} and U={f∈L∞:inf_x f(x)>0},\nboth\
    \ sets are open. For α∈ℕ, α≥1, and directions f₁,…,f_α∈L∞,\n  D^αℓₙ(f)[f₁,…,f_α]\n\
    \    = (-1)^{α-1}(α-1)! Pₙ(f^{-α}∏_{j=1}^α f_j),\nand, for the population functional,\n\
    \  D^αℓ(f)[f₁,…,f_α]\n    = (-1)^{α-1}(α-1)! P₀(f^{-α}∏_{j=1}^α f_j)."
  hypotheses:
    explicit:
    - Finite sample x₁,…,xₙ.
    - For the population formula f is bounded away from zero.
    - Directions are bounded.
    implicit:
    - Point evaluations on L∞ equivalence classes are not well-defined without selecting
      actual bounded functions; Lean should not use quotient `L∞` for U(x₁,…,xₙ).
    - Differentiation under the integral requires Exercise 7.2.4 hypotheses.
  quantifier_order:
  - ∀ α≥1, ∀ f in the relevant open set, ∀ directions f₁,…,f_α.
  constants: []
  dependencies:
    earlier_book:
    - Banach-space Fréchet calculus
    chapter_local:
    - ch7.def.logLikelihood
    - ch7.def.populationLogLikelihood
    later_book_uses: []
  proof_status:

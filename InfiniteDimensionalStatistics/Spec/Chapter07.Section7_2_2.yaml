- id: ch7.lemma.7.2.5
  kind: lemma
  book:
    number: Lemma 7.2.5
    pages:
    - 553
    - 554
    section: 7.2.2
    equations: []
  title: Directional derivative bound at a constrained MLE
  statement: "Let ḡ∈H and η>0. If both line segments from p̂ₙ to p₀+ηḡ and to p₀-ηḡ\n\
    lie in P∩U(X₁,…,Xₙ), then\n  |Dℓₙ(p̂ₙ)[ḡ]| ≤ η^{-1}|Dℓₙ(p̂ₙ)[p̂ₙ-p₀]|."
  hypotheses:
    explicit:
    - p̂ₙ is an MLE.
    - ḡ has zero integral.
    - Both specified line segments remain in the feasible positive set.
    implicit:
    - One-sided derivative optimality is applicable along each segment.
  quantifier_order:
  - ∀ admissible ḡ,η satisfying segment conditions.
  constants: []

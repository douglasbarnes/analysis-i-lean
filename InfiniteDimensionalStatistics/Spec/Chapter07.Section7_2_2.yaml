  title: Projection to a density tangent direction
  statement: For a bounded test function g define π₀(g)=(g-P₀g)p₀.
  hypotheses:
    explicit:
    - g is P₀-integrable; in applications g∈L∞.
    - p₀ is a density.
    implicit:
    - π₀(g) integrates to zero with respect to μ.

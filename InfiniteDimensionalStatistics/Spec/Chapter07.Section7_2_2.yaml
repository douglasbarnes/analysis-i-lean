- id: ch7.lemma.7.2.6
  kind: lemma
  book:
    number: Lemma 7.2.6
    pages:
    - 554
    section: 7.2.2
    equations: []
  title: Likelihood identity for the plug-in measure
  statement: "Assume p₀>0 and let p̂ₙ be an MLE. For bounded g, writing P̂ₙ for the\
    \ measure\nwith density p̂ₙ,\n  |(P̂ₙ-Pₙ)(g)|\n   = |Dℓₙ(p₀)[π₀(g)] + D²ℓ(p₀)[p̂ₙ-p₀,π₀(g)]|."
  hypotheses:
    explicit:
    - p₀ is strictly positive.
    - g∈L∞.
    - The derivatives in Proposition 7.2.4 exist.
    implicit:
    - Strict positivity should be made quantitative (bounded away from zero) when
      using population Fréchet derivatives on U; the printed statement says p₀>0 and
      this generality should be reviewed.
  quantifier_order:
  - ∀ bounded g.
  constants: []
  dependencies:

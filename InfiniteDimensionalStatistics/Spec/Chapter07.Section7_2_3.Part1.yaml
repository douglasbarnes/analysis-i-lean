- id: ch7.prop.7.2.8
  kind: proposition
  book:
    number: Proposition 7.2.8
    pages:
    - 556
    - 557
    section: 7.2.3
    equations: []
  title: Uniform consistency of the Sobolev-ball MLE
  statement: If p₀∈P(t,D) and p₀ is strictly positive, then ||p̂ₙ-p₀||∞→0 almost surely.
  hypotheses:
    explicit:
    - t>1/2, D>1.
    - p₀∈P(t,D).
    - p₀(x)>0 for every x.
    - p̂ₙ is any measurable MLE.
    implicit:
    - Compactness and likelihood identifiability are used; strict positivity plus
      continuity on [0,1] implies a positive lower bound.
  quantifier_order:
  - Under P₀^∞, almost surely as n→∞.
  constants: []

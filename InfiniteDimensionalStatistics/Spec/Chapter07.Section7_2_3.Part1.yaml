- id: ch7.prop.7.2.7
  kind: proposition
  book:
    number: Proposition 7.2.7
    label: Proposition 7.2.7
    pages:
    - 555
    - 556
    section: 7.2.3
    equations: []
    section_title: The Maximum Likelihood Estimator over a Sobolev Ball
    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Compactness and existence of the Sobolev-ball MLE
  statement: "For t>1/2 and D>1:\n(a) P(t,D) is compact in C([0,1]) with the uniform norm;\n(b) ℓₙ:P(t,D)→[-∞,∞) is upper semicontinuous (the printed text states continuity\n    in the extended-real topology) for each sample;\n(c) a maximiser exists and a Borel-measurable maximiser p̂ₙ can be selected."
  hypotheses:
    explicit:
    - The model of (7.53).
    - Fixed finite sample.
    implicit:
    - Part (b)'s exact continuity notion at zeros uses the topology on the extended real line.
    - Part (c) uses a measurable maximum theorem.
  quantifier_order:
  - ∀ n and samples, existence; ∃ measurable selector as a function of the sample.
  constants: []
  dependencies:
    earlier_book:
    - Sobolev compact embedding
    - Arzelà–Ascoli
    chapter_local:
    - ch7.def.sobolevDensityModel
    later_book_uses:
    - ch7.prop.7.2.8
    - ch7.prop.7.2.9
  proof_status:
    delegates_to_exercises:
    - ex7.2.3
    contains_omitted_steps: true
    comment: measurable-selection proof of part (c)
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: No notes-only mathematical declaration is used here.
    used_later_in_book: true
  equivalents:
    mathlib:
      status: none_exact
      candidates: []
      exact_equivalent: false
    repository:
      status: none_found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: Compact subtype in `C([0,1],ℝ)` plus an upper-semicontinuous extended-real objective; measurable argmax selection
      likely needs a new theorem.
    blockers: []
  difficulty: major-library

  title: Sobolev-ball density model and MLE
  statement: 'For t>1/2 and D>1 define P(t,D) as the continuous nonnegative probability

    densities p on [0,1] with ||p||_{H^t}≤D. Define p̂ₙ as a maximiser of ℓₙ over P(t,D).'
  hypotheses:
    explicit:
    - t>1/2.
    - D>1.
    - Periodic Sobolev convention.
    - p≥0 and ∫_0^1 p=1.
    implicit:
    - Sobolev embedding supplies continuous representatives.
    - MLE existence is established next.
  quantifier_order:
  - Fix t,D; define the model and estimator for each n.

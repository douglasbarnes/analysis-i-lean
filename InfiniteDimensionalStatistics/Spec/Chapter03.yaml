section_3_8_notes_inventory:
- topic: Bounded-sum concentration and maximal inequalities
  results:
  - Lemma 3.1.1
  - Theorems 3.1.2, 3.1.5, 3.1.7
  - Lévy/Ottaviani/Hoffmann–Jørgensen
  - symmetrisation and contraction
  later_use: Finite-sample basis for Sections 3.2–3.7 and Chapter 5.
- topic: Talagrand concentration and entropy method
  results:
  - Theorem 3.2.4
  - Theorems 3.3.9–3.3.10
  - McDiarmid and self-bounding inequalities
  later_use: Moment and estimator concentration in Sections 3.4–3.5 and Chapter 5.
- topic: Metric entropy and bracketing
  results:
  - Theorems 3.5.1, 3.5.4, 3.5.6, 3.5.11, 3.5.13, 3.5.21
  later_use: VC, Glivenko–Cantelli, Donsker and estimator bounds.
- topic: VC theory
  results:
  - Sauer–Shelah
  - Dudley–Pollard VC entropy
  - convex-hull entropy
  later_use: Corollary 3.7.17, Theorem 3.7.37 and Chapters 4–5.
- topic: Weak convergence and Donsker theory
  results:
  - Theorems 3.7.23, 3.7.31, 3.7.36–3.7.40, 3.7.47, 3.7.52–3.7.55
  later_use: Functional central limit theorems in Chapters 4–5; notes provide provenance rather than proof steps.

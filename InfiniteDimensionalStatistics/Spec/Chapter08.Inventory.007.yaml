    - 626
    section: 8.2.2
    equations:
    - '8.32'
  title: Empirical wavelet coefficient maximum bound
  statement: For every wavelet level ℓ in the range used by the estimator, E_f[sup_{k∈ℤ}|Y_{ℓk}−f_{ℓk}|] ≤ (E_f[sup_{k∈ℤ}|Y_{ℓk}−f_{ℓk}|²])^{1/2}
    ≤ c√(ℓ/n).
  source_fidelity: exact-transcription
  hypotheses:
    explicit:
    - The i.i.d. sampling and wavelet-coefficient setting preceding (8.32).
    - The density and wavelet basis satisfy the boundedness and regularity assumptions used there.
    implicit:
    - The countable supremum is measurable.
    - The constant c is uniform in n and ℓ over the displayed range.
  quantifier_order:
  - Fix the model and basis constants
  - For every admissible n and level ℓ assert both inequalities
  constants:
  - c depends only on the fixed envelope and wavelet constants.
  dependencies:
    earlier_book:
    - Theorem 5.1.13
    chapter_local:
    - ch8.iid_hard_threshold_estimator_8_31

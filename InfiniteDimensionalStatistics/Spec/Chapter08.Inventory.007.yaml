  title: Impossibility of fully adaptive honest confidence bands
  statement: No confidence set satisfies both honest coverage (8.36) and adaptive diameter (8.37). More strongly,
    an honest set over Σ(r) cannot have, uniformly over Σ(s), diameter tail at any rate r_n=o((log n/n)^{r/(2r+1)}).
  source_fidelity: exact-paraphrase
  hypotheses:

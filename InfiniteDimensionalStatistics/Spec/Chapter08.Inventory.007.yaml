- id: ch8.theorem_8_2_8
  kind: theorem
  book:
    number: Theorem 8.2.8
    pages:
    - 626
    section: 8.2.2
    equations:
    - '8.2'
  title: Adaptive L∞ density estimation by hard thresholding
  statement: For an S-regular wavelet basis, τ sufficiently large, B≥1, 0<s<S and n≥2, sup_{density f:‖f‖_{B^s_{∞,∞}(ℝ)}≤B}E_f‖f_n^T−f‖∞≤D·B^{1/(2s+1)}(n/log
    n)^{-s/(2s+1)}.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - f is a probability density on ℝ
    - B≥1
    - 0<s<S
    - n≥2
    implicit:
    - The Besov ball implies or is combined with the envelope used in the threshold; exact hidden dependence requires
      audit.
  quantifier_order:
  - Fix s and construction data
  - There exists D
  - For every B,n the supremum bound holds
  constants:
  - Book states D depends only on s; verify hidden fixed-data dependence.
  dependencies:
    earlier_book:
    - Theorem 5.1.13
    chapter_local:
    - ch8.iid_hard_threshold_estimator_8_31
    - ch8.empirical_wavelet_max_bound_8_32

- id: corollary-2-124
  kind: corollary
  book:
    number: '2.124'
    pages:
    - 105
    section: '2.8'
    equations: []
  title: Entropy-number comparison
  statement: If e_n(T)=inf{ε:N(T,d,ε)≤N_n}, then ∑_n2^{n/2}e_n(T) is bounded by a universal multiple of ∫₀^{diam T}√(log N(T,d,ε))dε,
    and conversely the generic-chain bound recovers Dudley's entropy bound by replacing a supremum of sums with a sum of suprema.
  hypotheses:
    explicit:
    - (T,d) totally bounded enough for finite entropy numbers.
    implicit: []
  quantifier_order:
  - N_n=2^{2^n}; factors √log2 and 1−1/√2 as displayed.

- id: theorem-2-8-3
  kind: theorem
  book:
    number: 2.8.3
    pages:
    - 106
    section: '2.8'
    equations: []
  title: Gumbel limit for cyclostationary Gaussian processes
  statement: Let X be centred cyclostationary Gaussian of period 1. Assume mean-square differentiability and a.s. continuity;
    perfect correlation r_X(s,t)=σ_X(s)σ_X(t) only when s=t; σ_X² has a unique maximum 1 at t₀∈(0,1), is C² there with derivative
    0, second derivative negative, and E(X′(t₀))²>0; and (log v)sup_{|s−t|≥v}|r_X(s,t)|→0. Then for every x, Pr(a_T(sup_{[0,T]}|X|−b_T)≤x)→exp(−e^{-x}),
    with a_T=√(2log T) and b_T exactly as displayed in the notes.
  hypotheses:
    explicit:
    - All four numbered hypotheses in the note theorem.
    - Period exactly 1.
    - x fixed real.
    implicit: []
  quantifier_order:
  - a_T=√(2log T); b_T uses log log T, log π, E(X′(t₀))² and σ_X²''(t₀) exactly as printed.
  constants:
  - a_T=√(2log T); b_T uses log log T, log π, E(X′(t₀))² and σ_X²''(t₀) exactly as printed.
  dependencies:
    earlier_book: []
    chapter_local:
    - definition-unnumbered-2-8-cyclostationary
    chapter_local_dependents: []
    later_book_uses:
    - 'later-wavelet-confidence-band-results: The notes state that the quoted extreme-value theorem will be used later.'
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:

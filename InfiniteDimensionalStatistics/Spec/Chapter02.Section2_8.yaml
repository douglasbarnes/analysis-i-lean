- id: example-2-8-2
  kind: example
  book:
    number: 2.8.2
    pages:
    - 104
    section: '2.8'
    equations: []
  title: Generic chaining beyond the entropy integral
  statement: For T={2,3,…,∞}, X(n)=g_n/√(log n) and X(∞)=0, choose T_n={2,…,N_n,∞}. Then sup_m∑_n2^{n/2}d(m,T_n)<∞, so generic
    chaining gives a bounded process, while the ordinary Dudley entropy integral diverges; this demonstrates strict improvement
    of the chaining functional.
  hypotheses:
    explicit:
    - g_n independent standard normals.
    - Metric d is the intrinsic Gaussian metric.
    implicit: []
  quantifier_order:
  - N_n=2^{2^n}.

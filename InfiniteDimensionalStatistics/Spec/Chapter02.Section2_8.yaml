- id: theorem-2-8-1
  kind: theorem
  book:
    number: 2.8.1
    pages:
    - 103
    section: '2.8'
    equations: []
  title: Generic chaining upper bound
  statement: Let (T,d) be countable, X sub-Gaussian relative to d, N_n=2^{2^n}, and T_n⊆T with |T_n|≤N_n and ⋃_nT_n=T. For
    finite F⊆T, t₀∈F and T₀={t₀}, E max_{t∈F}(X(t)−X(t₀))≤L·max_{t∈F}∑_{n≥0}2^{n/2}d(t,T_n), with universal L=(1+√2)(1+√(3log2))/√(3log2)<5.16;
    the same bound holds for the supremum over T when finite.
  hypotheses:
    explicit:
    - T countable pseudometric.
    - X sub-Gaussian.
    - Admissible sequence T_n with cardinal bounds and union T.
    - F finite.
    implicit: []
  quantifier_order:
  - N_n=2^{2^n}; weights 2^{n/2}; displayed universal L.
  constants:
  - N_n=2^{2^n}; weights 2^{n/2}; displayed universal L.

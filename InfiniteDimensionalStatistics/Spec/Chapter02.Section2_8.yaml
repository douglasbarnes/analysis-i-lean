- id: definition-unnumbered-2-8-cyclostationary
  kind: definition
  book:
    number: unnumbered-2.8-cyclostationary
    pages:
    - 106
    section: '2.8'
    equations: []
  title: Cyclostationary Gaussian process
  statement: A centred Gaussian process Y(t), t∈ℝ, is cyclostationary when for every lag v, the map t↦E[Y(t)Y(t+v)] is periodic
    in t with a period independent of v.
  hypotheses:
    explicit:
    - Centred Gaussian process on ℝ.
    implicit: []
  quantifier_order:
  - One common period for all lags.
  constants: []
  dependencies:

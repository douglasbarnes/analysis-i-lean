- id: 6.1.tensor_kl
  kind: operative_identity
  book:
    number: Equations (6.14)-(6.15)
    pages:
    - 475
    section: 6.1.2
    equations: []
  title: Kullback Leibler prod pow
  statement: 'For i.i.d. product laws,

    \[

    K(P_f^n,P_g^n)=nK(P_f,P_g),

    \qquad

    2\|P_f^n-P_g^n\|_{\mathrm{TV}}\le\sqrt{2nK(P_f,P_g)}.

    \]'
  hypotheses:
    explicit:
    - P_f and P_g are probability measures on a common measurable space.
    - The first identity is interpreted in the extended reals.
    implicit: []
  quantifier_order:
  - ∀n∈ℕ, the KL tensorisation identity holds; combining it with Proposition 6.1.7 yields the TV bound.
  constants:
  - ∀n∈ℕ, the KL tensorisation identity holds; combining it with Proposition 6.1.7 yields the TV bound.
  dependencies:

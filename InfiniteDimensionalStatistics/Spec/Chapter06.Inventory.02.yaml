- id: 6.2.ks_simple
  kind: operative_example
  book:
    number: Kolmogorov-Smirnov test (6.24)-(6.26)
    pages:
    - 478
    - 480
    section: 6.2.1
    equations: []
  title: Kolmogorov Smirnov Test
  statement: 'For testing a simple continuous distribution function \(F_0\), use

    \(T_n=\|F_n-F_0\|_\infty\) and reject when

    \(T_n>z_\alpha/\sqrt n\). The Brownian-bridge limit gives asymptotic level

    \(\alpha\); a distribution-free quantile and the Dvoretzky-Kiefer-Wolfowitz

    bound give a nonasymptotic alternative calibration. Under an alternative F,

    \(\|F_n-F_0\|_\infty\ge\|F-F_0\|_\infty-\|F_n-F\|_\infty\).'
  hypotheses:
    explicit:
    - X₁,…,Xₙ are i.i.d. with distribution function F.
    - F₀ is continuous for the distribution-free Brownian-bridge statement.
    - z_α is an appropriate upper quantile.
    implicit: []
  quantifier_order:
  - For each α and n define the test; its null level and separated-alternative power are controlled as stated.
  constants:
  - For each α and n define the test; its null level and separated-alternative power are controlled as stated.
  dependencies:
    earlier_book:
    - Donsker theorem for empirical distribution functions
    - DKW inequality / Exercise 6.2.1
    chapter_local: []
    later_book_uses:
    - Provides the upper bound in Proposition 6.2.6 and the confidence band in (6.119).
  proof_status:
    delegates_to_exercises:
    - Exercise 6.2.1
    contains_omitted_steps: true
    comment: Exercise 6.2.1 supplies the distribution-free transformation and DKW calibration.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: A measurable test based on the sup norm of the empirical CDF; exact distribution-free statements require
      quantile-transform machinery.
    blockers: &id008 []
  difficulty: major-library
  pass: core

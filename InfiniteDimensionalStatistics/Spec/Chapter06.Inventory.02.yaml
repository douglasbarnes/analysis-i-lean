- id: 6.2.mixtures_lower_bound
  kind: operative_lemma
  book:
    number: Equations (6.21)-(6.23)
    pages:
    - 477
    - 478
    section: 6.2.1
    equations: []
  title: Testing Error ge likelihood Mixture second Moment
  statement: 'For a singleton null \(f_0\) and finite alternatives

    \(\{f_1,\dots,f_M\}\), let

    \[

    Z=\frac1M\sum_{m=1}^M\frac{dP_{f_m}}{dP_{f_0}}.

    \]

    For any test \(\phi\) and \(0<\eta<1\), the sum of the null error and average

    alternative error is bounded below by

    \[

    (1-\eta)P_{f_0}(Z\ge1-\eta)

    \ge(1-\eta)\left(1-\frac{\sqrt{E_{f_0}(Z-1)^2}}{\eta}\right).

    \]'
  hypotheses:
    explicit:
    - Every P_fm is absolutely continuous with respect to P_f0.
    - M≥1 and 0<η<1.
    - The alternative term is initially an average; it lower-bounds the worst-case alternative error.
    implicit: []
  quantifier_order:
  - ∀ finite alternative families, ∀ tests φ, ∀η∈(0,1), the lower bounds hold.
  constants:
  - ∀ finite alternative families, ∀ tests φ, ∀η∈(0,1), the lower bounds hold.
  dependencies:
    earlier_book: []
    chapter_local:
    - 6.1.tv_density
    later_book_uses:
    - Used for the lower bounds in Theorems 6.2.7, 6.2.9 and 6.2.11.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

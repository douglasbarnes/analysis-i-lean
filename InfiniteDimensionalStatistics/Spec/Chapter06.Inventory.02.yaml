- id: 6.2.1
  kind: definition
  book:
    number: Definition 6.2.1
    pages:
    - 477
    - 478
    section: '6.2'
    equations: []
  title: Is Minimax Separation Rate
  statement: 'Let \(H_0\subseteq\mathcal F\), let \(d\) be a semimetric, and write

    \(H_1(d,r)=\{f\in\mathcal F:\inf_{g\in H_0}d(f,g)\ge r\}\).

    A sequence \(\rho_n\) is a minimax d-separation rate if:

    (i) for every \(\alpha>0\), there are tests \(\phi_n\) and N such that for all

    \(n\ge N\),

    \[

    \sup_{f\in H_0}E_f\phi_n+\sup_{f\in H_1(d,\rho_n)}E_f(1-\phi_n)\le\alpha;

    \]

    (ii) for every \(r_n=o(\rho_n)\),

    \[

    \liminf_{n\to\infty}\inf_{\phi_n}

    \left[\sup_{f\in H_0}E_f\phi_n+

    \sup_{f\in H_1(d,r_n)}E_f(1-\phi_n)\right]>0,

    \]

    where the infimum is over measurable tests.'
  hypotheses:
    explicit:
    - A statistical experiment is given for every n.
    - H₀ and F are parameter sets and d is a nonnegative semimetric on the ambient parameter space.
    - Tests are measurable and take values in [0,1] (or {0,1} for nonrandomised tests).
    - ρₙ is positive in the asymptotic regime in which o(ρₙ) is used.
    implicit: []
  quantifier_order:
  - First quantify the model, H₀,d,ρ; then (i) ∀α>0 ∃(φₙ),N ∀n≥N; and (ii) ∀(rₙ) with rₙ/ρₙ→0, liminfₙ inf_{φₙ}
    error(rₙ)>0.
  constants:
  - First quantify the model, H₀,d,ρ; then (i) ∀α>0 ∃(φₙ),N ∀n≥N; and (ii) ∀(rₙ) with rₙ/ρₙ→0, liminfₙ inf_{φₙ}
    error(rₙ)>0.
  dependencies:
    earlier_book: []
    chapter_local: []
    later_book_uses:
    - The rate notion is instantiated by Theorems 6.2.7, 6.2.9, 6.2.11, 6.2.18-6.2.20.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: A predicate on positive real sequences, using uniform type-I/type-II errors and little-o filters at

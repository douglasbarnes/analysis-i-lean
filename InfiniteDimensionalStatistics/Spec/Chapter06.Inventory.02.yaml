- id: 6.1.7
  kind: proposition
  book:
    number: Proposition 6.1.7
    pages:
    - 474
    - 475
    section: 6.1.2
    equations: []
  title: Total Variation le sqrt kl
  statement: 'For probability measures P,Q on \((\mathcal X,\mathcal A)\) and a common

    dominating measure \(\mu\), with densities p,q:

    (a) \(\|P-Q\|_{\mathrm{TV}}\le\sqrt{K(P,Q)/2}\).

    (b) If \(P\ll Q\), then

    \[

    \int_{\{pq>0\}}\left|\log\frac pq\right|p\,d\mu

    \le K(P,Q)+\sqrt{2K(P,Q)}.

    \]'
  hypotheses:
    explicit:
    - P,Q are probability measures on the same measurable space.
    - μ dominates P and Q, p=dP/dμ, q=dQ/dμ.
    - Part (b) assumes P≪Q.
    implicit: []
  quantifier_order:
  - ∀P,Q,μ,p,q satisfying the hypotheses, (a) holds; additionally P≪Q ⇒ (b).
  constants:
  - ∀P,Q,μ,p,q satisfying the hypotheses, (a) holds; additionally P≪Q ⇒ (b).
  dependencies:
    earlier_book: []
    chapter_local:
    - 6.1.6
    later_book_uses:
    - Gives (6.15), the product-law total-variation bound used in minimax lower bounds.
    - Its information-control role recurs in Chapters 7 and 8.
  proof_status:
    delegates_to_exercises:
    - Exercise 6.1.1
    - Exercise 6.1.2
    contains_omitted_steps: true
    comment: The proof invokes Exercise 6.1.1 for (6.13) and Exercise 6.1.2 for the negative logarithmic part.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: 'Two theorems: Pinsker''s inequality and the absolute log-density integral bound.'

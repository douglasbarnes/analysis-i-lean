- id: ch5.prop.5_1_21
  kind: proposition
  book:
    number: Proposition 5.1.21
    pages:
    - 414
    - 417
    section: 5.1.3*
    equations: []
  title: Proposition 5.1.21
  statement: Under (K1)–(K5), for f ranging uniformly over 𝒟 and resolutions jₙ obeying the growth conditions (5.50)–(5.51),
    the normalised sup-norm empirical kernel process can be coupled with the corresponding Gaussian process Yₙ.
    Consequently, whenever Aₙ(‖Yₙ‖_I−Bₙ) converges in distribution to Z, the same limit holds uniformly in f for
    Aₙ(2^{jₙ/2}‖νₙ^f‖_{𝔽ₙ^f}−Bₙ).
  source_fidelity:
    transcription_status: central_review_required
    author_corrected_reading: null
  hypotheses:
    explicit:
    - Conditions (K1)–(K5).
    - f∈𝒟(α,D,δ,A,L).
    - jₙ, Aₙ, Bₙ satisfy (5.50) and (5.51).
    - The stated Gaussian-process normalisation converges to Z.
    implicit:
    - The empirical process νₙ^f and index class 𝔽ₙ^f are exactly those defined in the subsection.
    - The convergence is uniform over f∈𝒟 at every continuity point of the limit law.
  quantifier_order:
  - For every real x at which the distribution function of Z is continuous.
  - Supremum over f∈𝒟 tends to zero.
  constants:
  - Aₙ,Bₙ and all constants in (K1)–(K5),(5.50),(5.51).
  dependencies:
    earlier_book:
    - KMT-type Gaussian approximation and extreme-value theory from Section 2.5
    chapter_local:
    - ch5.cond.K1_K5
    - ch5.def.D_class
    later_book_uses:
    - Propositions 5.1.22 and 5.1.23
  proof_status: *id003
  notes_status: *id004
  equivalents:

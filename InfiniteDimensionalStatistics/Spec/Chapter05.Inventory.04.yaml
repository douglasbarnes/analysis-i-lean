- id: ch5.cond.K1_K5
  kind: definition
  book:
    number: Conditions (K1)–(K5)
    pages:
    - 411
    - 414
    section: 5.1.3*
    equations: []
  title: Conditions (K1)–(K5)
  statement: 'The kernel K is required to satisfy five regularity conditions used for the Gaussian coupling theorem:
    symmetry/projection normalisation and bounded kernel sections; an L² normalisation and a nondegenerate local
    covariance metric; a decaying measurable envelope Φ for |K(x,y)|; regularity/entropy control of the associated
    Gaussian process under the intrinsic metric d; and a uniform VC-type covering-number bound for the empirical
    kernel class.'
  source_fidelity:
    transcription_status: central_review_required
    author_corrected_reading: null
  hypotheses:
    explicit:
    - K is either a convolution kernel or a wavelet projection kernel in the starred setting.
    - The exact constants and metric d are those in the displayed conditions (K1)–(K5).
    implicit:
    - All suprema are measurable/separable.
    - The envelope decay can be weakened as described after Proposition 5.1.21.
  quantifier_order:
  - The conditions hold uniformly over the location parameter and resolutions used below.
  constants:
  - Envelope and entropy constants; intrinsic metric d.
  dependencies:
    earlier_book:
    - Sections 2.5 and 3.6
    chapter_local: *id002
    later_book_uses:
    - Proposition 5.1.21
    - Propositions 5.1.22–5.1.23
  proof_status: *id003
  notes_status: *id004
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id005
  likely_lean_representation:
    sketch: A structure bundling analytic kernel assumptions, Gaussian-process continuity/entropy and empirical
      VC entropy.
    blockers:
    - Exact page transcription of all five conditions.

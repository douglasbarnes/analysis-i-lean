- id: ch5.prop.5_1_17
  kind: proposition
  book:
    number: Proposition 5.1.17
    pages:
    - 409
    section: 5.1.2
    equations: []
  title: Proposition 5.1.17
  statement: For any density f, ‖fₙ−f‖₁−E‖fₙ−f‖₁=O_P(n^{-1/2}); if √n E‖fₙ−f‖₁→∞ then the ratio to its expectation
    tends to 1 in probability. Moreover limsup_n √(n/log n)|‖fₙ−f‖₁−E‖fₙ−f‖₁|≤2‖Φ‖₁ a.s.; if √(n/log n)E‖fₙ−f‖₁→∞
    the ratio tends to 1 a.s.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - A sample-based kernel/projection estimator covered by Remark 5.1.14.
    - For the displayed constant use the ℝ envelope Φ; interval analogues have corresponding constants.
    implicit:
    - The asymptotic conditions on the expectation are separate sufficient conditions for the ratio conclusions.
  quantifier_order:
  - As n→∞ along the estimator sequence.
  constants:
  - 2‖Φ‖₁.
  dependencies:
    earlier_book:
    - Borel–Cantelli lemma
    chapter_local:
    - ch5.rem.5_1_14
    later_book_uses: *id002
  proof_status: *id003
  notes_status: *id004
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      - Mathlib.Analysis.Fourier.Convolution
      exact_equivalent: false
    repository: *id005
  likely_lean_representation:
    sketch: Derive stochastic and almost-sure fluctuations from bounded-difference tails and Borel–Cantelli.
    blockers:
    - Probability asymptotic notation and almost-sure limsup infrastructure.
  difficulty: major-library

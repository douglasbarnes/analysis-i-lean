      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id005
  likely_lean_representation:
    sketch: A uniform-in-density transfer theorem from Gaussian suprema to empirical kernel suprema, with an explicit
      coupling error.
    blockers:
    - Strong Gaussian approximation for VC-type empirical processes.
    - Extreme-value convergence and uniform distribution-function bounds.
  difficulty: research-level

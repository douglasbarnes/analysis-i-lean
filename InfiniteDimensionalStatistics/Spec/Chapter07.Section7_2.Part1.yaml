  title: L¹ bracketing bound for log-midpoint densities
  statement: "Let 0≤p_L≤p_U. Define p̄_L=(p_L+p₀)/2 and p̄_U=(p_U+p₀)/2, and on {p₀>0}\n  g_L=(1/2)log(p̄_L/p₀),  g_U=(1/2)log(p̄_U/p₀).\nProve\n  ρ₁(g_U-g_L) ≤ 2 h(p̄_L,p̄_U),\nusing (7.33) and g_U-g_L≥0."
  hypotheses:
    explicit:
    - p_L,p_U,p₀ are densities or nonnegative integrable functions in the bracketing setup.
    - 0≤p_L≤p_U pointwise.
    implicit:
    - The logarithms are defined only on {p₀>0}, with the Chapter 7 convention elsewhere.
    - ρ₁ is the L¹(P₀)-type semimetric used in the empirical-process bound.
  quantifier_order:
  - For every ordered bracket p_L≤p_U.
  constants:
  - Factor 2.
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.def.averageDensityClass

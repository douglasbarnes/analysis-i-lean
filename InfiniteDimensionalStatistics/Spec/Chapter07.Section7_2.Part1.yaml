  title: Differentiation under the integral in a Banach space
  statement: "Let V be open in a Banach space E, (S,A,μ) a measure space, and\nf:V×S→ℝ with f(v,·)∈L¹(μ). Assume D₁f(v,s) exists for every (v,s),\nv↦D₁f(v,s) is continuous into E*, and\n  ||D₁f(v,s)||_{E*} ≤ g(s)\nfor a fixed g∈L¹(μ), uniformly in v. Prove that\n  φ(v)=∫ f(v,s)dμ(s)\nis Fréchet differentiable and\n  Dφ(v)(h)=∫ D₁f(v,s)(h)dμ(s).\nApply this to the population likelihood derivative in Proposition 7.2.4."
  hypotheses:
    explicit:
    - V open in Banach E.
    - Pointwise Fréchet differentiability in v.
    - Continuity of the derivative in v.
    - An integrable uniform derivative envelope g.
    implicit:
    - The derivative field is sufficiently measurable for the integral; this should be stated explicitly in Lean.
  quantifier_order:
  - For every v∈V and h∈E, the derivative formula holds.
  constants: []
  dependencies:
    earlier_book: []
    chapter_local: []
    later_book_uses:

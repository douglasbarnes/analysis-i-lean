- id: 6.1.1
  kind: proposition
  book:
    number: Proposition 6.1.1
    pages:
    - 470
    section: 6.1.1
    equations: []
  title: Gaussian White Noise rn Deriv zero
  statement: 'Let \(f\in L^2([0,1])\), \(\sigma>0\), and \(n\in\mathbb N\). Let

    \(P^Y_{f,n,\sigma}\) be the law on \(C([0,1])\) of

    \(Y_t=\int_0^t f(s)\,ds+(\sigma/\sqrt n)W_t\). Then

    \(P^Y_{f,n,\sigma}\ll P^Y_{0,n,\sigma}\), and for \(Y\sim P^Y_{0,n,\sigma}\),

    \[

    \frac{dP^Y_{f,n,\sigma}}{dP^Y_{0,n,\sigma}}(Y)

    =\exp\left\{\frac n{\sigma^2}Y^{(n)}_0(f)

    -\frac n{2\sigma^2}\|f\|_2^2\right\}.

    \]'
  hypotheses:
    explicit:
    - f is a real L²-equivalence class on [0,1].
    - σ is strictly positive and n is a positive sample-size index.
    - The path-space Borel σ-field and the Paley-Wiener/isonormal functional Y₀⁽ⁿ⁾(f) are those fixed earlier.
    implicit: []
  quantifier_order:
  - ∀ f∈L²([0,1]), ∀ σ>0, ∀ n∈ℕ, absolute continuity holds and the displayed density identity holds P₀-a.s.
  constants:
  - ∀ f∈L²([0,1]), ∀ σ>0, ∀ n∈ℕ, absolute continuity holds and the displayed density identity holds P₀-a.s.
  dependencies:
    earlier_book:
    - Example 2.6.7 (Brownian-motion RKHS)
    - Theorem 2.6.13 (Cameron-Martin)
    chapter_local: []
    later_book_uses:
    - Used in the lower-bound proofs of Theorems 6.2.7, 6.2.9 and 6.2.11.
    - Provides the Gaussian likelihood formula used throughout Chapters 7 and 8.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Define the path-law as a translated scaled Wiener measure on C([0,1]); state absolute continuity and
      identify `Measure.rnDeriv` almost everywhere. The stochastic linear functional should be an isometry from
      L² into Gaussian random variables.
    blockers: &id001 []

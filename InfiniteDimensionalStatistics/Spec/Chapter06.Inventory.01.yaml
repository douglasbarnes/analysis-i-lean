- id: 6.1.2
  kind: operative_remark
  book:
    number: Remark 6.1.2
    pages:
    - 470
    section: 6.1.1
    equations: []
  title: Gaussian White Noise likelihood stochastic Integral
  statement: 'The likelihood in Proposition 6.1.1 can equivalently be written

    \[

    \exp\left\{\frac{\sqrt n}{\sigma}\int_0^1 f(t)\,dW_t

    -\frac n{2\sigma^2}\|f\|_2^2\right\}.

    \]'
  hypotheses:
    explicit:
    - The stochastic integral is the isonormal integral of f against the driving Brownian motion under the null
      law.
    implicit: []
  quantifier_order:
  - Under the hypotheses of Proposition 6.1.1, the two displayed random variables agree P₀-a.s.
  constants:

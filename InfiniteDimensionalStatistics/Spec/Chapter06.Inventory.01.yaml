- id: 6.1.sample_split
  kind: operative_example
  book:
    number: Sample-splitting construction around (6.10)
    pages:
    - 473
    section: 6.1.1
    equations: []
  title: Gaussian Experiment sample Split
  statement: 'Given the Gaussian sequence observation \(Y_k=f_k+\sigma g_k/\sqrt n\),

    introduce an independent i.i.d. standard-normal sequence \(\tilde g_k\) and set

    \[

    Y''''_k=Y_k+\frac{\sigma}{\sqrt n}\tilde g_k,\qquad

    Y''''''''_k=Y_k-\frac{\sigma}{\sqrt n}\tilde g_k.

    \]

    Then \(Y''''\) and \(Y''''''''\) are independent Gaussian sequence observations with

    common mean f and coordinate variance \(2\sigma^2/n\). The same construction

    produces two independent white-noise experiments.'
  hypotheses:
    explicit:
    - The auxiliary Gaussian sequence is independent of the original observation.
    - Joint Gaussianity is used to infer independence from zero covariance.
    implicit: []
  quantifier_order:
  - For every f,σ,n, after adjoining independent noise, the two transformed observations are independent and have
    the stated laws.
  constants:
  - For every f,σ,n, after adjoining independent noise, the two transformed observations are independent and have
    the stated laws.
  dependencies:
    earlier_book:
    - Gaussian linear transformations and independence
    chapter_local:
    - 6.1.4
    - 6.1.5
    later_book_uses:
    - Used in Theorem 6.4.8 and Chapter 8 adaptive confidence-set constructions.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

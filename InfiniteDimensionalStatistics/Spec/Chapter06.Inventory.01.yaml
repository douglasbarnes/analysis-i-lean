- id: 6.1.4
  kind: proposition
  book:
    number: Proposition 6.1.4
    pages:
    - 471
    section: 6.1.1
    equations: []
  title: Gaussian Sequence rn Deriv cylindrical
  statement: 'Let \(f=(f_k)_{k\in\mathbb Z}\in\ell^2(\mathbb Z)\) and

    \(Y_k=f_k+\sigma g_k/\sqrt n\), where \(g_k\) are i.i.d. \(N(0,1)\).

    On \((\mathbb R^{\mathbb Z},\mathcal C)\), the product law

    \(P^Y_{f,n,\sigma}\) is absolutely continuous with respect to

    \(P^Y_{0,n,\sigma}\), and

    \[

    \frac{dP^Y_{f,n,\sigma}}{dP^Y_{0,n,\sigma}}(Y)

    =\exp\left\{\frac n{\sigma^2}\sum_{k\in\mathbb Z}f_kY_k

    -\frac n{2\sigma^2}\|f\|_{\ell^2}^2\right\}

    \]

    for \(Y\sim P^Y_{0,n,\sigma}\).'
  hypotheses:
    explicit:
    - f∈ℓ²(Z), σ>0, n∈ℕ.
    - The infinite sum is the L²(P₀)-limit/isonormal pairing; it is not asserted to converge absolutely pointwise.
    - The ambient σ-field is the cylindrical/product σ-field.
    implicit: []
  quantifier_order:
  - ∀ f∈ℓ², ∀σ>0, ∀n, the absolute-continuity and P₀-a.s. density identity hold.
  constants:
  - ∀ f∈ℓ², ∀σ>0, ∀n, the absolute-continuity and P₀-a.s. density identity hold.
  dependencies:
    earlier_book:
    - Proposition 2.6.16 (Kakutani theorem for Gaussian products)
    chapter_local:
    - 6.1.1
    later_book_uses:
    - Used as the coordinate likelihood in Gaussian sequence lower bounds.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

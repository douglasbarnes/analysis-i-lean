- id: 6.1.5
  kind: proposition
  book:
    number: Proposition 6.1.5
    pages:
    - 472
    section: 6.1.1
    equations: []
  title: Gaussian Sequence rn Deriv weighted L2
  statement: 'Let \(f=(f_k)\in\ell^2(\mathbb Z)\), and let \(w\) be a positive,

    monotone decreasing sequence with \(w\in\ell^2\). Regard

    \(Y_k=f_k+\sigma g_k/\sqrt n\) as an \(\ell^2(w)\)-valued Gaussian random

    variable. Its Borel law \(P^Y_{f,n,\sigma}\) is absolutely continuous with

    respect to \(P^Y_{0,n,\sigma}\), with the same likelihood formula as in

    Proposition 6.1.4.'
  hypotheses:
    explicit:
    - f∈ℓ²(Z); σ>0; n∈ℕ.
    - w_k>0, w is monotone decreasing in the book's indexing convention, and w∈ℓ².
    - The weighted Hilbert-space construction is the one from Example 2.6.14.
    implicit: []
  quantifier_order:
  - ∀ admissible w, ∀f,σ,n, the Borel Gaussian laws satisfy the stated absolute continuity and density identity.
  constants:
  - ∀ admissible w, ∀f,σ,n, the Borel Gaussian laws satisfy the stated absolute continuity and density identity.
  dependencies:
    earlier_book:
    - Example 2.6.14 (Gaussian sequence in weighted ℓ²)
    - Theorem 2.6.13 (Cameron-Martin)
    chapter_local:

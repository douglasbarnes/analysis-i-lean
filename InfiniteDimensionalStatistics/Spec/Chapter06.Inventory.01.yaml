- id: 6.1.6
  kind: definition
  book:
    number: Definition 6.1.6
    pages:
    - 474
    section: 6.1.2
    equations: []
  title: Kullback Leibler
  statement: 'For probability measures P,Q on a measurable space,

    \[

    K(P,Q)=

    \begin{cases}

    \int \log(dP/dQ)\,dP,&P\ll Q,\\

    +\infty,&\text{otherwise},

    \end{cases}

    \]

    is the Kullback-Leibler distance/divergence.'
  hypotheses:
    explicit:
    - P and Q are probability measures on the same measurable space.
    - The integral is an extended-real integral; its well-definedness uses the standard entropy convention.
    implicit: []
  quantifier_order:
  - ∀ probability measures P,Q, define K(P,Q) by the displayed case distinction.
  constants:
  - ∀ probability measures P,Q, define K(P,Q) by the displayed case distinction.
  dependencies:
    earlier_book:
    - Definition 2.5.1 (entropy)
    chapter_local: []
    later_book_uses:
    - Used throughout Sections 6.2 and 6.3 and in Chapter 7.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''

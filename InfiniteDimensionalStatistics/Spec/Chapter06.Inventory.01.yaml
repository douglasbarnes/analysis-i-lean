- id: 6.1.3
  kind: operative_remark
  book:
    number: Remark 6.1.3
    pages:
    - 470
    - 471
    section: 6.1.1
    equations: []
  title: Gaussian White Noise rn Deriv
  statement: 'For \(f,g\in L^2([0,1])\), the chain rule for Radon-Nikodym derivatives gives

    the likelihood of \(P^Y_{f,n,\sigma}\) relative to \(P^Y_{g,n,\sigma}\); it is the

    formula of Proposition 6.1.1 applied to the shift \(f-g\), with the centred

    observation under \(g\). Equivalently,

    \[

    \log\frac{dP_f}{dP_g}(Y)

    =\frac n{\sigma^2}Y_g^{(n)}(f-g)-\frac n{2\sigma^2}\|f-g\|_2^2.

    \]'
  hypotheses:
    explicit:
    - f,g∈L²([0,1]); σ>0; n∈ℕ.
    - A common version of the Radon-Nikodym derivatives is chosen.
    implicit: []
  quantifier_order:
  - ∀ f,g,σ,n, the identity holds P_g-a.s.
  constants:
  - ∀ f,g,σ,n, the identity holds P_g-a.s.
  dependencies:
    earlier_book: []
    chapter_local:
    - 6.1.1
    later_book_uses: []

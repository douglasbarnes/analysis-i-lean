  title: Adaptive L∞ estimation by Lepski’s method
  statement: For τ sufficiently large, f̂_n=f_n(j̄_n) satisfies, for every s,B>0 and n≥2, sup_{‖f‖_{B^s_{∞,∞}}≤B}E_f‖f̂_n−f‖∞≤D·max(1,B)^{1/(2s+1)}(n/log
    n)^{-s/(2s+1)}, with D depending only on s,σ,τ.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - white-noise model
    - τ sufficiently large

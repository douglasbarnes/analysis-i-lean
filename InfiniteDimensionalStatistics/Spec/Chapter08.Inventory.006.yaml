- id: ch8.lemma_8_2_6
  kind: lemma
  book:
    number: Lemma 8.2.6
    pages:
    - 621
    section: 8.2.2
    equations:
    - '8.2'
  title: Upper-tail control for the L∞ Lepski selector
  statement: For f∈B^s_{∞,∞}, j>j_n^*, and τ sufficiently large, there is C>0 depending only on σ such that P_f(j̄_n=j)≤C^{-1}e^{-Cτj}
    and P_f(j̄_n>j_n^*)≤C^{-1}e^{-Cτj_n^*}.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - s>0
    - j>j_n^*
    - τ sufficiently large
    implicit:
    - Basis constants are fixed globally.
  quantifier_order:
  - There exists C(σ)>0
  - For all admissible n,f,s,j,τ the bounds hold
  constants:
  - Uniformity as stated.
  dependencies:

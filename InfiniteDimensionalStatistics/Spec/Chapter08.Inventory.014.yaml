- id: ch8.theorem_8_3_20
  kind: theorem
  book:
    number: Theorem 8.3.20
    pages:
    - 658
    section: 8.3.4
    equations:
    - '8.3'
  title: Self-similar classes retain the full minimax estimation rates
  statement: 'For every r>0 and ε>0, the minimax estimation rates over the self-similar Hölder class (8.86) and
    the self-similar Sobolev class (8.90) equal the rates over the corresponding full classes: (log n/n)^{r/(2r+1)}
    in L∞ and n^{-r/(2r+1)} in L2.'
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - fixed nonempty self-similar classes
    - all suppressed b,B,J₀ parameters fixed
    implicit:
    - The statement is informal about class parameters and exact ε admissibility.
  quantifier_order:
  - Fix r,ε and class parameters
  - prove standard upper bound by restriction
  - prove matching lower bound within the self-similar class
  constants: []

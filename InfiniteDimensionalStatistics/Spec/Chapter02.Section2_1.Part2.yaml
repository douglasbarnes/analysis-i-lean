  title: Continuous process as a Cᵤ(T,d)-valued random variable
  statement: If (T,d) is totally bounded and X has bounded uniformly d-continuous sample paths, then ω↦X(·,ω) is a measurable
    random variable with values in the separable Banach space Cᵤ(T,d), and its Borel law is tight.
  hypotheses:
    explicit:
    - (T,d) totally bounded pseudometric.
    - X jointly/coordinate measurability sufficient for the induced map.
    - Almost-sure bounded uniformly d-continuous paths.
    implicit:
    - Functions at d-distance zero are identified, or Cᵤ is formed on the metric quotient.
    - The supremum norm is used.
  quantifier_order:
  - For every such X, the path map is Borel measurable and its law is tight.
  constants:
  - For every such X, the path map is Borel measurable and its law is tight.

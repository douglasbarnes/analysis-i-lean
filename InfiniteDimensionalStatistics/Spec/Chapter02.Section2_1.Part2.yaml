- id: proposition-2-1-10
  kind: proposition
  book:
    number: 2.1.10
    pages:
    - 19
    section: '2.1'
    equations: []
  title: Existence from mean and covariance
  statement: Given any function f:T→ℝ and covariance kernel Σ on T, there exists a Gaussian process X with E X(t)=f(t) and
    Cov(X(s),X(t))=Σ(s,t) for all s,t.
  hypotheses:
    explicit:
    - T any index type.
    - f:T→ℝ.
    - Σ a covariance kernel in Definition 2.1.9.
    implicit:
    - The probability space can be the canonical product space ℝ^T with the cylinder σ-algebra.
    - Uses Kolmogorov consistency.
  quantifier_order:
  - ∀f Σ, ∃ probability space and X, ∀t mean=f(t), ∀s t covariance=Σ(s,t).
  constants:
  - ∀f Σ, ∃ probability space and X, ∀t mean=f(t), ∀s t covariance=Σ(s,t).

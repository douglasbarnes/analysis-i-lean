- id: example-2-1-6
  kind: example
  book:
    number: 2.1.6
    pages:
    - 17
    section: '2.1'
    equations: []
  title: Separable Banach spaces as function spaces
  statement: For a separable Banach space B, choose a countable weak-* dense norming set D in the dual unit ball. The map
    x↦(f↦f(x)) embeds B linearly and isometrically into Cᵤ(D,d), where d is any metric inducing the weak-* topology on D.
    Hence a B-valued random variable yields a process indexed by D whose supremum norm is the B-norm.
  hypotheses:
    explicit:
    - B separable Banach.
    - D countable norming subset of the dual unit ball, weak-* dense.
    implicit: []
  quantifier_order:
  - ∀x∈B, ‖x‖=sup_{f∈D}|f(x)|.
  constants:
  - ∀x∈B, ‖x‖=sup_{f∈D}|f(x)|.
  dependencies:

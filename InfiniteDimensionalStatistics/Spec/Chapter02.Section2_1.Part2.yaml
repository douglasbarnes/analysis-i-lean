  title: Gaussian process
  statement: X is Gaussian when every finite linear combination ∑ᵢaᵢX(tᵢ) is a real Gaussian random variable; it is centred
    when all coordinate means vanish.
  hypotheses:
    explicit:
    - A real process X indexed by T.
    implicit: []
  quantifier_order:
  - ∀n≥1 ∀t₁…tₙ ∀a₁…aₙ, ∑aᵢX(tᵢ) has a Gaussian law.
  - 'Centred: ∀t, E X(t)=0.'
  constants:
  - 'Centred: ∀t, E X(t)=0.'

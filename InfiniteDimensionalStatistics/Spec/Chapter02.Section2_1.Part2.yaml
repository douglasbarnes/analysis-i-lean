- id: proposition-2-1-7
  kind: proposition
  book:
    number: 2.1.7
    pages:
    - 18
    section: '2.1'
    equations: []
  title: Characterisation of tight laws on ℓ∞(T)
  statement: A sample-bounded process X has finite-dimensional distributions induced by a tight Borel probability measure
    on ℓ∞(T) if and only if there exists a totally bounded pseudometric d on T and a version of X with almost surely bounded
    uniformly d-continuous paths.
  hypotheses:
    explicit:
    - X is a real process indexed by T and sample bounded.
    implicit:
    - The cylinder σ-algebra and Borel σ-algebra of ℓ∞(T) differ in general; the assertion is existence of a tight Borel extension
      with the stated finite-dimensional marginals.
  quantifier_order:
  - Tight-law existence ⇔ ∃d total-bounded, ∃version Y, a.s. bounded uniformly d-continuous.
  constants:
  - Tight-law existence ⇔ ∃d total-bounded, ∃version Y, a.s. bounded uniformly d-continuous.

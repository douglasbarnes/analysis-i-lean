- id: example-2-1-11
  kind: example
  book:
    number: 2.1.11
    pages:
    - 19
    section: '2.1'
    equations: []
  title: Isonormal process on a separable Hilbert space
  statement: For a separable real Hilbert space H with orthonormal basis (ψᵢ) and iid gᵢ∼N(0,1), define X(∑aᵢψᵢ)=∑aᵢgᵢ in
    L². Then EX(h)=0 and E[X(h)X(k)]=⟨h,k⟩; the map H→V, h↦X(h), is a linear isometry onto the closed Gaussian span V of the
    gᵢ.
  hypotheses:
    explicit:
    - H separable real Hilbert.
    - (ψᵢ) orthonormal basis.
    - (gᵢ) independent standard normals.
    implicit:
    - Series convergence is in L²; equality of representatives is up to almost-sure equivalence.
  quantifier_order:
  - ∀h,k∈H, covariance equals inner product; ‖X(h)‖₂=‖h‖.
  constants:
  - ∀h,k∈H, covariance equals inner product; ‖X(h)‖₂=‖h‖.

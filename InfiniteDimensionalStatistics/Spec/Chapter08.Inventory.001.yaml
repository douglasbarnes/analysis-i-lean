- id: ch8.adaptive_l2_testing_rate
  kind: definition
  book:
    number: rate in Theorem 8.1.1(a)
    pages:
    - 609
    section: 8.1.1
    equations:
    - '8.1'
  title: Adaptive L2 testing separation rate
  statement: ρ_n^*(r,B)=C·max(1,B)^{1/(4r+1)}·n^{-r/(2r+1/2)}·(log log n)^{r/(4r+1)}, with log log n replaced by
    an arbitrary fixed positive constant for n≤e^e.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - R>0
    - 0<r≤R
    - B>0
    - C>0
    - n∈ℕ
    implicit:
    - Real powers use positive bases; the small-n convention makes the expression total.
  quantifier_order:
  - Fix C,R
  - For each r,B,n define ρ_n^*(r,B)
  constants:
  - C is chosen sufficiently large for the upper bound and sufficiently small multiples underpin the lower bound.
  dependencies:
    earlier_book: []
    chapter_local:
    - ch8.l2_testing_balance_8_2
    - ch8.l2_adaptive_alternative
    later_book_uses:
    - ch8.theorem_8_1_1
    - ch8.theorem_8_1_2
  proof_status:

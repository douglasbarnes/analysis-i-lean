  title: Fixed-smoothness testing resolution
  statement: For a Besov alternative of smoothness r and radius B, choose an integer j_n with 2^{j_n} ≍ B^{2/(2r+1/2)}
    n^{1/(2r+1/2)}.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - r>0
    - B>0
    - n∈ℕ
    implicit:
    - The comparison constants are positive and independent of n.
  quantifier_order:
  - Fix r,B
  - For every n choose j_n∈ℕ satisfying two-sided comparison
  constants:

    - 608
    section: 8.1.1
    equations:
    - '8.1'
  title: Gaussian white-noise experiment
  statement: For n∈ℕ and σ>0, observe dY_f^(n)(t)=f(t)dt+(σ/√n)dW(t), t∈[0,1]; write P_f^Y for its law and E_f for
    expectation.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - n∈ℕ
    - σ>0
    - f is square-integrable on [0,1]
    - W is standard Gaussian white noise
    implicit:
    - A common measurable sample space Y_n realising all translated laws is fixed.
  quantifier_order:
  - Fix σ>0
  - For each n∈ℕ
  - For each admissible f
  - define P_f^Y and E_f
  constants:
  - Noise level σ/√n.
  dependencies:
    earlier_book:
    - Chapter 1 Gaussian white-noise model
    - Section 6.1.1 realisation and likelihood
    chapter_local: []
    later_book_uses:
    - All Chapter 8 testing, estimation and confidence declarations
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: false
  equivalents:
    mathlib:
      status: infrastructure-only; no exact equivalent located
      candidates:
      - MeasureTheory.Measure
      - Measure.map
      - Measure.dirac
      - ProbabilityTheory.HasLaw
      - ProbabilityTheory.IdentDistrib
      exact_equivalent: false
      assessment: No exact equivalent. Mathlib supplies measurable spaces, probability measures, kernels, Gaussian
        variables, finite products, and filters for asymptotics, but not the chapter’s statistical-experiment or
        minimax-testing declarations.
      audit_profile: statistical_experiment
    repository:
      status: absent-after-code-search
      candidates: []
      exact_equivalent: false
      assessment: No exact equivalent found in douglasbarnes/analysis-i-lean after searches for Lepski, Besov, Gaussian
        white noise, self-similar, and adaptive confidence.
      repository: douglasbarnes/analysis-i-lean

  title: Score bound for Sobolev directions
  statement: "Under the interior condition, for bounded Sobolev g,\n  |Dℓₙ(p̂ₙ)[π₀(g)]|\n  ≤ C (D-||p₀||_{H^t})^{-1} ||g||_{H^t} ||p₀||_{H^t}\n      n^{-2t/(2t+1)}\non events of arbitrarily high probability for n sufficiently large."
  hypotheses:
    explicit:
    - Interior condition (7.65).
    - g has finite H^t norm.
    - n is large on the high-probability event.
    implicit:
    - The displayed constant C also absorbs lower-bound/interpolation constants.
  quantifier_order:
  - For each desired probability level, eventually uniformly over g after scaling by ||g||_{H^t}.

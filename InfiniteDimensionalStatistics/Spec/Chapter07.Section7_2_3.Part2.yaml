  title: Rates for the finite-dimensional Sobolev sieve MLE
  statement: "If 2^{jₙ}≍n^{1/(2t+1)}, the sieve MLE p̂ₙ(jₙ) satisfies\n  h(p̂ₙ(jₙ),p₀)=O_{P₀}(n^{-t/(2t+1)}),\n  ||p̂ₙ(jₙ)-p₀||₂=O_{P₀}(n^{-t/(2t+1)}),\n  ||p̂ₙ(jₙ)-p₀||∞=O_{P₀}(n^{-(t-1/2)/(2t+1)})."
  hypotheses:
    explicit:
    - Hypotheses on t,D,p₀ as in the preceding Sobolev setup.
    - Resolution sequence 2^{jₙ} is bounded above and below by fixed multiples of n^{1/(2t+1)}.
    implicit: []
  quantifier_order:
  - For every such resolution sequence, the three stochastic orders.

    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Exponential Sobolev-MLE convergence rates
  statement: "Let p₀∈P(t,D) be bounded away from zero. There exist c,C∈(0,∞), depending only\non t,D and inf p₀, such that for every n,\n  P₀^n(h(p̂ₙ,p₀)>C n^{-t/(2t+1)}) ≤ c exp(-n^{1/(2t+1)}/c),\n  P₀^n(||p̂ₙ-p₀||₂>C n^{-t/(2t+1)}) ≤ c exp(-n^{1/(2t+1)}/c),\n  P₀^n(||p̂ₙ-p₀||∞>C n^{-(t-1/2)/(2t+1)})\n     ≤ c exp(-n^{1/(2t+1)}/c)."
  hypotheses:
    explicit:
    - t>1/2, D>1.
    - p₀∈P(t,D).
    - inf p₀>0.
    implicit:
    - Wavelet entropy bounds and interpolation inequalities are used.
    - The same MLE as (7.54).
  quantifier_order:
  - ∃ c,C depending only on stated parameters, ∀ n, all three bounds.
  constants: []
  dependencies:
    earlier_book:
    - Corollary 4.3.38 (metric entropy)
    - Sobolev interpolation/embedding
    chapter_local:

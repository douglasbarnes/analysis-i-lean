  title: Admissible local perturbations of a strictly decreasing density
  statement: 'If p₀≥ζ>0, p₀'' is bounded and p₀''≤-ξ<0, and h,h''∈L∞ with ∫h=0, then

    p₀+ηh remains a nonincreasing probability density for all sufficiently small η>0.'
  hypotheses:
    explicit:
    - ζ,ξ>0.
    - p₀ is differentiable with bounded derivative.
    - h and h' are bounded.
    - ∫h=0.
    implicit:
    - The text sometimes writes |p₀'|≥ξ together with monotonicity; the operative
      sign is p₀'≤-ξ.
  quantifier_order:

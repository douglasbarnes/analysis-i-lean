    - 563
    section: 7.2.4
    equations: []
  title: Least-concave-majorant characterisation
  statement: 'The MLE is the left derivative of the least concave majorant F̂ₙ of
    the empirical

    cdf Fₙ. Consequently it is unique, left-continuous, piecewise constant, has jumps

    only at order statistics, and is zero on (X_(n),1].'
  hypotheses:
    explicit:
    - No tied observations in the displayed order-statistic description; ties require
      the natural grouped version.
    implicit:
    - The least concave majorant exists and has a left derivative in the stated sense.
  quantifier_order:
  - For each sample (with the usual almost-sure no-tie condition under a density).

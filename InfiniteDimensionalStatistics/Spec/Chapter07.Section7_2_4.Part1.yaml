- id: ch7.lemma.7.2.16
  kind: lemma
  book:
    number: Lemma 7.2.16
    pages:
    - 563
    - 564
    - 565
    section: 7.2.4
    equations: []
  title: Stochastic endpoint bounds for the monotone MLE
  statement: "(a) If inf_{[0,1]}p₀>0, then for every ε>0 there exist ξ>0 and N such\
    \ that\n    for n≥N, P₀^n(p̂ₙ(X_(n))<ξ)<ε.\n(b) If p₀≤K, then for every ε>0 there\
    \ exists k<∞ such that for every n,\n    P₀^n(p̂ₙ(0)>k)<ε."
  hypotheses:
    explicit:
    - p₀ is a monotone density.
    - 'Part (a): positive lower bound.'
    - 'Part (b): finite upper bound.'
    implicit:
    - Order statistics are well-defined; endpoint values use the canonical representative.
  quantifier_order:
  - (a) ∀ε∃ξ,N∀n≥N. (b) ∀ε∃k∀n.
  constants: []
  dependencies:
    earlier_book: []
    chapter_local:

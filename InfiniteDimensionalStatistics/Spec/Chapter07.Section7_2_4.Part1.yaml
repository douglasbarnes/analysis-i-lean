- id: ch7.thm.7.2.17
  kind: theorem
  book:
    number: Theorem 7.2.17
    pages:
    - 565
    - 566
    section: 7.2.4
    equations: []
  title: Cube-root rates for the monotone MLE
  statement: "If p₀ is a bounded nonincreasing density on [0,1], then\n  h(p̂ₙ,p₀)=O_{P₀}(n^{-1/3}),\n\
    \  ||p̂ₙ-p₀||₂=O_{P₀}(n^{-1/3})."
  hypotheses:
    explicit:
    - p₀ is bounded and nonincreasing.
    implicit:
    - The random sup-norm truncation from Lemma 7.2.16(b) permits a fixed entropy
      class on high-probability events.
  quantifier_order:
  - As n→∞.

    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Cube-root rates for the monotone MLE
  statement: "If p₀ is a bounded nonincreasing density on [0,1], then\n  h(p̂ₙ,p₀)=O_{P₀}(n^{-1/3}),\n  ||p̂ₙ-p₀||₂=O_{P₀}(n^{-1/3})."
  hypotheses:
    explicit:
    - p₀ is bounded and nonincreasing.
    implicit:
    - The random sup-norm truncation from Lemma 7.2.16(b) permits a fixed entropy class on high-probability events.
  quantifier_order:
  - As n→∞.

  title: Monotone density model and Grenander MLE
  statement: 'Let P^mon be the left-continuous nonincreasing probability densities on [0,1].

    Define p̂ₙ as a maximiser of ℓₙ over P^mon.'
  hypotheses:
    explicit:
    - Densities are nonnegative, integrate to one, nonincreasing and left-continuous.
    implicit:
    - A canonical representative is selected by left-continuity.
  quantifier_order:
  - For each sample, maximise over P^mon.

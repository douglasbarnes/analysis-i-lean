- id: ex.6.3.3
  kind: exercise
  book:
    number: Exercise 6.3.3
    pages:
    - 522
    section: '6.3'
    equations: []
  title: Fano wavelet alternatives mem holder besov ball
  statement: 'Show that the alternatives \(f_m\) in the lower-bound proofs of Theorems

    6.3.8 and 6.3.9 lie in a fixed ball of \(B^r_{\infty\infty}([0,1])\).

    Consequently, for \(1\le p<\infty\), the minimax \(L^p([0,1])\)-rate over such

    Hölder/Besov balls is

    \[

    n^{-r/(2r+1)}.

    \]'
  hypotheses:
    explicit:
    - The functions f_m are the exact lower-bound alternatives from Theorems 6.3.8 and 6.3.9.
    - The wavelet regularity is sufficient to characterise B^r_{∞∞}.
    implicit: []
  quantifier_order:
  - ∃ a fixed radius B' independent of n,m, ∀ constructed f_m, ||f_m||_{B^r_{∞∞}}≤B'; hence ∀ 1≤p<∞ the Hölder-ball
    minimax lower rate follows.
  constants:
  - ∃ a fixed radius B' independent of n,m, ∀ constructed f_m, ||f_m||_{B^r_{∞∞}}≤B'; hence ∀ 1≤p<∞ the Hölder-ball
    minimax lower rate follows.
  dependencies:
    earlier_book:
    - Wavelet characterisation of B^r_{∞∞}
    - Theorems 6.3.8 and 6.3.9
    chapter_local:
    - 6.3.8
    - 6.3.9
    later_book_uses: &id002
    - Supports later minimax and adaptive results over Hölder classes.
  proof_status:
    delegates_to_exercises:
    - Exercise 6.3.3
    contains_omitted_steps: true
    comment: Establishes a regularity fact not proved in the main lower-bound arguments.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

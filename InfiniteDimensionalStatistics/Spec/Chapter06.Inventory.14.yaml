    section: '6.4'
    equations: []
  title: Gaussian White Noise sample Split confidence Ball
  statement: 'Prove the Gaussian-white-noise analogue of Corollary 6.4.7: construct the

    sample-split \(L^2\)-confidence ball centred at a projection estimator, use the

    independent quadratic risk estimator from (6.138), and prove honest coverage

    together with the stated diameter/radius order.'
  hypotheses:
    explicit:
    - Observations are from the Gaussian white-noise model with a sample-splitting/independent-copy construction.
    - The parameter class and projection resolution satisfy the Gaussian analogues of Corollary 6.4.7.
    - The quadratic-risk statistic (6.138) is well-defined and measurable.
    implicit: []
  quantifier_order:
  - For each confidence level 1−α and admissible class, construct C_n such that inf_f P_f(f∈C_n)≥1−α+o(1) and the
    diameter has the analogue of Corollary 6.4.7's order.
  constants:
  - For each confidence level 1−α and admissible class, construct C_n such that inf_f P_f(f∈C_n)≥1−α+o(1) and the
    diameter has the analogue of Corollary 6.4.7's order.

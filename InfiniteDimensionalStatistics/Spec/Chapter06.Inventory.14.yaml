      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Bound the wavelet \(B^r_{\infty\infty}\) sequence norm of the hypercube alternatives uniformly in the
      resolution and codeword.

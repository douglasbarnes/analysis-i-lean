- id: ex.6.4.2
  kind: exercise
  book:
    number: Exercise 6.4.2
    pages:
    - 536
    - 537
    section: '6.4'
    equations: []
  title: Multiscale confidence Set data Driven weakened Besov
  statement: "In (6.142), replace the deterministic growing ball\n\\(\\{f:\\|f\\|_{B^r_{\\infty\\infty}}\\le u_n\\\
    }\\) by\n\\[\n\\left\\{f:\\|f\\|_{B^{r,\\gamma}_{\\infty\\infty}}\n \\le \\|\\widehat f_n\\|_{B^{r,\\gamma}_{\\\
    infty\\infty}}+\\delta'\\right\\},\n\\qquad \\delta',\\gamma>0.\n\\]\nShow that Theorem 6.4.9 remains valid.\
    \ The hint asks one to prove that\n\\(\\|\\widehat f_n\\|_{B^{r,\\gamma}_{\\infty\\infty}}\\) consistently estimates\
    \ the\ncorresponding weakened Besov norm for \\(f\\in B^r_{\\infty\\infty}\\), and to adapt\nthe interpolation\
    \ argument in Theorem 6.4.9."
  hypotheses:
    explicit:
    - f belongs to the fixed B^r_{∞∞} ball of Theorem 6.4.9.
    - δ'>0 and γ>0.
    - The weakened Besov norm B^{r,γ}_{∞∞} is defined by a logarithmically relaxed wavelet weight.
    - The estimator f̂_n consistently estimates that weakened norm.
    implicit: []
  quantifier_order:
  - ∀ δ',γ>0, replacing the deterministic regularity ball by the displayed data-driven ball preserves the uniform
    coverage and diameter conclusions of Theorem 6.4.9.
  constants:
  - ∀ δ',γ>0, replacing the deterministic regularity ball by the displayed data-driven ball preserves the uniform
    coverage and diameter conclusions of Theorem 6.4.9.
  dependencies:
    earlier_book:
    - Theorem 6.4.9
    - Wavelet interpolation inequalities
    chapter_local:
    - 6.4.multiscale_universal
    - 6.4.9
    later_book_uses: &id006
    - The data-driven/weakened-norm idea is conceptually reused in adaptive confidence-set theory in Chapter 8.
  proof_status:
    delegates_to_exercises:
    - Exercise 6.4.2
    contains_omitted_steps: true
    comment: Strengthens Theorem 6.4.9 by a data-driven regularity constraint; proof is delegated to the exercise.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

- id: theorem-2-2-7
  kind: theorem
  book:
    number: 2.2.7
    pages:
    - 34
    section: '2.2'
    equations: []
  title: Borell–Sudakov–Tsirelson concentration about a median
  statement: Let X be centred separable Gaussian with Pr(‖X‖∞<∞)>0, M a median of ‖X‖∞, and σ²=sup_t EX(t)². For u>0, both
    tails around M are ≤1−Φ(u/σ), and Pr(|‖X‖∞−M|>u)≤2(1−Φ(u/σ))≤exp(−u²/(2σ²)).
  hypotheses:
    explicit:
    - X centred, separable, and bounded with positive probability.
    - M finite median.
    - σ² finite (deduced from Theorem 2.1.20).
    - u>0.
    implicit: []
  quantifier_order:
  - No hidden dimension factor; exact σ and 1/2 exponent.
  constants:
  - No hidden dimension factor; exact σ and 1/2 exponent.

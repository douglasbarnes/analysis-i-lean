- id: theorem-2-2-6
  kind: theorem
  book:
    number: 2.2.6
    pages:
    - 33
    section: '2.2'
    equations: []
  title: Gaussian concentration for ℓ²-Lipschitz functions
  statement: 'If f is ℓ²-Lipschitz with median M_f, then for ε>0: γ(f≥M_f+ε)≤1−Φ(ε/‖f‖_{Lip₂}) and γ(f≤M_f−ε)≤1−Φ(ε/‖f‖_{Lip₂});
    hence γ(|f−M_f|≥ε)≤2(1−Φ(ε/L))≤exp(−ε²/(2L²)).'
  hypotheses:
    explicit:
    - f measurable and ℓ²-Lipschitz.
    - 0<L=‖f‖_{Lip₂}<∞; constant-function case handled separately.
    - ε>0.
    implicit: []
  quantifier_order:
  - Exact Gaussian tail and exponential constants.
  constants:
  - Exact Gaussian tail and exponential constants.

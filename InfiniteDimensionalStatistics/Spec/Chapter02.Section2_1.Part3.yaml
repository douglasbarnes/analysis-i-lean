  title: Intrinsic pseudometric
  statement: For a centred Gaussian process X with covariance Σ, d_X(s,t)^2 := E(X(t)−X(s))^2 = Σ(t,t)+Σ(s,s)−2Σ(s,t).
  hypotheses:

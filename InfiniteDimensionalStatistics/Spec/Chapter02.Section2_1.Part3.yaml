- id: proposition-2-1-12
  kind: proposition
  book:
    number: 2.1.12
    pages:
    - 20
    section: '2.1'
    equations: []
  title: Separable version criterion
  statement: For a centred Gaussian process X, (T,d_X) is separable if and only if X has a separable measurable strict version.
  hypotheses:
    explicit:
    - X centred Gaussian indexed by T.
    - d_X as intrinsic pseudometric.
    implicit:
    - Measurability means each coordinate random variable is measurable; separability is Definition 2.1.2.
  quantifier_order:
  - SeparableSpace(T,d_X) ⇔ ∃ measurable strict version Y that is separable.
  constants:
  - SeparableSpace(T,d_X) ⇔ ∃ measurable strict version Y that is separable.

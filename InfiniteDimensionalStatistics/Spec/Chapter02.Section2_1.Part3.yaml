  title: Gaussian Banach-valued random variable
  statement: A B-valued random variable X on a separable Banach space is centred Gaussian iff f(X) is a centred real normal
    random variable for every continuous linear functional f∈B*. It induces the centred Gaussian process f↦f(X) indexed by
    B*.
  hypotheses:

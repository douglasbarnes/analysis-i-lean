  title: Measurability of Gaussian suprema
  statement: For a separable process X with countable separating set T₀, sup_{t∈T}|X(t)| equals sup_{t∈T₀}|X(t)| almost surely;
    hence it is measurable, and for centred Gaussian X the event of finiteness has probability 0 or 1.
  hypotheses:
    explicit:
    - X separable relative to an appropriate pseudometric.
    - T₀ is the countable separant.
    implicit: []
  quantifier_order:
  - sup_T |X| = sup_T₀ |X| a.s.; Pr(sup_T|X|<∞)∈{0,1}.
  constants:
  - sup_T |X| = sup_T₀ |X| a.s.; Pr(sup_T|X|<∞)∈{0,1}.

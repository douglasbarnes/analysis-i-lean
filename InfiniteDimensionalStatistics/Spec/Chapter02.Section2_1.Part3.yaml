  title: Gaussian zero-one law for measurable linear subspaces
  statement: If X is a centred Gaussian process and F⊆ℝ^T is a linear subspace measurable for the cylinder σ-algebra, then
    Pr(X∈F) is either 0 or 1.
  hypotheses:
    explicit:
    - X centred Gaussian process.
    - F a linear subspace of ℝ^T.
    - F cylinder-measurable.

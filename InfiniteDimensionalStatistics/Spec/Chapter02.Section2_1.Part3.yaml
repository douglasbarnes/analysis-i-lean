- id: theorem-2-1-17
  kind: theorem
  book:
    number: 2.1.17
    pages:
    - 22
    section: '2.1'
    equations: []
  title: Maurey–Pisier convex comparison
  statement: Let B be finite-dimensional, X a centred Gaussian B-valued variable, Y an independent copy, f:B→ℝ Lipschitz,
    and Φ:ℝ→[0,∞) convex measurable. Then E Φ(f(X)−Ef(X)) ≤ E Φ((π/2)·Df(X)[Y]) wherever the a.e. derivative is used, in the
    precise book formulation.
  hypotheses:
    explicit:
    - B finite-dimensional normed space.
    - X,Y independent identically distributed centred Gaussian B-valued variables.
    - f Lipschitz.
    - Φ nonnegative convex measurable.
    - Both sides well-defined, allowing +∞ if the book does.
    implicit:
    - Rademacher differentiability of f and a measurable choice/version of f′(X).
    - The Gaussian law may be supported on a proper subspace, reduced to its support.
  quantifier_order:
  - Universal factor π/2; quantification over all admissible Φ.
  constants:
  - Universal factor π/2; quantification over all admissible Φ.
  dependencies:
    earlier_book: []
    chapter_local: []
    chapter_local_dependents:
    - example-2-1-19

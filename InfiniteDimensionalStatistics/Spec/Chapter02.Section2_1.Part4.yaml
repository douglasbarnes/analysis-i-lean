- id: theorem-2-1-20
  kind: theorem
  book:
    number: 2.1.20
    pages:
    - 24
    section: '2.1'
    equations: []
  title: Integrability and concentration of a separable Gaussian supremum
  statement: Let X be a centred separable Gaussian process and assume Pr(sup_t|X(t)|<∞)>0. Then σ²:=sup_t EX(t)²<∞, E sup_t|X(t)|<∞,
    and the convex-comparison conclusion of Theorem 2.1.17 extends to the supremum. In particular there is the stated Gaussian
    upper tail, with the book's constant K=1/π² in its parameterisation.
  hypotheses:
    explicit:
    - X centred and separable.
    - Positive probability of a finite supremum.
    implicit:
    - The supremum is measurable by separability.
    - σ is finite as part of the conclusion.
  quantifier_order:
  - ∀ admissible Φ; ∀u>0; universal constants exactly as displayed in the book.
  constants:
  - ∀ admissible Φ; ∀u>0; universal constants exactly as displayed in the book.
  dependencies:

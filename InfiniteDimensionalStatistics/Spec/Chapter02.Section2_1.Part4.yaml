  title: Finite Gaussian maximum concentration
  statement: For a centred jointly Gaussian vector (g₁,…,gₙ), σ²=max_i E gᵢ², and every nonnegative even convex Φ increasing
    on [0,∞), E Φ(max_i|gᵢ|−E max_i|gᵢ|) ≤ E Φ((π/2)σg), g∼N(0,1). Consequently Pr(max_i|gᵢ|−E max_i|gᵢ|>u) ≤ 2 exp(−u²/(2π²σ²)).
  hypotheses:
    explicit:
    - n≥1.
    - (gᵢ) jointly centred Gaussian.
    - Φ as stated.
    - u>0.
    implicit: []
  quantifier_order:
  - σ²=max variances.
  - Universal factor π/2 and tail denominator 2π²σ².
  constants:
  - Universal factor π/2 and tail denominator 2π²σ².

  title: McDiarmid bounded-differences inequality
  statement: If independent X_k and Z=Z(X₁,…,Xₙ) has bounded differences c_k, then Pr{|Z−EZ|≥t}≤2exp(−2t²/∑c_k²), t>0, and
    Var(Z)≤¼∑c_k².

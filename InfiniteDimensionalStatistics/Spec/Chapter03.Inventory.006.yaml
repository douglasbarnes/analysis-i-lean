- id: theorem_3_3_9
  kind: theorem
  book:
    number: Theorem 3.3.9
    pages:
    - 156
    - 158
    section: '3.3'
    equations: []
  title: Bousquet upper-tail Talagrand inequality
  statement: Let X₁,…,Xₙ be independent and 𝓕 countable, coordinatewise centred, |f|≤U. Let S_j be sup_f∑_{k≤j}f(X_k) or sup_f|∑_{k≤j}f(X_k)|,
    let σ²≥n⁻¹∑_{k=1}^n sup_fE f(X_k)², and v_n:=2U ES_n+nσ². Then log E exp(λ(S_n−ES_n))≤(v_n/U²)(e^{λU}−1−λU), λ≥0, with
    the corresponding Bennett, Bernstein and inverted tails.
  transcription_status: exact-with-official-correction
  hypotheses:
    explicit:
    - X_k independent
    - 𝓕 countable and centred
    - '|f|≤U'
    - U>0
    - variance proxy condition
    implicit: []
  quantifier_order: *id001
  constants: *id002

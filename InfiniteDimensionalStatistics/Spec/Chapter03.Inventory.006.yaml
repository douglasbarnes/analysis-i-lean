- id: bounded_differences
  kind: definition
  book:
    number: Unnumbered definition before Example 3.3.13
    pages:
    - 161
    section: '3.3'
    equations: []
  title: Bounded differences
  statement: A measurable Z=Z(X₁,…,Xₙ) has bounded differences c_k if changing only coordinate k changes Z by at most c_k,
    uniformly over all coordinate values.

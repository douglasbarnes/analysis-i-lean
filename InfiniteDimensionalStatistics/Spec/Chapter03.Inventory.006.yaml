  title: Upper-tail log-Laplace bound for empirical suprema
  statement: For Z=max_{f∈𝓕}∑f(X_k), with independent X_k and countable centred 𝓕⊂[0,1], put σ²:=n⁻¹∑_k sup_fE f(X_k)² and
    v:=2EZ+nσ². Then log E exp(λ(Z−EZ))≤v(e^λ−1−λ), λ≥0.
  transcription_status: exact-transcription
  hypotheses:
    explicit:
    - independent X_k
    - 𝓕 countable
    - 0≤f≤1
    - E f(X_k)=0
    implicit: []

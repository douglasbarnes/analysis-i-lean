    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Uniform asymptotic score control for monotone densities
  statement: "Suppose p₀ is differentiable, 0<ζ≤p₀, p₀' is bounded and p₀'≤-ξ<0.\nFor g,g'∈L∞,\n  |Dℓₙ(p̂ₙ)[π₀(g)]|=O_{P₀}(||g||_{C¹} n^{-2/3}).\nConsequently, for B={g:g,g'∈L∞, ||g||_{C¹}≤B},\n  sup_{g∈B}|(P̂ₙ-Pₙ)(g)|=O_{P₀}(B n^{-2/3})."
  hypotheses:
    explicit:
    - Strict positivity and strict decrease.
    - Bounded derivative.
    - g and g' bounded.
    implicit: []
  quantifier_order:
  - First bound for every g, uniformly by its norm; second for each fixed radius B.
  constants: []
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.prop.monotoneScoreBound
    - ch7.lemma.7.2.18
    - ch7.lemma.7.2.6

    section_title: The Maximum Likelihood Estimator of a Monotone Density
    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Asymptotic efficiency of the monotone MLE
  statement: "Under the hypotheses of Proposition 7.2.19, for every bounded class F in C^s,\ns>1/2,\n  ||P̂ₙ-Pₙ||_F=o_{P₀}(n^{-1/2}),\n hence\n  √n(P̂ₙ-P₀)⇒G_{P₀} in ℓ∞(F),\nwith the corresponding scalar normal limit for ∫f(p̂ₙ-p₀)."
  hypotheses:
    explicit:
    - p₀ satisfies strict positivity, differentiability and strict decrease.
    - s>1/2.
    - F is a bounded uniform Donsker class.
    implicit:
    - Wavelet projections of C^s functions are used.
  quantifier_order:
  - ∀ such F, as n→∞.
  constants: []
  dependencies:
    earlier_book:
    - Chapter 4 wavelet approximation
    - Chapter 3 Donsker theory
    chapter_local:

  title: Asymptotic efficiency of the monotone MLE
  statement: "Under the hypotheses of Proposition 7.2.19, for every bounded class\
    \ F in C^s,\ns>1/2,\n  ||P̂ₙ-Pₙ||_F=o_{P₀}(n^{-1/2}),\nhence\n  √n(P̂ₙ-P₀)⇒G_{P₀}\
    \ in ℓ∞(F),\nwith the corresponding scalar normal limit for ∫f(p̂ₙ-p₀)."
  hypotheses:

- id: ch7.thm.7.2.1
  kind: theorem
  book:
    number: Theorem 7.2.1
    pages:
    - 548
    - 549
    - 550
    section: 7.2.1
    equations: []
  title: Hellinger rate for an unsieved NPMLE
  statement: "Assume p₀∈P and p̂ₙ is an MLE. Let J(δ)≥J(P̄,δ) and assume J(δ)/δ² is\n\
    nonincreasing on (0,1]. There exists c>0 such that, for every sequence δₙ with\n\
    \  √n δₙ² ≥ c J(δₙ)  for every n,\nand every δ≥δₙ,\n  P₀^n(h(p̂ₙ,p₀)≥δ) ≤ c exp(-nδ²/c²)."
  hypotheses:
    explicit:
    - p₀∈P.
    - A measurable MLE exists.
    - The entropy majorant and monotonicity condition.
    - δₙ∈(0,1] and δ≥δₙ.
    implicit:
    - All empirical-process suprema used are measurable or interpreted through a measurable
      version.
    - The root-density bracketing integral is finite at relevant radii.
  quantifier_order:
  - ∃ universal-for-the-model-proof c>0, ∀ admissible sequences δₙ, ∀ n, ∀ δ≥δₙ, bound.
  constants:
  - c is fixed independently of n and δ, but may absorb universal constants.
  dependencies:
    earlier_book:
    - Theorem 3.5.21 (bracketing exponential inequality)
    chapter_local:
    - ch7.def.npmle
    - ch7.def.bracketingEntropyIntegral
    - ch7.lemma.7.2.2
    later_book_uses: []
  proof_status:
    delegates_to_exercises:
    - ex7.2.1
    - ex7.2.2
    contains_omitted_steps: true
    comment: essential inequalities in the published proof
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: No notes-only mathematical declaration is used here.
    used_later_in_book: false
  equivalents:
    mathlib:
      status: none_exact
      candidates: []
      exact_equivalent: false
    repository:
      status: none_found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: 'A theorem about filters and convergence in probability, using `TendstoInMeasure`/custom
      `OP` and `oP` predicates over the sequence of experiments.

      The nonasymptotic statement should be formalised first as a tail inequality

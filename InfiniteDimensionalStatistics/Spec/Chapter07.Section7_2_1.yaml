- id: ch7.prop.klIdentifiability
  kind: proposition
  book:
    number: (7.22)
    pages:
    - 547
    section: 7.2.1
    equations:
    - (7.22)
  title: Kullback–Leibler identifiability
  statement: "If p is absolutely continuous with respect to p₀ in the sense needed\
    \ for log(p/p₀), then\n  ℓ(p)-ℓ(p₀)=∫ log(p/p₀) dP₀ ≤ 0,\nwith equality if and\
    \ only if p=p₀ μ-a.e. Hence ℓ(p)<ℓ(p₀) for p≠p₀."
  hypotheses:
    explicit:
    - p and p₀ are probability densities.
    - The displayed log ratio is P₀-integrable (or the extended integral is defined).
    implicit:
    - The book's wording 'p absolutely continuous with respect to p₀(x)dx' appears
      directionally inconsistent with the displayed ratio and should be checked; the
      operative requirement is that p/p₀ is defined P₀-a.s.
  quantifier_order:
  - ∀ p in the model with the stated absolute-continuity/integrability conditions.
  constants: []
  dependencies:
    earlier_book:
    - Jensen/Gibbs inequality
    chapter_local:
    - ch7.def.populationLogLikelihood
    later_book_uses: []

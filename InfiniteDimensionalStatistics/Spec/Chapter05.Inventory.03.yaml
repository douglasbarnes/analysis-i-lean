- id: ch5.prop.5_1_9
  kind: proposition
  book:
    number: Proposition 5.1.9
    pages:
    - 401
    - 402
    section: 5.1.1
    equations: []
  title: Proposition 5.1.9
  statement: For the mth derivative kernel estimator, under the smoothness, weighted-integrability and variation
    hypotheses stated in the proposition, E‖fₙ^{(m)}−Efₙ^{(m)}‖p≤Lp/[√n h^{m+1/2}] for 1≤p<∞; for p=∞, E‖·‖∞≤L∞√(log(h⁻¹)/(n
    h^{2m+1})). The finite-p restriction is h>1/n when p>2, and the sup-norm restriction is h/log(h⁻¹)>1/n.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - K and f are C^m.
    - K^{(m)} and f satisfy the weighted assumptions analogous to Theorem 5.1.5 for p<2.
    - K^{(m)} has finite r-variation for p=∞.
    - Bandwidth restrictions as displayed.
    implicit:
    - K^{(m)} is used as a (not necessarily normalised) empirical-process kernel.
    - Lp constants depend on derivatives and density as in Theorem 5.1.5.
  quantifier_order:
  - For each m,p and fixed model data there exists Lp.
  - For every n,h satisfying the relevant restriction.
  constants:
  - Lp,L∞.
  dependencies:
    earlier_book: &id005 []
    chapter_local:
    - ch5.eq.5_26_5_27
    - ch5.thm.5_1_5
    later_book_uses:
    - Proposition 5.1.10
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      - Mathlib.Analysis.Fourier.Convolution
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Reduce to Theorem 5.1.5 after exact rescaling of K^{(m)}; no new probabilistic principle but substantial
      analytic bookkeeping.
    blockers:
    - Derivative kernel hypotheses and scaled Lp norm identities.
  difficulty: substantial
  pass: core
  issues_for_central_review: &id006 []
- id: ch5.prop.5_1_10
  kind: proposition
  book:
    number: Proposition 5.1.10
    pages:
    - 402
    section: 5.1.1
    equations: []
  title: Proposition 5.1.10
  statement: Assume the hypotheses of Proposition 5.1.9, K has order S, and f has s+m derivatives/smoothness with
    s+m<S. Choosing h to balance derivative bias h^s and stochastic error (nh^{2m+1})^{-1/2} gives finite-p risk
    bounded by 2 Lp^{2s/(2(s+m)+1)}(cB)^{(2m+1)/(2(s+m)+1)}n^{-s/(2(s+m)+1)}; the sup-norm analogue replaces n by
    n/log n.
  source_fidelity:
    transcription_status: verified_with_typographical_flag
    author_corrected_reading: null
  hypotheses:
    explicit:
    - Hypotheses of Proposition 5.1.9.
    - Kernel order S>s+m.
    - f belongs to the stated smoothness/Besov ball of radius B.
    - Bandwidth is the explicit balancing choice.
    implicit:
    - c is the approximation constant for derivative bias.
    - The stated risk is expected Lp error for estimating f^{(m)}.
  quantifier_order:
  - For every f satisfying the ball condition and each n, choose h as displayed.
  - Then the risk inequality holds.
  constants:
  - c,B,Lp and exact displayed exponents.
  dependencies:
    earlier_book:
    - Chapter 4 approximation of derivatives
    chapter_local:
    - ch5.prop.5_1_9
    later_book_uses: *id005
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Distribution.Sobolev
      - Mathlib.Analysis.FunctionalSpaces.SobolevInequality
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: A deterministic optimisation of a two-term risk bound after supplying the derivative approximation theorem.
    blockers:
    - Besov/Sobolev derivative approximation.
  difficulty: major-library
  pass: core
  issues_for_central_review:
  - The text says “same hypotheses as in Corollary 5.1.9”, but 5.1.9 is a Proposition.
  - The OCR rendering of one p-norm in the displayed statement is ambiguous; compare the page before proof implementation.
  - 'Source-transcription status: verified_with_typographical_flag.'
- id: ch5.prop.5_1_11
  kind: proposition
  book:
    number: Proposition 5.1.11
    pages:
    - 403
    - 405
    section: 5.1.1
    equations: []
  title: Proposition 5.1.11
  statement: Let φ be an MRA scaling function with m continuous rapidly decaying derivatives and let f be a C^m
    density. The wavelet derivative estimator f_{n,m} obtained by differentiating the projection estimator satisfies
    E‖f_{n,m}−Ef_{n,m}‖p≤Lp√(2^{(2m+1)j}/n) for p<∞ (with 2^j<n if p>2), and, if φ^{(m)} has finite p-variation
    and 2^j j<n, E‖·‖∞≤L∞√(2^{(2m+1)j}j/n). Bias-balanced rates agree with Proposition 5.1.10.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - φ∈C^m and its derivatives decay rapidly.
    - f∈C^m is a density.
    - Resolution restrictions as stated.
    - For p=∞, φ^{(m)} has finite variation exponent.
    implicit:
    - The differentiated projection series converges and defines f_{n,m}.
  quantifier_order:
  - For every n,j satisfying the restrictions.
  constants:
  - Lp,L∞.
  dependencies:
    earlier_book: *id005
    chapter_local:
    - ch5.eq.5_3
    - ch5.prop.5_1_9
    - ch5.prop.5_1_10
    later_book_uses: *id005
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Distribution.Sobolev
      - Mathlib.Analysis.FunctionalSpaces.SobolevInequality
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Differentiate finite/kernel wavelet expansions and apply empirical-process bounds to derivative kernel
      sections.
    blockers:
    - Differentiable wavelet basis and rapid-decay estimates.

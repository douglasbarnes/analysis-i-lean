- id: ch5.ex.multivariate_rates
  kind: operative_example
  book:
    number: Unnumbered multivariate extension
    pages:
    - 403
    - 405
    section: 5.1.1
    equations: []
  title: Unnumbered multivariate extension
  statement: In dimension d, the stochastic effective dimension 2^j is replaced by 2^{dj}; balancing with s-smooth
    bias gives Lp rate n^{-s/(2s+d)} for finite p and sup-norm rate (n/log n)^{-s/(2s+d)}. The same replacement
    applies to white-noise projection estimators.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - Tensor-product or d-dimensional kernels/wavelets satisfying the corresponding assumptions.
    - Density smoothness s and regularity sufficient for the bias bound.
    implicit:
    - Constants depend on d and the multivariate kernel/basis.
  quantifier_order:

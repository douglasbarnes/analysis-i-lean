  title: Measurable argmax selection on a compact metric space
  statement: "Let (X,A) be measurable, Θ a compact metric space, and u:X×Θ→ℝ such\
    \ that\nx↦u(x,θ) is measurable for every θ and θ↦u(x,θ) is continuous for every\
    \ x.\nProve that there is a Borel-measurable θ̂:X→Θ satisfying\n  u(x,θ̂(x)) =\
    \ sup_{θ∈Θ} u(x,θ).\nDeduce Proposition 7.2.7(c)."
  hypotheses:
    explicit:
    - Θ compact metric.
    - u is a Carathéodory function.
    implicit:
    - The supremum is attained by compactness.
  quantifier_order:
  - For every such u, construct one measurable maximiser selector.

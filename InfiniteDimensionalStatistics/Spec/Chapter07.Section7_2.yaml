  title: Order-statistic densities and exponential spacings
  statement: "For i.i.d. X₁,…,Xₙ with cdf F and density f on [0,1], derive the joint\n\
    density n!∏ᵢf(xᵢ) on x₁<⋯<xₙ and the beta-form marginal density of X_(i).\nIf\
    \ inf f≥ζ and aₙ↓0 with n aₙ→∞, prove\n  P(1-X_(n)>aₙ) ≤ (1-c aₙ)^n → 0\nfor c=c(ζ).\
    \ For a uniform sample prove the exponential-spacing\nrepresentation (U_(i)) ≡d\
    \ (Z_i/Z_{n+1}), where Z_i are partial sums of\nindependent Exp(1) variables."
  hypotheses:
    explicit:
    - i.i.d. sample with density f on [0,1].
    - For the tail bound, inf f≥ζ>0.
    - aₙ→0 and n aₙ→∞.
    implicit:
    - The exponential representation uses Z_i=E₁+⋯+E_i.
  quantifier_order:
  - For every n and order i; then asymptotically for the sequence aₙ.
  constants:
  - c depends only on ζ.

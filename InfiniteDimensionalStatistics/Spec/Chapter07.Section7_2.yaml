  title: Hellinger comparison with a midpoint density
  statement: "For probability densities p and p₀, let p̄=(p+p₀)/2. Prove that\n  h²(p,p₀)\
    \ ≤ C h²(p̄,p₀)\nfor a universal constant C. The stated hint is the pointwise\
    \ inequality\n  (√p̄+√p₀)/(√p+√p₀) ≤ 2."
  hypotheses:
    explicit:
    - p and p₀ are probability densities with respect to a common dominating measure.
    implicit:
    - Hellinger distance uses the Chapter 7 normalisation.
  quantifier_order:
  - There exists a universal C such that for all density pairs (p,p₀).
  constants:
  - Universal C; the hint yields an explicit non-optimised constant.

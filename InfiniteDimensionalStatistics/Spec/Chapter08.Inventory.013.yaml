- id: ch8.theorem_8_3_18
  kind: theorem
  book:
    number: Theorem 8.3.18
    pages:
    - 656
    section: 8.3.3
    equations:
    - '8.3'
  title: Lower bound for weak L2 self-similarity
  statement: Fix α∈(0,1/2), a constant self-similarity width ε∈(0,1), and 0<r′<r<r′/(1−ε). For every s∈(r,r′/(1−ε)),
    no sequence of confidence sets C_n⊆ℓ² can have, for every 0<b<B and J₀∈ℕ, both liminf_{n→∞} inf_{f∈S_ε^{r′}(b,B,J₀)∪S_ε^s(b,B,J₀)}
    P_f(f∈C_n) ≥ 1−α and sup_{f∈S_ε^s(b,B,J₀)} P_f(|C_n|₂>r_n)→0 for every positive sequence r_n=o(n^{-r/(2r+1/2)}).
  source_fidelity: exact-transcription
  hypotheses:
    explicit:
    - α∈(0,1/2)
    - ε∈(0,1) is constant
    - 0<r′<r<r′/(1−ε)
    - s∈(r,r′/(1−ε))
    - Gaussian sequence model
    - 0<b<B
    - J₀∈ℕ
    implicit:
    - C_n and the coverage/diameter events are measurable.
    - '|C_n|₂ denotes L²/ℓ² diameter.'
  quantifier_order:
  - Fix α,ε,r′,r
  - For every s in the displayed interval
  - There is no sequence C_n such that
  - for every 0<b<B and J₀
  - the coverage property holds and
  - for every positive sub-rate r_n
  - the s-class diameter probability tends to zero
  constants: []
  dependencies:
    earlier_book:
    - Likelihood-ratio diagonal construction as in Theorem 8.3.11
    chapter_local:
    - ch8.self_similar_sequence_class_8_90
    later_book_uses:
    - ch8.corollary_8_3_19

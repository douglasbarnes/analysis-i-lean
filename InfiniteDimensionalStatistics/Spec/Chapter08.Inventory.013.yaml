    - '8.3'
  title: Exact adaptive L2 confidence balls for self-similar sequences
  statement: For every 0<b<B, J₀ and ε satisfying (8.92), the ball (8.98) has uniformly exact asymptotic coverage
    1−α over S(ε,b,B,J₀). Moreover, for each s in the window, B>b and δ>0 there is C(s,δ)>0 such that limsup_n sup_{f∈S^s_{ε(s)}(b,B,J₀)}P_f(|C_n|₂≥C(s,δ)B^{1/(2s+1)}n^{-s/(2s+1)})≤δ.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - fixed adaptation window
    - parameter conditions (8.92),(8.95)
    - sample splitting
    - adaptive estimator f̂_n
    implicit:
    - The theorem says “any standard adaptive estimator”; the proof takes f_n(j̄_n).
  quantifier_order:
  - Fix α and all class parameters
  - construct C_n
  - take uniform absolute coverage error limit
  - for each s,B,δ choose C and assert diameter limsup
  constants:

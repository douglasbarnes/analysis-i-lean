  title: Sieved MLE and approximation setup
  statement: "Let Pₙ be a sequence of density models and p̂ₙ maximise ℓₙ over Pₙ. Choose pₙ*∈Pₙ\nsatisfying p₀/pₙ*≤U² for a fixed U<∞. Define\n  P̄_{*,n}^{1/2}={√((p+pₙ*)/2):p∈Pₙ}\nand its bracketing entropy integral J*(δ)."
  hypotheses:
    explicit:
    - Each pₙ* is a density in Pₙ.
    - Uniform likelihood-ratio bound p₀≤U²pₙ*.
    - A measurable sieve MLE exists.
    implicit: []
  quantifier_order:
  - ∃ fixed U, ∀ n, choose pₙ*; define classes for each n.

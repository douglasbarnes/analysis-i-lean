  title: Basic likelihood inequality
  statement: "For g_p=(1/2)log((p+p₀)/(2p₀)), one has\n  h²((p̂ₙ+p₀)/2,p₀) ≤ 2 (Pₙ-P₀)(g_{p̂ₙ})."
  hypotheses:
    explicit:
    - p₀∈P and p̂ₙ maximises ℓₙ over P.
    - The ratio is used on A={p₀>0}.
    implicit:
    - The empirical integral is finite on the event where the MLE comparison is applied; conventions at zeros are as in the
      text.
  quantifier_order:
  - For every realised sample and MLE satisfying (7.23).
  constants: []
  dependencies:
    earlier_book:
    - Concavity of log
    - Hellinger affinity identity
    chapter_local:
    - ch7.def.npmle
    - ch7.def.averageDensityClass
    - ch7.def.hellinger
    later_book_uses:

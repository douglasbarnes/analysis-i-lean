    section_title: Rates of Convergence in Hellinger Distance
    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Hellinger rate for an unsieved NPMLE
  statement: "Assume p₀∈P and p̂ₙ is an MLE. Let J(δ)≥J(P̄,δ) and assume J(δ)/δ² is\nnonincreasing on (0,1]. There exists c>0 such that, for every sequence δₙ with\n  √n δₙ² ≥ c J(δₙ)  for every n,\nand every δ≥δₙ,\n  P₀^n(h(p̂ₙ,p₀)≥δ) ≤ c exp(-nδ²/c²)."
  hypotheses:
    explicit:
    - p₀∈P.
    - A measurable MLE exists.
    - The entropy majorant and monotonicity condition.
    - δₙ∈(0,1] and δ≥δₙ.
    implicit:
    - All empirical-process suprema used are measurable or interpreted through a measurable version.
    - The root-density bracketing integral is finite at relevant radii.
  quantifier_order:
  - ∃ universal-for-the-model-proof c>0, ∀ admissible sequences δₙ, ∀ n, ∀ δ≥δₙ, bound.
  constants:
  - c is fixed independently of n and δ, but may absorb universal constants.
  dependencies:
    earlier_book:
    - Theorem 3.5.21 (bracketing exponential inequality)
    chapter_local:
    - ch7.def.npmle
    - ch7.def.bracketingEntropyIntegral
    - ch7.lemma.7.2.2
    later_book_uses:
    - ch7.remark.localEntropy
    - ch7.thm.7.2.10
    - ch7.thm.7.2.17
    - ch7.thm.7.2.3
  proof_status:
    delegates_to_exercises:

  title: Hellinger rate for a sieve MLE
  statement: "Under the sieve setup, let J dominate J* and let J(δ)/δ² be nonincreasing.\nIf √n δₙ²≥cJ(δₙ) eventually, then\n  h(p̂ₙ,p₀)=O_{P₀}(δₙ+h(pₙ*,p₀))."
  hypotheses:
    explicit:
    - All hypotheses of (7.34)–(7.37).
    - Entropy majorant condition for all sufficiently large n.
    implicit:
    - The `O_P` constant may depend on U and universal entropy constants.
  quantifier_order:
  - ∃ c>0; for every admissible δₙ, the stochastic order conclusion as n→∞.

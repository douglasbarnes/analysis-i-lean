      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: 'A theorem about filters and convergence in probability, using `TendstoInMeasure`/custom `OP` and `oP` predicates
      over the sequence of experiments.

      The nonasymptotic statement should be formalised first as a tail inequality on product measures.'

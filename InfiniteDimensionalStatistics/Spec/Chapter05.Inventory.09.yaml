- id: ch5.prop.5_2_14
  kind: proposition
  book:
    number: Proposition 5.2.14
    pages:
    - 435
    section: 5.2.2
    equations: []
  title: Proposition 5.2.14
  statement: 'For every weighting sequence w, the space M₀(w), equipped with the norm ‖·‖_{M(w)}, is a separable
    Banach space. If w is admissible, then the Gaussian coefficient array {G(l,k): l≥J₀−1, 0≤k<2^l} is a tight Borel
    Gaussian random variable in M₀(w).'
  source_fidelity:
    transcription_status: verified
    author_corrected_reading: null
  hypotheses:
    explicit:
    - w is a weighting sequence as in Definition 5.2.13.
    - Admissibility of w is additionally assumed for the Gaussian assertion.
    implicit:
    - The finitely many scaling-level coordinates are included at l=J₀−1.
    - G(l,k) denotes the white-noise/isonormal wavelet coefficient array introduced immediately before the proposition.
  quantifier_order:
  - For every weighting sequence w, assert the Banach and separability properties.
  - If w is admissible, assert tight Borel Gaussianity of G in M₀(w).
  constants: []
  dependencies:
    earlier_book: *id004
    chapter_local:
    - ch5.def.multiscale_spaces
    later_book_uses:
    - Proposition 5.2.15
    - Theorem 5.2.16
  proof_status: *id002
  notes_status: *id005
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates: []
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: Isometric equivalence of M₀(w) with c₀ over a countable index after rescaling.
    blockers:
    - Confirm exact numbering and whether the dual/bidual assertion is included in this proposition.
  difficulty: substantial
  pass: core
  issues_for_central_review: []
- id: ch5.prop.5_2_15
  kind: proposition
  book:
    number: Proposition 5.2.15 and identity (5.86)
    pages:
    - 435
    - 436
    section: 5.2.2
    equations: []
  title: Proposition 5.2.15 and identity (5.86)
  statement: 'The dual Banach space M₀(w)′ is isometrically identified with M′(w)={x: ‖x‖_{M′(w)}:=Σ_{l=J₀−1}^∞
    w_l Σ_{k=0}^{2^l−1}|x_{lk}|<∞}; moreover M₀(w)″=M(w). With M(w) equipped with its weak-* σ-field, the Gaussian
    coefficient array G is a Borel Gaussian random variable in M(w), and it is a tight Gaussian random variable
    in M₀(w) exactly when w is admissible; in that case G=Σ_{l,k}G(l,k)e_{lk} with convergence in M₀(w). In the
    white-noise model, equation (5.86) is the exact identity √n(Y^(n)−f)=W in M₀(w) for admissible w (with the model’s
    unit-noise normalisation).'
  source_fidelity:
    transcription_status: verified
    author_corrected_reading: null
  hypotheses:
    explicit:
    - w is a weighting sequence as in Definition 5.2.13.
    - For the M₀(w)-valued Gaussian series and white-noise identity, w is admissible.
    - The wavelet basis and white-noise coefficient representation are those fixed in the subsection.
    implicit:
    - The weak-* σ-field on M(w) is generated by coordinate projections.
    - The symbol M₀(w)″ denotes the Banach bidual under the stated isometric identifications.
    - Equation (5.86) uses the unit-variance white-noise normalisation of the book.
  quantifier_order:
  - For every weighting sequence w, identify M₀(w)′ and M₀(w)″.
  - If and only if w is admissible, the Gaussian coefficient series converges tightly in M₀(w).
  - For every n and f in the white-noise model, the coefficient identity holds.
  constants:
  - The dual norm weights coefficient absolute values by w_l.
  - The white-noise scaling is √n.
  dependencies:
    earlier_book: *id004
    chapter_local:
    - ch5.def.5_2_13
    - ch5.prop.5_2_14
    - ch5.eq.5_5
    later_book_uses:
    - Chapter 6, equation (6.141)
    - Chapter 7 multiscale BvM
  proof_status: *id002
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: Construct the coefficient Gaussian sequence as a random element of a weighted c₀ space using Gaussian
      maxima and Borel–Cantelli; state the model identity coefficientwise then by extensionality.
    blockers:
    - Gaussian sequence tail summability and Banach-valued measurability.
  difficulty: major-library
  pass: core
  issues_for_central_review: []
- id: ch5.thm.5_2_16
  kind: theorem
  book:
    number: Theorem 5.2.16
    pages:
    - 436
    - 437
    section: 5.2.2
    equations: []
  title: Theorem 5.2.16
  statement: Suppose P has a density f∈C^γ([0,1]) for some γ≥0. Let j_n satisfy √(2^{j_n}j_n/n)=O(1) and w_{j_n}^{−1}2^{−j_n(γ+1/2)}=o(n^{−1/2}).
    Then, for every admissible w, √n(P_n(j_n)−P) converges in law to the P-bridge G_P in M₀(w) as n→∞.
  source_fidelity:
    transcription_status: verified_with_erratum
    author_corrected_reading: 'Official erratum on p.436: every convergence arrow printed as →d is to be read as
      →L.'
  hypotheses:
    explicit:
    - P has density f∈C^γ([0,1]) for some γ≥0.
    - w is admissible.
    - √(2^{j_n}j_n/n)=O(1).
    - w_{j_n}^{−1}2^{−j_n(γ+1/2)}=o(n^{−1/2}).
    - P_n(j_n) is the wavelet-projected empirical measure defined in the subsection.
    implicit:
    - The P-bridge coefficient array defines a tight Borel random variable in M₀(w).
    - The projection includes all scales through j_n.
  quantifier_order:
  - Fix γ≥0, P with density f∈C^γ([0,1]), and an admissible w.
  - For every integer resolution sequence j_n satisfying both displayed conditions, let n→∞.
  constants:
  - The stochastic-size condition is equivalently 2^{j_n}j_n/n=O(1).
  - The bias condition is w_{j_n}^{−1}2^{−j_n(γ+1/2)}=o(n^{−1/2}).
  dependencies:
    earlier_book:
    - Empirical-process coefficient concentration
    chapter_local:
    - ch5.def.5_2_13
    - ch5.prop.5_2_15
    later_book_uses:
    - Chapter 6 multiscale confidence sets
  proof_status: *id002
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: Banach-valued CLT in weighted c₀ for a truncated empirical wavelet coefficient process plus deterministic
      bias.
    blockers:
    - Triangular-array empirical-process CLT in M₀(w).
    - Wavelet bias estimates.
  difficulty: research-level
  pass: core
  issues_for_central_review:
  - 'Official erratum on p.436: every convergence arrow printed as →d is to be read as convergence in law →L.'

  - 'Source-transcription status: central_review_required.'
- id: ch5.thm.5_2_16
  kind: theorem
  book:
    number: Theorem 5.2.16
    pages:
    - 436
    - 437
    section: 5.2.2
    equations: []
  title: Theorem 5.2.16
  statement: Suppose P has density f∈C^γ([0,1]), γ≥0. For projection resolution jₙ satisfying the printed stochastic-size
    condition (equivalent in context to 2^{jₙ}jₙ/n=O(1)) and w_{jₙ}^{-1}2^{-jₙ(γ+1/2)}=o(n^{-1/2}), √n(Pₙ(jₙ)−P)
    converges in law to the P-bridge G_P in M₀(w), for every admissible w.
  source_fidelity:
    transcription_status: central_review_required_with_erratum
    author_corrected_reading: 'Official erratum on p.436: every convergence arrow printed as →d is to be read as
      →L.'
  hypotheses:
    explicit:
    - f∈C^γ([0,1]).
    - w admissible.
    - Resolution conditions as displayed in the theorem.
    - Wavelet projection empirical measure Pₙ(jₙ).
    implicit:
    - The P-bridge coefficient array is a tight Borel random element of M₀(w).
  quantifier_order:
  - For every admissible w satisfying the bias condition.
  - As n→∞.
  constants:
  - γ and w.
  dependencies:
    earlier_book:
    - Empirical-process coefficient concentration
    chapter_local:
    - ch5.def.5_2_13
    - ch5.prop.5_2_15
    later_book_uses:
    - Chapter 6 multiscale confidence sets
  proof_status: *id002
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: Banach-valued CLT in weighted c₀ for a truncated empirical wavelet coefficient process plus deterministic
      bias.
    blockers:
    - Triangular-array empirical-process CLT in M₀(w).
    - Wavelet bias estimates.
  difficulty: research-level
  pass: core
  issues_for_central_review:
  - The OCR displays the first resolution condition ambiguously; compare the page to decide between 2^{jₙ}jₙ/n=O(1)

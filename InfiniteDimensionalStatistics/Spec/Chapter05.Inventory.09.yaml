    section: 5.2.2
    equations: []
  title: Proposition 5.2.15 and identity (5.86)
  statement: For admissible w, the white-noise wavelet coefficient array W=(W(ψ_{lk})) defines a tight Borel centred
    Gaussian random variable in M₀(w). In the white-noise model, the observation satisfies the exact identity √n(Y^{(n)}−f)=W
    in M₀(w) (with σ absorbed or retained according to the model normalisation).
  source_fidelity:
    transcription_status: central_review_required
    author_corrected_reading: null
  hypotheses:
    explicit:
    - w admissible.
    - Wavelet basis on [0,1].
    - White-noise model and coefficient representation.
    implicit:
    - The scaling coefficients are finite-dimensional and do not affect tightness.
    - Check whether σ=1 is fixed in this subsection.
  quantifier_order:
  - Almost surely the coefficient array belongs to M₀(w).
  - The identity holds as equality of M₀(w)-valued random elements.
  constants:
  - Weight w; noise σ if not normalised.
  dependencies:
    earlier_book: *id004
    chapter_local:
    - ch5.def.5_2_13
    - ch5.prop.5_2_14
    - ch5.eq.5_5
    later_book_uses:
    - Chapter 6, equation (6.141)
    - Chapter 7 multiscale BvM

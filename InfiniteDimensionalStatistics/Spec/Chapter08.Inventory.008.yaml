  title: Testing-rate characterisation for two-class L∞ confidence sets
  statement: An honest confidence set adapting at the optimal smooth-class L∞ estimation rate over Σ(s)∪Σ̃(r,ρ_n)
    exists exactly when ρ_n is at least a constant multiple of the minimax testing rate for H₀:f∈Σ(s) versus H₁:f∈Σ̃(r,ρ_n),
    namely r_n(r).

- id: ch8.theorem_8_3_2
  kind: theorem
  book:
    number: Theorem 8.3.2
    pages:
    - 631
    section: 8.3.1
    equations:
    - '8.3'
  title: Sharp separation for adaptive confidence bands
  statement: (a) If for every α,α′>0, a confidence set satisfies (8.39)–(8.41) for some ρ_n and any smooth-class
    radius r_n=o(r_n(r)), then necessarily liminf_n ρ_n/r_n(r)>0. (b) If ρ_n≥c r_n(r) for a sufficiently large c
    eventually, then for every α,α′>0 there exists such a confidence set with r_n=(n/log n)^{-s/(2s+1)}.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - white-noise model
    - known B
    - 0<r<s
    implicit:
    - All asymptotic criteria use the exact displayed quantifier order.
  quantifier_order:
  - 'Lower: quantify α,α′,sub-rate and C_n before the necessary liminf'
  - 'Upper: choose sufficiently large c, then for every α,α′ construct C_n'
  constants:
  - c depends on r,s,B and error levels through the construction.
  dependencies:
    earlier_book:
    - Theorem 6.2.11(b)
    - Proposition 6.2.13
    chapter_local:
    - ch8.separated_coverage_8_39
    - ch8.separated_diameters_8_40_41
    - ch8.holder_rate_notation
    later_book_uses:
    - ch8.theorem_8_3_4
    - ch8.proposition_8_3_6
    - ch8.proposition_8_3_7

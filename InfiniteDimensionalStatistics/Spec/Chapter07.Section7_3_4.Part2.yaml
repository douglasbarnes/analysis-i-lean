- id: ch7.thm.7.3.20
  kind: theorem
  book:
    number: Theorem 7.3.20
    pages:
    - 597
    - 598
    - 599
    section: 7.3.4
    equations: []
  title: Weak Bernstein–von Mises theorem in multiscale space
  statement: "In the wavelet case let σ_l=2^{-l(α+1/2)}, α>0. Assume φ is continuous,\nsatisfies Condition 7.3.11 and a sub-Gaussian tail bound. For every admissible\nweight sequence w, the shifted posterior τ_Y(f)=√n(f-Y) satisfies\n  β_{M₀(w)}(Π(·|Y)∘τ_Y^{-1},N)→0\nin P^Y_{f₀}-probability. The posterior mean also obeys\n  ||f̄ₙ-Y||_{M₀(w)}=o_P(n^{-1/2})\nvia Exercise 7.3.8."
  hypotheses:
    explicit:
    - Wavelet basis.
    - α>0.
    - Scale sequence as displayed.
    - Base density φ continuous, Condition 7.3.11, and sub-Gaussian.
    - w admissible as in Chapter 5.
    implicit:
    - White noise is a tight Borel random element in M₀(w).
  quantifier_order:
  - ∀ admissible w, convergence as n→∞.
  constants: []
  dependencies:
    earlier_book:
    - §5.2.2 multiscale spaces
    - Theorem 4.4.4(b)
    - Theorem 2.1.20(a)

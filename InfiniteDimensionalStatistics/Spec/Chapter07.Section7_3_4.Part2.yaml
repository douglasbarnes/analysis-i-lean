- id: ch7.thm.7.3.19
  kind: theorem
  book:
    number: Theorem 7.3.19 (officially corrected)
    pages:
    - 595
    - 596
    - 597
    section: 7.3.4
    equations: []
  title: Weak Bernstein–von Mises theorem in H(δ)
  statement: "Assume Condition 7.3.11 and that φ is continuous at every normalised true\ncoefficient f_{0,lk}/σ_l as required in the coordinate argument. Let δ>1/2.\nFor τ_Y(f)=√n(f-Y),\n  β_{H(δ)}( Π(·|Y)∘τ_Y^{-1}, N )→0\nin P^Y_{f₀}-probability, where N is the white-noise Gaussian law on H(δ).\nMoreover the proof yields\n  ||f̄ₙ-Y||_{H(δ)}=o_{P^Y_{f₀}}(n^{-1/2})\nafter the moment argument delegated to Exercise 7.3.8."
  hypotheses:
    explicit:
    - Condition 7.3.11.
    - Continuity of the coefficient density at the relevant truth coordinates.
    - δ>1/2.
    - Posterior is viewed as a Borel law on H(δ).
    implicit:
    - β is the bounded-Lipschitz metric.
    - Tightness and finite-dimensional convergence determine weak convergence.
  quantifier_order:
  - As n→∞.
  constants: []
  dependencies:
    earlier_book:
    - Bounded-Lipschitz characterisation of weak convergence
    chapter_local:
    - ch7.thm.7.3.18
    - ch7.thm.7.3.12
    - ch7.def.weightedSobolevBvMSpace
    later_book_uses: []
  proof_status:
    delegates_to_exercises:

  title: ε-boundary thickening
  statement: "For a measurable set B in a metric space (S,d) and ε>0, define\n  ∂_ε B = {x∈S : d(x,B)<ε and d(x,Bᶜ)<ε}.\nThis is the set of points within ε of both B and its complement."
  hypotheses:
    explicit:
    - (S,d) is a metric space.
    - B⊆S is measurable.
    - ε>0.
    implicit:
    - Distance to a set is the infimum distance; empty-set conventions must be fixed.
  quantifier_order:
  - For every measurable B and every ε>0.
  constants:
  - ε>0.
  dependencies:
    earlier_book: []
    chapter_local: []
    later_book_uses:
    - ch7.prop.7.3.21
    - ex7.3.7

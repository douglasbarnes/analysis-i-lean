- id: ch5.prop.5_1_21
  kind: proposition
  book:
    number: Proposition 5.1.21
    pages: [414, 417]
    section: 5.1.3*
    equations: ['5.46', '5.47', '5.48', '5.49', '5.50', '5.51']
  title: Uniform Gaussian reduction for maximal kernel-estimator deviations
  statement: Under Conditions (K1)–(K5), for densities f ranging uniformly over 𝒟(α,D,δ,A,L), define the Gaussian process Y_n and the normalised empirical-process class 𝔽_n^f as in the subsection. If A_n→∞ satisfies the displayed coupling-rate restriction (5.50), and A_n(‖Y_n‖_I−B_n) converges to a continuously distributed random variable Z, then, at every x∈ℝ, the distribution of A_n(2^{j_n/2}‖ν_n^f‖_{𝔽_n^f}−B_n) converges to the law of Z uniformly over f∈𝒟.
  source_fidelity:
    transcription_status: central_review_required
    author_corrected_reading: null
  hypotheses:
    explicit:
    - Conditions (K1)–(K5).
    - f∈𝒟(α,D,δ,A,L).
    - The interval I and enlarged neighbourhood are those fixed before the proposition.
    - j_n→∞.
    - A_n→∞ and A_n,B_n satisfy (5.50) and (5.51).
    - The Gaussian maximum A_n(‖Y_n‖_I−B_n) has the stated continuous limiting distribution.
    implicit:
    - The empirical-process class is normalised by √f at the evaluation point.
    - Suprema are countably measurable under the section-continuity hypotheses.
    - Convergence is uniform over the entire density class.
  quantifier_order:
  - Fix the kernel, density-class parameters, interval and resolution sequence.
  - For every continuity point x of the limit distribution, take the supremum over f∈𝒟 and then n→∞.
  constants:
  - A_n,B_n and every constant appearing in (K1)–(K5), (5.50) and (5.51).
  dependencies:
    earlier_book:
    - KMT coupling and Gaussian comparison results from Chapters 2 and 3
    chapter_local:
    - ch5.cond.K1_K5
    - ch5.def.D_class
    later_book_uses:
    - ch5.prop.5_1_22
    - ch5.prop.5_1_23
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: The proof adapts the strong empirical-process coupling to the normalised kernel class.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true

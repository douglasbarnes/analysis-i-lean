- id: ch5.prop.5_1_21
  kind: proposition
  book:
    number: Proposition 5.1.21
    pages:
    - 414
    - 417
    section: 5.1.3*
    equations:
    - '5.46'
    - '5.47'
    - '5.48'
    - '5.49'
    - '5.50'
    - '5.51'
    - '5.52'
    - '5.53'
  title: Uniform Gaussian reduction for maximal kernel-estimator deviations
  statement: Assume (K1)–(K5), fix I=[0,1], f∈𝒟(α,D,δ,A,L), and j_n→∞. Let ν_n^f be the empirical process indexed by the normalised
    kernel class 𝔽_n^f={s↦K(2^{j_n}t,2^{j_n}s)/√f(t):t∈I}; let Y be the centred Gaussian process with covariance ∫K(t,u)K(s,u)du and
    Y_n(t)=Y(2^{j_n}t). If A_n→∞ and the displayed approximation restrictions hold—equivalently A_n times both the empirical-to-Gaussian
    coupling error and the covariance-replacement error tend to zero, in particular A_n=o(2^{αj_n}/√j_n), together with the KMT growth
    restriction (5.50)—and if A_n(‖Y_n‖_I−B_n)⇒Z for a continuously distributed Z, then for every x∈ℝ, sup_{f∈𝒟}|P_f{A_n(2^{j_n/2}‖ν_n^f‖_{𝔽_n^f}−B_n)≤x}−P{Z≤x}|→0.
  source_fidelity:
    transcription_status: verified_by_book_proof_and_primary_source_triangulation
    author_corrected_reading: null
  hypotheses:
    explicit:
    - Conditions (K1)–(K5).
    - f∈𝒟(α,D,δ,A,L).
    - j_n→∞.
    - A_n→∞ and the coupling conditions (5.50)–(5.51).
    - A_n(‖Y_n‖_I−B_n)⇒Z and Z has continuous distribution.
    implicit:
    - ν_n^f and 𝔽_n^f use the exact √f(t) normalisation.
    - Processes use separable versions.
    - All probability bounds are uniform in f.
  quantifier_order:
  - Fix K, the density-class parameters, I and j_n.
  - For every x∈ℝ, take the supremum over f∈𝒟 before the limit n→∞.
  constants:
  - A_n,B_n.
  - All constants in (K1)–(K5) and in the strong approximation.
  dependencies:
    earlier_book:
    - Chapter 2 Gaussian comparison and extrema
    - Chapter 3 KMT-type approximation for VC-type classes
    chapter_local:
    - ch5.cond.K1_K5
    - ch5.def.D_class
    later_book_uses:
    - ch5.prop.5_1_22
    - ch5.prop.5_1_23
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: 'The proof has three stages: KMT coupling, covariance/metric Gaussian comparison, and distribution-function transfer.'
  notes_status:
    discussed_or_extended_in_notes: true
    note_summary: Attributed to Giné–Koltchinskii–Sakhanenko for convolution kernels and adapted to wavelet kernels by Giné–Nickl.
    used_later_in_book: true

- id: ch5.def.D_class
  kind: definition
  book:
    number: 'Equation (5.45): class 𝒟(α,D,δ,A,L)'
    pages:
    - 412
    - 414
    section: 5.1.3*
    equations:
    - '5.45'
  title: Density class for uniform Gaussian approximation
  statement: Fix 0<α≤1, D,L<∞, a compact interval I=[a,b], a neighbourhood radius δ>0 and a lower-bound constant A>0 that are admissible
    in the subsection. Define 𝒟(α,D,δ,A,L) to be the probability densities f on ℝ such that ‖f‖∞≤L, inf_{x∈I^δ} f(x)≥A, and |f(x)−f(y)|≤D|x−y|^α
    for all x,y∈I^δ, where I^δ={x:dist(x,I)≤δ}. For the applications in the book I=[0,1], hence I^δ=[−δ,1+δ].
  source_fidelity:
    transcription_status: verified_by_book_proof_and_primary_source_triangulation
    author_corrected_reading: null
  hypotheses:
    explicit:
    - 0<α≤1.
    - D,L<∞.
    - δ>0 and A>0.
    - I=[a,b] is the fixed compact interval.
    implicit:
    - Every member is measurable, nonnegative and integrates to one.
    - Admissibility means the neighbourhood I^δ is contained in the region on which the positive lower bound and Hölder condition are
      required.
  quantifier_order:
  - Fix α,D,δ,A,L and I.
  - Then quantify over probability densities f satisfying all three uniform bounds.
  constants:
  - α,D,δ,A,L and interval I.
  dependencies:
    earlier_book: []
    chapter_local: []
    later_book_uses:
    - ch5.prop.5_1_21
    - ch5.prop.5_1_22
    - ch5.prop.5_1_23
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: Definition.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      status: not-found
      candidates: []
      exact_equivalent: false
    repository:
      status: not-found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: Set of probability densities with an L∞ bound, a positive lower bound on I^δ and a local Hölder seminorm bound.
    blockers:
    - Reusable local Hölder-seminorm API.
  difficulty: substantial

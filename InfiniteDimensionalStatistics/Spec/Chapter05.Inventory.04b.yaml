- id: ch5.cond.K1_K5
  kind: definition
  book:
    number: Conditions (K1)–(K5)
    pages:
    - 411
    - 414
    section: 5.1.3*
    equations: []
  title: Kernel conditions for Gaussian reduction
  statement: 'Let K : ℝ² → ℝ be measurable. (K1) K is symmetric and bounded, and, for each fixed s, t ↦ K(s,t) is right- or left-continuous.
    (K2) sup_t ‖K(t,·)‖_V < ∞ and K(t,−∞)=0. (K3) |K(x,y)|≤Φ(|x−y|) for a bounded nonincreasing exponentially decreasing Φ. (K4) for
    d(s,t)²=∫(K(t,u)−K(s,u))²du and fixed F₁<0<1<F₂, there are A′,v₁,v₂<∞ such that N(λ[F₁,F₂],d,ε)≤A′λ^{v₂}ε^{−v₁} for λ≥1 and 0<ε≤diam_d(λ[F₁,F₂]).
    (K5) for 𝒦={K(2^j t,2^j·):t∈ℝ,j≥0}, there are Ā,v̄<∞ such that sup_Q N(𝒦,L²(Q),ε)≤(Ā/ε)^{v̄} for 0<ε≤‖K‖∞, uniformly over Borel
    probability measures Q.'
  source_fidelity:
    transcription_status: verified_against_book_and_primary_source
    author_corrected_reading: null
  hypotheses:
    explicit:
    - K is a measurable real-valued kernel on ℝ².
    - F₁<0<1<F₂.
    implicit:
    - Total variation is in the second variable.
    - All Gaussian and empirical-process suprema are taken through separable versions.
  quantifier_order:
  - Fix K and F₁,F₂.
  - Existentially quantify Φ,A′,v₁,v₂,Ā,v̄.
  - Then quantify uniformly over λ,ε and Q as displayed.
  constants:
  - ‖K‖_V=sup_t ‖K(t,·)‖_V.
  - A′,v₁,v₂,Ā,v̄ and Φ.
  dependencies:
    earlier_book:
    - Chapter 2 intrinsic Gaussian pseudometrics and Dudley entropy bounds
    - Chapter 3 covering numbers and VC-type classes
    chapter_local: []
    later_book_uses:
    - ch5.prop.5_1_21
    - ch5.prop.5_1_22
    - ch5.prop.5_1_23
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: Assumption package.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: The post-proof remark weakens exponential envelope decay to a suitable polynomial tail.
    used_later_in_book: true
  equivalents:
    mathlib:
      status: no exact bundled declaration found
      candidates:
      - Mathlib.MeasureTheory.Function.BoundedVariation
      exact_equivalent: false
    repository:
      status: not-found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: Structure bundling symmetry, bounded variation, envelope domination and two entropy estimates.
    blockers:
    - General covering-number and empirical-process entropy APIs.

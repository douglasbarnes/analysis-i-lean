- id: ch5.def.D_class
  kind: definition
  book:
    number: 'Equation (5.45): class 𝒟(α,D,δ,A,L)'
    pages: [412, 414]
    section: 5.1.3*
    equations: ['5.45']
  title: Density class for uniform Gaussian approximation
  statement: Define 𝒟(α,D,δ,A,L) as the book’s class of probability densities subject to the displayed lower and upper pointwise bounds, local α-Hölder regularity on a neighbourhood of [0,1], and the admissibility requirements on δ and A. In particular, every f∈𝒟 satisfies ‖f‖∞≤L and has α-Hölder constant at most D on [−δ,1+δ].
  source_fidelity:
    transcription_status: central_review_required
    author_corrected_reading: null
  hypotheses:
    explicit:
    - 0<α≤1.
    - 0<D,L<∞.
    - δ and A satisfy the book’s admissibility condition.
    implicit:
    - Members of 𝒟 are probability densities on ℝ.
    - The exact role of A in the lower-bound condition must be preserved from (5.45).
  quantifier_order:
  - Fix α,D,δ,A,L.
  - Quantify over all densities satisfying every condition in (5.45).
  constants:
  - α,D,δ,A,L.
  dependencies:
    earlier_book: []
    chapter_local: []
    later_book_uses:

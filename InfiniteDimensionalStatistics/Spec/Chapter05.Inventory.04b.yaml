- id: ch5.cond.K1_K5
  kind: definition
  book:
    number: Conditions (K1)–(K5)
    pages: [411, 414]
    section: 5.1.3*
    equations: []
  title: Kernel conditions for Gaussian reduction
  statement: >-
    Let K : ℝ² → ℝ be measurable. (K1) K is symmetric and bounded, and, for each fixed s, the section t ↦ K(s,t) is either right-continuous or left-continuous. (K2) The total variations of the sections are uniformly bounded, ‖K‖_V := sup_t ‖K(t,·)‖_V < ∞, and K(t,−∞)=0 for every t. (K3) There exists a bounded, nonincreasing, exponentially decreasing function Φ : [0,∞) → [0,∞) such that |K(x,y)|≤Φ(|x−y|). (K4) Fix F₁<0<1<F₂ and define d(s,t)²=∫ℝ(K(t,u)−K(s,u))²du. There exist A′,v₁,v₂<∞ such that, for every λ≥1 and every 0<ε≤diam_d(λ[F₁,F₂]), N(λ[F₁,F₂],d,ε)≤A′λ^{v₂}/ε^{v₁}. (K5) For 𝒦={K(2^j t,2^j·): t∈ℝ, j∈ℕ∪{0}}, there exist finite constants Ā and v̄ such that sup_Q N(𝒦,L²(Q),ε)≤(Ā/ε)^{v̄} for every 0<ε≤‖K‖∞, where Q ranges over all Borel probability measures on ℝ.
  source_fidelity:
    transcription_status: verified_against_primary_source
    author_corrected_reading: null
  hypotheses:
    explicit:
    - K is a measurable real-valued kernel on ℝ².
    - The interval constants satisfy F₁<0<1<F₂.
    implicit:
    - Total variation is taken for the second-variable section on ℝ.
    - Covering numbers use closed balls of the displayed pseudometric.
    - Under (K4), the Gaussian processes used below possess sample-continuous versions by Dudley’s entropy theorem.
  quantifier_order:
  - First fix K and the interval [F₁,F₂].
  - Then existentially quantify the constants A′,v₁,v₂,Ā,v̄ and the envelope Φ.
  - The (K4) estimate is uniform in λ≥1 and qualifying ε.
  - The (K5) estimate is uniform over all Borel probability measures Q and qualifying ε.
  constants:
  - ‖K‖_V=sup_t ‖K(t,·)‖_V.
  - A′,v₁,v₂ in the local metric-entropy estimate.
  - Ā,v̄ in the uniform empirical-process entropy estimate.
  - The envelope Φ is bounded, nonincreasing and exponentially decreasing.
  dependencies:
    earlier_book:
    - Chapter 2 intrinsic Gaussian pseudometrics and Dudley entropy bounds
    - Chapter 3 covering numbers and VC-type empirical-process classes
    chapter_local: []
    later_book_uses:
    - ch5.prop.5_1_21
    - ch5.prop.5_1_22
    - ch5.prop.5_1_23
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: These are assumptions, not a theorem requiring proof.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: The text following Proposition 5.1.21 notes that the exponentially decreasing envelope in (K3) can be weakened to an appropriate polynomial tail for the coupling argument.
    used_later_in_book: true
  equivalents:
    mathlib:
      status: no exact bundled declaration found
      candidates:
      - Mathlib.MeasureTheory.Function.BoundedVariation
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository:
      status: no exact declaration found in targeted search
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: A structure bundling kernel symmetry and boundedness, section variation, envelope domination, local Gaussian metric entropy and uniform L²(Q) entropy.
    blockers:
    - Covering-number and empirical-process entropy APIs at this generality.
    - A reusable bounded-variation norm for all kernel sections.
  difficulty: research-level
  pass: starred
  issues_for_central_review:

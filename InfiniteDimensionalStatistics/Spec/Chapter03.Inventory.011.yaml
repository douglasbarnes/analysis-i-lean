  title: P-Brownian bridge
  statement: A P-bridge G_P indexed by 𝓕 is a centred Gaussian process with covariance E[G_P(f)G_P(g)]=P(fg)−PfPg; its intrinsic
    semimetric is d_P(f,g):=[P(f−g)²−(P(f−g))²]^{1/2}.
  transcription_status: exact-transcription

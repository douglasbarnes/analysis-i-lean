  title: Asymptotic equicontinuity criterion for weak convergence
  statement: A sequence of bounded processes converges in law in ℓ∞(T) to a tight limit iff its finite-dimensional distributions
    converge and it is asymptotically uniformly equicontinuous in outer probability for a semimetric making T totally bounded;
    the theorem states both directions and the suitable-version conclusion.
  transcription_status: exact-transcription

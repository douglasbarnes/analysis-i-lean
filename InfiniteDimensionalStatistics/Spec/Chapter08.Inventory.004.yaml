  statement: Let f̂_n=f_n(j̄_n) with τ>4. For every fixed s,B>0 and every n, sup_{‖f‖_{B^s_{2,∞}}≤B}E_f‖f̂_n−f‖₂≤D·max(1,B)^{1/(2s+1)}n^{-s/(2s+1)},

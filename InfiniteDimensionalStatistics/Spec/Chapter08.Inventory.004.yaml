- id: ch8.lemma_8_2_1
  kind: lemma
  book:
    number: Lemma 8.2.1
    pages:
    - 617
    section: 8.2.1
    equations:
    - '8.2'
  title: Upper-tail control for the L2 Lepski selector
  statement: If f∈B^s_{2,∞}, s>0, and τ≥4, then for every j>j_n^* and n there is C>0 depending only on σ such that
    P_f(j̄_n=j)≤C^{-1}exp(−Cτ2^j), and P_f(j̄_n>j_n^*)≤C^{-1}exp(−Cτ2^{j_n^*}).
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - s>0
    - f∈B^s_{2,∞}
    - τ≥4
    - j>j_n^*
    implicit:
    - The white-noise sequence is separable/measurable and the grid conventions hold.
  quantifier_order:
  - Fix σ
  - There exists C(σ)>0
  - For all n,f,s,τ,j satisfying hypotheses both bounds hold
  constants:
  - C is uniform in n,f,s,τ,j except through σ.
  dependencies:
    earlier_book:

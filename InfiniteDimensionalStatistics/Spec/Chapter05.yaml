acceptance_blockers:
- Exact source transcription remains required for the declarations listed in `blocking_source_transcriptions`.
- The remaining unresolved material is concentrated in Conditions (K1)–(K5), the class 𝒟 and Proposition 5.1.21,
  and the quadratic-functional formulas on pp.439–451.
- Structural validation cannot certify source fidelity for unresolved formulas.
- P2 remains blocked until central review clears every blocking source transcription.

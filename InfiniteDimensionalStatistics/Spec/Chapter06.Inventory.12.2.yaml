  title: Total Variation eq half integral abs density sub
  statement: |-
    Let \(P,Q\) be probability measures dominated by \(\mu\), with densities
    \(p,q\). Prove
    \[
    \|P-Q\|_{\mathrm{TV}}=\frac12\int |p-q|\,d\mu
          =1-\int \min(p,q)\,d\mu.
    \]
    The book's hint takes \(A=\{x:q(x)\ge p(x)\}\) and rewrites
    \(\int|p-q|\,d\mu=2\int_A(q-p)\,d\mu\).
  hypotheses:
    explicit:
    - P and Q are probability measures on a common measurable space.
    - μ is a common dominating measure with densities p=dP/dμ and q=dQ/dμ.
    implicit: []
  quantifier_order:
  - ∀ measurable spaces, ∀ probability measures P,Q, ∀ common dominating μ, the two identities hold.
  constants:
  - ∀ measurable spaces, ∀ probability measures P,Q, ∀ common dominating μ, the two identities hold.
  dependencies:

- id: ch7.def.whiteNoisePosterior
  kind: definition
  book:
    number: (7.82)–(7.86)
    pages:
    - 572
    - 573
    section: '7.3'
    equations:
    - (7.82)
    - (7.83)
    - (7.84)
    - (7.85)
    - (7.86)
  title: Gaussian white-noise likelihood and posterior
  statement: "In dY=f dt+(σ/√n)dW, f∈L²[0,1], the likelihood relative to the zero-signal\
    \ law is\n  exp{(n/σ²)∫ f dY - (n/(2σ²))||f||₂²}.\nFor a prior Π on F⊂L², define\
    \ the posterior by normalising this likelihood:\n  dΠ(f|Y) ∝ exp{(n/σ²)∫ f dY\
    \ - (n/(2σ²))||f||₂²} dΠ(f).\nUnder truth f₀ it can equivalently be centred using\
    \ f-f₀ and the isonormal noise."
  hypotheses:
    explicit:
    - σ>0, n≥1.
    - F⊂L² has a σ-field for which the likelihood is jointly measurable.
    - Prior Π is a probability measure.
    implicit:
    - The stochastic integral is realised on a common measurable white-noise sample
      space.
    - Normalising denominator is finite and positive a.s.
  quantifier_order:
  - ∀ n,σ and prior, define the posterior a.s.

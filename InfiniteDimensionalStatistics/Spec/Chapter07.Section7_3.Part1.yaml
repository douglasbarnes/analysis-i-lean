  title: Dominated Bayesian joint model
  statement: "Let (X,A) be measurable, (F,B) a parameter space, μ σ-finite, Π a prior, and\np_f μ-densities. Under the official correction, (x,f)↦p_f(x) is jointly measurable.\nDefine Q on X×F by\n  dQ(x,f)=p_f(x)dμ(x)dΠ(f)."
  hypotheses:
    explicit:
    - Joint measurability `(x,f)↦p_f(x)`.
    - Each p_f is a probability density.
    - μ σ-finite.
    - Π is a probability measure.
    implicit:
    - Tonelli proves Q is a probability measure.
  quantifier_order:
  - For every such model and prior, define Q.
  constants: []
  dependencies:
    earlier_book:
    - Product measures, kernels
    chapter_local: []

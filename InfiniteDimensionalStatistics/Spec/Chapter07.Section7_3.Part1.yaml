- id: ch7.prop.posteriorConditionalFormulas
  kind: proposition
  book:
    number: (7.77)–(7.79)
    pages:
    - 571
    - 572
    section: '7.3'
    equations:
    - (7.77)
    - (7.78)
    - (7.79)
  title: Conditional sampling law and posterior density
  statement: "Under Q, the conditional law of X given f is p_f dμ. The conditional\
    \ law of f\ngiven X=x has density proportional to p_f(x) with respect to Π:\n\
    \  Π(B|x)= [∫_B p_f(x)dΠ(f)]/[∫_F p_f(x)dΠ(f)]\nfor every B∈B, for the marginal\
    \ law of X-a.e. x."
  hypotheses:
    explicit:
    - Bayesian joint-model hypotheses.
    - The denominator is positive for marginal-X almost every x.
    implicit:
    - A regular conditional distribution exists; the book's general measurable-space
      formulation may require Standard Borel/countable-generation hypotheses not printed.
  quantifier_order:
  - ∀ B∈B, equality almost surely in x.
  constants: []

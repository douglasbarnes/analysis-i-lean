- id: ch7.def.iidPosterior
  kind: definition
  book:
    number: (7.80)–(7.81)
    pages:
    - 572
    section: '7.3'
    equations:
    - (7.80)
    - (7.81)
  title: Posterior in the i.i.d. density model
  statement: "For a prior Π on a density class P and observations X₁,…,Xₙ,\n  dΠ(p|X₁,…,Xₙ)\n\
    \    = [∏_{i=1}^n p(X_i) dΠ(p)]/[∫_P ∏_{i=1}^n q(X_i)dΠ(q)].\nUnder truth p₀,\
    \ the same ratio may be written using ∏ p(X_i)/p₀(X_i)."
  hypotheses:
    explicit:
    - Joint measurability of sample and density parameter.
    - The marginal likelihood denominator is positive a.s.
    implicit:
    - The two displayed expressions agree where the p₀ likelihood is nonzero.
  quantifier_order:
  - ∀ n and almost every sample.

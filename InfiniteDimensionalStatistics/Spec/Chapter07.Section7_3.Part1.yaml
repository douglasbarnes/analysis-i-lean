- id: ch7.prop.posteriorConditionalFormulas
  kind: proposition
  book:
    number: (7.77)–(7.79)
    pages:
    - 571
    - 572
    section: '7.3'
    equations:
    - (7.77)
    - (7.78)
    - (7.79)
  title: Conditional sampling law and posterior density
  statement: "Under Q, the conditional law of X given f is p_f dμ. Put m(x)=∫_F p_f(x)dΠ(f). On {m>0}, define the posterior\
    \ kernel by\n  κ(x,B)= [∫_B p_f(x)dΠ(f)]/m(x).\nOn {m=0}, set κ(x,·)=Π; this branch is null for the marginal law of X.\
    \ Then κ is a probability kernel and is a conditional law of f given X=x; in particular, for every B∈B,\n  Π(B|x)= [∫_B\
    \ p_f(x)dΠ(f)]/[∫_F p_f(x)dΠ(f)]\nfor the marginal law of X-almost every x."
  hypotheses:
    explicit:
    - The jointly measurable dominated Bayesian model (7.76).
    - The marginal density m(x)=∫_F p_f(x)dΠ(f) is positive for the marginal law of X-almost every x.
    implicit:
    - Joint measurability and Tonelli imply measurability of x↦∫_B p_f(x)dΠ(f) for every measurable B.
    - The displayed normalised integrals construct the conditional kernel directly and satisfy the defining integral identity;
      an abstract Standard-Borel disintegration theorem is not required.
  quantifier_order:
  - Construct one kernel κ; then for every measurable parameter set B, the ratio formula holds for marginal-X almost every
    x.
  constants: []

  title: Conditional sampling law and posterior density
  statement: "Under Q, the conditional law of X given f is p_f dμ. The conditional law of f\ngiven X=x has density proportional to p_f(x) with respect to Π:\n  Π(B|x)= [∫_B p_f(x)dΠ(f)]/[∫_F p_f(x)dΠ(f)]\nfor every B∈B, for the marginal law of X-a.e. x."
  hypotheses:
    explicit:
    - Bayesian joint-model hypotheses.
    - The denominator is positive for marginal-X almost every x.
    implicit:
    - A regular conditional distribution exists; the book's general measurable-space formulation may require Standard Borel/countable-generation hypotheses not printed.
  quantifier_order:
  - ∀ B∈B, equality almost surely in x.
  constants: []
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.def.bayesianJointModel
    later_book_uses:
    - ch7.def.iidPosterior
    - ch7.def.whiteNoisePosterior
  proof_status:

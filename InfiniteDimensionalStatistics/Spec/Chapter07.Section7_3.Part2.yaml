  title: Scalar normal–normal conjugacy
  statement: "Let f∈ℝ and σ²>0. If Y conditional on f has law N(f,1/n) and f has prior law N(0,σ²), prove that the\
    \ posterior law is\n  f | Y ∼ N((σ²/(σ²+1/n))Y, σ²/(nσ²+1)).\nHint: use equation (7.78)."
  hypotheses:
    explicit:
    - n∈ℕ with n≥1.
    - σ²>0.
    - Y|f∼N(f,1/n) and f∼N(0,σ²).
    implicit:
    - The posterior density is taken with respect to Lebesgue measure on ℝ.
  quantifier_order:
  - For every n≥1 and σ²>0, compute the conditional law for every observed Y outside a null set.
  constants:
  - Posterior mean coefficient σ²/(σ²+1/n).
  - Posterior variance σ²/(nσ²+1).

  title: Bayesian conditional-law identities
  statement: 'Prove equations (7.77) and (7.78) for the joint law Q(dx,df)=p_f(x) μ(dx) Π(df): the conditional law
    of X given f is P_f(dx)=p_f(x) μ(dx), and the conditional law of f given X=x is the posterior kernel with density
    proportional to p_f(x) with respect to Π, for the marginal law of X-almost every x.'
  hypotheses:
    explicit:
    - The jointly measurable dominated Bayesian model (7.76).
    - The conditional distributions in (7.77) and (7.78) are defined on the measurable spaces used by the book.
    implicit:
    - The denominator in the posterior formula is positive for the marginal law of X-almost every x.
    - Existence of regular conditional laws requires the measurable-space hypotheses flagged in the main-text proposition.
  quantifier_order:
  - First condition on f to establish (7.77); then, for every measurable parameter set B, establish (7.78) for marginal-X
    almost every x.

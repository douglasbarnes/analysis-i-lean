  title: Gaussian conjugate posterior calculation
  statement: 'Derive the coordinatewise Gaussian posterior formula (7.115) and the

    random-series representation (7.116) from the Gaussian product prior

    (7.114) and sequence observation model (7.109), by completing the square

    independently in each coordinate.'
  hypotheses:
    explicit:
    - Independent Gaussian prior coefficients.
    - Independent Gaussian observation noise.
    - The coefficient variances are positive.
    implicit:
    - The infinite product posterior defines a Borel probability law on the intended
      function/sequence space.
  quantifier_order:
  - For every coordinate; then identify the infinite product law.

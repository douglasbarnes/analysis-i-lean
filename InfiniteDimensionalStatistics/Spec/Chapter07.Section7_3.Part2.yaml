  title: Proof of Lemma 7.3.8
  statement: 'Prove Lemma 7.3.8 (the book also refers to van der Vaart and van Zanten (2008)). For a=||v-w||∞, establish:

    (a) h(p_v,p_w) ≤ a exp(a/2);

    (b) -∫ log(p_v/p_w) p_w dμ ≤ a² exp(a)(1+a);

    (c) ∫ [log(p/p₀)]² p₀ dμ ≤ a² exp(a)(1+a)², with the printed aliases p=p_v and p₀=p_w.'
  hypotheses:
    explicit:
    - v and w are measurable real-valued functions and p_v,p_w are defined by (7.107).
    - The normalising integrals for p_v and p_w are finite and positive.
    implicit:
    - The extended-real interpretation covers a=∞; the substantive bound is for a<∞.
    - The notation switch in part (c) is preserved explicitly rather than silently normalised.
  quantifier_order:
  - For every admissible pair v,w, prove parts (a), (b) and (c) in order.
  constants:
  - Exact exponential factor exp(a/2) in part (a).
  - Exact factor a² exp(a)(1+a) in part (b).
  - Exact factor a² exp(a)(1+a)² in part (c).
  dependencies:
    earlier_book:
    - Inequalities for exponential and logarithmic functions
    chapter_local:
    - ch7.def.normalisedExponentialDensity
    - ch7.def.hellinger

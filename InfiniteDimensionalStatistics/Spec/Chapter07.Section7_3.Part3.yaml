  title: Sobolev-weighted posterior second-moment summation
  statement: 'Extend the coordinate posterior second-moment estimates from Theorem

    7.3.12/Corollary 7.3.13 to the weighted negative Sobolev norm H(δ), proving

    the tail/moment estimates required for tightness and the posterior-mean

    bound in the proof of Theorem 7.3.19.'
  hypotheses:
    explicit:
    - Condition 7.3.11 and the weighted space H(δ).
    - δ>1/2 under the official correction.
    implicit:
    - The exact exercise may formulate a more general Sobolev-risk result; this statement
      records only the reusable consequence explicitly cited in the main text.
  quantifier_order:
  - Sum the coordinate bounds uniformly in n, then let the projection cutoff tend
    to infinity.

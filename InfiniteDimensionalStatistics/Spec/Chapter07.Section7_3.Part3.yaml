  title: Posterior contraction in intermediate Sobolev norms
  statement: "Under the conditions of Corollary 7.3.13, prove that for every 0<s<γ the posterior contracts about\
    \ f₀ in the H₂^s norm at rate n^{-(γ-s)/(2γ+1)}. Precisely, for a sufficiently large fixed M,\n  Π(f : ||f-f₀||_{H₂^s}\
    \ > M n^{-(γ-s)/(2γ+1)} | Y) → 0\nin P^Y_{f₀}-probability."
  hypotheses:
    explicit:
    - All hypotheses of Corollary 7.3.13.
    - 0<s<γ.
    implicit:
    - H₂^s is the Sobolev space and norm used in the product-prior sequence model.
    - The contraction conclusion uses the same sampling law and posterior-probability convention as Corollary 7.3.13.
  quantifier_order:
  - For every fixed s with 0<s<γ, there exists a sufficiently large fixed M such that the posterior-probability
    convergence holds as n→∞.
  constants:
  - Smoothness-loss exponent (γ-s)/(2γ+1).
  - A sufficiently large fixed contraction constant M.

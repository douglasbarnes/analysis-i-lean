  title: Moment convergence for the posterior mean
  statement: "Prove equations (7.127) and (7.131). In the H(δ) and M₀(w) Bernstein–von Mises settings, respectively,\
    \ upgrade the weak posterior convergence to convergence of first moments and deduce\n  ||f̄_n-Y||_{H(δ)}=o_P(n^{-1/2})\n\
    and\n  ||f̄_n-Y||_{M₀(w)}=o_P(n^{-1/2}).\nThe printed hint reduces to almost-sure weak convergence as in the\
    \ proof of Corollary 7.3.22."
  hypotheses:
    explicit:
    - The hypotheses and posterior moment/tail bounds used in Theorems 7.3.19 and 7.3.20.
    implicit:
    - The identity map is Bochner integrable under the posterior laws.
    - Uniform integrability is required in addition to weak convergence.
  quantifier_order:
  - Treat the H(δ) conclusion (7.127), then the M₀(w) conclusion (7.131), each as n→∞.

  title: Contiguity in the finite-dimensional BvM argument
  statement: Let A_n be measurable events in the finite-dimensional setting of (7.124). If P_C^Y(A_n)→0, prove that
    P^{WV}(A_n)→0. Equivalently, prove that P^{WV} is contiguous with respect to P_C^Y.
  hypotheses:
    explicit:
    - The finite-dimensional Gaussian-shift measures P_C^Y and P^{WV} are those defined around equation (7.124).
    - A_n is measurable for every n.
    - P_C^Y(A_n)→0.
    implicit:
    - The finite-dimensional dimension is fixed as n→∞.
    - The likelihood-ratio lower bound/uniform-integrability argument in the book's hint applies on the relevant
      compact set C.

  title: Contiguity for finite-dimensional tilted posterior laws
  statement: 'Prove the finite-dimensional contiguity/change-of-measure step invoked in

    Theorem 7.3.18 for the tilted law displayed around (7.124), so that

    convergence established under the reference finite-dimensional Gaussian

    law transfers to the data-dependent posterior shift.'
  hypotheses:
    explicit:
    - Condition 7.3.17 on the prior density over every fixed finite-dimensional projection.
    - The finite-dimensional Gaussian likelihood shift.
    implicit:
    - The dimension is fixed as n→∞ and likelihood ratios are uniformly integrable.
  quantifier_order:
  - For each fixed finite-dimensional V, prove contiguity as n→∞.

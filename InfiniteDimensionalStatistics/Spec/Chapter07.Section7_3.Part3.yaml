  title: Uniform integrability and posterior-mean convergence under weak BvM
  statement: "Supply the uniform-integrability argument omitted after Theorems 7.3.19\n\
    and 7.3.20. Upgrade weak convergence of the shifted posterior laws to\nconvergence\
    \ of the relevant Bochner first moments, obtaining (7.127) and\n(7.131), in particular\n\
    \  ||f̄ₙ-Y||_{H(δ)}=o_P(n^{-1/2})\nand\n  ||f̄ₙ-Y||_{M₀(w)}=o_P(n^{-1/2}).\nRecord\
    \ the corresponding consequence used for posterior-mean-centred\ncredible sets\
    \ in Theorem 7.3.23."
  hypotheses:
    explicit:
    - The hypotheses and posterior moment/tail estimates proved in Theorem 7.3.19
      or 7.3.20.
    implicit:
    - Bochner integrability of the identity map under each posterior.
    - Weak convergence alone is insufficient; a uniform-integrability/tight-tail estimate
      is essential.
  quantifier_order:
  - For each of the two BvM spaces, prove moment convergence as n→∞.

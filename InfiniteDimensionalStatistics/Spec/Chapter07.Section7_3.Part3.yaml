  title: Uniform Portmanteau theorem for regular-boundary classes
  statement: "Prove Proposition 7.3.21: weak convergence μₙ⇒μ and\n  lim_{ε↓0} sup_{B∈𝒜} μ(∂_εB)=0\nimply\n  sup_{B∈𝒜}|μₙ(B)-μ(B)|→0.\nUse open/closed ε-enlargements and the standard Portmanteau inequalities."
  hypotheses:
    explicit:
    - The hypotheses of Proposition 7.3.21.
    implicit:
    - Uniformity follows by applying Portmanteau to common ε-thickenings rather than setwise to each B.
  quantifier_order:
  - First fix ε; take n→∞; then let ε↓0.
  constants: []
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.def.boundaryThickening

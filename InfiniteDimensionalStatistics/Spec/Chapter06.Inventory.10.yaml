- id: 6.4.sample_split_risk
  kind: definition
  book:
    number: Equation (6.131)
    pages:
    - 530
    - 531
    section: 6.4.2
    equations: []
  title: Sample Split Projected Risk UStat
  statement: "For a sample of size \\(2n\\), split the indices into independent halves\n\\(S_1,S_2\\) of size \\(n\\). Let\
    \ \\(\\tilde f_n\\) be based only on \\(S_1\\). For a\nwavelet projection \\(K_j\\), define\n\\[\n U_n(\\tilde f_n)=\\\
    frac{2}{n(n-1)}\n \\sum_{\\substack{i<i'\\\\i,i'\\in S_2}}\n \\sum_{l\\le j-1,k}\n \\big(\\psi_{lk}(X_i)-\\langle\\psi_{lk},\\\
    tilde f_n\\rangle\\big)\n \\big(\\psi_{lk}(X_{i'})-\\langle\\psi_{lk},\\tilde f_n\\rangle\\big). \\tag{6.131}\n\\]\nConditionally\
    \ on the first half,\n\\[\n E_f^{(2)}U_n(\\tilde f_n)=\\|K_j(f-\\tilde f_n)\\|_2^2.\n\\]"
  hypotheses:
    explicit:
    - The wavelet basis is orthonormal on [0,1] and the sum includes all scaling/wavelet coordinates in the range of K_j.
    - The preliminary estimator is measurable with respect to S1 and square integrable.
    - The density and basis functions give finite second moments.
    implicit: []
  quantifier_order:
  - For every first-half realisation and candidate density f, the conditional expectation over S2 equals the projected squared
    L2 error.
  constants:
  - For every first-half realisation and candidate density f, the conditional expectation over S2 equals the projected squared
    L2 error.
  dependencies:
    earlier_book:
    - sample splitting
    - canonical U-statistics
    - wavelet projection Parseval identity
    chapter_local: []
    later_book_uses:
    - Theorem 6.4.6

    chapter_local:
    - 6.4.1
    - 6.4.rademacher_radius
    - 6.4.4
    later_book_uses:
    - Section 8.3 discussion of unknown smoothness/radius
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: true
    comment: The text incorrectly points to Exercise 6.3.2 in the preceding paragraph; the proof itself is given immediately
      after the corollary.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

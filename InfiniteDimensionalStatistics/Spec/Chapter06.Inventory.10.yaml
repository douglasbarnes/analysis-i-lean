  title: Kernel Estimator deviation le rademacher Radius
  statement: "Under the kernel-density assumptions above, if\n\\(X_1,\\ldots,X_n\\) are i.i.d. from \\(f\\in L^\\infty(\\\
    mathbb R^d)\\), then for\nevery \\(n\\ge1\\), \\(h>0\\), \\(z>0\\),\n\\[\n P_f^N\\!\\left\\{\\sup_{x\\in\\mathbb R^d}\n\
    \ |f_n(h,x)-E_ff_n(h,x)|\\ge\\sigma_R(n,h,z)\\right\\}\\le2e^{-z}.\n\\]\nMoreover,\n\\[\n 2E_f\\sigma_R(n,h,z)\n \\le\
    \ C\\left[\n \\sqrt{\\frac{\\log(1/h)}{nh^d}}+\n \\frac{\\log(1/h)}{nh^d}\\right],\n\\]\nfor a constant \\(C\\) depending\
    \ only on \\(U,K,z,d\\)."
  hypotheses:
    explicit:
    - All assumptions in the construction (6.125)-(6.127) hold.
    - U≥||f||∞.
    - The expectation bound is read in the regime where log(1/h) is nonnegative; the book states it for all h>0 without discussing
      h>1.
    implicit: []
  quantifier_order:
  - ∀n≥1,h>0,z>0 the tail bound holds; ∃C=C(U,K,z,d) uniform in n,h,f for the expected-radius bound.
  constants:
  - ∀n≥1,h>0,z>0 the tail bound holds; ∃C=C(U,K,z,d) uniform in n,h,f for the expected-radius bound.

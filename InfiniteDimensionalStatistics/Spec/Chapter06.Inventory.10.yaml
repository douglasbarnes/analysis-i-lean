- id: 6.4.5
  kind: corollary
  book:
    number: Corollary 6.4.5
    pages:
    - 529
    - 530
    section: 6.4.2
    equations: []
  title: Besov Density kernel Confidence Band
  statement: "Let \\(X_1,\\ldots,X_n\\) be i.i.d. from a density\n\\[\n f\\in F=\\{f:\\|f\\|_{B^r_{\\infty\\infty}(\\mathbb\
    \ R^d)}\\le B\\}.\n\\]\nChoose\n\\[\n \\bar h_n\\asymp(n/\\log n)^{-1/(2r+d)},\\qquad\n h_n=\\bar h_nu_n,\\qquad u_n\\\
    to0,\n\\]\ntake \\(z_\\alpha\\) so that \\(2e^{-z_\\alpha}=\\alpha\\), and use a kernel of order\n\\(r\\). Then the band\
    \ (6.127) with \\(h=h_n,z=z_\\alpha\\) satisfies\n\\[\n \\inf_{f\\in F}P_f^Y\\{f\\in\\bar C_n\\}\\ge1-\\alpha+e_n,\\qquad\
    \ e_n=o(1).\n \\tag{6.129}\n\\]\nThe 2016 hardback prints\n\\[\n |\\bar C_n|_\\infty\n =O_P\\!\\left((\\log n/n)^{r/(2r+d)}\\\
    sqrt{u_n}\\right) \\tag{6.130-hardback}\n\\]\nuniformly in \\(F\\). The official errata replaces \\(\\sqrt{u_n}\\) by\n\
    \\(u_n^{-\\gamma}\\) for some \\(\\gamma>0\\)."
  hypotheses:
    explicit:
    - B,r,d>0 and the class consists of probability densities.
    - The density is uniformly bounded as required by Proposition 6.4.4; this follows from the Besov bound only under the
      relevant embedding/definition assumptions.
    - The kernel has order r and satisfies all conditions of Proposition 6.4.4.
    - u_n is positive and tends to zero.
    implicit: []
  quantifier_order:
  - For each 0<α<1 choose z_α; uniformly for f∈F, coverage is asymptotically at least 1-α and the corrected near-minimax diameter
    bound holds for some γ>0.
  constants:
  - For each 0<α<1 choose z_α; uniformly for f∈F, coverage is asymptotically at least 1-α and the corrected near-minimax diameter
    bound holds for some γ>0.
  dependencies:
    earlier_book:

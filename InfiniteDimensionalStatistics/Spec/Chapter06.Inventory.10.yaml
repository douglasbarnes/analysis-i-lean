- id: 6.4.7
  kind: corollary
  book:
    number: Corollary 6.4.7
    pages:
    - 532
    - 533
    section: 6.4.2
    equations: []
  title: Besov Density l2 minimax Confidence Set
  statement: "Let\n\\[\n F=\\left\\{f:\\max\\left(\\|f\\|_\\infty,\\|f\\|_{B^r_{2\\infty}([0,1])}\\right)\\le B\\right\\}\n\
    \\]\nbe a class of probability densities. Let \\(\\tilde f_n=f_n(\\bar j_n,\\cdot)\\) be the preliminary wavelet estimator,\
    \ where\n\\[\n 2^{\\bar j_n}\\asymp n^{1/(2r+1)}.\n\\]\nUse \\(\\tau_n(f)\\), \\(U_n(\\tilde f_n)\\), and \\(C_n\\) from\
    \ Theorem 6.4.6 with a resolution \\(j=j_n\\ge\\bar j_n\\) such that\n\\[\n 2^{j_n}\\asymp n^{1/(2r+1/2)},\\qquad\n B(j_n)=d(\\\
    log n)\\,2^{-2j_nr}\n\\]\nfor some \\(d>0\\). Then, for all \\(n\\ge n_0(B,d)\\),\n\\[\n \\inf_{f\\in F}P_f^N\\{f\\in\
    \ C_n\\}\\ge1-\\alpha. \\tag{6.136}\n\\]\nIf \\(|C_n|_2\\) denotes the \\(L^2\\)-diameter, then for every \\(\\alpha'>0\\\
    ) there exists \\(L>0\\) such that, for every \\(n\\in\\mathbb N\\),\n\\[\n \\sup_{f\\in F}P_f^N\\{|C_n|_2\\ge L n^{-r/(2r+1)}\\\
    }\\le\\alpha'. \\tag{6.137}\n\\]\nThus \\(C_n\\) is a minimax \\(L^2\\)-confidence set in the sense of Definition 6.4.2."
  hypotheses:
    explicit:
    - r>0, B>0, and d>0.
    - Every f∈F is a probability density and satisfies the displayed L∞ and Besov bounds.
    - The preliminary estimator is the wavelet projection estimator at resolution bar jₙ.
    - The two resolutions satisfy the displayed asymptotic comparisons and jₙ≥bar jₙ.
    - The confidence set and variance proxy are exactly those of Theorem 6.4.6.
    implicit: []
  quantifier_order:
  - Fix r,B,d and α. There exists n₀(B,d) such that coverage holds for every n≥n₀. Separately, for every α′>0 there exists
    L>0 such that the diameter bound holds for every n.
  constants:
  - Fix r,B,d and α. There exists n₀(B,d) such that coverage holds for every n≥n₀. Separately, for every α′>0 there exists

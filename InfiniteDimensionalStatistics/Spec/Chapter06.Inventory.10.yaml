- id: 6.4.6
  kind: theorem
  book:
    number: Theorem 6.4.6
    pages:
    - 531
    - 532
    section: 6.4.2
    equations: []
  title: Sample Split Risk Confidence Set coverage
  statement: "Let \\(X_1,\\ldots,X_{2n}\\) be i.i.d. observations on \\([0,1]\\) from a probability density \\(f\\in L^2([0,1])\\\
    ). Let \\(\\tilde f_n\\in L^2([0,1])\\) be a preliminary estimator based on the first subsample \\(S_1=\\{X_1,\\ldots,X_n\\\
    }\\). Let \\(F\\) be a family of probability densities in \\(L^\\infty([0,1])\\) such that\n\\[\n \\sup_{f\\in F}\\|K_j(f-\\\
    tilde f_n)-(f-\\tilde f_n)\\|_2^2\\le B(j).\n\\]\nLet \\(z_\\alpha\\) be a numerical quantile constant and define\n\\\
    [\n \\tau_n^2(f)=\\frac{2^{j+1}\\|f\\|_\\infty^2}{n(n-1)}\n +\\frac{4\\|f\\|_\\infty}{n}\\|K_j(f-\\tilde f_n)\\|_2^2.\n\
    \\]\nWith \\(U_n(\\tilde f_n)\\) as in (6.131), based on the second subsample \\(S_2=\\{X_{n+1},\\ldots,X_{2n}\\}\\),\
    \ define\n\\[\n C_n=\\left\\{f\\in F:\\|f-\\tilde f_n\\|_2\n \\le \\sqrt{z_\\alpha\\tau_n(f)+U_n(\\tilde f_n)+B(j)}\\\
    right\\}. \\tag{6.132}\n\\]\nThen, for every \\(n\\in\\mathbb N\\) for which the statistic is defined and for \\(z_\\\
    alpha\\) sufficiently large,\n\\[\n \\inf_{f\\in F}P_f^N\\{f\\in C_n\\}\\ge 1-\\alpha. \\tag{6.133}\n\\]"
  hypotheses:
    explicit:
    - The full sample has size 2n and is split into the independent halves S₁ and S₂.
    - f is a probability density in L²([0,1]); every candidate in F is also essentially bounded.
    - The preliminary estimator is L²-valued and measurable with respect to S₁.
    - The uniform projection-bias inequality holds for the chosen resolution j.
    - n≥2 is implicitly required by the factor n(n−1) in τₙ² and by the order-two U-statistic.
    - All membership and radius expressions defining Cₙ are measurable.
    implicit: []
  quantifier_order:
  - Fix α and an integer n≥2. Quantify over the class F and every true f∈F after the first-half estimator and resolution j
    are fixed. Choose a numerical z_α sufficiently large, uniformly in f; the displayed coverage lower bound then holds.
  constants:
  - Fix α and an integer n≥2. Quantify over the class F and every true f∈F after the first-half estimator and resolution j
    are fixed. Choose a numerical z_α sufficiently large, uniformly in f; the displayed coverage lower bound then holds.
  dependencies:
    earlier_book:
    - Theorem 3.4.8 / variance bounds for canonical U-statistics
    - wavelet Parseval and approximation bounds
    chapter_local:
    - 6.4.1
    - 6.4.sample_split_risk
    later_book_uses:
    - Corollary 6.4.7
    - Theorem 6.4.8 (white-noise analogue)
    - Section 8.3
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: First formalise an exact variance lemma for the projected-risk U-statistic, then define a candidate-dependent
      random set and apply one-sided Chebyshev plus the projection bias bound.
    blockers: &id004
    - The radius depends on the candidate f through τₙ(f), so measurability of the resulting random subset is a substantive
      obligation.
    - The printed square root requires a nonnegative radicand; the book gives no positive-part convention.

  title: 'Theorem 1.2.1: exact and quantitative comparison'
  statement: Let E_n^(1), E_n^(2), E_n^(3) be respectively the fixed-design regression, white-noise, and Gaussian sequence
    experiments. For every family F of bounded functions and every n, Δ_F(E_n^(2),E_n^(3))=0 and Δ_F(E_n^(1),E_n^(2))≤√(n/σ²)·sup_{f∈F}‖f−π_n(f)‖₂.
  hypotheses:
    explicit:
    - F is a family of bounded functions.
    - π_n is the piecewise-constant interpolant.
    - The L² norm is on [0,1].
    implicit:
    - Functions in F must be measurable/L².
    - The same σ is used in all three models.
    - The Le Cam definition and rigorous sample spaces satisfy the transport/sufficiency arguments.
  quantifier_order:
  - Fix σ>0.
  - For every n∈ℕ with n>0.
  - For every parameter family F of bounded functions on [0,1].
  - Define the three experiments.
  - First conclude exact zero distance between experiments 2 and 3.
  - Then conclude the displayed nonasymptotic upper bound between experiments 1 and 2.
  constants:
  - Leading factor √(n/σ²)=√n/σ.
  - No extra 1/2 in the final bound under the book's L¹ convention.

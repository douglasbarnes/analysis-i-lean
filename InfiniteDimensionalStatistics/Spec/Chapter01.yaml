- id: C1-D001
  kind: definition
  book:
    number: unnumbered
    pages:
    - 1
    section: '1'
    equations: []
  title: Statistical model
  statement: 'A statistical model for an observation Y is a family {P_f : f ∈ F} of probability distributions on a common
    observation space, indexed by a parameter f in a parameter space F.'
  hypotheses:
    explicit:
    - Each P_f is a probability distribution.
    - All P_f describe candidates for the law of the same observation Y.
    implicit:
    - The observation space carries a σ-field.
    - The indexing map f↦P_f is not required to be measurable at this point.
  quantifier_order:
  - Choose a measurable observation space 𝒴.
  - Choose a parameter type/set F.
  - For every f∈F choose a probability measure P_f on 𝒴.
  constants:
  - No numerical constants.
  dependencies:
    earlier_book: []
    chapter_local: []
    later_book_uses:
    - Chapters 5–8 use families of laws indexed by function parameters.
    - Section 1.2.3 packages these families as statistical experiments.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: definition
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

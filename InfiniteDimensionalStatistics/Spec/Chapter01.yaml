    - '1.13'
  title: Common-sample-space L¹ bound for Le Cam distance
  statement: If both experiments have the same complete separable metric sample space 𝒴 and all P_f^(1),P_f^(2) are dominated
    by a common measure μ, then Δ_F(E¹,E²) ≤ sup_{f∈F}∫_𝒴 |dP_f¹/dμ−dP_f²/dμ|dμ, denoted ‖P¹−P²‖_{1,μ,F}.
  hypotheses:
    explicit:
    - Common sample space is complete separable metric.
    - There is one common dominating measure μ.
    implicit:
    - The sample σ-field is Borel.
    - The same decision procedure can be applied in either experiment.
    - The risk proof uses |L|=1.
    - The displayed right side is twice the total-variation convention of C1-D009.
  quantifier_order:
  - For every common parameter f∈F.
  - Assume both laws are absolutely continuous with respect to μ.
  - Take their Radon–Nikodym densities.
  - Integrate the pointwise absolute difference.
  - Take the supremum over f.
  - Bound the symmetric Le Cam distance.
  constants:
  - 'No factor 1/2: this is the full L¹ density distance.'
  dependencies:
    earlier_book: []
    chapter_local:
    - C1-D009
    - C1-D042
    - C1-D043
    later_book_uses:

audit:
  repository: douglasbarnes/analysis-i-lean
  target_branch: main
  mathlib_pin_from_repository: v4.30.0
  audit_method: Source-level repository and mathlib search; no Lean proof or local compilation was performed for this specification
    task.
  repository_reuse_summary:
  - '`IAProbability.ProbabilitySpace`, `ProbabilityDistribution`, `RandomVariable`, expectation, and independence primitives
    are partial inputs.'
  - '`StatisticsCourse.Statistic`, `IsSufficient`, `likelihood`, `IsConfidenceInterval`, `CriticalRegion`, and least-squares
    predicates are partial inputs.'
  - No existing Le Cam distance, statistical-experiment, Gaussian white-noise, or Chapter 1 equivalence library was identified.
  mathlib_reuse_summary:
  - 'Exact CDF infrastructure: `ProbabilityTheory.cdf`, `ProbabilityTheory.cdf_eq_real`, and `MeasureTheory.Measure.cdf_eq_iff`.'
  - Product measures, mapped measures, Radon–Nikodym densities, integrals, measurable equivalences, kernels, and standard-Borel
    disintegration provide primitives.
  - Measure convolution is available in `Mathlib.MeasureTheory.Group.Convolution`.
  - Hölder predicates and seminorms (`HolderWith`, `MemHolder`, `eHolderNorm`, `nnHolderNorm`) partially match F(α,M).
  - Hilbert-basis coefficient isometries provide the functional-analytic core of the sequence representation.
  - No exact Le Cam, isonormal statistical experiment, or full infinite-dimensional Gaussian-shift comparison theorem was
    identified.
  verification_caveat: Candidate declaration names marked partial/likely must be checked in a local checkout at the repository's
    pinned mathlib revision before implementation.

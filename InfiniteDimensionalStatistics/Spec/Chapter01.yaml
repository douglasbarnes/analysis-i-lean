- id: C1-D067
  kind: lemma
  book:
    number: unnumbered
    pages:
    - 12
    section: 1.2.3
    equations: []
  title: Hölder interpolation error rate
  statement: Uniformly for f∈F(α,M), ‖f−π_n(f)‖₂² = Σ_i∫_{(i−1)/n}^{i/n}(f(x)−f(x_i))²dx ≤ M²n^{-2α}, hence it is O(n^{-2α}).
  hypotheses:
    explicit:
    - Uses the Hölder bound from F(α,M).
    implicit:
    - The class bound gives Hölder seminorm at most M because both nonnegative terms sum to at most M.
    - The displayed M²n^{-2α} is a coarse bound; exact integration gives an additional factor 1/(2α+1).
  quantifier_order:
  - Fix 0<α≤1 and M>0.
  - For every f∈F(α,M).
  - For every n>0.
  - On each cell use |f(x)−f(x_i)|≤M|x−x_i|^α≤Mn^{-α}.
  - Integrate and sum.
  constants:
  - Book's bound M²n^{-2α}.
  - Big-O constant depends on M.
  dependencies:
    earlier_book: []
    chapter_local:
    - C1-D049
    - C1-D050
    - C1-D058
    later_book_uses: []

      formula fixes 𝒯 in the preceding paragraph.
    - Randomized decision rules/Markov kernels are not displayed.
    - All suprema and infima are over sets with well-defined extended-real order.
  quantifier_order:
  - 'First directed term: supremum over every decision procedure T² in experiment 2.'
  - Then infimum over every decision procedure T¹ in experiment 1.
  - Then supremum jointly over f∈F and losses L with |L|=1.
  - Take the absolute risk difference.
  - Repeat with 1 and 2 interchanged.
  - Take the maximum of the two directed terms.

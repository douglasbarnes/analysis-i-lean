- id: C1-D007
  kind: definition
  book:
    number: unnumbered
    pages:
    - 2
    section: '1.1'
    equations: []
  title: IID sample and product law
  statement: For independent identically distributed copies X₁,…,X_n with common law P, the joint law is Pⁿ = ⊗_{i=1}^n P
    on (𝒳ⁿ,𝒜ⁿ).
  hypotheses:
    explicit:
    - Independence.
    - Identical distribution with law P.
    implicit:
    - All variables are defined on one probability space.
    - The product measurable space agrees with the measurable structure on `Fin n → 𝒳`.
  quantifier_order:
  - For every n∈ℕ.
  - Choose random variables X_i, i∈Fin n.
  - Assume the family is independent and every X_i has law P.
  - Conclude that the vector law is the finite product of P.
  constants: []
  dependencies:
    earlier_book: []
    chapter_local:
    - C1-D006
    later_book_uses:
    - Chapter 3 empirical processes and later product-measure statistical models.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: standard fact invoked without proof
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      status: partial
      candidates:
      - Measure.pi
      - Measure.prod
      - ProbabilityTheory.iIndepFun
      exact_equivalent: false
      assessment: Mathlib has finite/countable product measures and independence APIs; exact vector-law theorem should be
        located at the pinned revision.
    repository:
      status: partial
      candidates:
      - IAProbability.IndependentRandomVariables
      exact_equivalent: false
      assessment: The repository aliases mutual independence but does not expose this exact product-law declaration.
  likely_lean_representation:
    sketch: Model samples as `Fin n → 𝒳`; use `Measure.pi`/iterated products and a theorem identifying the map law of the
      coordinate vector.
    blockers: []
  difficulty: substantial
  pass: core
  issues_for_central_review: []

central_review_flags:
- id: CRI-01
  location:
    book_page: 7
    book_number: (1.6)
  category: constant_mismatch
  issue: The displayed variance in (1.6) is ‖g‖₂²/n, although model (1.5), model (1.8), and the subsequent proof use noise
    scale σ/√n and hence variance σ²‖g‖₂²/n.
  required_action: Preserve the printed statement in the source field; central review must decide whether the formal theorem
    follows the printed equation or the internally consistent σ² version.
- id: CRI-02
  location:
    book_page: 5
    book_number: unnumbered linear regression display
  category: suspected_typographical_error
  issue: The first coefficient is printed/OCR-extracted as x_{i1}θ_i rather than x_{i1}θ_1.
  required_action: Check the typeset page and approve any correction before formalization.
- id: CRI-03
  location:
    book_page: 5
    book_number: least-squares example
  category: generality
  issue: The text speaks of a unique value θ̂ and a p-dimensional design subspace under p<n alone. Uniqueness and dimension
    p additionally require full column rank of the design matrix.
  required_action: Formalize the minimizer set without rank assumptions, or add an explicitly reviewed full-rank hypothesis.
- id: CRI-04
  location:
    book_page: 5
    book_number: Gaussian-noise motivation
  category: generality
  issue: A single intercept absorbs a common nonzero noise mean, not arbitrary i-dependent means e_i = E ε_i as the wording
    may suggest.
  required_action: Distinguish a common mean from observation-specific systematic errors.
- id: CRI-05
  location:
    book_page: 3
    book_number: (1.1)
  category: implicit_independence
  issue: The text states that the ε_i are independent of the X_i and have law P_ε, but does not explicitly state mutual independence
    or i.i.d. structure of the ε_i. The usual n-fold deconvolution sampling experiment needs those assumptions.
  required_action: Keep the one-observation convolution law separate from any n-observation product-law declaration.
- id: CRI-06
  location:
    book_page: 6
    book_number: (1.4) discussion
  category: typographical
  issue: The phrase 'as n → ∞' is duplicated.
  required_action: No mathematical repair is needed; retain as a transcription note only.
- id: CRI-07
  location:
    book_page: 7
    book_number: (1.5)
  category: terminology
  issue: σ/√n is called both the noise level and a signal-to-noise ratio; dimensionally and conventionally it is a noise scale
    (inverse signal-to-noise factor).
  required_action: Use a neutral Lean name such as noiseScale.
- id: CRI-08
  location:
    book_page: 8
    book_number: (1.10)-(1.11)
  category: mathematical_representation
  issue: White noise on [0,1]^d is described as corresponding to stochastic integrals with respect to d independent one-dimensional
    Brownian motions. The canonical object is an isonormal process on L²([0,1]^d), equivalently a Brownian sheet/orthogonal
    random measure, not merely d independent one-dimensional Brownian motions.
  required_action: Use the isonormal-Hilbert-space formulation unless the prose interpretation is separately clarified.
- id: CRI-09
  location:
    book_page: 9
    book_number: (1.12)
  category: definition_generality
  issue: The displayed Le Cam distance quantifies directly over deterministic decision procedures and all normalized losses.
    Standard formulations use deficiencies via Markov kernels or randomized decision rules and require a fixed decision problem
    or a theorem identifying the formulations.
  required_action: Central review must select the exact formal definition and prove equivalence to the displayed risk formulation
    under stated regularity assumptions.
- id: CRI-10
  location:
    book_page: 10
    book_number: (1.15)
  category: measurability
  issue: Measurability of S and the precise meaning/version of the conditional law of Y^(1) given S(Y^(1)) are not stated.
    The sufficient-statistic argument needs a regular conditional kernel on standard Borel/Polish spaces and parameter-independence
    of a common version.
  required_action: Make the kernel and all measurability hypotheses explicit without changing the intended claim.
- id: CRI-11
  location:
    book_page: 10
    book_number: definition of π_n
  category: uniqueness
  issue: The half-open cells ((i−1)/n,i/n] do not contain 0, so interpolation at x_i and piecewise constancy on those cells
    do not determine π_n(f)(0). The claimed uniqueness on [0,1] is false without a boundary convention or an almost-everywhere
    quotient.
  required_action: Choose an approved convention at 0, or define π_n as an L² equivalence class where the value at 0 is irrelevant.
- id: CRI-12
  location:
    book_page: 12
    book_number: (1.21)-(1.22)
  category: notation
  issue: The displayed drift terms are written as π_n(f)(t) rather than π_n(f)(t)dt in differential notation.
  required_action: Represent the model through its indexed Gaussian linear functionals or through the integrated path, avoiding
    ambiguous differential syntax.
- id: CRI-13
  location:
    book_page: 12
    book_number: proof of Theorem 1.2.1
  category: sample_space
  issue: The proof says the common sample space can be C([0,1]). Raw white noise is not C([0,1])-valued; the integrated observation
    x ↦ ∫₀ˣ f(t)dt + σW(x)/√n is continuous. Section 6.1.1 supplies this rigorous realization.
  required_action: Formalize the integrated path model or a suitable negative-Sobolev/weighted sequence model.
- id: CRI-14
  location:
    book_page: 12
    book_number: (1.23)
  category: notation
  issue: The typeset expression appears to place an external sup_{f∈F} around a norm already subscripted by F. Read literally,
    this is redundant or ill-typed.
  required_action: Use the pointwise L¹ distance followed by one supremum over f, while retaining a source transcription note.
- id: CRI-15
  location:
    book_page: 14
    book_number: Notes on Theorem 1.2.1
  category: threshold_wording
  issue: The theorem assumes α>1/2, while the notes describe the 'necessity of α≥1/2'. The boundary α=1/2 requires separate
    treatment and the literature summary may not match the theorem's strict threshold.
  required_action: Do not encode a boundary theorem without checking the cited result.
- id: CRI-16
  location:
    book_page: 11
    book_number: Theorem 1.2.1
  category: measurability
  issue: The theorem quantifies over any family of bounded functions on [0,1], but the white-noise drift and L² norm require
    measurable functions (or L² equivalence classes). Boundedness alone does not imply measurability.
  required_action: Central review must approve an explicit Borel-measurability or L²-membership hypothesis.
- id: CRI-17
  location:
    book_page: 2
    book_number: bounded-Lipschitz metric
  category: measurability
  issue: The integral requires BL(1) functions to be measurable for 𝒜. Lipschitz continuity gives Borel measurability only
    when 𝒜 contains the Borel σ-field generated by d.
  required_action: State the Borel compatibility of the measurable and metric structures.
- id: CRI-18
  location:
    book_page: 9
    book_number: (1.12)
  category: measurability_integrability
  issue: Measurability of decision procedures and losses, and integrability of L(f,T(Y)), are implicit. The normalization
    |L|=1 gives boundedness but not measurability.
  required_action: Add measurable-space structures and measurable-section hypotheses explicitly.
- id: CRI-19
  location:
    book_page: 3
    book_number: CDF characterization
  category: scope
  issue: The characterization by x ↦ P((−∞,x]) is valid for Borel probability measures on ℝ; the prose should not be generalized
    to arbitrary σ-fields without proof.
  required_action: Use the Borel measurable space on ℝ.
- id: CRI-20
  location:
    book_page: 11
    book_number: Theorem 1.2.1, Hölder consequence
  category: implicit_range
  issue: F(α,M) was defined only for 0<α≤1, whereas the theorem says 'any α>1/2' without repeating α≤1.
  required_action: Retain the inherited range 1/2<α≤1 unless a higher-order Hölder definition is introduced.
- id: CRI-21
  location:
    book_page: 8
    book_number: (1.8)
  category: indexing
  issue: The orthonormal basis is indexed by ℤ. Lean's standard Hilbert basis APIs often use an arbitrary countable type or
    ℕ; an explicit equivalence of index types is representational, not mathematical.
  required_action: Parameterize by a countable index type and record the book's ℤ convention.
- id: CRI-22
  location:
    book_page: 8
    book_number: (1.8) discussion
  category: sample_path
  issue: The statement that the noisy sequence is not ℓ²-valued requires σ>0 and infinitely many independent nondegenerate
    Gaussian coordinates; it is false in the zero-noise or finite-index cases.
  required_action: State all hypotheses if this observation becomes a theorem.
- id: CRI-23
  location:
    book_page: 11
    book_number: (1.18)
  category: source_layout
  issue: The radical/fraction typography is poorly recovered by PDF text extraction. The proof and (1.23) identify the intended
    bound as √(n/σ²)·sup_f ‖f−π_n f‖₂.
  required_action: Verify against the rendered page before treating the transcription as source-exact.

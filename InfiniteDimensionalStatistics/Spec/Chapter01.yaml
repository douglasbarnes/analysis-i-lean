  kind: proposition
  book:
    number: (1.15)
    pages:
    - 10
    section: 1.2.3
    equations:
    - '1.15'
  title: Equivalence by a sufficient statistic
  statement: Let 𝒴₁,𝒴₂ be complete separable metric spaces. If a parameter-independent map S:𝒴₁→𝒴₂ produces Y²=S(Y¹) with
    law P_f² and S(Y¹) is sufficient for Y¹, meaning the conditional law of Y¹ given S(Y¹) is independent of f, then Δ_F(E¹,E²)=0.
  hypotheses:
    explicit:
    - Both sample spaces are complete separable metric.
    - Conditional distribution is parameter-independent.
    implicit:
    - S is measurable.
    - A common version of the regular conditional law exists and is measurable as a Markov kernel.
    - The book describes deterministic decision rules, but reconstructing Y¹ from Y² generally uses randomization.
  quantifier_order:
  - Choose one measurable S independent of f.
  - For every f, under P_f¹ the pushforward S(Y¹) has law P_f².
  - There exists a regular conditional distribution K(y₂,·) of Y¹ given S(Y¹)=y₂ that is the same for every f.
  - Use S forward and K backward as randomizations.
  - Conclude zero distance.
  constants: []
  dependencies:
    earlier_book: []
    chapter_local:
    - C1-D043
    - C1-X001
    later_book_uses:
    - Used in the proof of Theorem 1.2.1.
  proof_status:
    delegates_to_exercises:
    - C1-X001
    contains_omitted_steps: true

  title: P-measurable class
  statement: A class 𝓕 is P-measurable if for every n, every real a₁,…,aₙ,b, the random variable ‖∑_{i=1}^n a_i f(X_i)+bPf‖𝓕
    is measurable for the completion of P^n.
  transcription_status: exact-transcription

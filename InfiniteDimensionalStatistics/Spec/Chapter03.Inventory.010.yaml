  title: Random-entropy characterisation of Glivenko–Cantelli classes
  statement: For a P-measurable, uniformly L¹(P)-bounded class with integrable measurable cover, P-Glivenko–Cantelli is equivalent
    to the vanishing random L¹(P_n) packing/covering entropy and to the finite random-net approximation conditions listed
    in the theorem.
  transcription_status: blocking-page-image-transcription

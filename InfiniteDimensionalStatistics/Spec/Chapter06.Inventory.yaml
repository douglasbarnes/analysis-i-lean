scope:
  purpose: Declaration-level planning specification only; no Lean proofs.
  statement_policy: Printed statements are preserved; official errata and unresolved source issues are explicit.
  pass_policy:
    core: Every declaration in unstarred main text or unstarred notes. Proof difficulty is recorded separately and
      does not change the pass.
    starred: Only declarations explicitly marked with a star in the book. Chapter 6 has no such declarations.
    exercise: Selected exercises that complete an omitted proof, are cited later, or establish a reusable lemma.
audit:
  scope: Full Chapter 6, including all exercises and Section 6.5 notes.
  proofs_written: false
  source_fidelity_policy: Statements are transcribed without silent repair. Where the available text layer is ambiguous,
    the closest recoverable printed/OCR reading is retained and a central-review flag is attached.
  repository_audit:
    repository: douglasbarnes/analysis-i-lean
    branch_audited: main
    result: No exact Chapter 6 declarations were found by repository keyword searches for Kullback, Pinsker, minimax,
      GaussianWhiteNoise, and confidence.
    date: '2026-07-24'
  mathlib_audit:
    result: No exact declarations for Kullback-Leibler divergence, Pinsker's inequality, Cameron-Martin likelihoods,
      minimax testing/estimation rates, or nonparametric confidence sets were found in a bounded current mathlib4
      keyword audit.
    date: '2026-07-24'
    caveat: This is a declaration-name/content audit, not a proof of absence. Standard primitives such as measures,
      Radon-Nikodym derivatives, product measures, Bochner integration, Hilbert spaces, Gaussian variables, conditional
      expectation, and elementary probability inequalities are reusable.
  official_errata:
    source: Richard Nickl, CORRECTIONS for the 2016 hardback, compiled 2020-12-16
    policy: The YAML preserves the hardback/OCR reading in the statement or source-issue field and separately records
      the official correction. No correction is applied silently.
    chapter_6_items:
    - 'p.490: first display should read (1/n)^{r/(2r+1/2)}.'
    - 'p.492: exponents in Theorem 6.2.11 should be r/(2r+1) and r/(2r+1/2).'
    - 'p.507: last display in Corollary 6.2.19 should be 1/n.'
    - 'p.514: factor in (6.104) corrected from sqrt(Mbar)/(1+sqrt(Mbar)) to sqrt(M/3)/(1+sqrt(M)).'
    - 'p.520: proof reference ''By (6.14)'' corrected to ''By (6.16)''.'
    - 'p.530: (6.130) replaces sqrt(u_n) by u_n^{-gamma}, for some gamma>0.'
    - 'p.537: notes exponent denominator corrected from 2r+1+p^{-1} to 2r+1-p^{-1}.'
  resolved_source_transcriptions:
  - id: 6.4.6.source
    resolution: Direct PDF transcription supplied the exact variance proxy, confidence-set formula, and equation
      numbers (6.132)-(6.133).
    resolved_on: '2026-07-25'
  - id: 6.4.7.source
    resolution: Direct PDF transcription supplied both resolution choices, B(j_n), n0(B,d), and the diameter statement.
    resolved_on: '2026-07-25'

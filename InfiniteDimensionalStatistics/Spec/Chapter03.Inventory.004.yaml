- id: convex_distance
  kind: definition
  book:
    number: Unnumbered definitions, pp. 139–140
    pages:
    - 139
    - 140
    section: '3.2'
    equations: []
  title: Hamming, weighted Hamming and convex distance
  statement: For x,y in a product space, d_H(x,y):=∑1_{xᵢ≠yᵢ}; for α with ∑αᵢ²=1, d_α(x,y):=(∑αᵢ²1_{xᵢ≠yᵢ})^{1/2}; for A,
    d_c(x,A):=sup_{‖α‖₂=1}inf_{y∈A}d_α(x,y).
  transcription_status: exact-transcription
  hypotheses:
    explicit:
    - finite product of coordinate spaces and A a subset

  title: Equations (5.26)–(5.27)
  statement: If f and K are m-times differentiable with sufficient integrability, then (E fₙ)^{(m)}=K_h*f^{(m)},
    and the sample derivative is fₙ^{(m)}(x)=(nh^{m+1})⁻¹∑ᵢK^{(m)}((x-Xᵢ)/h).
  source_fidelity: *id001
  hypotheses:

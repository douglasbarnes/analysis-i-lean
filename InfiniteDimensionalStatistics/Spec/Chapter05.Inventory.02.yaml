- id: ch5.thm.5_1_5
  kind: theorem
  book:
    number: Theorem 5.1.5
    pages:
    - 395
    - 399
    section: 5.1.1
    equations: []
  title: Theorem 5.1.5
  statement: Let f be a density in Lp(A), let K satisfy any case of Condition 5.1.1, and let fₙ be (5.3). For 1≤p<2
    in cases (a),(b), assume f,K²,Φ² have a finite moment ∫(1+|t|^s)|·| with s>(2-p)/p. Then for 1≤p<∞ there is
    Lp with E‖fₙ−Efₙ‖p≤Lp√(2^j/n), for all j when p≤2 and for 2^j<n when p>2. If p=∞ and f is bounded, there is
    L∞ with E‖fₙ−Efₙ‖∞≤L∞√(2^j(j+1)/n) whenever 2^j j<n.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - Condition 5.1.1(a),(b),(c), or (d).
    - f is a probability density and belongs to the stated Lp space.
    - Extra weighted integrability for p<2 in cases (a),(b).
    - Resolution restrictions for p>2 and p=∞.
    implicit:
    - Norms are on A.
    - The random suprema are measurable/countably determined.
    - The constants are uniform in n,j but depend on p, f and the kernel data.
  quantifier_order:
  - For each p and fixed model data there exists Lp<∞.
  - For every n and every j satisfying the relevant restriction.
  constants:
  - Lp and L∞ with dependency stated in the theorem.
  dependencies:
    earlier_book:
    - Hoffmann–Jørgensen inequalities
    - VC-type empirical-process moment bound, Corollary 3.5.8
    chapter_local:
    - ch5.eq.5_3
    - ch5.cond.5_1_1

    section: 5.1.1
    equations: []
  title: Remark 5.1.6
  statement: 'The proof of Theorem 5.1.5 gives the following explicit choices of L_p. Under Conditions 5.1.1(a)
    or (b), with Φ=K in case (a): for 1≤p<2, L_p ≤ [2(2−p)/(sp−(2−p))]^(1/p−1/2) ‖Φ²‖_{L¹(μ_s)}^(1/2) ‖f‖_{L¹(μ_s)}^(1/2);
    for 2<p<∞, L_p ≤ (p−1)^(1+1/p) 2^(4+3/p) ‖Φ‖₂ ‖f‖_{p/2}^{1/2} + (p−1)^(1+1/p) 2^(1−2/p) ‖Φ‖_p; for p=2, L_2≤‖Φ‖₂;
    and L_∞≤C(1∨‖f‖_∞)^(1/2), where C is numerical and depends only on K in case (a), and on φ and Φ in case (b).
    Under Conditions 5.1.1(c) or (d), one may take C(φ)(1∨‖f‖_{p/2})^(1/2) for p<∞ and C(1∨‖f‖_∞)^(1/2) for p=∞.'
  source_fidelity:
    transcription_status: verified_with_erratum
    author_corrected_reading: On p.395 in the first display, ν^{1/p} is corrected by the author to ν_p^{1/p}.
  hypotheses:

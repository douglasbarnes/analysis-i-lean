- id: ch5.prop.5_1_7
  kind: proposition
  book:
    number: Proposition 5.1.7
    pages:
    - 399
    - 400
    section: 5.1.1
    equations: []
  title: Proposition 5.1.7
  statement: For an S-regular wavelet projection estimator with S>s, or a convolution estimator with a kernel of
    order S>s, choose the resolution/bandwidth balancing stochastic error and Besov bias. Over a Besov ball of radius
    B, the expected Lp risk is bounded by a constant times n^{-s/(2s+1)} for p<∞, and the expected sup-norm risk
    by a constant times (n/log n)^{-s/(2s+1)}.
  source_fidelity:
    transcription_status: verified_with_erratum
    author_corrected_reading: 'Author erratum: in (5.19) and (5.20) delete the displayed suprema over f; replace
      the prose “if f∈B…” by the explicit hypotheses ‖f‖_{B^s_{p∞}}≤B and ‖f‖_{B^s_{∞∞}}≤B, respectively.'
  hypotheses:
    explicit:
    - s>0 and S>s.
    - f is a density in the appropriate Besov ball.
    - Kernel/wavelet satisfies the assumptions of Theorem 5.1.5 and the Chapter 4 approximation theorem.
    - jₙ or hₙ is chosen at the stated balance.
    implicit:
    - Constants depend only on p,s,S,B and the kernel/basis data.
    - The density and domain restrictions from Condition 5.1.1 remain in force.
  quantifier_order:
  - For every density f satisfying the norm bound.
  - For all n≥1 after choosing the prescribed resolution.
  constants:
  - Besov radius B; approximation constant c; stochastic constant Lp.
  dependencies:
    earlier_book:
    - Proposition 4.3.14 and Besov approximation bounds
    chapter_local:
    - ch5.thm.5_1_5
    later_book_uses:
    - Remark 5.2.6
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Distribution.Sobolev
      - Mathlib.Analysis.FunctionalSpaces.SobolevInequality
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Bias–variance corollary combining an approximation theorem with Theorem 5.1.5; formalise separately
      for finite p and p=∞.

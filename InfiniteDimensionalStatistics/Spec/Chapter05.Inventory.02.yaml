- id: ch5.prop.5_1_2
  kind: proposition
  book:
    number: Proposition 5.1.2
    pages:
    - 393
    - 395
    section: 5.1.1
    equations: []
  title: Proposition 5.1.2
  statement: Under Condition 5.1.1(c) or (d), for the white-noise estimator based on K_j, there is C=C(φ,p) such
    that E‖fₙ−Efₙ‖_p≤Cσ√(2^j/n) for 1≤p<∞, and E‖fₙ−Efₙ‖_∞≤C(φ,∞)σ√(2^j(j+1)/n).
  source_fidelity: *id001
  hypotheses:
    explicit:
    - f∈L²([0,1]).
    - In the periodised case f satisfies the endpoint periodicity convention.
    - Y_f^{(n)} follows (5.5).
    - For boundary wavelets 2^j≥2N.
    - 1≤p≤∞.
    implicit:
    - Norms are Lebesgue Lp norms on the interval.
    - Expectations are finite by Gaussian moment bounds.
  quantifier_order:
  - For each p and admissible basis there exists C.
  - For every n≥1 and admissible j the stated bound holds.
  constants:
  - C(φ,p), σ, boundary N.
  dependencies:
    earlier_book:
    - Gaussian moment equivalence and maximal inequalities from Chapter 2
    chapter_local:
    - ch5.eq.5_6_5_8
    - ch5.eq.5_9_5_11
    later_book_uses:
    - Exercise 5.1.6
    - Exercise 5.1.8
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Moment bounds for a finite-dimensional Gaussian random element in Lp; p=∞ requires a Gaussian maximum
      bound over O(2^j) coefficients.
    blockers:
    - Banach-valued Gaussian integration.
    - Lp norm of finite wavelet series.
  difficulty: major-library
  pass: core
  issues_for_central_review: &id005 []
- id: ch5.lem.5_1_3
  kind: lemma
  book:
    number: Lemma 5.1.3
    pages:
    - 394
    - 395
    section: 5.1.1
    equations: []
  title: Lemma 5.1.3
  statement: Let 0<r<1, t≥0, s>(1-r)/r and dμ_a(x)=(1+|x|)^a dx. If f,k≥0 belong to L¹(μ_{s+t/r}), then for every
    b>0, sup_{0<h≤b}∫(k_h*f)^r(y)(1+|y|)^t dy ≤ C(‖f‖_{L¹(μ_{s+t/r})}‖k‖_{L¹(μ_{s+t/r})})^r, where C=(2(1-r)/(sr-(1-r)))^{1-r}(1∨b)^{sr+t}.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - 0<r<1.
    - t≥0.
    - s>(1-r)/r.
    - b>0.
    - f,k are nonnegative and weighted-integrable.
    implicit:
    - k_h(x)=h⁻¹k(x/h).
  quantifier_order:
  - For all f,k satisfying the hypotheses.
  - For all b>0.
  - Supremum over 0<h≤b.
  constants:
  - Exact C displayed above.
  dependencies:
    earlier_book:
    - Weighted Hölder inequality and convolution algebra
    chapter_local: &id006 []
    later_book_uses:
    - Theorem 5.1.5, case 1≤p<2
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:

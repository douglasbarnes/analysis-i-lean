    - Differentiation under the integral/convolution is justified by the integrability assumptions used in Proposition
      5.1.9.
    implicit:
    - The derivative notation is classical wherever pointwise formulas are asserted.
  quantifier_order:
  - For every integer m≥0 and every x where the derivatives are defined.
  constants:
  - Bandwidth exponent h^{m+1}.
  dependencies:
    earlier_book:

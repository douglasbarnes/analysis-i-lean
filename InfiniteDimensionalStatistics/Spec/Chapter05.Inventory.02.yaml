      - Mathlib.Analysis.Fourier.Convolution
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: A weighted integral inequality over ℝ using ENNReal/Bochner integrals; formulate first for nonnegative
      measurable functions.

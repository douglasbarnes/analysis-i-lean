- id: ch5.rem.5_1_4
  kind: operative_example
  book:
    number: Remark 5.1.4
    pages:
    - 394
    - 395
    section: 5.1.1
    equations: []
  title: Remark 5.1.4
  statement: If K is bounded and has finite p-variation, then the class {K((x-·)/h):x∈ℝ,h>0} is VC type. For 0<ε≤v_p(K)^{1/p}
    and w>6 (w>3 under one-sided continuity), N(𝒦,L²(Q),εv_p(K)^{1/p})≤(A_{w,p}/ε)^{(p∨2)w} for every Borel probability
    Q. Suprema used later are countably measurable by Exercise 5.1.3.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - K bounded.
    - Finite p-variation for p≥1.
    - Required right/left continuity.
    - Q any Borel probability measure.
    implicit:
    - Covering number is for the L²(Q) pseudometric.
  quantifier_order:
  - For every admissible w there exists A_{w,p}.
  - For all Q and all ε in the displayed range.
  constants:
  - A_{w,p}; exponent (p∨2)w; variation v_p(K).
  dependencies:
    earlier_book:
    - Proposition 3.6.12
    chapter_local: *id006
    later_book_uses:

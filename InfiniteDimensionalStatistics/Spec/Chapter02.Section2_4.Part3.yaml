  title: Matching entropy bounds under regular variation
  statement: Under the stated two-sided regular-variation control of log N(T,d_X,1/τ), the Dudley upper and Sudakov lower
    bounds combine to give K^{-1}σ_X√(log N(T,d_X,σ_X))≤E sup_t|X(t)|≤Kσ_X√(log N(T,d_X,σ_X)).
  hypotheses:
    explicit:
    - The metric entropy has the regular-variation comparability described in the surrounding paragraph.
    - σ_X is the natural process scale.

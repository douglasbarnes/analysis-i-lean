    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Independent product prior on basis coefficients
  statement: "Let φ be a probability density on ℝ and σ_l>0 with ∑_{l,k}σ_l²<∞.\nDraw independent coefficients f_{lk}=σ_l ξ_{lk}, ξ_{lk}∼φ, and set\n  f=∑_{l,k} f_{lk}ψ_{lk}.\nEquivalently the coordinate density is φ_{lk}(x)=σ_l^{-1}φ(x/σ_l)."
  hypotheses:
    explicit:
    - The basis is as in Definition 7.3.10.
    - φ is a probability density.
    - Positive scales σ_l.
    - Square-summability over all coordinates when L² support is required.
    implicit:
    - The official erratum deletes the assertion that the displayed scale condition in Condition 7.3.11(a) by itself ensures f∈L² a.s.; support must be proved under adequate moment/summability assumptions.
  quantifier_order:
  - Independently for all coordinates.
  constants: []
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.def.7.3.10
    later_book_uses:
    - ch7.condition.7.3.11
    - ch7.def.uniformWaveletPrior

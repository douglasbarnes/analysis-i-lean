  title: S-regular orthonormal bases
  statement: "An S-regular basis is of one of two types:\n(a) a singly indexed basis\
    \ with singleton Z_l and scale a_l=max(2,|l|), satisfying\n    the stated uniform\
    \ C^S/localisation bounds;\n(b) a wavelet basis with |Z_l|=a_l=2^l and the stated\
    \ S-regularity/localisation bounds."
  hypotheses:
    explicit:
    - S∈ℕ.
    - The basis is orthonormal in L²[0,1].
    - All derivative/localisation bounds printed in the definition hold.
    implicit:
    - The exact low-frequency index set L and boundary-wavelet conventions are inherited
      from Chapter 4.

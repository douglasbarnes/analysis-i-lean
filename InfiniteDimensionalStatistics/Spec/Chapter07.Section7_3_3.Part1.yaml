- id: ch7.condition.7.3.11
  kind: condition
  book:
    number: Condition 7.3.11
    label: Condition 7.3.11
    pages:
    - 583
    - 584
    section: 7.3.3
    equations: []
    section_title: Product Priors in Gaussian Regression
    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Assumptions for product-prior coordinate analysis
  statement: '(a) The prior coefficients are independent with scaled density φ and the scale

    sequence is square-summable in the required coordinate sense.

    (b) For the truth, (P1) sup_{l,k}|f_{0,lk}|/σ_l≤M. For some τ>M, (P2) φ is

    bounded above globally, bounded below by a positive constant on [-τ,τ], and has

    finite second moment.

    The official erratum deletes the text claiming these assumptions automatically

    ensure f∈L² almost surely.'
  hypotheses:
    explicit:
    - Constants M<τ<∞.
    - 0<c_φ≤φ(x)≤C_φ on the specified regions.
    - ∫x²φ(x)dx<∞.
    implicit:
    - The exact indexing multiplicity must be included in the square-summability condition.
  quantifier_order:
  - Uniformly over all l,k.
  constants: []
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.def.productPrior
    later_book_uses:

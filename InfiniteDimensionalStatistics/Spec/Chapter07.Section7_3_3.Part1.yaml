  title: L² posterior contraction and posterior-mean risk for product priors
  statement: "Choose σ_l=|l|^{-1/2-γ} in basis type (a), or σ_l=2^{-l(γ+1/2)} in type (b).\nUnder Theorem 7.3.12,\n  E^Y_{f₀}∫||f-f₀||₂² dΠ(f|Y)=O(n^{-2γ/(2γ+1)}),\nand for the posterior mean f̄ₙ,\n  E^Y_{f₀}||f̄ₙ-f₀||₂²=O(n^{-2γ/(2γ+1)})."
  hypotheses:
    explicit:
    - γ>0.
    - The corresponding basis type and scale sequence.
    - Condition 7.3.11.
    implicit:

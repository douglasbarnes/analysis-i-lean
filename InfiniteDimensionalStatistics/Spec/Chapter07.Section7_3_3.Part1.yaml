  title: Coordinatewise posterior mean-square bound
  statement: "Under Condition 7.3.11 there is C<∞, independent of l,k,n, such that\n\
    \  E^Y_{f₀} ∫(f_{lk}-f_{0,lk})² dΠ(f_{lk}|Y)\n     ≤ C (σ_l² ∧ n^{-1})."
  hypotheses:
    explicit:
    - White-noise sequence model.
    - Condition 7.3.11.
    implicit:
    - Posterior factorises across coordinates.
    - C depends only on the constants in the condition, not on l,k,n.
  quantifier_order:
  - ∃C, ∀l,k,n.

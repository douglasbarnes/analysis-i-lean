  title: Continuous mapping for shifted posteriors
  statement: "If F is continuous from H(δ) or M₀(w) to a metric space S, then under the\ncorresponding BvM theorem,\n  β_S((Π(·|Y)∘τ_Y^{-1})∘F^{-1}, N∘F^{-1})→0\nin P^Y_{f₀}-probability."
  hypotheses:
    explicit:
    - F continuous.
    - Corresponding BvM hypotheses.
    - δ>1/2 in the H(δ) case.
    implicit:
    - Pushforwards are Borel probability measures.
  quantifier_order:
  - For every continuous F.

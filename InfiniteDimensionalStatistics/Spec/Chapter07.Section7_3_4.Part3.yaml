  title: Uniform convergence over classes with uniformly regular boundaries
  statement: "Let μₙ⇒μ on a separable metric space (S,d). For a measurable set B define\n  ∂_εB={x:d(x,B)<ε and d(x,B^c)<ε}.\nIf a class B satisfies\n  lim_{ε↓0} sup_{B∈B} μ(∂_εB)=0,\nthen\n  sup_{B∈B}|μₙ(B)-μ(B)|→0."
  hypotheses:
    explicit:
    - S separable metric.
    - μₙ,μ probability measures.
    - All B in the class are measurable.
    - Uniform boundary condition.
    implicit:
    - The displayed `d(x,B)` convention handles empty sets in the standard way.
  quantifier_order:
  - If μₙ⇒μ and boundary condition, then uniform convergence.

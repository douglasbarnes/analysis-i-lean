  title: Credible sets with Hölder regularity and L∞ diameter
  statement: "In the multiscale wavelet setting, intersect/regularise the credible ball from\nTheorem 7.3.23 with a growing C^γ constraint controlled by a sequence uₙ→∞.\nThe resulting credible set retains asymptotic frequentist coverage 1-α and its\nL∞-diameter satisfies the officially corrected rate\n  |Cₙ|_∞ = O_{P^Y_{f₀}}((n/log n)^{-γ/(2γ+1)} uₙ)."
  hypotheses:
    explicit:
    - The hypotheses and construction immediately preceding the corollary on p.602.
    - f₀ has the stated C^γ regularity.
    - uₙ→∞ at the allowed rate.
    - Multiscale BvM/credible-ball hypotheses.
    implicit:
    - The exact set notation and any additional lower-growth condition on uₙ must be visually verified from the uploaded page before implementation.
  quantifier_order:
  - For the allowed sequence uₙ, coverage and diameter conclusions as n→∞.

  title: Frequentist coverage of Bayesian credible balls
  statement: "Let S=H(δ) with δ>1/2, or S=M(w) with admissible w. Assume the corresponding\nBvM theorem. For 0<α<1 choose Rₙ so that\n  Cₙ={f:||f-Tₙ||_S≤Rₙ/√n},  Π(Cₙ|Y)=1-α,\nwhere Tₙ=Y or the posterior mean f̄ₙ. Then\n  P^Y_{f₀}(f₀∈Cₙ)→1-α,\n  Rₙ→Φ^{-1}(1-α) in P^Y_{f₀}-probability,\nwhere Φ(t)=N({z:||z||_S≤t})."
  hypotheses:
    explicit:
    - 0<α<1.
    - δ>1/2 in the Sobolev case.
    - w admissible in the multiscale case.
    - Rₙ is a measurable posterior quantile.
    - Tₙ is one of the two stated centres.
    implicit:
    - The Gaussian norm distribution Φ is continuous and strictly increasing.
    - For posterior-mean centring, Exercise 7.3.8's `o_P(n^{-1/2})` result is used.
  quantifier_order:
  - For either space/centre, as n→∞.
  constants:
  - Limit radius is the (1-α)-quantile of the Gaussian norm.
  dependencies:
    earlier_book:
    - Exercise 2.4.4
    - Theorem 2.4.5
    - Corollary 2.6.18
    chapter_local:
    - ch7.cor.7.3.22
    - ch7.thm.7.3.19

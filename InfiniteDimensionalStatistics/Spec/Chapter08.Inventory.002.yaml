- id: ch8.test_statistic_8_1_1
  kind: definition
  book:
    number: proof of Theorem 8.1.1
    pages:
    - 609
    section: 8.1.1
    equations:
    - '8.1'
  title: Maximum quadratic projection test
  statement: Let J={1,…,j_max} with 2^{j_max}≍n². For projection estimators f_n(j), define T_n=max_{j∈J}2^{-j/2}|‖f_n(j)‖₂²−2^j/n|
    and reject H₀ when T_n≥L√(log log n)/n.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - n sufficiently large
    - finite dyadic grid J
    - σ² normalised to 1 in the proof
    implicit:
    - The projection estimator and its norm are measurable.
  quantifier_order:
  - Choose j_max
  - Choose L>0
  - Define T_n
  - Define φ_n=1{T_n≥threshold}
  constants:
  - L depends on the desired error α; rescaling is needed for general σ.
  dependencies:
    earlier_book:
    - Projection estimator (6.28)
    - Exercise 3.1.11 or Theorem 3.1.9
    chapter_local:
    - ch8.white_noise_model_8_1
    later_book_uses:
    - ch8.theorem_8_1_1
  proof_status:

  title: Adaptive alternatives for testing uniformity
  statement: For a density f on [0,1], define alternatives by max(‖f‖∞,‖f‖_{B^r_{2,∞}})≤B and ‖f−1‖₂≥ρ_n(r,B), and
    take the union over B>0 and 0<r≤R.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - f≥0 a.e.
    - ∫f=1
    - R>0
    - 0<r≤R
    - B>0
    implicit:
    - The density is represented modulo a.e. equality and the constant density 1 is admissible.
  quantifier_order:
  - Fix R
  - For each n,r,B form the class
  - Take the union
  constants: []
  dependencies:
    earlier_book:
    - Section 6.2.2 testing uniformity
    chapter_local:
    - ch8.adaptive_l2_testing_rate
    later_book_uses:

- id: ch8.theorem_8_1_1
  kind: theorem
  book:
    number: Theorem 8.1.1
    pages:
    - 609
    section: 8.1.1
    equations:
    - '8.1'
  title: Adaptive minimax signal detection in white noise
  statement: (a) For every α>0 there is a measurable test φ_n such that, for all n and C sufficiently large, E₀φ_n+sup_{f
    in the adaptive alternative at ρ_n^*}E_f(1−φ_n)≤α. (b) If ρ_n(r,B)=o(ρ_n^*(r,B)) for every r,B, then liminf_n
    inf_{measurable φ_n}[E₀φ_n+sup_{f in the corresponding adaptive alternative}E_f(1−φ_n)]>0.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - Fixed arbitrary R>0
    - Rate and alternative as recorded above
    implicit:
    - The supremum over an empty alternative is not intended; alternatives are nonempty for relevant n.
  quantifier_order:
  - Fix R
  - 'Upper: for every α choose C₀ and tests; for every C≥C₀ and n bound risk'
  - 'Lower: for every sub-rate family take liminf then infimum over tests'
  constants:
  - Upper constants depend on α,R,σ and the fixed basis; lower positive constant is not quantified numerically.
  dependencies:
    earlier_book:
    - Definition 6.2.1
    - Proposition 6.2.3
    - Theorem 6.2.11(c)
    - Exercise 3.1.11 or Theorem 3.1.9
    chapter_local:
    - ch8.white_noise_model_8_1
    - ch8.l2_adaptive_alternative
    - ch8.adaptive_l2_testing_rate
    - ch8.test_statistic_8_1_1
    later_book_uses:
    - ch8.theorem_8_1_2
    - ch8.theorem_8_3_5
    - ch8.proposition_8_3_6
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''

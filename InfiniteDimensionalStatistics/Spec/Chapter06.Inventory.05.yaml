- id: 6.2.14
  kind: theorem
  book:
    number: Theorem 6.2.14
    pages:
    - 497
    - 500
    section: 6.2.4
    equations: []
  title: Minimum Chi Square Test error bound
  statement: "Let \\(H_0\\subset L^2([0,1])\\) be bounded and\n\\(H_1\\subset\\{f:\\operatorname{dist}_2(f,H_0)\\\
    ge \\rho_n\\}\\).\nLet \\(K_j\\) be the wavelet projection and let \\(B(j)\\downarrow\\) satisfy\n\\[\n\\sup_{f_0\\\
    in H_0,\\ f\\in H_1}\n\\|K_j(f-f_0)-(f-f_0)\\|_2^2\\le B(j).\n\\]\nFor positive constants \\(c,L\\), levels\
    \ \\(j_n\\in\\mathbb N\\), and \\(d_n\\ge1\\), set\n\\[\n\\tau_n=L\\sigma^2 d_n\\,2^{j_n/2}/n,\\qquad\n\\rho_n^2\\\
    ge c\\max\\{L\\sigma^2d_n\\,2^{j_n/2}/n,\\ B(j_n)\\}.\n\\]\nFor the sliced Gaussian classes \\(G_{j_n,m}(H_0,f)\\\
    ), assume\n\\[\n\\sup_{f\\in H_1}\\mathbb E\\|W\\|_{G_{j_n,m}(H_0,f)}\n \\le \\sqrt n\\,2^m/16\n\\quad\\text{for\
    \ every }m\\in\\mathbb Z\\text{ with }2^m\\ge\\rho_n^2/2.\n\\]\nThen \\(L=L(\\psi)>0\\) and \\(c=c(L,\\sigma)>0\\\
    ) can be chosen so that the\nminimum-\\(\\chi^2\\) test \\(\\Phi_n\\) in (6.56) obeys\n\\[\n\\sup_{f\\in H_0}E_f\\\
    Phi_n+\\sup_{f\\in H_1}E_f(1-\\Phi_n)\n \\le c_1\\exp\\!\\left\\{-c_2\\frac{d_n^2}{1+d_n2^{-j_n/2}}\\right\\\
    }\n      +c_3e^{-c_4n\\rho_n^2},\n\\]\nwhere \\(c_i>0\\) depend only on \\(c,L,\\sigma\\)."
  hypotheses:
    explicit:
    - H₀ is a bounded subset of real L²([0,1]).
    - The wavelet basis and projection K_j are fixed and regular enough for the displayed finite-dimensional statistic.
    - The infimum in the test statistic is measurable; Exercise 6.2.2 supplies a sufficient compactness route.
    - The approximation bound is uniform over the ordered pair (f₀,f)∈H₀×H₁.
    - The Gaussian-process expectation bound is uniform in f and required at every dyadic slice above ρₙ²/2.
    implicit: []
  quantifier_order:
  - ∀ bounded H₀, ∀ H₁, ∀ nonincreasing B, ∀ positive sequences/parameters satisfying the bias, separation and entropy
    conditions, ∃ admissible L,c and ∃ c₁,…,c₄>0 such that ∀n the displayed uniform error bound holds.
  constants:
  - ∀ bounded H₀, ∀ H₁, ∀ nonincreasing B, ∀ positive sequences/parameters satisfying the bias, separation and entropy
    conditions, ∃ admissible L,c and ∃ c₁,…,c₄>0 such that ∀n the displayed uniform error bound holds.
  dependencies:
    earlier_book:
    - Theorem 2.3.7 (Dudley bound)
    - Theorem 2.4.12 (Gaussian concentration)
    - Theorem 3.1.9 (centred chi-square concentration)
    - Section 4.2 wavelet projections
    chapter_local:
    - 6.2.infimum_chisq
    - 6.2.3
    later_book_uses:
    - Corollaries 6.2.15 and 6.2.16
    - Proposition 6.2.18
  proof_status:
    delegates_to_exercises:
    - Exercise 6.2.2
    contains_omitted_steps: true
    comment: Existence/measurability of an attaining minimiser is delegated to Exercise 6.2.2.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: A theorem over a finite wavelet coefficient index type and a compact/measurable null set. Package the
      sliced isonormal process classes, entropy hypothesis, projection bias, and `Measure`-expectation error bound.
      The denominator in the first exponent must be checked against the typeset source before formalisation.
    blockers: &id001
    - The OCR-visible first exponential denominator is read as `1 + d_n 2^{-j_n/2}`; verify against the printed
      typesetting.
    reusable_primitives:
    - finite-dimensional centred chi-square statistic
    - Gaussian process slice entropy
  difficulty: research-level
  pass: core
  issues_for_central_review: *id001
- id: 6.2.15
  kind: corollary
  book:
    number: Corollary 6.2.15
    pages:
    - 500
    section: 6.2.4
    equations: []
  title: Minimum Chi Square Test bounded Null error
  statement: 'Under the hypotheses of Theorem 6.2.14, take \(d_n=2^{j_n/2}\) and

    \[

    \rho_n^2\ge c\max\{L\sigma^2 2^{j_n}/n,\ B(j_n)\}.

    \]

    For every \(D>0\), \(L=L(\psi,D)\) and \(c=c(L,\sigma,D)\) can be chosen so that

    \[

    \sup_{H_0}E_f\Phi_n+\sup_{H_1}E_f(1-\Phi_n)\le D e^{-D2^{j_n}}.

    \]

    If \(H_0\cup H_1\) is bounded in \(B^r_{2\infty}([0,1])\) and

    \(2^{j_n}\asymp n^{1/(2r+1)}\), one may take

    \(\rho_n^2\asymp c^2n^{-2r/(2r+1)}\), with error at most

    \(D e^{-Dn\rho_n^2}\).'
  hypotheses:
    explicit:
    - All hypotheses of Theorem 6.2.14.
    - The Besov conclusion additionally assumes a uniform B^r_{2∞}-bound and a sufficiently regular wavelet basis.
    implicit: []
  quantifier_order:
  - ∀D>0, ∃L,c large enough, ∀n the error bound holds; under the Besov hypothesis and specified jₙ, the displayed
    rate and stronger form follow.
  constants:
  - ∀D>0, ∃L,c large enough, ∀n the error bound holds; under the Besov hypothesis and specified jₙ, the displayed
    rate and stronger form follow.
  dependencies:
    earlier_book:
    - Besov wavelet approximation, Sections 4.3.4-4.3.5
    chapter_local:
    - 6.2.14
    later_book_uses:
    - Proposition 6.2.18
    - Corollary 6.2.19
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:

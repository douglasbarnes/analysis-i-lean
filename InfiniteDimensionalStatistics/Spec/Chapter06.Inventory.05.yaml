- id: 6.2.16
  kind: corollary
  book:
    number: Corollary 6.2.16
    pages:
    - 500
    - 501
    section: 6.2.4
    equations: []
  title: Minimum Chi Square Test entropy separation
  statement: 'Assume \(H_0,H_1\) are as in Theorem 6.2.14, \(H_0\cup H_1\) is

    bounded in \(B^r_{2\infty}([0,1])\) for some \(r>0\), and (6.70) holds for

    some \(s>1/2\). With

    \[

    \rho_n^2\asymp c^2\max\{n^{-2s/(2s+1)},\ n^{-2r/(2r+1/2)}\},

    \]

    for every \(\alpha>0\) there are \(L=L(\psi,\alpha)\) and

    \(c=c(L,\sigma,\alpha)\) large enough such that the minimum-\(\chi^2\) test

    satisfies, for every \(n\),

    \[

    \sup_{f\in H_0}E_f\Phi_n+\sup_{f\in H_1}E_f(1-\Phi_n)\le\alpha.

    \]'
  hypotheses:
    explicit:
    - The full assumptions of Theorem 6.2.14 hold.
    - The entropy exponent satisfies s>1/2.
    - The displayed `asymp` hides constants independent of n but dependent on model parameters.
    implicit: []
  quantifier_order:
  - ∀r>0, ∀s>1/2, under boundedness and (6.70), ∀α>0, ∃L,c sufficiently large, ∀n the error bound holds at the displayed
    separation.
  constants:
  - ∀r>0, ∀s>1/2, under boundedness and (6.70), ∀α>0, ∃L,c sufficiently large, ∀n the error bound holds at the displayed
    separation.
  dependencies:
    earlier_book:
    - Theorem 2.3.7 (Dudley entropy integral)
    - Theorem 4.3.36 (Besov entropy)
    chapter_local:
    - 6.2.14
    - 6.2.entropy_condition
    later_book_uses:
    - Proposition 6.2.18

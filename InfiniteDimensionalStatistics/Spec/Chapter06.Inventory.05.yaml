      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: A second-order U-statistic over a finite wavelet index set, followed by an infimum over a compact null
      set and an indicator test.
    blockers: &id005 []

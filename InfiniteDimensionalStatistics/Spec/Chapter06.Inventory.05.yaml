- id: 6.2.entropy_condition
  kind: operative_definition
  book:
    number: Condition (6.70)
    pages:
    - 500
    - 501
    section: 6.2.4
    equations: []
  title: Composite Null Entropy Bound
  statement: "For constants \\(s,A>0\\), the sliced classes satisfy the uniform entropy bound\n\\[\n\\log N\\!\\\
    left(G_{j,m}(H_0,f),L^2([0,1]),\\varepsilon\\right)\n \\le (A/\\varepsilon)^{1/s},\\qquad 0<\\varepsilon<A,\n\
    \\]\nuniformly in the integers \\(j,m\\) (and in the relevant alternative \\(f\\))."
  hypotheses:
    explicit:
    - The sliced class G_{j,m}(H₀,f) is the class defined in the proof framework of Theorem 6.2.14.
    - N denotes the metric covering number in L².
    implicit: []
  quantifier_order:
  - ∃s,A>0 such that ∀j,m,f and ∀ε∈(0,A), the covering-number inequality holds.
  constants:
  - ∃s,A>0 such that ∀j,m,f and ∀ε∈(0,A), the covering-number inequality holds.

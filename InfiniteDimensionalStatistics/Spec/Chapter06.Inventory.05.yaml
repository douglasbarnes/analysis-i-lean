- id: 6.2.infimum_ustat
  kind: operative_example
  book:
    number: Infimum U-statistic test (6.74)
    pages:
    - 501
    - 502
    section: 6.2.4
    equations: []
  title: Minimum UStatistic Test
  statement: "For i.i.d. \\(X_1,\\ldots,X_n\\) from a bounded density \\(f\\) on \\([0,1]\\),\na wavelet basis \
    (\\{\\psi_{lk}\\}\\), \\(j\\in\\mathbb N\\), and \\(h\\in H_0\\), define\n\\[\nU_n(h)=\\frac{2}{n(n-1)}\n \
    sum_{i<i'}\\sum_{l\\le j-1,k}\n (\\psi_{lk}(X_i)-\\langle\\psi_{lk},h\\rangle)\n (\\psi_{lk}(X_{i'})-\\langle\\\
    psi_{lk},h\\rangle).\n\\]\nThe composite test rejects when\n\\[\n\\inf_{h\\in H_0}|U_n(h)|>\\tau_n.\n\\]"
  hypotheses:
    explicit:
    - n≥2.
    - The density and null functions have enough integrability for the coefficients and kernel expectations.
    - The infimum statistic is measurable.
    implicit: []
  quantifier_order:
  - For each admissible n,j,H₀ and threshold τₙ≥0, define the statistic and its indicator test.
  constants:
  - For each admissible n,j,H₀ and threshold τₙ≥0, define the statistic and its indicator test.
  dependencies:
    earlier_book: []
    chapter_local:
    - 6.2.5
    - 6.2.13
    later_book_uses:
    - Theorem 6.2.17
  proof_status:
    delegates_to_exercises:
    - Exercise 6.2.2
    contains_omitted_steps: true
    comment: Measurable attainment/approximation of the infimum is covered by Exercise 6.2.2.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

- id: theorem-2-3-6
  kind: theorem
  book:
    number: 2.3.6
    pages:
    - 41
    section: '2.3'
    equations: []
  title: Finite chaining entropy bounds
  statement: For a finite S⊆T, t₀∈S, and a process sub-Gaussian relative to d, E max_{t∈S}|X(t)|≤E|X(t₀)|+4√2∫₀^{D/2}√(log(2N(T,d,ε)))dε,
    where D=diam(T); moreover the expected modulus over pairs in S with d(s,t)≤δ is at most (16√2+2)∫₀^δ√(log(2N(T,d,ε)))dε.
  hypotheses:
    explicit:
    - S finite nonempty.
    - X sub-Gaussian relative to d.
    - The entropy integrals are interpreted as extended integrals.
    - δ<diam(T) for the second display.
    implicit: []
  quantifier_order:
  - 4√2; 16√2+2; upper limits D/2 and δ; log(2N).
  constants:
  - 4√2; 16√2+2; upper limits D/2 and δ; log(2N).

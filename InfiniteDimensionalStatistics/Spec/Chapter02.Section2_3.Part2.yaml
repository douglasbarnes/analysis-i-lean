- id: theorem-2-3-8
  kind: theorem
  book:
    number: 2.3.8
    pages:
    - 45
    section: '2.3'
    equations: []
  title: Dudley modulus-of-continuity theorem
  statement: Under the entropy-integrability hypotheses, a separable version satisfies E sup_{s≠t}|X(t)−X(s)| / ∫₀^{d(s,t)}√(log
    N(T,d,ε))dε <∞, with 0/0:=0, and hence the corresponding almost-sure modulus bound.
  hypotheses:
    explicit:
    - X sub-Gaussian and separable.
    - The entropy integral is finite at the relevant scales.
    implicit: []
  quantifier_order:
  - A universal finite bound; denominator exactly the local entropy integral.

- id: theorem-2-3-7
  kind: theorem
  book:
    number: 2.3.7
    pages:
    - 43
    section: '2.3'
    equations: []
  title: Dudley entropy condition for bounded continuous versions
  statement: If (T,d) is totally bounded/separable as induced by the finite entropy condition and ∫₀^{diam(T)}√(log N(T,d,ε))dε<∞,
    then every separable version of a d-sub-Gaussian process has bounded uniformly d-continuous sample paths; the theorem
    also gives the displayed expectation and modulus bounds obtained by passing from finite subsets.
  hypotheses:
    explicit:
    - X sub-Gaussian relative to d.
    - Entropy integral finite.
    - A separable version is chosen for pathwise conclusions.
    implicit:
    - The theorem's exact upper limit and factor 2 inside the logarithm follow the displays preceding it.
  quantifier_order:
  - Universal constants inherited from Theorem 2.3.6.

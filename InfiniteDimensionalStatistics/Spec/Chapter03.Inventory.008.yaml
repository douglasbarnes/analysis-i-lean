  title: Bracketing expectation inequality
  statement: Let F be a P-square-integrable envelope and assume ∫₀^{2‖F‖₂}√log N_{[]}(𝓕,L²(P),τ)dτ<∞. With σ²:=sup_fPf² and
    a(δ):=δ/[32√log(2N_{[]}(𝓕,L²(P),δ/2))], (3.203) bounds the outer expectation of ‖∑(f(X_i)−Pf)‖𝓕 by the bracketing integral
    up to 2δ, the envelope tail 4nP[F1_{F>√n a(δ)}], and the printed finite-net variance term.

- id: definition_3_6_1
  kind: definition
  book:
    number: Definition 3.6.1
    pages:
    - 212
    section: '3.6'
    equations: []
  title: Shattering, trace growth and VC index
  statement: For a set class 𝒞 and finite A={x₁,…,xₙ}, define 𝒞|A:={C∩A:C∈𝒞}; A is shattered when 𝒞|A=2^A. Define C(x₁,…,xₙ):=|𝒞|{x₁,…,xₙ}|
    and the VC index as the least v for which no v-point set is shattered, or ∞ if none.
  transcription_status: exact-transcription
  hypotheses:
    explicit:
    - 𝒞⊂2^S and A finite

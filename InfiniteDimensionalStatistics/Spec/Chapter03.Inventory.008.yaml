  title: Expectation bound under regular entropy growth
  statement: Let 𝓕 be countable with 0∈𝓕 and envelope F. Suppose H satisfies the theorem’s monotonicity/integral regularity
    with constant C_H and uniformly majorises log[2N(𝓕,L²(Q),τ‖F‖_{L²(Q)})] by H(1/τ). Then (3.179) bounds the centred empirical
    supremum by a term of order σ√H(‖F‖₂/σ) and an envelope-maximum term of order ‖U‖₂H(‖F‖₂/σ)/√n.
  transcription_status: precise-structural-statement-page-image-check

  title: L^p brackets and bracketing number
  statement: N_{[]}(𝓕,L^p(P),ε) is the least number of measurable partition cells whose measurable-cover diameter has p-th
    P-moment at most ε^p; equivalently, cover 𝓕 by order intervals [l_i,u_i] with ‖u_i−l_i‖_{L^p(P)}≤ε.
  transcription_status: exact-transcription

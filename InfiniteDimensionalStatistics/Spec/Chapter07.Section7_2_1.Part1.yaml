- id: ch7.def.npmle
  kind: definition
  book:
    number: (7.23)
    label: (7.23)
    pages:
    - 547
    section: 7.2.1
    equations:
    - (7.23)
    section_title: Rates of Convergence in Hellinger Distance
    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Nonparametric maximum-likelihood estimator
  statement: A (measurable) MLE p̂ₙ is a P-valued statistic satisfying ℓₙ(p̂ₙ)=sup_{p∈P}ℓₙ(p).
  hypotheses:
    explicit:
    - The supremum is attained.
    - A measurable maximiser is selected when p̂ₙ is used probabilistically.
    implicit:
    - Existence and measurability are not automatic and are proved separately in concrete models.
  quantifier_order:
  - For each n and sample, choose p̂ₙ∈argmax_P ℓₙ.

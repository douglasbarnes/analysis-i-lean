- id: ch7.prop.klIdentifiability
  kind: proposition
  book:
    number: (7.22)
    label: (7.22)
    pages:
    - 547
    section: 7.2.1
    equations:
    - (7.22)
    section_title: Rates of Convergence in Hellinger Distance
    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Kullback–Leibler identifiability
  statement: "If p is absolutely continuous with respect to p₀ in the sense needed for log(p/p₀), then\n  ℓ(p)-ℓ(p₀)=∫ log(p/p₀) dP₀ ≤ 0,\nwith equality if and only if p=p₀ μ-a.e. Hence ℓ(p)<ℓ(p₀) for p≠p₀."
  hypotheses:
    explicit:
    - p and p₀ are probability densities.
    - The displayed log ratio is P₀-integrable (or the extended integral is defined).
    implicit:
    - The book's wording 'p absolutely continuous with respect to p₀(x)dx' appears directionally inconsistent with the displayed
      ratio and should be checked; the operative requirement is that p/p₀ is defined P₀-a.s.
  quantifier_order:
  - ∀ p in the model with the stated absolute-continuity/integrability conditions.
  constants: []
  dependencies:
    earlier_book:
    - Jensen/Gibbs inequality
    chapter_local:
    - ch7.def.populationLogLikelihood
    later_book_uses:
    - ch7.example.grenanderCharacterisation
    - ch7.prop.7.2.8
    - ex7.2.7
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: none
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: No notes-only mathematical declaration is used here.
    used_later_in_book: true
  equivalents:
    mathlib:
      status: partial_equivalent
      candidates:
      - InformationTheory.klDiv
      - InformationTheory.klDiv_eq_zero_iff
      exact_equivalent: false
    repository:
      status: none_found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: Express as nonnegativity and zero-characterisation of `InformationTheory.klDiv P₀ P`, after aligning the book's
      orientation of the log-likelihood ratio.
    blockers: []

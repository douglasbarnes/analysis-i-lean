  - Proposition 7.2.4 now records the book’s pointwise bounded-function Banach space rather than a quotient L∞ interpretation.
  - Proposition 7.2.7 now states the printed extended-real continuity topology explicitly.
  - Exercise 7.2.4 derives derivative measurability from measurable difference quotients.
  - Exercise 7.2.7 records the distinct-sample and grouped-tie conventions explicitly.
  - The posterior conditional law is represented by an explicitly constructed normalised kernel, avoiding an unnecessary abstract-disintegration
    assumption.
  - The contraction-rate definition now preserves the printed existential fixed-M quantifier.
  - Lemma 7.3.4 now records all exact σ-dependent constants.
  - The ε-boundary thickening is recorded as an open, hence Borel, set for every subset of the metric space.
  - 'Equation (7.22) was verified against p. 547: the printed hypothesis P≪P₀ is the correct condition for the Jensen normalisation

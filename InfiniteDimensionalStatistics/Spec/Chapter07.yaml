purpose: Declaration-level specification only; this file contains no Lean proofs.
specification_policy:
  no_lean_proofs: true
  statement_fidelity: Statements are transcribed or mathematically normalised without changing content. Only corrections in
    the authors' official errata are incorporated. Other suspected typographical, measurability, normalisation or generality
    problems remain explicitly flagged.
  pagination: All page references are printed book pages, not PDF viewer indices.
  pass_semantics:
    core: All unstarred Chapter 7 main-text declarations and operative examples, irrespective of implementation difficulty.
    starred: Only items explicitly marked with a star in the book. Chapter 7 contains no such items.
    exercise: Selected exercises satisfying the project dependency/reuse criteria.
  difficulty_values:
  - routine
  - substantial
  - major-library
  - research-level
audit:
  official_errata_applied:
  - page: 545
    target: Theorem 7.1.4
    correction: Require n ε² ≥ c₀ and take K=K(c₀), rather than one universal K for every n.
  - pages:
    - 559
    - 560
    target: Proof of Lemma 7.2.12
    correction: Use the corrected joint L²/L∞ high-probability event; the first display on p.560 uses the L² rate.
  - page: 560
    target: Proof of Lemma 7.2.12
    correction: Replace the empirical-process citation by Corollary 3.5.7 with the stated parameters, or Remark 3.5.14.
  - page: 561
    target: Proof of Lemma 7.2.13
    correction: The first display uses the L² rate, not the L∞ rate.
  - page: 562
    target: Proof of Theorem 7.2.14 and following text
    correction: Replace the deleted phrase as specified; cite Theorem 4.4.5 and Corollary 3.7.39.
  - page: 571
    target: Bayesian joint model
    correction: Require joint measurability of (x,f)↦p_f(x).
  - page: 573
    target: Theorem 7.3.1 setup
    correction: Require joint measurability of (x,p)↦p(x).
  - page: 576
    target: Proof of Theorem 7.3.3
    correction: Use ε₀=m εₙ for fixed sufficiently large m<M.
  - page: 577
    target: Equation (7.95)
    correction: Use ||f-f₀||₂≤εₙ, not ≤εₙ².
  - page: 582
    target: Noise-process sentence
    correction: Read 'If the noise process ...', not 'Since the noise process ...'.
  - page: 583
    target: Condition 7.3.11(a)
    correction: Delete the assertion that the displayed condition ensures f∈L² almost surely.
  - page: 588
    target: Proof citation near Corollary 7.3.13
    correction: Replace Lemma 2.3.2 by Lemma 2.3.4.
  - page: 591
    target: BvM introductory statement
    correction: Centre at the likelihood estimator or, more generally, any efficient estimator.
  - page: 595
    target: H(δ), Theorems 7.3.19 and 7.3.23
    correction: Require δ>1/2, not merely δ>0.
  - page: 601
    target: Equation (7.136) and Theorem 7.3.23
    correction: The sampling law is P^Y_{f₀}.
  - page: 602
    target: Corollary 7.3.24
    correction: The exponent in the L∞-diameter rate is -γ/(2γ+1).
  notes_section:
    pages:
    - 603
    - 604
    - 605
    - 606
    audited: true
    self_contained_declarations_extracted: []
    notes_only_results_used_later: []
    conclusion: The notes are bibliographic and historical. No separate mathematically operative result stated only in §7.4
      was identified as a dependency of a later declaration.
  mathlib_overlap:
    checked_on: '2026-07-24'
    exact_or_close_foundations:
    - module: Mathlib.Probability.Kernel.Posterior
      use: Posterior kernels, posterior density and Bayes/disintegration foundations.
    - module: Mathlib.InformationTheory.KullbackLeibler.Basic
      use: Kullback–Leibler divergence and zero-divergence characterisations.
    - module: Mathlib.MeasureTheory.Measure.ProbabilityMeasure
      use: Probability measures and the weak topology.
    - module: Mathlib.MeasureTheory.Measure.Portmanteau
      use: Portmanteau implications for weak convergence.
    - module: Mathlib.Probability.WeakConvergence
      use: Convergence in distribution and continuous-mapping infrastructure.
    not_found_as_exact_theorems:
    - Chapter 7 Hellinger testing inequalities and composite-test theorem.
    - Unsieved/sieved NPMLE convergence and efficiency theorems.
    - Grenander endpoint/rate/efficiency results.
    - General posterior contraction theorems in the exact book form.
    - Product-prior contraction bounds.
    - Finite- and infinite-dimensional nonparametric Bernstein–von Mises theorems.
    - Frequentist coverage theorem for Bayesian credible balls.
    hellinger_status: No exact Hellinger-distance module or Chapter 7 theorem was found in the targeted official mathlib documentation
      audit.
  repository_overlap:
    repository: douglasbarnes/analysis-i-lean
    branch: main
    checked_on: '2026-07-24'
    search_terms:
    - Hellinger
    - Kullback
    - posterior
    - likelihood
    - maximum likelihood
    - Sobolev
    - Besov
    result: No matching Chapter 7 formalisation was found in the targeted repository search. The InfiniteDimensionalStatistics
      hierarchy and prior Chapter specification files were absent before this file was created.
  source_limitations:
  - The final §7.3 exercise block is not exposed cleanly by the available searchable text layer. Exercises 7.3.1–7.3.8 are
    conservatively reconstructed from explicit main-text referrals, with page range and exact wording flagged for visual central
    review.
  - Lemma 7.3.8 and Corollary 7.3.24 contain formulae whose exact typography is not fully legible in the searchable layer;
    the official errata are applied and remaining details are flagged.

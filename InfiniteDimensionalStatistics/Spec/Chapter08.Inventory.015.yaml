  title: Uniform wavelet priors are almost surely self-similar
  statement: For ε>0,s>0,j∈ℕ, P(‖K_jU_s−U_s‖∞<εB2^{-js})≤ε^{2^j}=exp(−2^jlog(1/ε)). Consequently P(U_s∈N_s)=0.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - 0<ε<1 for the informative bound
    - s,B>0
    implicit:
    - The proof uses 2^j independent level-j coefficients.
  quantifier_order:
  - Fix ε,s,j
  - bound bias below by the maximum coefficient
  - compute largest-order-statistic probability
  - deduce null probability by contradiction/eventual quantification

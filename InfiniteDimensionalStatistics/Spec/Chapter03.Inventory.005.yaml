  title: Subadditive/self-bounding random variable
  statement: A nonnegative Z of n coordinates is subadditive in the book’s sense if coordinate-deleted Z_k, independent of
    coordinate k, satisfy 0≤Z−Z_k≤1 and ∑_{k=1}^n(Z−Z_k)≤Z.
  transcription_status: exact-transcription

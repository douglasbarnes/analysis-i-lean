  title: Kolmogorov Smirnov distribution free and dkw level
  statement: |-
    Let \(F\) be any continuous distribution function on \(\mathbb R\), and
    let \(G_F\) be the \(F\)-Brownian bridge. Show that
    \[
    \sup_{t\in\mathbb R}|G_F(t)|
    \]
    has the same distribution as \(\sup_{u\in[0,1]}|G(u)|\) for a standard Brownian
    bridge \(G\). Using the Dvoretzky-Kiefer-Wolfowitz inequality, give a numerical
    \(z_\alpha\) such that
    \[
    \sup_F P_F^n\!\left(\|F_n-F\|_\infty>z_\alpha/\sqrt n\right)\le\alpha
    \quad\text{for every }n\in\mathbb N,
    \]
    where the supremum is over all distribution functions \(F\).
  hypotheses:
    explicit:
    - F is a continuous distribution function on ℝ.
    - G_F is an F-Brownian bridge and G is a standard Brownian bridge.
    - 0<α<1 and n∈ℕ.
    implicit: []
  quantifier_order:
  - ∀ continuous F, the bridge supremum laws agree; ∀ α∈(0,1), ∃ numerical zα, ∀ n∈ℕ, sup_F P_F^n(event)≤α.
  constants:
  - ∀ continuous F, the bridge supremum laws agree; ∀ α∈(0,1), ∃ numerical zα, ∀ n∈ℕ, sup_F P_F^n(event)≤α.

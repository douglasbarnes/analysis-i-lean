  title: RKHS of a centred Gaussian process
  statement: Let F be the closed linear span in L²(Pr) of {X(t):t∈T}. The RKHS H is {h:T→ℝ | h(t)=E[kX(t)] for some k∈F};
    the map k↦h is an isometry and ⟨h₁,h₂⟩_H=E[k₁k₂].
  hypotheses:
    explicit:
    - X centred Gaussian process.
    - Coordinates in L².
    implicit:
    - The representing k is unique in the closed span F.
  quantifier_order:
  - ∀t, h(t)=E[kX(t)].
  constants:
  - ∀t, h(t)=E[kX(t)].

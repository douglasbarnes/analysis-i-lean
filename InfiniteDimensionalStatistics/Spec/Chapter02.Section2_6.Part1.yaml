  title: RKHS of a centred Gaussian Banach-valued variable
  statement: Let F be the closed span in L² of {f(X):f∈B*}. Define H={E[kX]:k∈F}⊆B with inner product transported from F by
    the isometry φ(k)=E[kX].
  hypotheses:
    explicit:
    - B separable Banach.
    - X centred Gaussian B-valued.
    - Bochner integrability of kX for k∈F.
    implicit:
    - E[kX] is a Bochner integral; the map is injective on F.
  quantifier_order:
  - ‖E[kX]‖_H=‖k‖₂.
  constants:

  title: Bochner integrability criterion for Gaussian Banach variables
  statement: For a centred Gaussian random variable X in a separable Banach space, X is Bochner integrable iff E‖X‖<∞; in
    that case it is Pettis integrable and the Bochner and Pettis integrals agree.
  hypotheses:
    explicit:
    - B separable Banach.
    - X strongly/Borel measurable Gaussian.
    implicit: []
  quantifier_order:
  - Equivalence with first moment finiteness.

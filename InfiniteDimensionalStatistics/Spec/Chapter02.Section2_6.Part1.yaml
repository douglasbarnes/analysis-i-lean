  title: Dual characterisation of the RKHS
  statement: H={x∈B:sup_{f∈B*} f(x)²/C_X(f,f)<∞}, with the convention for zero denominators, and ‖x‖_H² equal to that supremum.
  hypotheses:
    explicit:
    - B separable Banach.
    - X centred Gaussian.
    - C_X covariance form.
    implicit:
    - If C_X(f,f)=0, finiteness forces f(x)=0; quotient convention must be explicit.
  quantifier_order:

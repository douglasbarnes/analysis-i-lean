  title: Uniform Hölder-ball wavelet prior
  statement: "In a wavelet basis let ξ_{lk} iid U[-B,B] and\n  f_{lk}=2^{-l(γ+1/2)}ξ_{lk},  γ>0.\nThe induced prior Π_{γ,B} is supported in the corresponding wavelet-defined C^γ ball."
  hypotheses:
    explicit:
    - γ>0, B>0.
    - S-regular wavelet basis with S>γ.
    implicit:
    - The book notes a slight abuse of C^γ notation; it is the wavelet coefficient norm.
  quantifier_order:
  - Independently for all wavelet coordinates.

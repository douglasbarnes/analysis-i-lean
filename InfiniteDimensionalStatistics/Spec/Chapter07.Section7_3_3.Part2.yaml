  title: Gaussian product prior
  statement: "Draw independent g_{lk}∼N(0,1) and set\n  f=∑_{l,k} σ_l g_{lk} ψ_{lk},\n\
    with ∑_{l,k}σ_l²<∞."
  hypotheses:
    explicit:
    - Positive scales with multiplicity-weighted square sum finite.
    - Wavelet basis as in Definition 7.3.10(b).
    implicit:
    - The series converges in L² almost surely and defines a Gaussian measure.
  quantifier_order:

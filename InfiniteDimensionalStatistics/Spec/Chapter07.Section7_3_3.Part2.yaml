- id: ch7.prop.gaussianPosteriorFormula
  kind: proposition
  book:
    number: (7.115)–(7.116)
    label: (7.115)–(7.116)
    pages:
    - 589
    - 590
    section: 7.3.3
    equations:
    - (7.115)
    - (7.116)
    section_title: Product Priors in Gaussian Regression
    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Conjugate Gaussian posterior formula
  statement: "Conditional on Y=(Y_{lk}), the posterior is the law of\n  f|Y = ∑_{l,k} [σ_l²/(σ_l²+1/n)]Y_{lk} ψ_{lk}\n        + ∑_{l,k} [σ_l²/(nσ_l²+1)]^{1/2} ḡ_{lk} ψ_{lk},\nwhere ḡ_{lk} are iid N(0,1), independent of Y.\nThus each coordinate posterior is normal with mean\n  σ_l²Y_{lk}/(σ_l²+1/n)\nand variance σ_l²/(nσ_l²+1)."
  hypotheses:
    explicit:
    - Gaussian prior (7.114).
    - Gaussian white-noise sequence likelihood.
    implicit:
    - Conditional infinite product/series defines a Gaussian measure in L².
  quantifier_order:
  - For every observed coordinate sequence in an a.s. set.
  constants: []
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.def.gaussianConjugatePrior
    - ch7.def.whiteNoiseSequenceModel
    later_book_uses:

- id: ch7.prop.7.3.15
  kind: proposition
  book:
    number: Proposition 7.3.15
    pages:
    - 588
    - 589
    section: 7.3.3
    equations: []
  title: Supremum-norm contraction for the uniform wavelet prior
  statement: "If ||f₀||_{C^γ}<B and Π_{γ,B} is the uniform wavelet prior, then for\
    \ some M<∞,\n  E^Y_{f₀} E_{Π_{γ,B}}[||f-f₀||∞ |Y]\n     ≤ M (log n/n)^{γ/(2γ+1)}."
  hypotheses:
    explicit:
    - γ>0, B>0.
    - Truth lies strictly inside the coefficient Hölder ball.
    - Wavelet basis regular enough.
    implicit:
    - The result is an expected posterior loss bound, hence implies contraction by
      Markov.
  quantifier_order:
  - ∃M independent of n, ∀n sufficiently large (printed display can be read all n
    after adjustment).
  constants: []
  dependencies:
    earlier_book:
    - Wavelet reconstruction sup-norm inequality

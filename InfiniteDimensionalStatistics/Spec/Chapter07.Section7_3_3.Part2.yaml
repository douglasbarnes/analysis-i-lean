- id: ch7.prop.7.3.14
  kind: proposition
  book:
    number: Proposition 7.3.14
    pages:
    - 587
    - 588
    section: 7.3.3
    equations: []
  title: Sub-Gaussian posterior coordinate bounds
  statement: "Under Theorem 7.3.12, if √n σ_l≥S₀>0, then for every t∈ℝ and coordinate\
    \ k,\n  E^Y_{f₀} E_Π[exp(t√n(f_{lk}-Y_{lk}))|Y] ≤ C exp(t²/2).\nConsequently,\n\
    \  E^Y_{f₀} E_Π[max_{k∈Z_l}|f_{lk}-f_{0,lk}| |Y]\n     ≤ C' √(log(1+|Z_l|)/n)."
  hypotheses:
    explicit:
    - Fixed S₀>0.
    - Frequency l satisfies √nσ_l≥S₀.
    - Condition 7.3.11.
    implicit:
    - Constants C,C' are uniform in l,k,n and t except through fixed model constants.
    - The second bound also includes the Gaussian observation noise.
  quantifier_order:
  - ∃C,C', ∀ admissible n,l,k, ∀t∈ℝ.

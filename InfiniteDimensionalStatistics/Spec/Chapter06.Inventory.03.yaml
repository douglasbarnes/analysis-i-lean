- id: 6.2.6
  kind: proposition
  book:
    number: Proposition 6.2.6
    pages:
    - 486
    - 487
    section: 6.2.2
    equations: []
  title: Uniformity cdf minimax Separation
  statement: 'For i.i.d. observations from an arbitrary distribution function F on

    [0,1], testing \(H_0:F(t)=t\) against

    \(\|F-\mathrm{id}\|_\infty\ge r_n\) has minimax separation rate

    \[

    \rho_n=C/\sqrt n,

    \]

    where C depends only on the desired total-error level α.'
  hypotheses:
    explicit:
    - The model consists of all distribution functions on [0,1].
    - Distance is the uniform norm on distribution functions.
    - The null is the uniform distribution.
    implicit: []
  quantifier_order:
  - ∀α>0 ∃C(α)>0 such that C/√n satisfies both clauses of Definition 6.2.1.
  constants:
  - ∀α>0 ∃C(α)>0 such that C/√n satisfies both clauses of Definition 6.2.1.

- id: 6.2.spiky_lipschitz
  kind: operative_example
  book:
    number: Spiky Lipschitz alternatives
    pages:
    - 487
    section: 6.2.2
    equations: []
  title: Spiky Lipschitz Alternative scaling
  statement: 'Let ψ be a compactly supported zig-zag function on [0,1] with zero

    integral, and put

    \(\psi_n(x)=\varepsilon n^{-1/4}\psi(n^{1/4}x)\), \(f_n=1+\psi_n\).

    Then \(f_n\) is a density for small ε, has Lipschitz constant of order ε, and

    \[

    \|F_n-\mathrm{id}\|_\infty\lesssim\varepsilon n^{-1/2},\quad

    \|f_n-1\|_\infty=\varepsilon n^{-1/4}\|\psi\|_\infty,\quad

    \|f_n-1\|_2=\varepsilon n^{-3/8}\|\psi\|_2.

    \]

    Thus CDF separation can be parametrically small while density L∞ or L²

    separation is much larger.'
  hypotheses:
    explicit:
    - ψ has zero integral and compact support arranged so that 1+ψₙ≥0.
    - Scaling is interpreted on the portion of [0,1] on which the rescaled support lies.
    implicit: []
  quantifier_order:
  - For every admissible ψ and sufficiently small ε, the displayed identities/bounds hold for each n.
  constants:
  - For every admissible ψ and sufficiently small ε, the displayed identities/bounds hold for each n.
  dependencies:
    earlier_book: []
    chapter_local:
    - 6.2.6
    later_book_uses:

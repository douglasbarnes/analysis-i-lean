  title: Density uniformity Linfty subrate indistinguishable
  statement: 'The lower-bound proof of Theorem 6.2.7 gives more than a positive

    liminf: if \(r_n=o(\rho_n)\), the null and the constructed mixture of

    alternatives are asymptotically indistinguishable, so every test has total

    error tending to one along that subproblem.'
  hypotheses:
    explicit:
    - The sub-rate sequence satisfies rₙ/ρₙ→0.
    - The same finite mixture as in the proof of Theorem 6.2.7 is used.
    implicit: []
  quantifier_order:
  - ∀rₙ=o(ρₙ), the mixture lower bound tends to its no-information value.

- id: 6.2.5
  kind: proposition
  book:
    number: Proposition 6.2.5
    pages:
    - 484
    - 485
    section: 6.2.1
    equations: []
  title: Density L2 Test simple Null
  statement: 'Let \(X_1,\dots,X_n\) be i.i.d. on [0,1] from density f. Let \(f_0\) be

    bounded and let

    \(H_1\subseteq\{f:\|f-f_0\|_2\ge\rho_n,\ \|f\|_\infty\le U\}\).

    Assume

    \[

    \sup_{f\in H_1}\|K_j(f-f_0)-(f-f_0)\|_2^2\le B(j).

    \]

    Define the order-two U-statistic

    \[

    U_n(f_0)=\frac{2}{n(n-1)}

    \sum_{i<i''}\sum_{l\le j-1,k}

    (\psi_{lk}(X_i)-\langle f_0,\psi_{lk}\rangle)

    (\psi_{lk}(X_{i''})-\langle f_0,\psi_{lk}\rangle).

    \]

    Reject when \(|U_n(f_0)|\ge L2^{j/2}/n\). If

    \[

    \rho_n^2=c\max\{L2^{j_n/2}/n,B(j_n)\},

    \]

    then, for every α>0, sufficiently large \(L=L(\alpha,U)\) and \(c=c(U,\alpha)\)

    give error sum at most α for all n.'
  hypotheses:
    explicit:
    - f₀ is a bounded density on [0,1].
    - Every alternative f is a density bounded by U.
    - The wavelet basis/projection satisfies the standard bounded-kernel estimates.
    - n≥2 for the U-statistic formula.
    implicit: []
  quantifier_order:
  - ∀α>0 ∃L,c ∀n≥2, the error sum is ≤α under the displayed separation and bias hypotheses.
  constants:
  - ∀α>0 ∃L,c ∀n≥2, the error sum is ≤α under the displayed separation and bias hypotheses.
  dependencies:
    earlier_book:
    - Canonical U-statistic moment bounds from Chapter 3
    - wavelet projection identities
    chapter_local:
    - 6.2.1
    later_book_uses:
    - Used for the upper bound in Theorem 6.2.9 and as the simple-null precursor of Theorem 6.2.17.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:

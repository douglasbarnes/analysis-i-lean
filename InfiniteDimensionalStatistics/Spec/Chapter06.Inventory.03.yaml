- id: 6.2.2
  kind: proposition
  book:
    number: Proposition 6.2.2
    pages:
    - 480
    section: 6.2.1
    equations: []
  title: Test From Estimator simple Null
  statement: 'Suppose an estimator \(\hat f_n\) satisfies

    \(\sup_{f\in\mathcal F}E_fd(\hat f_n,f)\le r_n\).

    Fix \(f_0\in\mathcal F\), \(\alpha>0\), and

    \(H_1\subseteq\mathcal F\cap\{f:d(f,f_0)\ge c r_n\}\) with \(c\ge4/\alpha\).

    Then the test

    \[

    \phi_n=1\{d(\hat f_n,f_0)>2r_n/\alpha\}

    \]

    satisfies, for every n,

    \[

    E_{f_0}\phi_n+\sup_{f\in H_1}E_f(1-\phi_n)\le\alpha.

    \]'
  hypotheses:
    explicit:
    - (S,d) is a metric or semimetric space and F⊂S.
    - The estimator and displayed events are measurable.
    - rₙ≥0; f₀∈F; c≥4/α.
    implicit: []
  quantifier_order:
  - ∀α>0, ∀c≥4/α, ∀n, the specified test has error sum ≤α for every admissible H₁.
  constants:
  - ∀α>0, ∀c≥4/α, ∀n, the specified test has error sum ≤α for every admissible H₁.
  dependencies:
    earlier_book:
    - Markov inequality
    - triangle inequality
    chapter_local:
    - 6.2.1
    later_book_uses:
    - Used to convert minimax estimators into testing upper bounds; contributes to Proposition 6.2.6 and Chapter
      8.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: A generic theorem for a measurable estimator in a pseudo-metric space.
    blockers: &id001 []

- id: 6.2.7
  kind: theorem
  book:
    number: Theorem 6.2.7
    pages:
    - 488
    - 489
    section: 6.2.2
    equations: []
  title: Density uniformity besov Linfty minimax Separation
  statement: 'Let r>0 and B>1. In the i.i.d. density model on [0,1], test the

    uniform density 1 against

    \[

    H_1(r_n)=\{f:\|f\|_{B^r_{\infty\infty}}\le B,\ \|f-1\|_\infty\ge r_n\}.

    \]

    The minimax separation rate is

    \[

    \rho_n=C\left(\frac{\log n}{n}\right)^{r/(2r+1)},

    \]

    where C depends on r,B and the desired error level α.'
  hypotheses:
    explicit:
    - r>0, B>1.
    - Alternatives are probability densities on [0,1].
    - The Besov norm is the boundary/periodic convention fixed in Chapter 4.
    implicit: []
  quantifier_order:
  - ∀α>0 ∃C=C(r,B,α)>0 such that ρₙ satisfies Definition 6.2.1.
  constants:
  - ∀α>0 ∃C=C(r,B,α)>0 such that ρₙ satisfies Definition 6.2.1.
  dependencies:
    earlier_book:
    - Wavelet Besov characterisation
    - Proposition 5.1.7 (L∞ estimator rate)
    chapter_local:
    - 6.2.1
    - 6.2.2
    - 6.2.mixtures_lower_bound
    - 6.1.tensor_kl
    later_book_uses:
    - The lower-bound construction is reused in Theorems 6.3.5 and 6.3.7.

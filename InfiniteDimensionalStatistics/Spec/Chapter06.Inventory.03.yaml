- id: 6.2.3
  kind: proposition
  book:
    number: Proposition 6.2.3
    pages:
    - 481
    - 483
    section: 6.2.1
    equations: []
  title: White Noise L2 Test simple Null
  statement: 'In Gaussian white noise, test \(H_0:f=f_0\) against

    \(H_1\subseteq\{f:\|f-f_0\|_2\ge\rho_n\}\). Assume \(B(j)\) is nonincreasing and

    \[

    \sup_{f\in H_1}\|K_j(f-f_0)-(f-f_0)\|_2^2\le B(j).

    \]

    For

    \[

    T_n(f_0)=\|\hat f_n(j)-K_jf_0\|_2^2-\sigma^2 2^j/n,\quad

    \phi_n=1\{|T_n(f_0)|\ge \sigma^2L2^{j/2}/n\},

    \]

    if

    \[

    \rho_n^2=c\max\{\sigma^2L2^{j_n/2}/n,B(j_n)\},

    \]

    then for every \(\alpha>0\) there are sufficiently large \(L=L(\alpha)\) and

    \(c=c(\alpha,\sigma)\) such that, for every n, the sum of errors is at most α.'
  hypotheses:
    explicit:
    - Gaussian white-noise model with known σ>0.
    - K_j is the wavelet projection and the number of retained coefficients is 2^j.
    - The bias bound holds uniformly over H₁.
    - j_n is an integer resolution sequence.
    implicit: []
  quantifier_order:
  - ∀α>0 ∃L,c such that ∀n, under the displayed choice of ρₙ, the uniform error sum is ≤α.
  constants:
  - ∀α>0 ∃L,c such that ∀n, under the displayed choice of ρₙ, the uniform error sum is ≤α.
  dependencies:
    earlier_book:
    - Gaussian sequence moments
    - wavelet projection Parseval identity
    chapter_local:
    - 6.2.1
    later_book_uses:
    - Abstract prototype for Theorem 6.2.11(c) and composite tests.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

- id: ch5.eq.5_1
  kind: operative_definition
  book:
    number: Equation (5.1)
    pages:
    - 389
    section: '5.1'
    equations:
    - '5.1'
  title: Equation (5.1)
  statement: For i.i.d. X₁,…,Xₙ with density f on ℝ, a kernel K and h>0, define K_h(x)=h⁻¹K(x/h) and fₙ(x)=(Pₙ*K_h)(x)=n⁻¹∑ᵢK_h(x-Xᵢ)=(nh)⁻¹∑ᵢK((x-Xᵢ)/h).
    Then E_f fₙ=K_h*f.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - X₁,…,Xₙ are i.i.d. real random variables with common Lebesgue density f.
    - K is bounded and Lebesgue integrable.
    - ∫ℝ K(u)du=1.
    - h=hₙ>0.
    implicit:
    - All displayed integrals and random functions are measurable.
    - Pₙ=n⁻¹∑ᵢδ_{Xᵢ}.
  quantifier_order:
  - Fix n≥1.
  - Fix f,K,h satisfying the hypotheses.
  - For every x∈ℝ define fₙ(x).
  constants:
  - Bandwidth h.
  - Kernel normalisation ∫K=1.
  dependencies:
    earlier_book:
    - Chapter 1 empirical measure notation
    - Section 4.1 approximate identities
    chapter_local: &id005 []
    later_book_uses:
    - Theorems 5.1.5, 5.1.13, 5.1.15
    - Section 5.3.2 deconvolution estimators
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      - Mathlib.Analysis.Fourier.Convolution
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Define a kernel rescaling, empirical measure and Bochner/Lebesgue convolution; define fₙ pointwise as
      a finite sum and prove its expectation identity as a separate lemma.
    blockers:
    - A reusable density-estimator structure.
    - Measurability and integrability of parameterised convolution.
    - Expectation of finite sums of real-valued random functions.
  difficulty: substantial
  pass: core
  issues_for_central_review: &id006 []
- id: ch5.eq.5_2
  kind: operative_definition
  book:
    number: Equation (5.2)
    pages:
    - 390
    section: '5.1'
    equations:
    - '5.2'
  title: Equation (5.2)
  statement: For an orthonormal multiresolution analysis with scaling function φ and wavelet ψ, define K(x,y)=∑_{k∈ℤ}φ(x-k)φ(y-k),
    K_j(x,y)=2^jK(2^jx,2^jy), and equivalently K_j(x,y)=K(x,y)+∑_{l=0}^{j-1}∑_{k∈ℤ}ψ_{lk}(x)ψ_{lk}(y).
  source_fidelity: *id001
  hypotheses:
    explicit:
    - (φ,ψ) generate an orthonormal multiresolution wavelet basis of L²(ℝ).
    - j∈ℕ.
    implicit:
    - The series converge in the sense established in Chapter 4 and pointwise where used.
    - ψ_{lk}(x)=2^{l/2}ψ(2^lx-k).
  quantifier_order:
  - For every j≥0 and x,y∈ℝ.
  constants:
  - Dyadic resolution j.
  dependencies:
    earlier_book:
    - Section 4.2 multiresolution analyses and projection kernels
    chapter_local: *id005
    later_book_uses:
    - Equation (5.3)
    - Condition 5.1.1(b)
    - All wavelet projection estimators in Chapter 5
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Distribution.Sobolev
      - Mathlib.Analysis.FunctionalSpaces.SobolevInequality
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Represent V_j as a closed subspace of L² and K_j as a chosen measurable reproducing kernel; the pointwise
      infinite series requires a summability theorem from the wavelet library.
    blockers:
    - No complete orthonormal wavelet/MRA library in mathlib.
    - Pointwise convergence of the reproducing-kernel series.
  difficulty: major-library
  pass: core
  issues_for_central_review: *id006

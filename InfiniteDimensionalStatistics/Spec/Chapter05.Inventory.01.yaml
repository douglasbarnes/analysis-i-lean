- id: ch5.cond.5_1_1
  kind: definition
  book:
    number: Condition 5.1.1
    pages:
    - 391
    - 393
    section: 5.1.1
    equations: []
  title: Condition 5.1.1
  statement: 'An admissible approximating sequence is K_j(x,y)=2^jK(2^jx,2^jy) and satisfies one of: (a) convolution
    on ℝ with K∈L¹∩L∞, ∫K=1, finite p-variation and one-sided continuity; (b) an S-regular MRA projection kernel
    with φ,ψ∈L¹∩L∞, finite p-variation and uniform continuity (or Haar), together with an integrable bounded envelope
    Φ(|x-y|); (c) a boundary-corrected interval projection kernel; or (d) a periodised interval projection kernel
    satisfying the corresponding MRA assumptions.'
  source_fidelity: *id001
  hypotheses:
    explicit:
    - The domain A is ℝ, [0,1], or (0,1] according to the case.
    - In (a),(b), p≥1 is finite.
    - In (b), |K(x,y)|≤Φ(|x-y|) with Φ∈L¹∩L∞.
    - Boundary resolutions satisfy the lower-level restriction from Chapter 4.
    implicit:
    - All kernels and envelopes are Borel measurable.
    - The operator normalisation reproduces constants in the relevant sense.
    - Endpoint periodicity is imposed when later the periodised projection is applied to f.
  quantifier_order:
  - Choose exactly one of cases (a)–(d).
  - For all j≥0 (or all admissible boundary j) and all domain points x,y.
  constants:
  - Variation exponent p.
  - Regularity S.
  - Envelope Φ.
  - Boundary integer N.
  dependencies:
    earlier_book:
    - Chapter 4 wavelet, periodisation and boundary-correction results
    chapter_local: *id005
    later_book_uses:
    - Every result in Sections 5.1.1–5.1.2
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.MeasureTheory.Group.Convolution
      - Mathlib.Analysis.Fourier.Convolution
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: A sum type of four kernel models with fields for measurability, integrability, normalisation, variation
      and envelope estimates.
    blockers:
    - Bounded p-variation formalisation.
    - Wavelet/boundary-wavelet structures.
    - Uniform pointwise envelope theorems.
  difficulty: major-library
  pass: core
  issues_for_central_review: *id006

  source_fidelity:
    transcription_status: verified
    author_corrected_reading: null
  hypotheses:
    explicit:
    - K_j is a wavelet projection kernel as in (5.2), or one of the interval variants in (5.4).
    - jₙ∈ℕ.
    implicit:
    - The kernel sections are Pₙ-integrable.
    - Membership fₙ∈V_{jₙ} uses closure/finite-sum properties of the projection space.
  quantifier_order:

    section_title: The Maximum Likelihood Estimator over a Sobolev Ball
    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Asymptotic efficiency of the Sobolev MLE
  statement: "Assume the interior condition and let s>1/2. If F is a bounded subset of H^s\n(or of C^s under the stated embeddings), then\n  ||P̂ₙ-Pₙ||_F = o_{P₀}(n^{-1/2}),\nand therefore\n  √n(P̂ₙ-P₀) ⇒ G_{P₀} in ℓ∞(F).\nIn particular, for each f∈F,\n  √n∫ f(p̂ₙ-p₀)dμ ⇒ N(0, ||f-P₀f||²_{L²(P₀)})."
  hypotheses:
    explicit:
    - t>1/2 and p₀ satisfies (7.65).
    - s>1/2.
    - F is bounded in the specified smoothness norm and is a uniform P₀-Donsker class.
    implicit:
    - Measurability/separability assumptions for ℓ∞(F) are in force.
    - The empirical process CLT is invoked.
  quantifier_order:
  - ∀ admissible bounded classes F; weak convergence as n→∞; ∀ f∈F scalar CLT.

  title: Parametric-rate convergence of the Sobolev-MLE cdf
  statement: "Let F̂ₙ(x)=∫_0^x p̂ₙ(u)du and F₀(x)=∫_0^x p₀(u)du. Under the hypotheses of\nTheorem 7.2.14,\n  √n ||F̂ₙ-F₀||∞ = O_{P₀}(1),\nand the process has the corresponding Brownian-bridge weak limit obtained by\ntesting against indicators [0,x]."
  hypotheses:
    explicit:
    - Sobolev MLE and interior p₀ hypotheses.
    - Indicator class indexed by x∈[0,1].
    implicit:
    - The exact weak-limit formulation is inherited from Theorem 7.2.14/empirical cdf theory.
  quantifier_order:
  - As n→∞.

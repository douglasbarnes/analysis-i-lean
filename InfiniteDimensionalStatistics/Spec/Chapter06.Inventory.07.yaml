- id: 6.3.5
  kind: theorem
  book:
    number: Theorem 6.3.5
    pages:
    - 516
    - 517
    section: 6.3.2
    equations: []
  title: Besov Gaussian sup Norm minimax Rate
  statement: 'Let \(B,r>0\). In Gaussian white noise with dispersion \(\sigma>0\),

    the minimax rate over

    \[

    F=\{f:\|f\|_{B^r_{\infty\infty}([0,1])}\le B\}

    \]

    in \(L^\infty\)-risk is

    \[

    r_n=C\left(\frac{\log n}{n}\right)^{r/(2r+1)},

    \]

    where \(C\) depends on \(B,r,\sigma\).'
  hypotheses:
    explicit:
    - B,r,σ are positive.
    - The Besov/Hölder ball is represented using a sufficiently regular boundary-corrected or periodic wavelet basis.
    - The loss is the essential supremum norm.
    implicit: []
  quantifier_order:
  - ∀B,r,σ>0, the displayed rate is minimax in the sense of Definition 6.3.1, with a constant depending only on
    B,r,σ and basis normalisation.
  constants:
  - ∀B,r,σ>0, the displayed rate is minimax in the sense of Definition 6.3.1, with a constant depending only on
    B,r,σ and basis normalisation.
  dependencies:
    earlier_book:
    - Proposition 5.1.7
    - Theorem 4.2.10
    - Theorem 4.3.2
    - Varshamov/Gilbert packing
    chapter_local:
    - 6.3.2
    - 6.1.gwn_kl
    later_book_uses:
    - Corollary 6.4.5 as an analogous confidence-band benchmark
    - Chapter 8 adaptive L∞ estimation
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

    section: 6.3.3
    equations: []
  title: Besov Gaussian lp minimax Rate
  statement: 'Let \(B,r>0\), \(1\le p<\infty\), and \(1\le q\le\infty\). In

    Gaussian white noise, the minimax rate over the ball

    \[

    F=\{f:\|f\|_{B^r_{pq}([0,1])}\le B\}

    \]

    in \(L^p\)-risk is

    \[

    r_n=Cn^{-r/(2r+1)},

    \]

    where \(C\) depends on \(B,r,p,\sigma\).'
  hypotheses:
    explicit:
    - B,r,σ>0.
    - 1≤p<∞ and 1≤q≤∞.
    - The wavelet basis has regularity S>r.
    - The Lp and Besov norms use the book's boundary convention.
    implicit: []
  quantifier_order:
  - For every admitted parameter tuple, n^{-r/(2r+1)} is the minimax rate; C is uniform in n,f and, as printed,
    does not list q.
  constants:
  - For every admitted parameter tuple, n^{-r/(2r+1)} is the minimax rate; C is uniform in n,f and, as printed,
    does not list q.

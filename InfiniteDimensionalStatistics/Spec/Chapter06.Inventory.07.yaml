- id: 6.3.4
  kind: proposition
  book:
    number: Proposition 6.3.4
    pages:
    - 515
    - 516
    section: 6.3.2
    equations: []
  title: Cdf sup Norm minimax Rate
  statement: 'For the class \(F\) of all distribution functions on \([0,1]\), based

    on \(n\) i.i.d. observations from \(F\), the minimax rate in supremum-norm

    risk is

    \[

    r_n=n^{-1/2}.

    \]

    The text adds that the same rate remains when \(F\) is restricted to

    distribution functions with any fixed number \(S\) of derivatives bounded in

    supremum norm by any fixed \(M\).'
  hypotheses:
    explicit:
    - The observations are i.i.d. under the distribution corresponding to F.
    - The loss is the supremum norm on distribution functions.
    - The smooth subclass extension is an unnumbered consequence of the lower-bound construction.
    implicit: []
  quantifier_order:
  - The sequence n^{-1/2} satisfies Definition 6.3.1 uniformly over all distribution functions; likewise for each
    fixed smooth subclass described in the prose.
  constants:
  - The sequence n^{-1/2} satisfies Definition 6.3.1 uniformly over all distribution functions; likewise for each
    fixed smooth subclass described in the prose.
  dependencies:
    earlier_book:
    - Exercise 3.1.7 (empirical CDF expectation bound)
    chapter_local:
    - 6.2.2
    - 6.2.6
    - 6.3.1
    later_book_uses:
    - Definition 6.4.2 and Kolmogorov-Smirnov confidence bands
    - Exercise 6.3.1
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

- id: 6.3.7
  kind: theorem
  book:
    number: Theorem 6.3.7
    pages:
    - 517
    - 518
    section: 6.3.2
    equations: []
  title: Besov Density sup Norm minimax Rate
  statement: 'Let \(B>1\), \(r>0\), and \(A=[0,1]\) or \(A=\mathbb R\). For the class

    of probability densities

    \[

    F=\{f\ge0:\int_Af=1,\ \|f\|_{B^r_{\infty\infty}(A)}\le B\},

    \]

    based on \(n\) i.i.d. observations, the minimax \(L^\infty\)-risk rate is

    \[

    r_n=C\left(\frac{\log n}{n}\right)^{r/(2r+1)},

    \]

    with \(C\) depending on \(B,r\).'
  hypotheses:
    explicit:
    - B>1 is used to embed the uniform density on [0,1] or a sufficiently spread normal density on R in the ball.
    - The observations are i.i.d. from a density in F.
    - The density class and Besov norm depend on A.
    implicit: []
  quantifier_order:
  - For either allowed A, ∀B>1,r>0, the displayed sequence is minimax with constants independent of n and f.
  constants:
  - For either allowed A, ∀B>1,r>0, the displayed sequence is minimax with constants independent of n and f.
  dependencies:
    earlier_book:
    - Proposition 5.1.7
    - Theorem 4.3.2
    - smooth normal-density Besov membership
    chapter_local:
    - 6.3.2
    - 6.1.tensor_kl
    - 6.3.6
    later_book_uses:
    - Exercise 6.3.2
    - Chapter 8 adaptive density estimation

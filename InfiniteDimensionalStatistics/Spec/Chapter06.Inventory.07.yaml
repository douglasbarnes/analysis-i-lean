- id: 6.3.2
  kind: theorem
  book:
    number: Theorem 6.3.2
    pages:
    - 513
    - 515
    section: 6.3.1
    equations: []
  title: Fano minimax Risk lower Bound
  statement: "Let \\(f_0,\\ldots,f_M\\in F\\) be pairwise \\(2r_n\\)-separated and suppose\n\\(P_{f_m}\\ll P_{f_0}\\\
    ) for \\(m=1,\\ldots,M\\). Put\n\\(\\bar M=\\max(e,M)\\). If for some \\(\\alpha>0\\),\n\\[\n\\frac1M\\sum_{m=1}^M\
    \ K(P_{f_m},P_{f_0})\\le\\alpha\\log\\bar M,\n\\]\nthen\n\\[\n\\inf_{\\tilde f_n}\\sup_{f\\in F}E_f d(\\tilde\
    \ f_n,f)\n\\ge r_n\\left(1-2\\alpha-\n \\sqrt{\\frac{8\\alpha}{\\log\\bar M}}\\right)\n \\frac{\\sqrt{\\bar\
    \ M}}{1+\\sqrt{\\bar M}}.\n\\]"
  hypotheses:
    explicit:
    - M is a positive integer; the statement uses M alternatives plus the base point f₀.
    - All f_m belong to F and are pairwise 2rₙ-separated.
    - P_{f_m} is absolutely continuous with respect to P_{f₀}.
    - The average KL bound must make the parenthetical lower-bound factor positive for a nontrivial conclusion.
    implicit: []
  quantifier_order:
  - ∀n and every finite family satisfying separation, domination, and the average-information bound, the minimax
    risk is at least the displayed quantity.
  constants:
  - ∀n and every finite family satisfying separation, domination, and the average-information bound, the minimax
    risk is at least the displayed quantity.
  dependencies:
    earlier_book:
    - Proposition 6.1.7
    - Elementary likelihood-ratio truncation and Jensen
    chapter_local:
    - 6.3.reduction
    - 6.1.6
    - 6.1.7
    later_book_uses:
    - Theorems 6.3.5, 6.3.7, 6.3.8, 6.3.9
    - Theorem 6.3.10 by delegated adaptation
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: A Fano/Tsybakov finite packing theorem for arbitrary experiments. Use finite sums of extended-real KL
      values, absolute continuity, and a classifier lower bound. Separate a real-valued finite-KL version from an
      `ENNReal` master theorem.
    blockers: &id001
    - Official hardback errata changes the final factor in (6.104) from `sqrt(Mbar)/(1+sqrt(Mbar))` to `sqrt(M/3)/(1+sqrt(M))`.
      The declaration above preserves the hardback formula; central review must choose the corrected theorem statement.
    reusable_primitives:
    - Fano inequality
    - packing lower bound
  difficulty: major-library
  pass: core
  issues_for_central_review: *id001

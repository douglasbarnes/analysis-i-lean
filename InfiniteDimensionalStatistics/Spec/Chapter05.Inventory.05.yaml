- id: ch5.ex.haar_extreme
  kind: operative_example
  book:
    number: Unnumbered Haar-kernel example
    pages:
    - 417
    - 418
    section: 5.1.3*
    equations: []
  title: Unnumbered Haar-kernel example
  statement: For the Haar projection kernel K(x,y)=∑_k1_{[0,1)}(x-k)1_{[0,1)}(y-k)=1_{⌊x⌋=⌊y⌋}, the comparison Gaussian
    process is piecewise constant and its supremum is the maximum of 2^j independent |N(0,1)| variables. The extreme-value
    normalisers are A(l)=√(2(log 2)l) and B(l)=A(l)−(log l+log(π log 2))/(2A(l)).
  source_fidelity: *id001
  hypotheses:
    explicit:
    - Haar wavelet basis.
    - l→∞.
    implicit:
    - The index interval produces 2^l cells.
  quantifier_order:
  - For every integer l≥1.
  constants:
  - A(l),B(l) exactly as displayed.
  dependencies:
    earlier_book: &id005 []
    chapter_local:
    - ch5.prop.5_1_21
    later_book_uses:
    - Proposition 5.1.22
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Identify the Gaussian process with a finite vector of independent standard normals; use a classical
      maximum-of-Gaussians Gumbel theorem.
    blockers:
    - Extreme-value theorem for maxima of Gaussian variables.
  difficulty: research-level
  pass: starred
  issues_for_central_review: &id006 []
- id: ch5.prop.5_1_22
  kind: proposition
  book:
    number: Proposition 5.1.22
    pages:
    - 418
    section: 5.1.3*
    equations: []
  title: Proposition 5.1.22
  statement: Let f range over 𝒟 and let jₙ→∞ with jₙ2^{jₙ}=o(n/(log n)²). For the Haar estimator, uniformly over
    f∈𝒟, P_f{A(jₙ)[√(n2^{-jₙ})‖(fₙ−Efₙ)/√f‖_{[0,1]}−B(jₙ)]≤x}→exp(−e^{-x}) for every x∈ℝ.
  source_fidelity: *id001
  hypotheses:
    explicit:
    - 𝒟 as in (5.45).
    - Haar projection estimator.
    - jₙ2^{jₙ}=o(n/(log n)²).
    implicit:
    - f is bounded away from zero on [0,1], so division by √f is defined.
    - A,B are the Haar normalisers.
  quantifier_order:
  - For every x∈ℝ.
  - The convergence is uniform in f∈𝒟.
  constants:
  - A(jₙ),B(jₙ).
  dependencies:
    earlier_book: *id005
    chapter_local:
    - ch5.prop.5_1_21
    - ch5.ex.haar_extreme
    - ch5.def.D_class
    later_book_uses: *id005
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Uniform Gumbel limit for a standardised histogram/Haar estimator.
    blockers:
    - Proposition 5.1.21 coupling and Gaussian extreme values.
  difficulty: research-level
  pass: starred
  issues_for_central_review: *id006
- id: ch5.ex.convolution_extreme
  kind: operative_example
  book:
    number: Unnumbered smooth convolution-kernel example
    pages:
    - 418
    section: 5.1.3*
    equations: []
  title: Unnumbered smooth convolution-kernel example
  statement: For a bounded symmetric C² kernel K supported on [−1,1], the stationary Gaussian process Y(t)=∫K(t-s)dW(s)
    has covariance r(t)=‖K‖₂²−Ct²+o(t²) at zero with C>0. The resulting extreme-value normaliser has leading term
    √(2(log 2)l) and second-order correction involving C/‖K‖₂² and π, as displayed in (5.66).
  source_fidelity:
    transcription_status: central_review_required
    author_corrected_reading: null
  hypotheses:
    explicit:
    - K bounded, symmetric, support⊆[−1,1], K∈C².
    - The covariance curvature constant is positive.
    implicit:
    - The stochastic integral is with respect to two-sided white noise.
  quantifier_order:
  - As l→∞.
  constants:
  - C and the exact B(l) from (5.66).
  dependencies:
    earlier_book: *id005
    chapter_local:
    - ch5.prop.5_1_21
    later_book_uses:
    - Proposition 5.1.23
  proof_status: *id002
  notes_status: *id003
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Probability.Distributions.Gaussian.Real
      exact_equivalent: false
    repository: *id004
  likely_lean_representation:
    sketch: Stationary Gaussian moving-average process plus a Pickands/Bickel–Rosenblatt extreme-value theorem.
    blockers:
    - Stationary Gaussian-process extreme-value theory.
  difficulty: research-level
  pass: starred
  issues_for_central_review:
  - OCR is ambiguous about the numerical factor in C=−(constant)∫KK″ and the exact second-order term in B(l); verify
    (5.65)–(5.66).
  - 'Source-transcription status: central_review_required.'
- id: ch5.prop.5_1_23
  kind: proposition
  book:
    number: Proposition 5.1.23
    pages:
    - 418
    - 419
    section: 5.1.3*
    equations: []
  title: Proposition 5.1.23
  statement: For a bounded symmetric C² convolution kernel supported on [−1,1], for 𝒟 and jₙ as in Proposition 5.1.22,
    uniformly over f∈𝒟 the variable √(2(log 2)jₙ)[√(n2^{-jₙ})‖(fₙ−Efₙ)/(‖K‖₂√f)‖_{[0,1]}−B(jₙ)] converges to the
    standard Gumbel law exp(−e^{-x}).
  source_fidelity: *id001
  hypotheses:
    explicit:
    - Kernel assumptions from the preceding example.
    - 𝒟 and jₙ as in Proposition 5.1.22.
    implicit:
    - B is the normaliser (5.66).
  quantifier_order:
  - For all x∈ℝ, supremum over f∈𝒟 of the distribution-function error tends to zero.
  constants:
  - ‖K‖₂ and B(jₙ).
  dependencies:

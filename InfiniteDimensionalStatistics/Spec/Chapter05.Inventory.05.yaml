  title: Proposition 5.1.23
  statement: For a bounded symmetric C² convolution kernel supported on [−1,1], for 𝒟 and jₙ as in Proposition 5.1.22, uniformly
    over f∈𝒟 the variable √(2(log 2)jₙ)[√(n2^{-jₙ})‖(fₙ−Efₙ)/(‖K‖₂√f)‖_{[0,1]}−B(jₙ)] converges to the standard Gumbel law
    exp(−e^{-x}).
  source_fidelity: *id001
  hypotheses:
    explicit:
    - Kernel assumptions from the preceding example.
    - 𝒟 and jₙ as in Proposition 5.1.22.
    implicit:
    - B is the normaliser (5.66).
  quantifier_order:

  title: Hoeffding inequality
  statement: Let X₁,…,Xₙ be independent, EXᵢ=0 and aᵢ≤Xᵢ≤bᵢ a.s. For Sₙ=∑Xᵢ, E e^{λSₙ}≤exp(λ²∑(bᵢ−aᵢ)²/8), λ∈ℝ,
    and Pr{|Sₙ|≥t}≤2exp(−2t²/∑(bᵢ−aᵢ)²), t>0.

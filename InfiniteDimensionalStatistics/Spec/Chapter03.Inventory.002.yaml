    section: '3.1'
    equations: []
  title: Bernstein–Bennett inequality for bounded independent sums
  statement: Let X₁,…,Xₙ be independent, centred, |Xᵢ|≤c, and v:=∑EXᵢ². For t,x>0, Pr{Sₙ≥t}≤exp[−(v/c²)h₁(ct/v)]≤exp[−t²/(2v+2ct/3)]
    and Pr{Sₙ≥√(2vx)+cx/3}≤e^{−x}; the same applied to −Sₙ gives two-sided bounds.
  transcription_status: exact-with-official-correction

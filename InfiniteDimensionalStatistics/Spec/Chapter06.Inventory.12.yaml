inventory:
- id: 6.5.unified_Lp_detection_rate
  kind: notes_result
  book:
    number: Notes-only unified Lᵖ separation rate
    pages:
    - 537
    - 538
    section: 6.5 (notes to Section 6.2)
    equations: []
  title: Besov simple Testing unified Lp separation rate
  statement: 'For simple nonparametric signal-detection/goodness-of-fit problems over

    smoothness-\(r\) classes, the \(L^2\)-separation rate

    \(n^{-r/(2r+1/2)}\) and the \(L^\infty\)-separation rate

    \(n^{-r/(2r+1)}\), ignoring the logarithmic factor in the latter, are endpoints

    of the unified rate

    \[

    \rho_n\asymp n^{-r/(2r+1-p^{-1})},\qquad 2\le p\le\infty.

    \]

    For \(1\le p<2\), the notes state that no further improvement over the \(L^2\)

    rate is possible.'
  hypotheses:
    explicit:
    - The testing problem is one of the simple smooth alternatives treated in the Ingster theory referenced by the
      notes.
    - The regularity parameter satisfies r>0.
    - For the displayed interpolation formula, 2≤p≤∞.
    - Logarithmic factors in the L∞ endpoint are deliberately suppressed in this notes-level statement.
    implicit: []
  quantifier_order:
  - ∀ r>0, ∀ p∈[2,∞], the asserted asymptotic separation exponent is r/(2r+1−1/p); for 1≤p<2 the rate does not improve
    beyond the p=2 rate.
  constants:
  - ∀ r>0, ∀ p∈[2,∞], the asserted asymptotic separation exponent is r/(2r+1−1/p); for 1≤p<2 the rate does not improve
    beyond the p=2 rate.
  dependencies:
    earlier_book:
    - Theorems 6.2.7, 6.2.9 and 6.2.11
    - Exercise 6.2.5 for the L¹ endpoint phenomenon
    chapter_local:
    - 6.2.7
    - 6.2.9
    - 6.2.11
    later_book_uses:
    - Background for the adaptive L² and L∞ testing problems of Chapter 8; the exact notes statement is not directly
      invoked as a proved theorem.
  proof_status:
    delegates_to_exercises:
    - Exercise 6.2.5
    contains_omitted_steps: true
    comment: The p<2 assertion points to 'Exercise 6.4' in print, an ambiguous/mistyped reference; Exercise 6.2.5
      proves the L¹ version for Theorem 6.2.9.
  notes_status:
    discussed_or_extended_in_notes: true
    note_summary: This declaration is stated in the chapter notes.
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: After formalising the whole Ingster family, parameterise the separation metric by p and state the exponent
      piecewise. This is not a consequence of the chapter's endpoint proofs alone.
    blockers: &id001
    - The hardback prints denominator 2r+1+p^{-1}; the official errata corrects it to 2r+1−p^{-1}.
    - The reference 'see Exercise 6.4' is not a valid unambiguous exercise label in the chapter and likely points
      to Exercise 6.2.5 or another omitted numbering.
  difficulty: research-level
  pass: core
  issues_for_central_review: *id001
- id: ex.6.1.1
  kind: exercise
  book:
    number: Exercise 6.1.1
    pages:
    - 476
    section: '6.1'
    equations: []
  title: Total Variation eq half integral abs density sub
  statement: "Let \\(P,Q\\) be probability measures dominated by \\(\\mu\\), with densities\n\\(p,q\\). Prove\n\\\\
    [\n\\|P-Q\\|_{\\mathrm{TV}}=\\frac12\\int |p-q|\\,d\\mu\n      =1-\\int \\min(p,q)\\,d\\mu.\n\\]\nThe book's\\
    \\ hint takes \\(A=\\{x:q(x)\\ge p(x)\\}\\) and rewrites\n\\(\\int|p-q|\\,d\\mu=2\\int_A(q-p)\\,d\\mu\\)."
  hypotheses:
    explicit:
    - P and Q are probability measures on a common measurable space.
    - μ is a common dominating measure with densities p=dP/dμ and q=dQ/dμ.
    implicit: []
  quantifier_order:
  - ∀ measurable spaces, ∀ probability measures P,Q, ∀ common dominating μ, the two identities hold.
  constants:
  - ∀ measurable spaces, ∀ probability measures P,Q, ∀ common dominating μ, the two identities hold.
  dependencies:
    earlier_book:
    - Definition of total variation distance
    - Radon-Nikodym theorem
    chapter_local:
    - 6.1.6
    - 6.1.tv_density
    later_book_uses: &id003
    - Used implicitly throughout the chapter when converting density L¹-distance into total variation.
  proof_status:
    delegates_to_exercises:
    - Exercise 6.1.1
    contains_omitted_steps: true
    comment: Completes the proof of equation (6.13), which the main text leaves to the exercise.
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit; standard analytic/probabilistic primitives may be reusable.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: For finite measures dominated by a common measure, identify total variation distance with one half of
      the L¹ norm of the Radon-Nikodym density difference; derive the minimum-density formula.
    blockers: &id002 []
  difficulty: substantial
  pass: exercise
  issues_for_central_review: *id002
  selection_reasons:
  - establishes a required reusable lemma
  - supplies the proof omitted before equation (6.13)
  used_by: *id003

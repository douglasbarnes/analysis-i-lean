    - 188
    section: '3.5'
    equations: []
  title: Uniform entropy bound with square-integrable envelope
  statement: Let 𝓕 be countable, 0∈𝓕, F a positive envelope with PF²<∞, σ²:=sup_fPf², δ:=σ/‖F‖₂ and U:=max_iF(X_i). If J(𝓕,F,1)<∞,
    then E‖ν_n‖𝓕 is bounded by the maximum of A₁‖F‖₂J(δ) and A₂‖U‖₂J(δ)²/(√nδ²), with the theorem’s explicit universal A₁,A₂.
  transcription_status: precise-structural-statement-page-image-check

{"schema_version":1,"target_path":"InfiniteDimensionalStatistics/Spec/Chapter02.yaml","source":{"title":"Mathematical Foundations of Infinite-Dimensional Statistical Models","authors":["Evarist Giné","Richard Nickl"],"edition":"First edition, 2016","uploaded_file":"FULLPDF.pdf","chapter":2,"chapter_title":"Gaussian Processes","book_pages":{"start":15,"end":108},"scope_read":["Main text, numbered and unnumbered operative statements in Sections 2.1–2.7.","Section 2.8 notes, including the generic-chaining material and the quoted cyclostationary extreme-value theorem.","All Chapter 2 exercises; every exercise is classified by why it is required for formalisation."]},"specification_policy":{"no_lean_proofs":true,"statement_fidelity":"Statements are declaration-level mathematical paraphrases preserving the printed quantifiers, constants and hypotheses. Suspected OCR, typographical, measurability or generality defects are not repaired silently; they are placed in central_review_flags.","page_policy":"book_page is the printed book page. A range is used when an exercise crosses a page break.","pass_definitions":{"core":"Unstarred foundational declarations required by downstream Chapter 2 results and intended for the first formalisation pass.","starred":"Deep results requiring a major new library, quoted external theorems, or results whose proof is unsuitable for the core closure pass.","exercise":"Exercise declarations. selection_reasons records whether the exercise completes an omitted proof, is cited later, or supplies reusable infrastructure."},"difficulty_values":["routine","substantial","major-library","research-level"],"equivalence_audit_scope":{"mathlib":"Audit against current official mathlib documentation. Foundational Gaussian predicates exist, but no exact advanced Chapter 2 theorem was located unless the entry says exact_equivalent: true.","repository":"Repository-wide search of douglasbarnes/analysis-i-lean before creating this file. No exact Chapter 2 declarati
nnumbered-2-2-spherical-neighbourhood","theorem-2-2-1","lemma-2-2-2","theorem-2-2-3","definition-unnumbered-2-2-product-gaussian","theorem-2-2-4","definition-2-2-5a","definition-2-2-5b","theorem-2-2-6","theorem-2-2-7","corollary-2-19","corollary-2-20","corollary-2-2-8","corollary-2-2-9","definition-unnumbered-2-3-subgaussian-rv","definition-unnumbered-2-3-psi2","lemma-2-3-1","lemma-2-3-2","lemma-2-3-3","lemma-2-3-4","definition-2-3-5","definition-unnumbered-2-3-covering","definition-unnumbered-2-3-packing","theorem-2-3-6","theorem-2-3-7","theorem-2-3-8","definition-unnumbered-2-4-convex-symmetric","definition-unnumbered-2-4-minkowski","lemma-2-4-1","theorem-2-4-2","definition-unnumbered-2-4-logconcave-measure","theorem-2-4-3","theorem-2-4-4","theorem-2-4-5","corollary-2-4-6","theorem-2-4-7","theorem-2-4-8","remark-2-4-9","corollary-2-4-10","lemma-2-4-11","theorem-2-4-12","corollary-2-4-13","corollary-2-4-14","corollary-2-61","definition-2-5-1","lemma-2-5-2","proposition-2-5-3","lemma-2-5-4","lemma-2-5-5","theorem-2-5-6","theorem-2-5-7","theorem-2-5-8","definition-2-6-1","example-2-6-2","lemma-2-6-3","definition-2-6-4","definition-unnumbered-2-6-covariance","lemma-2-6-6","example-2-6-7","proposition-2-6-8","proposition-2-6-9","theorem-2-6-10","corollary-2-6-11","theorem-2-6-12","theorem-2-6-13","example-2-6-15","proposition-2-6-16","corollary-2-6-17","corollary-2-6-18","definition-unnumbered-2-6-concentration-function","proposition-2-6-19","lemma-2-6-20","lemma-2-6-21","definition-unnumbered-2-6-integrated-bm","lemma-2-6-22","lemma-2-6-23","proposition-2-6-24","corollary-2-83","definition-unnumbered-2-6-smallball-zero","theorem-2-6-26","corollary-2-6-27","lemma-2-6-28","theorem-2-6-29","corollary-2-6-30","theorem-2-7-1","definition-2-7-2","lemma-2-7-3","theorem-2-7-4","definition-unnumbered-2-7-stationary-process","definition-unnumbered-2-7-normalised-process","definition-unnumbered-2-7-pickands-process","theorem-2-7-5","corollary-2-7-6","definition-2-110-2-111","lemma-2-7-7","proposition-2-7-8","definition-2-120","theorem-2-7-9","theorem-2-8-1","example-2-8-2","corollary-2-124","definition-unnumbered-2-8-cyclostationary","theorem-2-8-3","exercise-2-1-1","exercise-2-1-2","exercise-2-1-3","exercise-2-1-4","exercise-2-1-5","exercise-2-1-6","exercise-2-2-1","exercise-2-2-2","exercise-2-2-3","exercise-2-2-4","exercise-2-2-5","exercise-2-2-6","exercise-2-2-7","exercise-2-2-8","exercise-2-2-9","exercise-2-2-10","exercise-2-2-11","exercise-2-2-12","exercise-2-2-13","exercise-2-3-1","exercise-2-3-2","exercise-2-3-3","exercise-2-3-4","exercise-2-3-5","exercise-2-3-6","exercise-2-3-7","exercise-2-3-8","exercise-2-3-9","exercise-2-3-10","exercise-2-4-1","exercise-2-4-2","exercise-2-4-3","exercise-2-4-4","exercise-2-4-5","exercise-2-4-6","exercise-2-4-7","exercise-2-4-8","exercise-2-4-9","exercise-2-4-10","exercise-2-4-11","exercise-2-4-12","exercise-2-5-1","exercise-2-5-2","exercise-2-6-1","exercise-2-6-2","exercise-2-6-3","exercise-2-6-4","exercise-2-6-5","exercise-2-6-6","exercise-2-6-7","exercise-2-6-8","exercise-2-6-9","exercise-2-6-10","exercise-2-6-11","exercise-2-6-12","exercise-2-6-13","exercise-2-6-14","exercise-2-6-15","exercise-2-6-16","exercise-2-7-1","exercise-2-7-2","exercise-2-7-3"],"declaration_fields":["node","section","book_number","kind","book_page","title","precise_statement","explicit_hypotheses","implicit_hypotheses","constants_and_quantifier_order","proof_delegation_to_exercises","notes_result_used_later","equivalence_audit_profile","likely_lean_representation","expected_difficulty","pass","central_review_flags"],"declarations":[[0,0,"unnumbered-2.1-process",1,15,"Stochastic process indexed by T","A stochastic process indexed by a set T is a family X = (X(t))_{t∈T} of real random variables on one probability space.",["A probability space (Ω,𝒜,Pr).","An index type T.","For each t∈T, a measurable map X(t):Ω→ℝ."],["All random variables share the same probability space."],["∀ probability spaces Ω, ∀ index sets T, ∀ families X:T→Ω→ℝ."],[],[],2,"A function `X : T → Ω → ℝ` with `[MeasurableSpace Ω]` and coordinate measurability hypotheses.",0,0,[]],[1,0,"2.1.1",1,16,"Version and strict version","Processes X and Y indexed by T are versions when every finite vector (X(t₁),…,X(tₙ)) has the same law as (Y(t₁),…,Y(tₙ)); they are strict versions (modifications) when Pr(X(t)=Y(t))=1 for every t∈T.",["X and Y are real processes on (possibly different for version, common for strict version) probability spaces.","n≥1 and t₁,…,tₙ∈T for finite-dimensional-law equality."],["For strict versions, coordinatewise almost-sure equality implies equal finite-dimensional laws."],["Version: ∀n≥1 ∀t₁…tₙ, law vectors equal.","Strict version: ∀t∈T, Pr[X(t)=Y(t)]=1."],[],[],2,"Predicates `SameFiniteDimensionalDistributions X Y P Q` and `IsModification X Y P := ∀ t, X t =ᵐ[P] Y t`.",0,0,[]],[2,0,"2.1.2a",1,16,"Separable process","Relative to a pseudometric d on T, X is separable when there is a countable d-dense T₀⊆T and a null set N such that for every closed F⊆ℝ and open G⊆T, the events determined by X over G and over G∩T₀ agree off N in the standard separability criterion; equivalently, suprema/infima over T are determined by T₀ for the uses in this chapter.",["A pseudometric d on T.","A process X.","A countable d-dense subset T₀."],["The book uses the standard Doob separability definition, not merely topological separability of T."],["∃ countable T₀ dense, ∃N with Pr(N)=0, ∀ closed F, ∀ open G, the separability event condition holds."],[],[],2,"A structure carrying a countable dense range and an almost-everywhere equality of relevant coordinate-event closures; a weaker chapter API may package `sup_eq_iSup_dense` directly.",2,0,["The exact event-based separability definition should be transcribed from the PDF visually before implementation; OCR is not reliable enough for its set-theoretic formula."]],[3,0,"2.1.2b",1,16,"Joint measurability","X is jointly measurable when (t,ω)↦X(t,ω) is measurable on T×Ω for the product σ-algebra.",["T carries a measurable space.","Ω carries the probability σ-algebra."],[],["Measurable (Function.uncurry X)."],[],[],2,"`Measurable (Function.uncurry X)`.",0,0,[]],[4,0,"2.1.3a",1,17,"Sample bounded process","X is sample bounded when it has a version whose sample paths t↦X(t,ω) are bounded on T for almost every ω.",["A process X indexed by T."],[],["∃ version Y of X, Pr({ω | sup_t |Y(t,ω)|<∞})=1."],[],[],2,"Predicate using a modification/version and `∀ᵐ ω, Bornology.IsBounded (Set.range fun t => Y t ω)`.",1,0,[]],[5,0,"2.1.3b",1,17,"Sample continuous process","Relative to d, X is sample continuous when it has a version whose sample paths are bounded and uniformly d-continuous almost surely.",["A pseudometric d on T.","A process X."],[],["∃ version Y, ∀ᵐω, bounded(Y·ω) ∧ UniformContinuous(Y·ω)."],[],[],2,"Predicate over a version `Y` with `∀ᵐ ω, UniformContinuous (Y · ω)` and bounded range.",1,0,[]],[6,0,"2.1.4",5,17,"Oxtoby–Ulam tightness","Every Borel probability measure on a complete separable metric space is tight: for every ε>0 there is compact K with μ(K)>1−ε.",["(S,d) complete and separable metric.","μ a Borel probability measure on S.","ε>0."],[],["∀μ ∀ε>0, ∃ compact K, μ(K)>1−ε."],["Exercise 2.1.6"],[],2,"A theorem from Polish/Radon probability-measure infrastructure, stated using `IsTightMeasure μ` or compact inner regularity.",1,0,["The text cross-reference says 'Exercise 2.6'; the relevant exercise is 2.1.6. Treat as a typographical cross-reference error."]],[7,0,"2.1.5",5,17,"Continuous process as a Cᵤ(T,d)-valued random variable","If (T,d) is totally bounded and X has bounded uniformly d-continuous sample paths, then ω↦X(·,ω) is a measurable random variable with values in the separable Banach space Cᵤ(T,d), and its Borel law is tight.",["(T,d) totally bounded pseudometric.","X jointly/coordinate measurability sufficient for the induced map.","Almost-sure bounded uniformly d-continuous paths."],["Functions at d-distance zero are identified, or Cᵤ is formed on the metric quotient.","The supremum norm is used."],["For every such X, the path map is Borel measurable and its law is tight."],[],[],3,"Define `BoundedContinuousFunction`/uniformly continuous bounded maps on the metric quotient; prove measurability via countable dense evaluation maps and tightness via Polish-space measure theory.",2,0,[]],[8,0,"2.1.6",2,17,"Separable Banach spaces as function spaces","For a separable Banach space B, choose a countable weak-* dense norming set D in the dual unit ball. The map x↦(f↦f(x)) embeds B linearly and isometrically into Cᵤ(D,d), where d is any metric inducing the weak-* topology on D. Hence a B-valued random variable yields a process indexed by D whose supremum norm is the B-norm.",["B separable Banach.","D countable norming subset of the dual unit ball, weak-* dense."],[],["∀x∈B, ‖x‖=sup_{f∈D}|f(x)|."],[],[],3,"Use `StrongDual ℝ B`, Banach–Alaoglu/weak-* metrizability, and the evaluation linear isometry into bounded continuous functions.",2,0,[]],[9,0,"2.1.7",5,18,"Characterisation of tight laws on ℓ∞(T)","A sample-bounded process X has finite-dimensional distributions induced by a tight Borel probability measure on ℓ∞(T) if and only if there exists a totally bounded pseudometric d on T and a version of X with almost surely bounded uniformly d-continuous paths.",["X is a real process indexed by T and sample bounded."],["The cylinder σ-algebra and Borel σ-algebra of ℓ∞(T) differ in general; the assertion is existence of a tight Borel extension with the stated finite-dimensional marginals."],["Tight-law existence ⇔ ∃d total-bounded, ∃version Y, a.s. bounded uniformly d-continuous."],[],[],2,"An equivalence between a `ProbabilityMeasure (BoundedFunction T ℝ)` with prescribed evaluation pushforwards and a path-regular modification; likely requires a custom cylinder-law API.",3,1,[]],[10,0,"2.1.8",1,19,"Gaussian process","X is Gaussian when every finite linear combination ∑ᵢaᵢX(tᵢ) is a real Gaussian random variable; it is centred when all coordinate means vanish.",["A real process X indexed by T."],[],["∀n≥1 ∀t₁…tₙ ∀a₁…aₙ, ∑aᵢX(tᵢ) has a Gaussian law.","Centred: ∀t, E X(t)=0."],[],[],0,"Use `ProbabilityTheory.IsGaussianProcess X P`; centredness as `∀ t, ∫ ω, X t ω ∂P = 0`.",0,0,[]],[11,0,"2.1.9",1,19,"Covariance kernel","A covariance on T is a symmetric function Σ:T×T→ℝ such that for every finite t₁,…,tₙ and a₁,…,aₙ, ∑ᵢⱼaᵢaⱼΣ(tᵢ,tⱼ)≥0.",["An index set T."],[],["Symmetric Σ and ∀ finite coefficient families, quadratic form nonnegative."],[],[],9,"A symmetric positive-semidefinite kernel, likely `Matrix.PosSemidef` on every finite restriction or a custom `IsPositiveSemidefiniteKernel` predicate.",1,0,[]],[12,0,"2.1.10",5,19,"Existence from mean and covariance","Given any function f:T→ℝ and covariance kernel Σ on T, there exists a Gaussian process X with E X(t)=f(t) and Cov(X(s),X(t))=Σ(s,t) for all s,t.",["T any index type.","f:T→ℝ.","Σ a covariance kernel in Definition 2.1.9."],["The probability space can be the canonical product space ℝ^T with the cylinder σ-algebra.","Uses Kolmogorov consistency."],["∀f Σ, ∃ probability space and X, ∀t mean=f(t), ∀s t covariance=Σ(s,t)."],[],[],4,"Construct consistent finite-dimensional Gaussian measures and invoke a Kolmogorov extension theorem; mathlib support must be checked for arbitrary index types.",2,1,[]],[13,0,"2.1.11",2,19,"Isonormal process on a separable Hilbert space","For a separable real Hilbert space H with orthonormal basis (ψᵢ) and iid gᵢ∼N(0,1), define X(∑aᵢψᵢ)=∑aᵢgᵢ in L². Then EX(h)=0 and E[X(h)X(k)]=⟨h,k⟩; the map H→V, h↦X(h), is a linear isometry onto the closed Gaussian span V of the gᵢ.",["H separable real Hilbert.","(ψᵢ) orthonormal basis.","(gᵢ) independent standard normals."],["Series convergence is in L²; equality of representatives is up to almost-sure equivalence."],["∀h,k∈H, covariance equals inner product; ‖X(h)‖₂=‖h‖."],[],[],4,"An `Isometry`/linear isometry `H →ₗᵢ[ℝ] Lp ℝ 2 P` constructed from an orthonormal basis and independent Gaussian coordinates.",2,0,[]],[14,0,"unnumbered-2.1-intrinsic-distance",1,20,"Intrinsic pseudometric","For a centred Gaussian process X with covariance Σ, d_X(s,t)^2 := E(X(t)−X(s))^2 = Σ(t,t)+Σ(s,s)−2Σ(s,t).",["X centred Gaussian.","Finite second moments, automatic for Gaussian coordinates."],[],["∀s,t∈T, d_X(s,t)=sqrt(E[(X(t)-X(s))²])."],[],[],4,"A `PseudoMetric` induced by the `L2` distance between coordinate random variables; quotient if definiteness is needed.",1,0,[]],[15,0,"2.1.12",5,20,"Separable version criterion","For a centred Gaussian process X, (T,d_X) is separable if and only if X has a separable measurable strict version.",["X centred Gaussian indexed by T.","d_X as intrinsic pseudometric."],["Measurability means each coordinate random variable is measurable; separability is Definition 2.1.2."],["SeparableSpace(T,d_X) ⇔ ∃ measurable strict version Y that is separable."],[],[],4,"Equivalence using a countable dense set and almost-sure coordinate limits; package modifications with `ae_eq_fun`.",2,0,[]],[16,0,"2.1.13",7,21,"Gaussian zero-one law for measurable linear subspaces","If X is a centred Gaussian process and F⊆ℝ^T is a linear subspace measurable for the cylinder σ-algebra, then Pr(X∈F) is either 0 or 1.",["X centred Gaussian process.","F a linear subspace of ℝ^T.","F cylinder-measurable."],[],["Pr(X∈F)∈{0,1}."],[],[],4,"A zero-one theorem for a Gaussian measure on a product measurable vector space and measurable additive subgroup/submodule.",2,1,[]],[17,0,"2.1.14",0,21,"Zero-one law for measurable pseudonorms","For a centred Gaussian process and a cylinder-measurable pseudonorm N on ℝ^T, Pr(N(X)<∞) is 0 or 1.",["N is a measurable pseudonorm, allowing value ∞.","X centred Gaussian."],[],["Pr[N(X)<∞]∈{0,1}."],[],[],4,"Apply the zero-one law to the measurable linear subspace `{x | N x < ∞}`.",1,0,[]],[18,0,"2.1.15",2,21,"Measurability of Gaussian suprema","For a separable process X with countable separating set T₀, sup_{t∈T}|X(t)| equals sup_{t∈T₀}|X(t)| almost surely; hence it is measurable, and for centred Gaussian X the event of finiteness has probability 0 or 1.",["X separable relative to an appropriate pseudometric.","T₀ is the countable separant."],[],["sup_T |X| = sup_T₀ |X| a.s.; Pr(sup_T|X|<∞)∈{0,1}."],[],[],4,"Countable `iSup` measurability plus an a.e. equality between the full supremum and the dense/countable supremum.",1,0,[]],[19,0,"2.1.16",2,22,"Gaussian Banach-valued random variable","A B-valued random variable X on a separable Banach space is centred Gaussian iff f(X) is a centred real normal random variable for every continuous linear functional f∈B*. It induces the centred Gaussian process f↦f(X) indexed by B*.",["B separable real Banach.","X:B-valued measurable random variable."],[],["∀f∈B*, law(f∘X)=N(0,variance_f)."],[],[],1,"`ProbabilityTheory.HasGaussianLaw X P` or `[ProbabilityTheory.IsGaussian (P.map X)]`, with centring constraints.",0,0,[]],[20,0,"2.1.17",7,22,"Maurey–Pisier convex comparison","Let B be finite-dimensional, X a centred Gaussian B-valued variable, Y an independent copy, f:B→ℝ Lipschitz, and Φ:ℝ→[0,∞) convex measurable. Then E Φ(f(X)−Ef(X)) ≤ E Φ((π/2)·Df(X)[Y]) wherever the a.e. derivative is used, in the precise book formulation.",["B finite-dimensional normed space.","X,Y independent identically distributed centred Gaussian B-valued variables.","f Lipschitz.","Φ nonnegative convex measurable.","Both sides well-defined, allowing +∞ if the book does."],["Rademacher differentiability of f and a measurable choice/version of f′(X).","The Gaussian law may be supported on a proper subspace, reduced to its support."],["Universal factor π/2; quantification over all admissible Φ."],[],[],5,"Finite-dimensional Euclidean reduction; almost-everywhere Fréchet derivative and Bochner/scalar expectation inequality for convex functions.",2,1,["The derivative term and measurability of a derivative representative require a precise formal convention; do not replace it silently by a Clarke derivative or by an arbitrary subgradient."]],[21,0,"2.1.19",2,23,"Finite Gaussian maximum concentration","For a centred jointly Gaussian vector (g₁,…,gₙ), σ²=max_i E gᵢ², and every nonnegative even convex Φ increasing on [0,∞), E Φ(max_i|gᵢ|−E max_i|gᵢ|) ≤ E Φ((π/2)σg), g∼N(0,1). Consequently Pr(max_i|gᵢ|−E max_i|gᵢ|>u) ≤ 2 exp(−u²/(2π²σ²)).",["n≥1.","(gᵢ) jointly centred Gaussian.","Φ as stated.","u>0."],[],["σ²=max variances.","Universal factor π/2 and tail denominator 2π²σ²."],[],[],5,"Specialise Theorem 2.1.17 to the sup norm on `Fin n → ℝ`, then use an exponential/cosh test function and Gaussian MGF.",1,0,[]],[22,0,"2.1.20",7,24,"Integrability and concentration of a separable Gaussian supremum","Let X be a centred separable Gaussian process and assume Pr(sup_t|X(t)|<∞)>0. Then σ²:=sup_t EX(t)²<∞, E sup_t|X(t)|<∞, and the convex-comparison conclusion of Theorem 2.1.17 extends to the supremum. In particular there is the stated Gaussian upper tail, with the book's constant K=1/π² in its parameterisation.",["X centred and separable.","Positive probability of a finite supremum."],["The supremum is measurable by separability.","σ is finite as part of the conclusion."],["∀ admissible Φ; ∀u>0; universal constants exactly as displayed in the book."],[],[],5,"Approximate the countable supremum by finite maxima and pass to limits using monotone/dominated convergence; represent σ as a supremum of variances.",2,1,[]],[23,1,"unnumbered-2.2-spherical-neighbourhood",1,26,"Spherical distance, caps and ε-enlargement","On the unit sphere Sⁿ with geodesic distance, A^ε={x:d(x,A)<ε}; a spherical cap is a geodesic ball/half-space section, and the comparison cap C is chosen with μ(C)=μ(A).",["Uniform probability μ on Sⁿ.","A measurable subset of Sⁿ.","ε>0."],[],["A^ε uses strict distance <ε."],[],[],2,"Use a sphere subtype, geodesic distance, metric neighbourhoods, and normalized surface measure.",2,0,[]],[24,1,"2.2.1",7,27,"Isoperimetric inequality on the sphere","Let A⊆Sⁿ be measurable and nonempty, and C a spherical cap with μ(C)=μ(A). Then for every ε>0, μ(A^ε)≥μ(C^ε) (equivalently μ(C^ε)≤μ(A^ε)).",["n finite.","μ uniform probability on Sⁿ.","A measurable and nonempty.","C a spherical cap of equal μ-measure.","ε>0."],[],["∀ε>0."],["Exercises 2.2.1, 2.2.2, 2.2.3 complete topological/density steps in the proof."],[],2,"A theorem about normalized Hausdorff/surface measure on finite-dimensional spheres and geodesic neighbourhoods.",3,1,[]],[25,1,"2.2.2",4,30,"Poincaré limit lemma","Fix n. If U_{n+m} is uniform on the sphere of radius √(n+m) in ℝ^{n+m}, then its first n coordinates have an explicit density converging pointwise to the standard N(0,I_n) density, and the projected laws converge to γ_n on Borel sets.",["n fixed.","m→∞.","Uniform surface measure on √(n+m)S^{n+m−1} (indexing to be matched exactly to the book)."],["Boundary/index convention for Sⁿ versus ambient dimension must match the book."],["Pointwise density convergence and setwise/weak convergence to γ_n."],[],[],5,"Compute projected spherical density using Gamma constants and prove convergence by dominated convergence/Stirling asymptotics.",2,1,["Sphere-dimension indexing is convention-sensitive; verify the ambient dimension and radius visually before Lean transcription."]],[26,1,"2.2.3",7,31,"Finite-dimensional Gaussian isoperimetry","For standard Gaussian measure γ_n on ℝⁿ, measurable A, and a half-space H with γ_n(H)=γ_n(A), γ_n(A+εO_n)≥γ_n(H+εO_n)=Φ(Φ⁻¹(γ_n(A))+ε) for every ε>0.",["n≥1.","A Borel measurable.","O_n Euclidean closed unit ball.","ε>0."],["Minkowski enlargement is measurable; use completion/analytic measurability if needed."],["∀ε>0; no dimension-dependent constant."],[],[],5,"Gaussian probability measure on `EuclideanSpace ℝ (Fin n)`; half-space quantile and Minkowski neighbourhood.",3,1,["For arbitrary Borel A, A+εO may be analytic rather than Borel. State the measure using completion or prove the required measurability."]],[27,1,"unnumbered-2.2-product-gaussian",1,31,"Canonical product Gaussian measure","γ is the countable product ⨂_{k∈ℕ}N(0,1) on ℝ^ℕ with its cylindrical/product σ-algebra; O is the closed unit ball of ℓ² embedded in ℝ^ℕ.",["Countable product measurable space."],[],["Coordinate projections are iid standard normal."],[],[],4,"A countable product probability measure and the subset `{x : Summable (fun k => (x k)^2) ∧ tsum ... ≤ 1}`.",2,0,[]],[28,1,"2.2.4",7,32,"Infinite-product Gaussian isoperimetry","For every cylindrical/product-Borel A⊆ℝ^ℕ and ε>0, γ(A+εO)≥Φ(Φ⁻¹(γ(A))+ε), where O is the ℓ² unit ball.",["A measurable in the product σ-algebra.","ε>0."],["A+εO may only be universally/completion measurable."],["Dimension-free; ∀ε>0."],["Exercises 2.2.5–2.2.7 supply the compact projection argument and extension to all measurable A."],[],5,"Project to finite coordinates, apply finite-dimensional isoperimetry, and pass through compact approximations/tightness.",3,1,["The proof is explicitly delegated to Exercises 2.2.5–2.2.7.","Measurability of Minkowski sums needs an explicit completed-measure treatment."]],[29,1,"2.2.5a",1,32,"ℓ²-direction Lipschitz function","A measurable f:ℝ^ℕ→ℝ is ℓ²-Lipschitz when ‖f‖_{Lip₂}:=sup{|f(x)−f(y)|/‖x−y‖₂ : x≠y, x−y∈ℓ²}<∞.",["f measurable for the product σ-algebra."],[],["Supremum over pairs with ℓ² difference; the denominator is the ℓ² norm."],[],[],9,"A custom Lipschitz-on-Cameron–Martin-directions predicate rather than ordinary `LipschitzWith` on all of ℝ^ℕ.",1,0,[]],[30,1,"2.2.5b",1,32,"Median","For measurable f under γ, M_f:=inf{t∈ℝ:γ(f≤t)>1/2}.",["f measurable.","γ the canonical product Gaussian measure."],["This is the lower median convention with strict >1/2."],["Infimum in ℝ∪{±∞}; finiteness follows in applications."],[],[],2,"An extended-real quantile followed by a finiteness lemma, or a real `sInf` with nonempty/bounded hypotheses.",1,0,[]],[31,1,"2.2.6",7,33,"Gaussian concentration for ℓ²-Lipschitz functions","If f is ℓ²-Lipschitz with median M_f, then for ε>0: γ(f≥M_f+ε)≤1−Φ(ε/‖f‖_{Lip₂}) and γ(f≤M_f−ε)≤1−Φ(ε/‖f‖_{Lip₂}); hence γ(|f−M_f|≥ε)≤2(1−Φ(ε/L))≤exp(−ε²/(2L²)).",["f measurable and ℓ²-Lipschitz.","0<L=‖f‖_{Lip₂}<∞; constant-function case handled separately.","ε>0."],[],["Exact Gaussian tail and exponential constants."],["Exercise 2.2.8 proves the final Gaussian-tail simplification."],[],5,"Apply product isoperimetry to sublevel/superlevel sets and use the directional Lipschitz inclusion.",2,1,["In the printed proof, the lower-tail step appears to reuse the upper sublevel set without changing sign; formalisation should preserve the theorem but flag the proof's set-sign bookkeeping for review."]],[32,1,"2.2.7",7,34,"Borell–Sudakov–Tsirelson concentration about a median","Let X be centred separable Gaussian with Pr(‖X‖∞<∞)>0, M a median of ‖X‖∞, and σ²=sup_t EX(t)². For u>0, both tails around M are ≤1−Φ(u/σ), and Pr(|‖X‖∞−M|>u)≤2(1−Φ(u/σ))≤exp(−u²/(2σ²)).",["X centred, separable, and bounded with positive probability.","M finite median.","σ² finite (deduced from Theorem 2.1.20).","u>0."],[],["No hidden dimension factor; exact σ and 1/2 exponent."],[],[],5,"Realise the countable process as a Lipschitz functional of a Gaussian coordinate sequence, then apply Theorem 2.2.6.",2,1,[]],[33,1,"2.19",0,34,"Mean–median bound","|E‖X‖∞−M|≤√(2/π)σ (with the direction/absolute-value convention exactly as displayed).",["Hypotheses of Theorem 2.2.7."],[],["√(2/π)."],[],[],5,"Integrate the one-sided Gaussian tail or compare with `E|g|`.",0,0,["Verify whether the book states `|E‖X‖−M|` or two separate inequalities; OCR compresses the display."]],[34,1,"2.20",0,34,"BST concentration about the expectation","The median-centred BST bound implies the displayed expectation-centred upper/lower tail estimate (2.20), with the book's explicit shift by √(2/π)σ.",["Hypotheses of Theorem 2.2.7.","u in the range required by the displayed formula."],[],["Shift √(2/π)σ and Gaussian variance proxy σ²."],[],[],5,"Substitute the mean–median estimate into the median tail inequalities.",0,0,["The exact one-sided display must be checked visually because OCR does not preserve its brackets reliably."]],[35,1,"2.2.8",0,34,"Moments of the supremum","Under Theorem 2.2.7, for every p≥1, (E‖X‖∞^p)^{1/p}≤2E‖X‖∞+(E|g|^p)^{1/p}σ≤K√p·E‖X‖∞ for a universal K.",["p≥1.","g standard normal.","X as in Theorem 2.2.7."],[],["Universal K independent of p and X."],[],[],5,"Integrate the BST tail; use Gaussian moment bounds and lower comparison of σ by `E‖X‖∞`.",1,0,[]],[36,1,"2.2.9",0,35,"Exact logarithmic tail and square-exponential threshold","For X as in Theorem 2.2.7, lim_{u→∞}u^{-2}log Pr(‖X‖∞>u)=−1/(2σ²), and E exp(λ‖X‖∞²)<∞ iff λ<1/(2σ²).",["σ>0 for the displayed reciprocal; the degenerate σ=0 case is separate.","λ∈ℝ."],[],["Sharp threshold 1/(2σ²)."],[],[],5,"Upper bound from BST; lower bound from any coordinate whose variance approaches σ²; tail-integral criterion for exponential square moments.",1,0,[]],[37,2,"unnumbered-2.3-subgaussian-rv",1,36,"Sub-Gaussian random variable","A centred real random variable ξ is sub-Gaussian with variance proxy σ² when E exp(λξ)≤exp(λ²σ²/2) for every λ∈ℝ.",["ξ measurable and integrable/centred.","σ≥0."],[],["∀λ∈ℝ."],[],[],5,"Predicate `∀ λ : ℝ, mgf ξ λ ≤ exp (λ^2*σ^2/2)` with integrability encoded by finiteness.",0,0,[]],[38,2,"unnumbered-2.3-psi2",1,37,"ψ₂ Orlicz norm","‖ξ‖_{ψ₂}:=inf{c>0:E exp(ξ²/c²)≤2}; L_{ψ₂} is the class where this is finite.",["ξ a real random variable."],["The infimum is over positive real c and is a norm modulo almost-sure equality under the stated Orlicz convention."],["Threshold 2 is fixed."],["Exercise 2.3.5 proves the Banach/pseudonorm assertion."],[],5,"An Orlicz/Luxemburg norm specialised to `ψ₂(x)=exp(x²)-1`, likely requiring a custom definition.",2,0,[]],[39,2,"2.3.1",4,38,"Equivalent sub-Gaussian formulations","The Laplace bound, Gaussian tail bound, and finite ψ₂ norm imply each other with the explicit constants in the book; in particular a tail Pr(|ξ|≥t)≤2e^{-t²/(2σ²)} implies ‖ξ‖_{ψ₂}≤√6σ, and a centred ψ₂ variable is sub-Gaussian with proxy bounded by a universal multiple of ‖ξ‖_{ψ₂}².",["ξ real; centring required for the MGF implication.","σ>0."],[],["Explicit constants include √6 and the displayed book constants; quantifiers are ∀t>0 and ∀λ∈ℝ."],[],[],5,"A bundle of implications proved by Chernoff optimisation, tail integration, and power-series/MGF estimates.",1,0,["Retain the book's nonoptimal constants; do not normalise to a different ψ₂ convention."]],[40,2,"2.3.2",4,38,"Sub-Gaussian bounds with a prefactor","If a tail or Laplace inequality holds with prefactor C, then ‖ξ‖_{ψ₂}≤√(2(2C+1))σ; if ξ is centred, it is sub-Gaussian with variance proxy 12(2C+1)σ².",["C≥1 or C>0 as in the book.","σ>0.","Centring for the final MGF bound."],[],["√(2(2C+1)); 12(2C+1)."],[],[],5,"Reduce the prefactor inequality to ψ₂ integrability, then invoke Lemma 2.3.1.",0,0,[]],[41,2,"2.3.3",4,39,"ψ₂ norm of a finite maximum","For ξ₁,…,ξ_N, ‖max_{i≤N}|ξᵢ|‖_{ψ₂}≤4√(log N)·max_i‖ξᵢ‖_{ψ₂} (with the small-N convention implicit in the book), and corresponding L^p/maximal bounds follow.",["N finite and at least the range needed for log N; N=1 treated separately.","Each ξᵢ∈L_{ψ₂}."],[],["Factor 4 and √log N."],[],[],5,"Use union bound and the Orlicz definition; finite `Finset.max` and expectation estimates.",1,0,[]],[42,2,"2.3.4",4,40,"Expected maximum of Gaussian/sub-Gaussian variables","If E exp(λξᵢ)≤exp(λ²σᵢ²/2), then E max_{i≤N}ξᵢ≤√(2log N)max_iσᵢ; if the same holds for ±ξᵢ, then E max_i|ξᵢ|≤√(2log(2N))max_iσᵢ.",["Finite N.","MGFs finite and satisfy the displayed bounds."],[],["√(2log N), √(2log(2N))."],[],[],5,"Log-sum-exp/Jensen bound followed by optimisation in λ.",0,0,[]],[43,2,"2.3.5",1,40,"Sub-Gaussian process relative to d","X is sub-Gaussian relative to a pseudometric d when every increment X(t)−X(s) is centred and E exp(λ(X(t)−X(s)))≤exp(λ²d(s,t)²/2) for all λ; a relaxed version permits a fixed prefactor C.",["A real process X on T.","A pseudometric d.","Coordinate/increment measurability."],[],["∀s,t∈T ∀λ∈ℝ; optional universal prefactor C."],[],[],5,"Predicate on increments parameterised by a `PseudoMetricSpace T`.",0,0,[]],[44,2,"unnumbered-2.3-covering",1,41,"Covering number and metric entropy","N(T,d,ε) is the least number of d-balls of radius ε needed to cover T; log N(T,d,ε) is the metric entropy.",["ε>0.","(T,d) pseudometric."],[],["Infimum/minimum over finite covers; value ∞ if no finite cover."],[],[],6,"An `ℕ∞`-valued minimal-cardinality finite cover, with an extended-real logarithm for the entropy integral.",2,0,[]],[45,2,"unnumbered-2.3-packing",1,41,"Packing number","D(T,d,ε) is the largest cardinality of an ε-separated subset; N(T,d,ε)≤D(T,d,ε)≤N(T,d,ε/2).",["ε>0."],[],["Exact radii ε and ε/2."],[],[],6,"A supremum of finite cardinalities of pairwise-separated subsets, plus standard packing-covering inequalities.",1,0,[]],[46,2,"2.3.6",7,41,"Finite chaining entropy bounds","For a finite S⊆T, t₀∈S, and a process sub-Gaussian relative to d, E max_{t∈S}|X(t)|≤E|X(t₀)|+4√2∫₀^{D/2}√(log(2N(T,d,ε)))dε, where D=diam(T); moreover the expected modulus over pairs in S with d(s,t)≤δ is at most (16√2+2)∫₀^δ√(log(2N(T,d,ε)))dε.",["S finite nonempty.","X sub-Gaussian relative to d.","The entropy integrals are interpreted as extended integrals.","δ<diam(T) for the second display."],[],["4√2; 16√2+2; upper limits D/2 and δ; log(2N)."],[],[],6,"Dyadic nets `T_k`, nearest-point maps, telescoping increments, finite maximum bounds, and a Riemann/Lebesgue entropy integral.",2,1,[]],[47,2,"2.3.7",7,43,"Dudley entropy condition for bounded continuous versions","If (T,d) is totally bounded/separable as induced by the finite entropy condition and ∫₀^{diam(T)}√(log N(T,d,ε))dε<∞, then every separable version of a d-sub-Gaussian process has bounded uniformly d-continuous sample paths; the theorem also gives the displayed expectation and modulus bounds obtained by passing from finite subsets.",["X sub-Gaussian relative to d.","Entropy integral finite.","A separable version is chosen for pathwise conclusions."],["The theorem's exact upper limit and factor 2 inside the logarithm follow the displays preceding it."],["Universal constants inherited from Theorem 2.3.6."],[],[],6,"Approximate T by increasing finite dense sets; use monotone convergence and Borel–Cantelli/expectation control for uniform continuity.",2,1,[]],[48,2,"2.3.8",7,45,"Dudley modulus-of-continuity theorem","Under the entropy-integrability hypotheses, a separable version satisfies E sup_{s≠t}|X(t)−X(s)| / ∫₀^{d(s,t)}√(log N(T,d,ε))dε <∞, with 0/0:=0, and hence the corresponding almost-sure modulus bound.",["X sub-Gaussian and separable.","The entropy integral is finite at the relevant scales."],[],["A universal finite bound; denominator exactly the local entropy integral."],[],[],6,"Normalise increments by a deterministic modulus function and apply multiscale chaining on annuli.",3,1,[]],[49,3,"unnumbered-2.4-convex-symmetric",1,48,"Convex symmetric set","C in a real vector space is convex and symmetric when ∑ᵢλᵢxᵢ∈C whenever xᵢ∈C and ∑ᵢ|λᵢ|=1; equivalently C is convex and C=−C.",["Finite families only."],[],[],[],[],9,"Use `Convex ℝ C` and `Set.EqNeg C`/`∀x∈C,-x∈C`; prove equivalence to the balanced-convex finite-combination formulation.",0,0,[]],[50,3,"unnumbered-2.4-minkowski",1,48,"Minkowski sum and scalar dilation","A+B={a+b:a∈A,b∈B} and λA={λa:a∈A}.",["A,B subsets of a real vector space.","λ∈ℝ."],[],[],[],[],9,"Use `Set.image2 (·+·)` and scalar images.",0,0,[]],[51,3,"2.4.1",4,49,"One-dimensional Brunn–Minkowski","For Borel measurable A,B⊆ℝ, Lebesgue measure satisfies m(A+B)≥m(A)+m(B).",["A and B Borel subsets of ℝ."],["A+B need not be Borel; it is analytic and Lebesgue measurable in the completion."],["No finiteness assumption; extended-real inequality."],[],[],9,"Lebesgue-completion measurability of analytic sums plus compact approximation and interval-component argument.",2,0,["The statement's measurability relies on analytic-set/universal measurability; this is not automatic from `MeasurableSet` under continuous images."]],[52,3,"2.4.2",7,49,"Prékopa–Leindler inequality","For 0<λ<1 and nonnegative measurable f,g,φ on ℝⁿ satisfying φ(λx+(1−λ)y)≥f(x)^λg(y)^{1−λ} for all x,y, ∫φ≥(∫f)^λ(∫g)^{1−λ}.",["n finite.","f,g,φ nonnegative measurable.","0<λ<1.","Pointwise interpolation inequality."],["Extended integrals and conventions when an integral is 0 or ∞."],["Dimension-free; exact exponents λ and 1−λ."],[],[],9,"A finite-dimensional Lebesgue-integral theorem; likely substantial new convex-measure infrastructure.",3,1,[]],[53,3,"unnumbered-2.4-logconcave-measure",1,50,"Log-concave measure","A measure μ on ℝⁿ is log-concave when μ(λA+(1−λ)B)≥μ(A)^λμ(B)^{1−λ} for Borel A,B and 0<λ<1.",["The Minkowski combination is measurable in the completion."],[],[],[],[],9,"Predicate on measurable sets, preferably phrased with outer measure or completed measure to avoid analytic-set gaps.",2,0,[]],[54,3,"2.4.3",7,50,"Log-concavity of centred Gaussian measures","Every centred Gaussian measure μ on ℝⁿ is log-concave: μ(λA+(1−λ)B)≥μ(A)^λμ(B)^{1−λ}.",["μ may be degenerate.","A,B Borel.","0<λ<1."],["The measure is represented on its linear support if covariance is singular."],["Exact log-concavity exponent."],[],[],5,"Reduce to the support subspace and apply Prékopa–Leindler to the Gaussian density there.",3,1,["For degenerate Gaussian measures, support-subspace Lebesgue measure and the measurability of λA+(1−λ)B require explicit handling."]],[55,3,"2.4.4",7,51,"Anderson's lemma in finite dimensions","For a centred jointly Gaussian X∈ℝⁿ, measurable convex symmetric C⊆ℝⁿ, and x∈ℝⁿ, Pr(X+x∈C)≤Pr(X∈C).",["C measurable, convex, symmetric.","x arbitrary."],[],["∀x∈ℝⁿ."],[],[],5,"Apply Gaussian log-concavity with A=C+x, B=C−x, λ=1/2.",2,1,["The prose says measurability is superfluous because boundaries of convex sets have Gaussian measure zero. This is not valid without qualification for degenerate Gaussian measures or lower-dimensional convex sets; retain measurability."]],[56,3,"2.4.5",7,51,"Anderson's lemma in a separable Banach space","Let B be separable Banach, X a centred Gaussian B-valued variable, and C⊆B closed, convex, symmetric. Then Pr(X+x∈C)≤Pr(X∈C) for all x∈B. In particular Pr(‖X‖≤ε)>0 for every ε>0.",["B separable Banach.","X centred Gaussian.","C closed convex symmetric.","ε>0."],[],["∀x∈B; ∀ε>0."],[],[],5,"Represent C as a countable intersection of strips from the dual, apply finite-dimensional Anderson, and pass to a limit.",2,1,[]],[57,3,"2.4.6",0,52,"Khatri–Šidák inequality","For a centred jointly Gaussian vector (g₁,…,gₙ) and nonnegative thresholds xᵢ, Pr(∩ᵢ{|gᵢ|≤xᵢ})≥∏ᵢPr(|gᵢ|≤xᵢ).",["Finite centred Gaussian vector.","xᵢ≥0."],[],["Product over all coordinates."],["Exercises 2.4.5 and 2.4.6 supply the induction/conditioning argument used in the proof."],[],5,"Induction on n using Anderson for conditional/translated symmetric intervals.",2,0,[]],[58,3,"2.4.7",7,53,"Berman Gaussian comparison inequality","For centred unit-variance Gaussian vectors X,Y with covariance matrices C¹,C⁰ and ρᵢⱼ=max(|C⁰ᵢⱼ|,|C¹ᵢⱼ|), the difference of lower-orthant probabilities is bounded by the stated sum over i<j of covariance differences divided by √(1−ρᵢⱼ²), times exp(−(threshold_i²+threshold_j²)/(2(1+ρᵢⱼ))). The theorem also gives the absolute symmetric-rectangle bound (2.56) with factor 2/π and |C¹−C⁰|.",["Finite vectors.","Centred jointly Gaussian.","Unit marginal variances.","Threshold vectors as in (2.55) and (2.56).","ρᵢⱼ<1 where denominators are used; limiting convention otherwise."],[],["1/(2π) in one-sided bound; 2/π in symmetric rectangle bound; exact exponential denominator 2(1+ρᵢⱼ)."],["Exercises 2.4.7 and 2.4.8 complete derivative/integration estimates in the proof."],[],5,"Interpolate covariance matrices, differentiate multivariate Gaussian probabilities, integrate the Plackett identity, and bound bivariate densities.",3,1,["The OCR of (2.55) is ambiguous about positive parts, threshold names and inequality orientation. The exact PDF display must be visually transcribed before implementation.","Handle |ρ|=1 by a limiting or degenerate-coordinate reduction; division by zero cannot be left implicit."]],[59,3,"2.4.8",7,55,"Slepian's lemma","Let X,Y be centred Gaussian vectors with EXᵢ²=EYᵢ² and E(XᵢXⱼ)≤E(YᵢYⱼ) for all i,j. Then for all thresholds λᵢ, Pr(∩ᵢ{Yᵢ>λᵢ})≤Pr(∩ᵢ{Xᵢ>λᵢ}), and E maxᵢYᵢ≤E maxᵢXᵢ.",["Finite centred Gaussian vectors.","Equal coordinate variances.","Covariance order entrywise.","Arbitrary real thresholds."],[],["No multiplicative constant in the maximum comparison."],[],[],5,"Specialise Berman's inequality; derive expectation comparison by integrating distribution functions with careful negative-tail handling.",2,1,[]],[60,3,"2.4.9",6,55,"Absolute maximum comparison inequalities","For symmetric Xᵢ and fixed i₀: E maxᵢXᵢ≤E maxᵢ|Xᵢ|≤E|X_{i₀}|+E max_{i,j}|Xᵢ−Xⱼ|≤E|X_{i₀}|+2E maxᵢXᵢ; also adding a common mean-zero variable does not change E maxᵢXᵢ.",["Finite integrable symmetric variables for the displayed chain.","Common additive variable integrable and mean zero."],[],["Factor 2."],[],[],9,"Elementary identities for finite maxima and symmetry; record as helper lemmas despite being printed as a remark.",0,0,[]],[61,3,"2.4.10",0,55,"Increment-metric comparison","If X,Y are centred Gaussian vectors and E(Yᵢ−Yⱼ)²≤E(Xᵢ−Xⱼ)² for all i,j, then E maxᵢYᵢ≤2E maxᵢXᵢ.",["Finite centred jointly Gaussian vectors.","Increment variance domination."],[],["Printed constant 2."],[],["Section 2.8 notes state Fernique proved the stronger optimal constant 1; the core specification must retain the printed constant 2 and may add the sharpened result separately."],5,"Anchor each vector at coordinate 1, augment variances if needed, apply Slepian, then use the absolute-maximum comparison.",2,0,[]],[62,3,"2.4.11",4,56,"Gaussian maxima grow as √log n","For iid standard normals gᵢ, E max_{i≤n}|gᵢ|/√(2log n)→1; the lemma also records a universal lower bound of order √log n for the relevant one-sided/absolute maximum used in Sudakov's proof.",["n→∞.","gᵢ iid N(0,1)."],[],["Asymptotic constant 1 for the absolute maximum; a universal positive constant for the finite-n lower bound."],[],[],5,"Gaussian tail estimates, independence, and convergence of expectations/uniform integrability.",1,0,["The exact wording of part (b), including whether it is `E max g_i` or `E max |g_i|`, must be checked visually; OCR around the lemma is incomplete."]],[63,3,"2.4.12",7,57,"Sudakov lower bound","There is universal K<∞ such that for every centred Gaussian process X and ε>0, ε√(log N(T,d_X,ε))≤K·sup{E max_{t∈S}X(t):S⊆T finite}.",["X centred Gaussian.","ε>0.","Covering number finite or the inequality is interpreted in extended form."],["Packing-covering conversion and selection of an ε-separated finite set."],["Universal K independent of X,T,ε."],[],[],6,"Choose a maximal separated set, compare increments to independent Gaussian coordinates using Slepian, and invoke Gaussian-max lower bounds.",3,1,[]],[64,3,"2.4.13",0,57,"Entropy obstruction to sample boundedness","If liminf_{ε↓0} ε√(log N(T,d_X,ε))=∞, then sup_{t∈T}|X(t)|=∞ almost surely.",["X centred Gaussian."],[],["Limit inferior at zero."],[],[],6,"Contrapositive using finite expected maxima and the zero-one/integrability theorem for a separable bounded version.",1,0,[]],[65,3,"2.4.14",0,58,"Entropy necessity for sample continuity","If X is a sample-continuous centred Gaussian process, then lim_{ε↓0} ε√(log N(T,d_X,ε))=0.",["X has a version with bounded uniformly d_X-continuous paths."],[],["Limit equals zero."],[],[],6,"Apply Sudakov to the increment process restricted to pairs with d_X≤δ, then let δ↓0 using expected modulus convergence.",2,0,[]],[66,3,"2.61",0,59,"Matching entropy bounds under regular variation","Under the stated two-sided regular-variation control of log N(T,d_X,1/τ), the Dudley upper and Sudakov lower bounds combine to give K^{-1}σ_X√(log N(T,d_X,σ_X))≤E sup_t|X(t)|≤Kσ_X√(log N(T,d_X,σ_X)).",["The metric entropy has the regular-variation comparability described in the surrounding paragraph.","σ_X is the natural process scale."],[],["A finite comparability constant K."],[],[],6,"A corollary parameterised by a regular-variation/comparability hypothesis on the entropy function.",1,0,[]],[67,4,"2.5.1",1,60,"Entropy of a nonnegative function","For a probability μ and f≥0, Ent_μ(f):=∫f log f dμ−(∫f dμ)log(∫f dμ), finite under ∫f log(1+f)<∞ and +∞ otherwise.",["μ probability measure.","f measurable nonnegative."],["0 log 0:=0; extended-real conventions."],["No normalization ∫f=1 required."],[],[],9,"An `ENNReal`/`EReal`-valued functional with explicit integrability branch and conventions at zero.",1,0,[]],[68,4,"2.5.2",4,61,"Variational formula for entropy","Ent_μ(f)=sup{∫fg dμ:g measurable and ∫e^g dμ≤1}.",["μ probability.","f≥0 measurable.","Integrability/extended-value conventions."],[],["Supremum over all measurable real g satisfying the exponential integral constraint."],[],[],9,"Convex duality/Gibbs variational principle in extended real arithmetic.",2,0,[]],[69,4,"2.5.3",5,61,"Tensorisation of entropy","For P=μ₁⊗⋯⊗μₙ and nonnegative measurable f, Ent_P(f)≤∑_{i=1}^n∫Ent_{μᵢ}(f with all other coordinates fixed)dP.",["Finite product of probability spaces.","f nonnegative measurable."],["Section entropies are measurable and extended integrals are well-defined."],["Sum over exactly n coordinates."],[],[],9,"Induction on finite products, using conditional sections and Fubini/Tonelli.",2,0,[]],[70,4,"2.5.4",4,62,"Infimum representation of entropy","Ent_μ(f)=inf_{t≥0}∫[f log f−(log t+1)f+t]dμ.",["μ probability.","f≥0 measurable."],[],["Infimum over t≥0 with conventions at t=0."],[],[],9,"Pointwise convex minimisation after integrating; special case `∫f=0` handled separately.",1,0,[]],[71,4,"2.5.5",4,62,"Shifted exponential entropy formula","With φ(u)=e^{-u}+u−1, Ent_μ(e^f)=inf_{u∈ℝ}∫φ(f−u)e^f dμ.",["f measurable with the relevant exponential integrability."],[],["Infimum over all real u."],[],[],9,"Substitute t=e^u in Lemma 2.5.4 and simplify.",0,0,[]],[72,4,"2.5.6",7,62,"Gaussian logarithmic Sobolev inequality","For canonical Gaussian γ_n and C² f:ℝⁿ→ℝ with f² and |∇f|² integrable, Ent_{γ_n}(f²)≤2∫|∇f|²dγ_n.",["n≥1.","f twice continuously differentiable.","f² and squared gradient γ_n-integrable."],[],["Sharp displayed constant 2."],["Exercise 2.5.1 supplies the approximation reducing to f²=e^g with smooth compactly supported g."],[],5,"Finite-dimensional Gaussian integration and Prékopa–Leindler/Taylor expansion; approximation theorem is a separate exercise declaration.",3,1,[]],[73,4,"2.5.7",7,64,"Herbst concentration for Gaussian Lipschitz functions","If X∼N(0,I_n) and F:ℝⁿ→ℝ is 1-Lipschitz, then E exp(λF(X))≤exp(λEF(X)+λ²/2) for every λ∈ℝ; hence Pr(F−EF≥t)≤e^{-t²/2} and Pr(F−EF≤−t)≤e^{-t²/2}.",["F measurable and 1-Lipschitz.","EF finite, automatic.","t>0, λ∈ℝ."],[],["Variance proxy 1; scale by L² for L-Lipschitz F."],["Exercise 2.5.2 completes the smoothing/approximation from smooth F to arbitrary Lipschitz F."],[],5,"Apply log-Sobolev to `exp(λF/2)`, derive differential inequality for log MGF, then Chernoff optimise.",2,1,[]],[74,4,"2.5.8",7,65,"BST concentration about the expectation","For a centred separable Gaussian process X with finite supremum and σ²=sup_tEX(t)², Pr(‖X‖∞≥E‖X‖∞+u)≤e^{-u²/(2σ²)} and Pr(‖X‖∞≤E‖X‖∞−u)≤e^{-u²/(2σ²)}.",["X centred separable Gaussian with finite supremum a.s./positive probability as in prior BST results.","u>0."],[],["Exact variance proxy σ² and exponent 1/2."],[],[],5,"Finite-coordinate approximation of the supremum as a Lipschitz function of a standard Gaussian vector, followed by monotone convergence.",2,1,[]],[75,5,"2.6.1",1,67,"RKHS of a centred Gaussian process","Let F be the closed linear span in L²(Pr) of {X(t):t∈T}. The RKHS H is {h:T→ℝ | h(t)=E[kX(t)] for some k∈F}; the map k↦h is an isometry and ⟨h₁,h₂⟩_H=E[k₁k₂].",["X centred Gaussian process.","Coordinates in L²."],["The representing k is unique in the closed span F."],["∀t, h(t)=E[kX(t)]."],[],[],7,"Define a linear isometry from the closed subspace `F : Submodule ℝ (Lp ℝ 2 P)` to a function space `T → ℝ`; define H as its range with transported Hilbert structure.",2,1,[]],[76,5,"2.6.2",2,67,"RKHS of the orthogaussian sequence","For the coordinate process X_n=g_n on ℝ^ℕ with iid standard normals, the RKHS is ℓ² embedded in ℝ^ℕ, with its usual inner product.",["Countably many iid standard normals."],[],["H={h:∑h_n²<∞}; ‖h‖_H²=∑h_n²."],[],[],7,"Identify the Gaussian closed span with `ℓ²` and the covariance map with the coordinate embedding.",1,0,[]],[77,5,"2.6.3",4,68,"Bochner integrability criterion for Gaussian Banach variables","For a centred Gaussian random variable X in a separable Banach space, X is Bochner integrable iff E‖X‖<∞; in that case it is Pettis integrable and the Bochner and Pettis integrals agree.",["B separable Banach.","X strongly/Borel measurable Gaussian."],[],["Equivalence with first moment finiteness."],[],[],3,"Use mathlib's `Integrable` iff norm integrable for strongly measurable functions; connect Bochner and Pettis integral evaluations by continuous linear maps.",1,0,[]],[78,5,"2.6.4",1,68,"RKHS of a centred Gaussian Banach-valued variable","Let F be the closed span in L² of {f(X):f∈B*}. Define H={E[kX]:k∈F}⊆B with inner product transported from F by the isometry φ(k)=E[kX].",["B separable Banach.","X centred Gaussian B-valued.","Bochner integrability of kX for k∈F."],["E[kX] is a Bochner integral; the map is injective on F."],["‖E[kX]‖_H=‖k‖₂."],[],[],7,"A Hilbert subspace/range of the covariance map `Lp → B`, with a transported norm and continuous inclusion.",2,1,[]],[79,5,"unnumbered-2.6-covariance",1,68,"Covariance bilinear form","C_X(f,g):=E[f(X)g(X)] for f,g∈B*.",["X centred Gaussian Banach-valued.","f,g continuous linear functionals."],[],["Bilinear symmetric positive-semidefinite form."],[],[],4,"A continuous/nonnegative bilinear form on `StrongDual ℝ B`, after proving integrability.",1,0,[]],[80,5,"2.6.6",4,69,"Weak-* sequential continuity of the covariance map","The map ϕ:B*→H, ϕ(f)=E[f(X)X], is weak-* sequentially continuous.",["B separable Banach.","X centred Gaussian B-valued.","f_n→f weak-*."],[],["f_n→w* f implies ‖ϕ(f_n)−ϕ(f)‖_H→0."],[],[],7,"Show `f_n(X)→f(X)` in probability and, for Gaussian differences, in L²; identify the H norm with L².",2,0,[]],[81,5,"2.6.7",2,69,"RKHS of Brownian motion","For Brownian motion W on [0,1], H={h:h(0)=0, h absolutely continuous, h′∈L²[0,1]}, with ⟨h,k⟩_H=∫h′k′ and ‖h‖_H²=∫(h′)².",["W standard Brownian motion as a C[0,1]-valued Gaussian variable/process."],[],["Boundary condition h(0)=0."],[],[],7,"Identify the covariance span of evaluation measures with primitives of L² functions; use absolutely continuous/Sobolev representation.",2,1,[]],[82,5,"2.6.8",5,70,"Dual characterisation of the RKHS","H={x∈B:sup_{f∈B*} f(x)²/C_X(f,f)<∞}, with the convention for zero denominators, and ‖x‖_H² equal to that supremum.",["B separable Banach.","X centred Gaussian.","C_X covariance form."],["If C_X(f,f)=0, finiteness forces f(x)=0; quotient convention must be explicit."],["Supremum over all continuous linear f."],["Exercise 2.6.4 supplies the proof."],[],7,"A Riesz-representation theorem on the closed Gaussian span, with an extended-real Rayleigh quotient.",2,0,[]],[83,5,"2.6.9",5,70,"Topological properties of the RKHS","For a centred Gaussian variable in a separable Banach space, H is a separable Hilbert space and a Borel/measurable subset of B; the inclusion H→B is continuous and the closed H-unit ball is compact in B.",["B separable Banach.","X centred Gaussian B-valued."],[],["Compactness of O_H={h:‖h‖_H≤1} in the B norm."],[],[],7,"Construct a countable ONB, prove compactness via covariance-tail approximations and a countable norming set; package inclusion as a compact linear map.",3,1,[]],[84,5,"2.6.10",7,71,"Karhunen–Loève expansion in a Banach space","Let (k_j) be a complete orthonormal system of the Gaussian closed span F. Then ∑_j E[k_jX]·k_j converges almost surely in B to X. Equivalently, for an ONB (h_j) of H, X=∑_j φ⁻¹(h_j)h_j almost surely in B.",["B separable Banach.","X centred Gaussian B-valued.","(k_j) ONB of F."],["Products are scalar random coefficients times deterministic B-vectors.","Series convergence is in the B norm."],["Almost-sure convergence of the full sequence of partial sums."],[],[],7,"Orthogonal expansion in L² plus Lévy maximal inequality and a countable norming set to upgrade scalar convergence to B-valued a.s. convergence.",3,1,[]],[85,5,"2.6.11",0,72,"Gaussian measure of its RKHS","Pr(X∈closure_B H)=1. If H is finite-dimensional, Pr(X∈H)=1; if H is infinite-dimensional, Pr(X∈H)=0.",["X and H as above."],[],["Dichotomy by finite/infinite Hilbert dimension."],[],[],7,"Use a.s. series convergence for support; in infinite dimension, the H norm of Gaussian partial sums diverges almost surely.",2,0,[]],[86,5,"2.6.12",7,73,"Gaussian isoperimetry in a Banach space","Let O_H be the RKHS unit ball and μ the law of centred Gaussian X in separable Banach B. For Borel A⊆B and ε>0, μ(A+εO_H)≥Φ(Φ⁻¹(μ(A))+ε).",["B separable Banach.","X centred Gaussian.","A Borel.","ε>0."],["A+εO_H may require completion/analytic measurability."],["No dimension factor; RKHS-radius ε."],[],[],7,"Pull A back along Gaussian coordinates in the KL expansion and apply product Gaussian isoperimetry.",3,1,["The statement writes μ(A+εO_H) for a set not automatically Borel. Use completed measure/outer measure or prove analytic measurability."]],[87,5,"2.6.13",7,73,"Cameron–Martin theorem","For centred Gaussian μ on separable Banach B with RKHS H: if h∈H, the translate τ_hμ is equivalent to μ and d(τ_hμ)/dμ(x)=exp(φ⁻¹(h)(x)−‖h‖_H²/2) μ-a.e.; if h∉H, τ_hμ and μ are mutually singular.",["B separable Banach.","μ centred Gaussian.","h∈B.","φ:F→H the RKHS isometry."],["φ⁻¹(h) is an L²(μ) equivalence class, not generally a pointwise continuous linear functional.","Translation sign convention τ_hμ(A)=μ(A−h) must be fixed."],["Exponent −‖h‖²/2 and coefficient 1."],[],[],7,"Radon–Nikodym derivative for translated measures, represented by an `Lp` Gaussian linear functional; singularity via finite-dimensional coordinate likelihood ratios.",3,1,["Do not model `φ⁻¹(h)(x)` as an everywhere-defined continuous linear functional on B; it is only a measurable linear functional/L² class μ-a.e.","Fix and document the translation convention, since it determines the sign in the exponent."]],[88,5,"2.6.15",2,75,"Gaussian variables in a Hilbert space","If B has ONB e_i and X=∑λ_i g_i e_i with ∑λ_i²<∞, then H={h=∑h_i e_i:∑h_i²/λ_i²<∞}, with inner product ∑h_i k_i/λ_i², omitting/handling zero λ_i coordinates appropriately.",["B separable Hilbert.","g_i iid standard normal.","(λ_i) square summable."],["If λ_i=0, H requires h_i=0 and the quotient is not formed naively."],["Weighted ℓ² norm."],[],[],7,"A diagonal covariance operator and weighted `ℓ²` subspace; represent zero eigenvalues by support restrictions.",2,0,[]],[89,5,"2.6.16",5,75,"Equivalence or singularity for translated product Gaussians","For μ=⊗_iN(0,σ_i²) on ℝ^ℕ, translation by h is equivalent to μ iff ∑h_i²/σ_i²<∞, in which case the density is exp(∑h_ix_i/σ_i²−½∑h_i²/σ_i²); otherwise the measures are singular.",["σ_i>0 unless zero-variance coordinates are separately treated.","Product/cylindrical σ-algebra.","h∈ℝ^ℕ."],[],["Exact weighted ℓ² criterion and exponent."],[],[],7,"Finite-product RN derivatives, martingale/L² convergence of likelihood ratios, and Kakutani-type singularity criterion.",3,1,[]],[90,5,"2.6.17",0,77,"Support of a centred Gaussian measure","The topological support of μ is the B-norm closure of its RKHS H.",["μ centred Gaussian Borel probability on separable Banach B."],[],["Equality of closed subsets of B."],[],[],7,"Show every ball around H has positive μ-measure by Cameron–Martin and Anderson; show μ is carried by closure H via KL expansion.",2,0,[]],[91,5,"2.6.18",0,77,"Shifted small-ball lower bound","For h∈H and ε>0, Pr(‖X−h‖<ε)≥exp(−‖h‖_H²/2)Pr(‖X‖<ε).",["X centred Gaussian in separable Banach B.","h∈H.","ε>0."],[],["Factor exp(−‖h‖²/2)."],[],["The notes identify this consequence as observed by Borell and other authors."],7,"Use the Cameron–Martin density, symmetry/Anderson, and Jensen or a half-space argument.",2,0,["Check strict `<ε` versus closed `≤ε` balls; later use invokes continuity of the norm distribution to switch boundaries."]],[92,5,"unnumbered-2.6-concentration-function",1,77,"Gaussian concentration function","For x in closure_B H and ε>0, φ_x(ε):=inf{½‖h‖_H²−log Pr(‖X‖<ε):h∈H, ‖h−x‖<ε}.",["x∈closure H.","ε>0.","Small-ball probability positive by Anderson/support."],[],["Coefficient 1/2; the approximation radius and small-ball radius are both ε."],[],[],7,"An extended-real infimum over the RKHS subtype, with positivity/finite-value lemmas.",1,0,[]],[93,5,"2.6.19",5,78,"Concentration function bounds shifted small balls","For x∈closure H and ε>0, φ_x(ε)≤−log Pr(‖X−x‖<ε)≤φ_x(ε/2).",["X centred Gaussian B-valued.","x∈closure H.","ε>0."],[],["Radii ε and ε/2 exactly."],[],["Notes say this precise form is due to van der Vaart–van Zanten and is used later in Bayesian applications."],7,"Upper bound via an RKHS approximant; lower bound via the minimum-norm approximant and Cameron–Martin/Anderson.",3,1,[]],[94,5,"2.6.20",4,78,"Minimum-norm RKHS approximant","As printed/OCR, for x in the support closure and ε>0, define B_{ε,x}:={h∈H: ||h−x||_B < ε}. The text claims that inf_{h∈B_{ε,x}} ||h||_H is attained at a unique h₀∈B_{ε,x}.",["x∈closure H.","ε>0.","B_{ε,x} nonempty."],[],["Variational inequality for all h in the feasible convex set."],[],[],7,"Metric projection of 0 onto a nonempty closed convex subset of H, with compactness of bounded H-balls in B used to prove feasibility/closedness.",2,0,["The displayed set is OCR-transcribed with the strict inequality `||h−x||<ε`, but the proof uses a closed convex feasible set and boundary arguments. Open-ball attainment is generally false. Check the printed PDF: this is likely a `<`/`≤` typographical or OCR issue, and no formal statement should be generated until central review resolves it."]],[95,5,"2.6.21",4,79,"Sign of the Cameron–Martin functional on the shifted ball","With h_ε from Lemma 2.6.20, φ⁻¹(h_ε)≥0 almost surely on {‖X+h_ε−x‖<ε}.",["All notation from Proposition 2.6.19 and Lemma 2.6.20."],[],["Almost-sure statement restricted to the displayed event."],[],[],7,"Use KL partial sums in H, the variational inequality, L² convergence of the inner products, and an almost-sure subsequence.",2,0,[]],[96,5,"unnumbered-2.6-integrated-bm",1,79,"Integrated and released Brownian motions","I_{0+}f(t)=∫₀^t f(s)ds, iterated as I_{0+}^k; the released k-times integrated Brownian motion is W_k(t)=I_{0+}^kW(t)+∑_{j=0}^k t^j g_j/j! with independent standard Gaussian release variables.",["W Brownian motion on [0,1].","Release variables independent of W and each other."],[],["Polynomial coefficients 1/j!."],[],[],4,"Iterated Bochner/Lebesgue integral operator on continuous paths and a finite Gaussian polynomial process.",2,0,[]],[97,5,"2.6.22",4,79,"RKHS of integrated Brownian motion","The RKHS of I_{0+}^kW consists of functions h with h^{(j)}(0)=0 for 0≤j≤k, h^{(k)} absolutely continuous and h^{(k+1)}∈L²; its norm is ‖h^{(k+1)}‖₂.",["k∈ℕ∪{0}.","Functions on [0,1]."],[],["k+1 derivative in L²; k+1 zero initial conditions."],[],[],7,"Apply the RKHS-under-injective-continuous-linear-map exercise to iterated integration and identify the range as a Sobolev/AC space.",2,1,[]],[98,5,"2.6.23",4,80,"RKHS of the release polynomial","For Z_k(t)=∑_{j=0}^k t^jg_j/j!, the RKHS is the space of polynomials of degree at most k, with ⟨P,Q⟩=∑_{j=0}^kP^{(j)}(0)Q^{(j)}(0).",["g_0,…,g_k independent standard normal."],[],["Derivative values at zero; no factorial remains in the norm because of the chosen basis."],[],[],7,"Finite-dimensional Gaussian coefficient map and transported Euclidean inner product.",1,0,[]],[99,5,"2.6.24",5,80,"RKHS of released integrated Brownian motion","The RKHS H_{W,k} of W_k is the Sobolev-type space of functions whose kth derivative is absolutely continuous and whose (k+1)st derivative is in L², with inner product ∑_{j=0}^k f^{(j)}(0)g^{(j)}(0)+∫f^{(k+1)}g^{(k+1)}.",["k∈ℕ∪{0}.","Independent sum of integrated Brownian and release polynomial."],[],["Boundary derivative sum j=0,…,k plus L² derivative term."],[],[],7,"RKHS of an independent Gaussian sum as the Hilbert direct-sum/range sum, then identify the unique decomposition by Taylor boundary data.",3,1,[]],[100,5,"2.83",0,81,"Entropy of the released integrated-Brownian RKHS ball","For the unit ball of H_{W,k} in the supremum norm, log N(H_{W,k,1},‖·‖∞,ε)≤C_k ε^{-1/(k+1)} for small ε.",["k fixed.","ε in the small-radius range."],[],["Exponent 1/(k+1); constant C_k."],[],["This estimate is imported from later Corollary 4.3.38; it is an explicit forward dependency and must not be proved circularly inside Chapter 2."],6,"Reference a later Sobolev-ball metric-entropy theorem; in staging, declare a dependency node rather than an axiom hidden in the Chapter 2 file.",2,1,[]],[101,5,"unnumbered-2.6-smallball-zero",1,82,"Centred small-ball concentration","φ₀^X(ε):=−log Pr(‖X‖<ε).",["ε>0.","The small-ball probability is positive for centred Gaussian X in its support."],[],["Natural logarithm."],[],[],7,"A real/extended-real function of ε using `Measure` of an open norm ball.",0,0,[]],[102,5,"2.6.26",7,82,"Supremum-norm small balls for Brownian motion","There exists C∈(0,∞) such that for 0<ε≤1, −Cε^{-2}≤log Pr(‖W‖∞<ε)≤−C^{-1}ε^{-2}.",["W standard Brownian motion on [0,1].","0<ε≤1."],[],["Two-sided exponent 2; one finite positive C."],[],[],7,"Use a Schauder/Haar series representation and independent Gaussian coefficient estimates for the lower bound; discretisation/increments for the upper bound.",3,1,[]],[103,5,"2.6.27",0,84,"Small balls for released Brownian and its integrals","The released Brownian W₀=g+W has the same ε^{-2} two-sided logarithmic small-ball order; for every k, a rough lower bound log Pr(‖W_k‖∞<ε)≥−C_kε^{-2} holds for small ε.",["g independent standard normal.","k∈ℕ∪{0}.","ε sufficiently small."],[],["Exponent 2; constants depend on k."],[],[],7,"Product/independence lower bounds and norm bounds for integration plus release coefficients.",1,0,[]],[104,5,"2.6.28",4,84,"Kuelbs–Li entropy/small-ball inequality","For centred Gaussian X with RKHS unit ball H₁ and φ₀(ε)=−log Pr(‖X‖<ε), for every λ,ε>0: φ₀(2ε)≤log N(H₁,ε/λ)−log Φ(λ+Φ⁻¹(e^{-φ₀(ε)})).",["X centred Gaussian in separable Banach B.","λ>0, ε>0."],[],["Radii 2ε and ε/λ; exact normal-quantile term."],[],["Notes attribute the result to Kuelbs–Li."],7,"Cover λH₁ by ε-balls, compare translated balls by Anderson, and apply Gaussian isoperimetry.",3,1,[]],[105,5,"2.6.29",7,85,"Entropy-to-small-ball exponent transfer","If φ₀(ε)≤C₁ε^{-γ} and log N(H₁,ε)≤C₂ε^{-α} for small ε, with 0<α<2, then φ₀(ε)≤C₃ε^{-2α/(2−α)} for small ε.",["C₁,C₂,γ>0.","0<α<2.","Both hypotheses hold below some radius."],[],["Conclusion exponent 2α/(2−α); C₃ depends on the input constants."],[],["Notes say a stronger result appears in Li–Linde."],7,"Iterate the nonlinear inequality from Lemma 2.6.28 after choosing λ≈√φ₀(ε); formalise a discrete recursion and exponent algebra.",3,1,[]],[106,5,"2.6.30",0,86,"Small-ball concentration of released integrated Brownian motion","For every k∈ℕ∪{0}, φ₀^{W_k}(ε)≤C_k ε^{-2/(2k+1)} for all sufficiently small ε.",["W_k released k-times integrated Brownian motion."],[],["Exponent 2/(2k+1)."],[],["The notes state that the inequality is actually two-sided; the printed chapter only proves/records the upper bound.","The result is explicitly announced as used later in Bayesian density estimation."],7,"Instantiate the entropy exponent α=1/(k+1) in Theorem 2.6.29 and simplify 2α/(2−α)=2/(2k+1).",2,1,[]],[107,6,"2.7.1",7,89,"Gumbel limit for iid absolute Gaussian maxima","For iid g_i∼N(0,1), n≥e², a_n=√(2log n), b_n=a_n−(log log n+log π)/(2a_n). For every x∈ℝ, Pr(a_n(max_{i≤n}|g_i|−b_n)≤x)→exp(−e^{-x}).",["iid standard normal sequence.","n→∞.","x fixed real."],[],["Exact a_n and b_n; Gumbel CDF exp(−e^{-x})."],[],[],8,"Asymptotic expansion of Gaussian tails, powers of the distribution function, and real-limit algebra.",2,1,[]],[108,6,"2.7.2",1,89,"Stationary sequence","A sequence ξ_n is stationary when for every finite n₁,…,n_m and shift k≥0, the joint law of (ξ_{n₁+k},…,ξ_{n_m+k}) is independent of k. For a centred Gaussian sequence this is equivalent to Eξ_mξ_{m+n} being independent of m; r(n) denotes that covariance.",["Sequence of real random variables.","Finite-dimensional law equality for all shifts."],[],["∀m≥1 ∀indices n_i ∀k≥0."],[],[],4,"Predicate on equality of pushforward measures for all finite index tuples; Gaussian covariance characterisation as a theorem.",2,0,[]],[109,6,"2.7.3",4,90,"Covariance-sum estimate for Gaussian sequence extremes","Let sup_n|r_n|<1, r_n log n→0, and positive u_n satisfy sup_n n(1−Ψ(u_n))<∞, where Ψ is the CDF of |N(0,1)|. Then ∑_{j=1}^n n|r_j| exp(−u_n²/(1+|r_j|))→0.",["A real sequence r_j.","Uniform strict correlation bound.","Berman decay r_n log n→0.","Positive thresholds u_n with bounded expected exceedance count."],[],["The exact prefactor n and denominator 1+|r_j|."],[],[],8,"Split the sum at n^α, use Gaussian-tail asymptotics and the covariance decay condition.",2,1,[]],[110,6,"2.7.4",7,90,"Gumbel limit for stationary Gaussian sequences","Let (ξ_n) be stationary standard normal with covariance r_n satisfying r_n log n→0. With a_n,b_n from Theorem 2.7.1, for every x∈ℝ, Pr(a_n(max_{i≤n}|ξ_i|−b_n)≤x)→exp(−e^{-x}).",["Stationary jointly Gaussian sequence.","Every coordinate standard normal.","Covariance decay r_n log n→0."],["The comparison theorem also needs correlations away from ±1; stationarity/nondegeneracy supplies or must separately assume the needed bound."],["Same normalisation as iid case."],[],[],8,"Apply Berman's symmetric-rectangle comparison between the dependent vector and iid normals, then use Lemma 2.7.3.",3,1,["The printed theorem states only r_n log n→0; verify how the proof handles any finite lag with |r_j|=1 and whether nondegeneracy is implicit."]],[111,6,"unnumbered-2.7-stationary-process",1,91,"Stationary Gaussian process on [0,∞)","A process ξ(t) is stationary when every finite-dimensional law is invariant under common shifts preserving nonnegative times. For centred Gaussian ξ this is equivalent to covariance depending only on lag; r(t)=Eξ(0)ξ(t).",["Process indexed by [0,∞)."],[],["∀ finite t_i and shifts s≥0."],[],[],4,"Shift-invariance of finite-dimensional distributions; for Gaussian processes, reduce to equality of covariance kernels.",2,0,[]],[112,6,"unnumbered-2.7-normalised-process",1,91,"Normalised stationary Gaussian process","A stationary centred Gaussian process is normalised when ξ(0), and hence every ξ(t), is standard normal.",["Stationary centred Gaussian process."],[],["Eξ(t)²=1 for all t."],[],[],4,"Stationarity plus `∀t, variance (ξ t)=1`, reducible to the t=0 condition.",0,0,[]],[113,6,"unnumbered-2.7-pickands-process",1,92,"Pickands tangent process and constant","For α∈(0,2], ζ_α has mean −|t|^α and covariance s^α+t^α−|t−s|^α. With η independent Exp(1), H_α:=lim_{a↓0} a^{-1}Pr(sup_{k∈ℕ}(ζ_α(ak)+η)≤0), whose existence, finiteness and positivity are established in Theorem 2.7.5; H_2=1/√π.",["α∈(0,2].","η independent exponential with mean 1."],[],["Scale 1/a; covariance exactly as displayed."],[],[],8,"Construct a Gaussian process from the covariance kernel, product with an exponential variable, define a one-sided limit in `ℝ≥0∞`, then prove it is finite positive.",3,1,[]],[114,6,"2.7.5",7,92,"Pickands fixed-interval high-excursion asymptotic","Let ξ be normalised centred stationary Gaussian with continuous paths and r(t)<1 for t>0, r(t)=1−C|t|^α+o(|t|^α) as t→0, α∈(0,2], C>0. For h>0, Pr(sup_{t∈[0,h]}ξ(t)>u)/(u^{2/α}h·barΦ(u))→C^{1/α}H_α, where barΦ is the standard normal upper tail.",["Continuous sample paths.","Local covariance condition (2.97).","h>0.","u→∞."],[],["C^{1/α}H_α; q(u)=u^{-2/α} in proof."],[],[],8,"A four-claim discretisation/double-sum proof, finite-dimensional conditional convergence to the tangent process, and control of discretisation errors.",3,1,[]],[115,6,"2.7.6",0,97,"Fixed-interval asymptotic for the absolute supremum","Under Theorem 2.7.5, Pr(sup_{[0,h]}|ξ(t)|>u)/(u^{2/α}h·barΦ(u))→2C^{1/α}H_α. For each a>0 the corresponding grid maximum has the displayed limit involving a^{-1}Pr(sup_k(ζ(C^{1/α}ak)+η)≤0).",["All hypotheses of Theorem 2.7.5.","a>0 for the discretised statement."],[],["Factor 2 in the continuous absolute-value result."],[],[],8,"Inclusion–exclusion for positive/negative excursions plus BST control of simultaneous large opposite excursions.",3,1,[]],[116,6,"2.110-2.111",1,98,"Extreme-value scaling relation","Set μ̄(u)=2C^{1/α}H_α u^{2/α}barΦ(u), and choose T=T(u) so Tμ̄(u)→τ∈(0,∞). This is equivalent to the asymptotic expansion (2.111) for u² in terms of log T, log log T, τ,C,H_α.",["τ>0.","u,T→∞ linked by the relation."],[],["The explicit logarithmic constants are those in (2.111)."],[],[],8,"A lemma equating two asymptotic formulations using Mills ratio and logarithmic expansions.",2,0,["The exact constant term in (2.111) must be transcribed visually; OCR line breaks obscure powers of 2."]],[117,6,"2.7.7",4,98,"Continuous covariance-sum estimate","Assume α∈(0,2), r(0)=1, |r(t)|<1 for t>0, r(t)=1−C|t|^α+o(|t|^α), r(t)log t→0, T and u satisfy (2.111), q=u^{-2/α}, and a>0. Then for every ε>0, (T/q)∑_{ε≤aqk≤T}|r(aqk)|exp(−u²/(1+|r(aqk)|))→0.",["All displayed local and long-range covariance assumptions.","α strictly less than 2 in the printed lemma.","ε,a>0."],[],["Prefactor T/q and grid spacing aq."],["Exercise 2.7.1 supplies the omitted proof."],[],8,"Split the sum at T^β and use the decay envelope δ(t)=sup_{s≥t}|r(s)log s|.",3,1,["The proof is entirely omitted to Exercise 2.7.1.","The lemma excludes α=2 while Proposition 2.7.8 allows α=2; verify whether the α=2 case is immediate or requires a separate version."]],[118,6,"2.7.8",5,99,"Poisson limit for the absolute supremum over increasing intervals","Let ξ satisfy the normalised stationary continuous-path hypotheses, local covariance (2.97), and r(t)log t→0. If Tμ̄(u_T)→τ>0, then Pr(sup_{0≤t≤T}|ξ(t)|≤u_T)→e^{-τ}.",["α∈(0,2] in local condition.","Long-range covariance decay.","Threshold sequence u_T linked to T."],[],["Limit e^{-τ}."],[],[],8,"Block decomposition with gaps, discretisation, Berman comparison to independent blocks, and fixed-block tail asymptotics.",3,1,[]],[119,6,"2.120",1,101,"Normalising constants for continuous-time extremes","a_T=√(2log T) and b_T=a_T+[((2−α)/α)log log T+2log((2π)^{-1/2}2^{(2+α)/α}C^{1/α}H_α)]/(2a_T), exactly as in (2.120).",["T>1.","α∈(0,2], C>0."],[],["All powers of 2 and π exactly as in the display."],[],[],8,"Real-valued definitions plus eventual positivity/nonzero lemmas.",0,0,["The OCR exponent of 2 in the logarithmic constant must be checked visually against the PDF before code generation."]],[120,6,"2.7.9",7,101,"Gumbel limit for stationary Gaussian-process suprema","Under the normalised centred stationary continuous-path assumptions, r(t)<1 for t>0, r(t)=1−C|t|^α+o(|t|^α) at zero, and r(t)log t→0 at infinity, for every x∈ℝ: Pr(a_T(sup_{t∈[0,T]}|ξ(t)|−b_T)≤x)→exp(−e^{-x}).",["α∈(0,2], C>0.","All covariance and continuity conditions.","x fixed."],[],["a_T,b_T from (2.120)."],[],[],8,"Set u_T=b_T+x/a_T, verify the scaling relation with τ=e^{-x}, then apply Proposition 2.7.8.",3,1,[]],[121,7,"2.8.1",7,103,"Generic chaining upper bound","Let (T,d) be countable, X sub-Gaussian relative to d, N_n=2^{2^n}, and T_n⊆T with |T_n|≤N_n and ⋃_nT_n=T. For finite F⊆T, t₀∈F and T₀={t₀}, E max_{t∈F}(X(t)−X(t₀))≤L·max_{t∈F}∑_{n≥0}2^{n/2}d(t,T_n), with universal L=(1+√2)(1+√(3log2))/√(3log2)<5.16; the same bound holds for the supremum over T when finite.",["T countable pseudometric.","X sub-Gaussian.","Admissible sequence T_n with cardinal bounds and union T.","F finite."],[],["N_n=2^{2^n}; weights 2^{n/2}; displayed universal L."],[],[],6,"Admissible nets and nearest-point maps, telescoping paths, a union bound across levels, and tail integration.",3,1,["The OCR of the closed form for L is slightly garbled; verify the numerator `1+√(3 log 2)` visually."]],[122,7,"2.8.2",2,104,"Generic chaining beyond the entropy integral","For T={2,3,…,∞}, X(n)=g_n/√(log n) and X(∞)=0, choose T_n={2,…,N_n,∞}. Then sup_m∑_n2^{n/2}d(m,T_n)<∞, so generic chaining gives a bounded process, while the ordinary Dudley entropy integral diverges; this demonstrates strict improvement of the chaining functional.",["g_n independent standard normals.","Metric d is the intrinsic Gaussian metric."],[],["N_n=2^{2^n}."],[],[],6,"Compute the intrinsic distances and compare a dyadic series with the covering-number entropy integral.",2,0,["The OCR of `X(n)=g_n/√log n` and the exact interval bounding d(n,m) should be visually verified."]],[123,7,"2.124",0,105,"Entropy-number comparison","If e_n(T)=inf{ε:N(T,d,ε)≤N_n}, then ∑_n2^{n/2}e_n(T) is bounded by a universal multiple of ∫₀^{diam T}√(log N(T,d,ε))dε, and conversely the generic-chain bound recovers Dudley's entropy bound by replacing a supremum of sums with a sum of suprema.",["(T,d) totally bounded enough for finite entropy numbers."],[],["N_n=2^{2^n}; factors √log2 and 1−1/√2 as displayed."],[],[],6,"Define entropy numbers in `ℝ≥0∞`, partition the entropy integral into intervals [e_{n+1},e_n], and sum.",2,0,[]],[124,7,"unnumbered-2.8-cyclostationary",1,106,"Cyclostationary Gaussian process","A centred Gaussian process Y(t), t∈ℝ, is cyclostationary when for every lag v, the map t↦E[Y(t)Y(t+v)] is periodic in t with a period independent of v.",["Centred Gaussian process on ℝ."],[],["One common period for all lags."],[],["The notes say such processes approximate wavelet density estimators and introduce the next theorem because it is used later."],8,"A predicate on the covariance kernel with a common positive period, plus centred Gaussian-process data.",1,0,[]],[125,7,"2.8.3",7,106,"Gumbel limit for cyclostationary Gaussian processes","Let X be centred cyclostationary Gaussian of period 1. Assume mean-square differentiability and a.s. continuity; perfect correlation r_X(s,t)=σ_X(s)σ_X(t) only when s=t; σ_X² has a unique maximum 1 at t₀∈(0,1), is C² there with derivative 0, second derivative negative, and E(X′(t₀))²>0; and (log v)sup_{|s−t|≥v}|r_X(s,t)|→0. Then for every x, Pr(a_T(sup_{[0,T]}|X|−b_T)≤x)→exp(−e^{-x}), with a_T=√(2log T) and b_T exactly as displayed in the notes.",["All four numbered hypotheses in the note theorem.","Period exactly 1.","x fixed real."],[],["a_T=√(2log T); b_T uses log log T, log π, E(X′(t₀))² and σ_X²''(t₀) exactly as printed."],[],["The notes explicitly state that this result will be used later."],8,"A quoted major theorem requiring mean-square derivatives, periodic covariance geometry, and an extreme-value limit; formal proof is outside a reasonable core pass.",3,1,["The OCR of b_T is ambiguous. It appears to involve `log(π) − log(1 − E(X′(t₀))² / σ_X²''(t₀))`; transcribe directly from the PDF before implementation.","The condition `r_X(s,t)=σ_X(s)σ_X(t) only at s=t` should be checked for signs and whether absolute correlation was intended."]]],"exercise_fields":["node","section","book_number","book_page","title","precise_statement","explicit_hypotheses","implicit_hypotheses","constants_and_quantifier_order","selection_reasons","cited_or_used_by","equivalence_audit_profile","likely_lean_representation","expected_difficulty","pass","central_review_flags"],"selected_exercises":[[126,0,"2.1.1",25,"Fernique integrability from the chapter bounds","For the separable centred Gaussian process X fixed in the exercise preamble, with ||X||:=sup_t|X(t)| finite with positive probability, prove that there exists α>0 such that E exp(α||X||²)<∞.",[],[],[],["required_reusable_lemma"],["Fernique-type integrability throughout Chapters 2 and 7"],5,"Derive square-exponential integrability by integrating the Gaussian tail bound for ||X||.",1,2,["The OCR suppresses the square on ||X|| in the exponential; the chapter context and later references indicate exp(α||X||²). Verify directly against the PDF."]],[127,0,"2.1.2",25,"Lp moments of a Gaussian supremum","For every p≥1, prove (E||X||^p)^(1/p) ≤ K√p E||X|| for a universal K<∞.",[],[],["∀p≥1; one universal K independent of X and p."],["cited_by_later_result","required_reusable_lemma"],["Corollary 2.2.8"],5,"Integrate the concentration tail, control Gaussian moments, and use σ≤√(π/2)E||X||.",1,2,[]],[128,0,"2.1.3",25,"Median versus mean","If m is a median of ||X||, prove K E||X|| ≤ m ≤ 2E||X|| for a universal K>0.",[],[],["One universal K>0."],["required_reusable_lemma"],["Concentration arguments comparing means and medians"],5,"Upper bound by Markov/Chebyshev; lower bound from the proof of Theorem 2.1.20.",1,2,[]],[129,0,"2.1.4",25,"Equivalence of probabilistic and Lp convergence","Let X_n be separable centred Gaussian processes with Pr(||X_n||<∞)>0. Prove that ||X_n||→0 in probability iff it converges to 0 in Lp for some p≥1 iff it converges to 0 in Lp for every p≥1.",[],[],["Quantifiers: sequence n→∞, then some/all p≥1."],["cited_by_later_result","required_reusable_lemma"],["Lemma 2.6.6 and Gaussian-series convergence arguments"],5,"Uniform-integrability argument from Gaussian concentration, with implications between convergence modes.",1,2,[]],[130,0,"2.1.5",25,"Banach-valued extension of the section","Let B be separable Banach and X a centred B-valued Gaussian random variable. Prove that the preceding zero-one, integrability and concentration results apply to ||X||_B.",[],
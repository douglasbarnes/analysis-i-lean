- id: ch8.lemma_8_2_4
  kind: lemma
  book:
    number: Lemma 8.2.4
    pages:
    - 619
    section: 8.2.1
    equations:
    - '8.2'
  title: Upper-tail control for the sampling L2 selector
  statement: For f∈B^s_{2,∞} with ‖f‖∞≤U, τ̃ sufficiently large and j>j_n^*, there is a universal C>0 such that
    P_f(j̄_n=j)≤C^{-1}exp(−Cτ̃·min(2^j,√n)) and P_f(j̄_n>j_n^*)≤C^{-1}exp(−Cτ̃·min(2^{j_n^*},√n)).
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - i.i.d. density sample
    - s>0
    - ‖f‖∞≤U
    - j>j_n^*
    - τ̃ sufficiently large
    implicit:
    - Exact threshold notation in the first display is under review.
  quantifier_order:
  - There exists universal C
  - For every admissible n,f,j the two bounds hold
  constants:
  - C independent of all displayed parameters after τ̃ is large enough.
  dependencies:
    earlier_book:

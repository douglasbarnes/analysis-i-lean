- id: ch8.theorem_8_2_3
  kind: theorem
  book:
    number: Theorem 8.2.3
    pages:
    - 619
    section: 8.2.1
    equations:
    - '8.2'
  title: Adaptive L2 density estimation
  statement: For the empirical projection estimator and L2 Lepski selector with τ=τ̃U and τ̃ sufficiently large,
    for every s>0, B≥1, U≥1 and n, sup_{‖f‖_{B^s_{2,∞}}≤B, ‖f‖∞≤U}E_f‖f̂_n−f‖₂≤D·B^{1/(2s+1)}n^{-s/(2s+1)}, with
    D depending only on s,U,τ̃.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - f is a density on [0,1]
    - s>0
    - B,U≥1
    - τ̃ sufficiently large
    implicit:
    - Positivity and integral-one are included even when omitted from ball notation.
  quantifier_order:
  - Fix s,U,τ̃
  - There exists D
  - For all B≥1,n the uniform risk bound holds
  constants:
  - D independent of B,n,f.
  dependencies:
    earlier_book:
    - Theorem 5.1.5
    chapter_local:
    - ch8.iid_projection_estimator_8_18
    - ch8.iid_lepski_threshold_8_19

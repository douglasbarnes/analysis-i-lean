central_review_flags:
- id: 6.1.sample_split
  pages: '473'
  severity: central-review
  issue: 'Noise-scale wording: printed prose says factor 2 although the displayed transform gives variance 2σ²/n
    and standard deviation √2σ/√n.'
- id: 6.1.6
  pages: '474'
  severity: central-review
  issue: 'Typographical error: “Definifion 2.5.1”.'
- id: 6.2.1
  pages: 477-478
  severity: central-review
  issue: Variable rₙ is rebound in part (ii), and the printed level quantifier is α>0 rather than 0<α<1.
- id: 6.2.4
  pages: '483'
  severity: central-review
  issue: The condition number claimed removable by Exercise 6.2.6 requires typeset-source verification.
- id: 6.2.11
  pages: 492-494
  severity: central-review
  issue: The OCR-visible theorem statement does not clearly quantify r>0 for parts (b),(c), though the rates and
    Besov classes require it.
- id: 6.2.14
  pages: 497-500
  severity: central-review
  issue: The first exponential term in (6.61) is OCR-sensitive; current transcription preserves the recoverable
    reading dₙ²/(1+dₙ2^{-jₙ/2}) pending typeset-source verification.
- id: 6.2.17
  pages: '502'
  severity: central-review
  issue: Printed/OCR condition `1 ≤ dₙ ≤ min(2^{jₙ/2}, n^{-1/4})` is impossible for n>1. The sign of the exponent
    requires typeset-source review.
- id: 6.3.1
  pages: '512'
  severity: central-review
  issue: Equation (6.98) uses `f̂ₙ` inside the risk while the infimum is over `f̃ₙ`; preserve as a notation error
    and formalise only after confirming intended binding.
- id: 6.3.9
  pages: '521'
  severity: central-review
  issue: The upper-bound proof's printed/OCR embedding `B^r_{pq} ⊂ B^r_{q∞}` is index-suspicious; verify the intended
    target space. The theorem also states C depends only on B,r although the construction may hide p,q constants.
- id: 6.2.9.errata
  pages: '490'
  severity: official-erratum
  issue: 'Official correction to the malformed first display: `(1/n)^{r/(2r+1/2)}`.'
- id: 6.2.11.errata
  pages: '492'
  severity: official-erratum
  issue: Official correction of the two minimax exponents in Theorem 6.2.11.
- id: 6.2.19.errata
  pages: '507'
  severity: official-erratum
  issue: 'Official correction: last proof display should be `1/n`.'
- id: 6.3.2.errata
  pages: '514'
  severity: official-erratum
  issue: Official correction changes the multiplicative Fano factor in (6.104).
- id: 6.3.9.errata
  pages: '520'
  severity: official-erratum
  issue: Official correction changes a proof cross-reference from (6.14) to (6.16).
- id: 6.4.1.random_set
  pages: '523'
  severity: central-review
  issue: Definition 6.4.1 types a random subset as a map into the Borel σ-field without specifying a measurable
    hyperspace structure.
- id: 6.4.1.exactness
  pages: '523'
  severity: central-review
  issue: Equation (6.115) prints an infimum of absolute coverage errors; uniform exact asymptotic coverage would
    normally use a supremum.
- id: 6.4.generic_ball
  pages: 523-524
  severity: central-review
  issue: Equation (6.117) uses ordered interval notation in a generic metric space; formalisation should encode
    a metric ball only after central approval.
- id: 6.4.5.errata
  pages: '530'
  severity: official-erratum
  issue: 'Official correction: equation (6.130) replaces `sqrt(u_n)` by `u_n^{-γ}` for some γ>0.'
- id: 6.4.5.crossref
  pages: '529'
  severity: central-review
  issue: The text says `see Exercise 6.3.2`, but that exercise is a multivariate minimax lower-bound problem and
    does not directly establish Corollary 6.4.5.
- id: 6.4.8
  pages: '534'
  severity: central-review
  issue: Theorem 6.4.8 has candidate-dependent radius/measurability and radicand-sign obligations; its proof also
    switches `f̃_n` to `f̂_n`.
- id: 6.5.unified_Lp_reference
  pages: 537-538
  severity: central-review
  issue: The notes cite `Exercise 6.4` for the p<2 assertion, but the chapter has no unambiguous exercise of that
    label; Exercise 6.2.5 appears closest in content.
- id: 6.5.unified_Lp.errata
  pages: '537'
  severity: official-erratum
  issue: 'Official correction: the unified Lᵖ separation-rate denominator is `2r+1−p^{-1}`, not the hardback''s
    `2r+1+p^{-1}`.'

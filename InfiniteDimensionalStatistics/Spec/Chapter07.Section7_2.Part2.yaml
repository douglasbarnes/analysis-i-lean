  title: Exact boundary-crossing probability for a uniform empirical cdf
  statement: "For the empirical cdf Fₙ^U of a U(0,1) sample and every M≥1, prove\n  P(Fₙ^U(t)≤M t for all t∈[0,1]) = 1-1/M."

  title: Uniqueness of the Sobolev-ball MLE
  statement: 'Prove that the MLE p̂ₙ over the Sobolev ball in (7.54) is unique. Use

    concavity of ℓₙ on the convex model, Proposition 7.2.9 showing every

    maximiser lies on the Hᵗ sphere of radius D, and strict convexity of the

    Hilbert norm to show the convex set of maximisers is a singleton.'
  hypotheses:
    explicit:
    - The Sobolev density model and MLE of (7.54).
    - The boundary conclusion of Proposition 7.2.9.
    implicit:
    - A strictly convex norm has no nontrivial line segment in its sphere.
  quantifier_order:
  - For each sample for which the boundary result applies, the maximiser is unique.
  constants:
  - Sobolev radius D.
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.def.sobolevDensityModel

  title: Rates for the finite-dimensional Sobolev sieve MLE
  statement: "Prove Proposition 7.2.11 by combining Theorem 7.2.10 with the sieve theorem.\nFor the approximation choose\n  pₙ* = π_{V_{jₙ}}(p₀) / ||π_{V_{jₙ}}(p₀)||₁,\nprove pₙ*∈P∩V_{jₙ} for large n, and establish\n  h(pₙ*,p₀)=O(||pₙ*-p₀||₂)=O(2^{-jₙt})=O(n^{-t/(2t+1)})."
  hypotheses:
    explicit:
    - The hypotheses of Proposition 7.2.11.
    - The wavelet approximation and positivity conditions used in the hint.
    implicit:
    - '||π_{V_j}p₀-p₀||∞→0 ensures eventual positivity and model membership.'
  quantifier_order:
  - For the prescribed resolution jₙ and n sufficiently large.
  constants:
  - Implicit approximation constants depend on the Sobolev ball parameters and lower bound for p₀.

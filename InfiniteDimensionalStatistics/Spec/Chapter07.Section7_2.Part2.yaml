  title: Grenander MLE as the derivative of the least concave majorant
  statement: 'Prove that the monotone-density MLE p̂ₙ in (7.70) is the left derivative

    of the least concave majorant F̂ₙ of the empirical cdf Fₙ. Deduce that p̂ₙ

    is left-continuous, piecewise constant, has jumps only at observation

    points, is zero on (X_(n),1], and is unique.'
  hypotheses:
    explicit:
    - The monotone density model (7.70).
    - The empirical cdf Fₙ and its least concave majorant.
    implicit:
    - Ties in the observations require grouping; the printed description uses strict order statistics.
  quantifier_order:
  - For every finite sample, modulo the standard tied-observation convention.
  constants: []

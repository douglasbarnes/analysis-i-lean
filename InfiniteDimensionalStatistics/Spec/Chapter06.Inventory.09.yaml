- id: 6.4.ks_band
  kind: operative_example
  book:
    number: Kolmogorov-Smirnov confidence band (6.119)
    pages:
    - 525
    section: 6.4.2
    equations: []
  title: Kolmogorov Smirnov Confidence Band
  statement: "Let \\(X_1,\\ldots,X_n\\) be i.i.d. with continuous distribution function\n\\(F\\), and let \\(F_n\\\
    ) be the empirical distribution function. If \\(G\\) is a\nstandard Brownian bridge and \\(z_\\alpha\\) is chosen\
    \ so that\n\\[\n P\\{\\sup_{0\\le x\\le1}|G(x)|\\le z_\\alpha\\}=1-\\alpha,\n\\]\nthen\n\\[\n \\sqrt n\\,\\\
    |F_n-F\\|_\\infty\\Rightarrow\\sup_{0\\le x\\le1}|G(x)|, \\tag{6.119}\n\\]\nuniformly over continuous \\(F\\\
    ), and\n\\[\n C_n(x)=\\left[F_n(x)-\\frac{z_\\alpha}{\\sqrt n},\n              F_n(x)+\\frac{z_\\alpha}{\\sqrt\
    \ n}\\right],\\qquad x\\in\\mathbb R,\n\\]\nhas asymptotic coverage \\(1-\\alpha\\) uniformly in \\(F\\) and\n\
    \\(L^\\infty\\)-diameter \\(2z_\\alpha/\\sqrt n\\). A slightly enlarged constant\nobtained from the Dvoretzky-Kiefer-Wolfowitz\
    \ inequality gives nonasymptotic\ncoverage."
  hypotheses:
    explicit:
    - F is continuous for the distribution-free Brownian-bridge limit as stated.
    - z_alpha is a continuity quantile of the supremum distribution.
    - The band is interpreted as the set of all functions lying pointwise in the displayed intervals.
    implicit: []
  quantifier_order:
  - ∀0<α<1 choose z_α by the Brownian-bridge law; then as n→∞ the coverage converges uniformly over continuous F
    to 1-α.
  constants:
  - ∀0<α<1 choose z_α by the Brownian-bridge law; then as n→∞ the coverage converges uniformly over continuous F
    to 1-α.
  dependencies:
    earlier_book:
    - Corollary 3.7.39
    - Examples 3.7.19 and 3.7.42
    - Exercise 3.3.3 (DKW)
    - Proposition 6.3.4
    chapter_local:
    - 6.4.1
    - 6.4.2
    later_book_uses:
    - multivariate Rademacher tube in Section 6.4.2
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Requires empirical CDF, uniform Donsker theorem, continuity mapping for sup norm, and DKW as a separate
      finite-sample theorem.
    blockers: &id001
    - The text calls z_alpha the `α-quantile` while using it as the 1-α acceptance quantile; encode the defining
      probability rather than terminology.
    reusable_primitives:
    - empirical CDF confidence band

- id: 6.4.haar_projection
  kind: definition
  book:
    number: Equation (6.120)
    pages:
    - 525
    - 526
    section: 6.4.2
    equations: []
  title: Haar Projection Estimator
  statement: "In Gaussian white noise with \\(\\sigma=1\\), define the Haar projection\nestimator\n\\[\n f_n(j,x)=\\\
    sum_{k=0}^{2^j-1}\\phi_{jk}(x)\n          \\int_0^1\\phi_{jk}(t)\\,dY(t),\\qquad\n \\phi_{jk}(x)=2^{j/2}\\mathbf\
    \ 1_{(k/2^j,(k+1)/2^j]}(x). \\tag{6.120}\n\\]"
  hypotheses:
    explicit:
    - j is a nonnegative integer.
    - Y is the Gaussian white-noise observation on [0,1].
    - The stochastic integrals against the normalised Haar scaling functions exist.
    implicit: []
  quantifier_order:
  - For each n,j and observation Y, define a finite measurable function-valued sum.
  constants:
  - For each n,j and observation Y, define a finite measurable function-valued sum.
  dependencies:
    earlier_book:
    - Gaussian white noise model (6.3)
    - Haar multiresolution analysis
    chapter_local: []
    later_book_uses:
    - Proposition 6.4.3
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''

- id: 6.4.rademacher_radius
  kind: definition
  book:
    number: Equations (6.125)-(6.127)
    pages:
    - 528
    - 529
    section: 6.4.2
    equations: []
  title: Kernel Rademacher Confidence Radius
  statement: "For the kernel density estimator\n\\[\n f_n(h,x)=\\frac1{nh^d}\\sum_{i=1}^nK\\!\\left(\\frac{x-X_i}{h}\\\
    right)\n\\]\nwith a bounded-variation kernel \\(K\\in L^1\\cap L^\\infty\\), \\(\\int K=1\\),\ndefine the conditional\
    \ Rademacher complexity\n\\[\n R_n(h)=E_\\varepsilon\\sup_{x\\in\\mathbb R^d}\n \\left|\\frac1n\\sum_{i=1}^n\\\
    varepsilon_iK_h(x-X_i)\\right|.\n\\]\nIf \\(U\\ge\\|f\\|_\\infty\\) is known, set\n\\[\n \\sigma_R(n,h,z)\n\
    \ =3R_n(h)+\\sqrt{\\frac{9\\,2U\\|K\\|_2^2z}{4nh^d}}\n              +\\frac{50\\|K\\|_\\infty z}{3nh^d}. \\\n    tag{6.126}\n\\]\nThe band for the mean of the estimator is\n\\[\n \\bar C_n=[f_n(h,\\cdot)-\\sigma_R(n,h,z),\n\
    \           f_n(h,\\cdot)+\\sigma_R(n,h,z)]. \\tag{6.127}\n\\]\nThe preceding expectation benchmark is\n\\[\n\
    \ E_f\\sup_x|f_n(h,x)-f(x)|\n \\lesssim \\|f\\|_\\infty^{1/2}\\sqrt{\\frac{\\log(1/h)}{nh^d}}\n           +\\\
    |f\\|_{B^r_{\\infty\\infty}}h^r. \\tag{6.125}\n\\]"
  hypotheses:
    explicit:
    - K is of bounded variation, integrates to one, and belongs to L1∩L∞; the L2 norm in (6.126) is finite.
    - h>0, z>0, and U is a deterministic upper bound for the density sup norm.
    - The translated kernel class satisfies the measurability/separability assumptions of the empirical-process
      inequalities.
    implicit: []
  quantifier_order:
  - For every n,h,z and observed sample, R_n(h) and σ_R are defined; the benchmark bound holds for f in the stated
    Besov class.
  constants:
  - For every n,h,z and observed sample, R_n(h) and σ_R are defined; the benchmark bound holds for f in the stated
    Besov class.
  dependencies:
    earlier_book:
    - Chapters 4-5 kernel bias/variance bounds
    - Section 3.4.2 Rademacher complexity
    chapter_local: []
    later_book_uses:
    - Proposition 6.4.4
    - Corollary 6.4.5
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Bundle kernel assumptions, define a conditional expectation over a finite Rademacher product space,
      and construct the pointwise band as a random predicate.
    blockers: &id005
    - The OCR layout of the square-root term is fragile. The transcription follows the proof's equivalent `sqrt(9·2U||K||₂²
      z/(4nh^d))` form.
    - The suggested replacement of unknown U by `||f_n(̄h_n)||∞` needs a separate high-probability upper-bound theorem;
      consistency alone is not enough for a finite-sample statement.
    reusable_primitives:
    - kernel Rademacher radius
  difficulty: major-library
  pass: core
  issues_for_central_review: *id005

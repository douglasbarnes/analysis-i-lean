- id: 6.4.3
  kind: proposition
  book:
    number: Proposition 6.4.3
    pages:
    - 526
    - 527
    section: 6.4.2
    equations: []
  title: Haar Confidence Band gumbel Limit
  statement: "Let \\(B>0\\), \\(0<r\\le1\\), \\(\\sigma=1\\), and\n\\[\n F=\\{f:\\|f\\|_{B^r_{\\infty\\infty}([0,1])}\\\
    le B\\}.\n\\]\nChoose \\(\\bar j_n\\) and \\(u_n\\) so that\n\\[\n 2^{\\bar j_n}\\asymp(n/\\log n)^{1/(2r+1)},\\\
    qquad\n j_n=\\bar j_n+u_n,\\qquad 2^{u_n}\\sim(\\log n)^2.\n\\]\nFor the estimator in (6.120), put\n\\[\n a_n=\\\
    sqrt{2j_n\\log2},\\qquad\n b_n=a_n-\\frac{\\log j_n+\\log(\\pi\\log2)}{2a_n}.\n\\]\nThen, for every \\(t\\in\\\
    mathbb R\\),\n\\[\n \\lim_{n\\to\\infty}\\sup_{f\\in F}\n \\left|P_f^Y\\!\\left\\{\n a_n\\!\\left(\\sqrt{\\\
    frac n{2^{j_n}}}\n \\|f_n(j_n)-f\\|_\\infty-b_n\\right)\\le t\\right\\}\n -e^{-e^{-t}}\\right|=0. \\tag{6.121}\n\
    \\]\nIf \\(1-\\alpha=e^{-e^{-z_\\alpha}}\\), the band\n\\[\n C_n(\\alpha,x)=f_n(j_n,x)\\ \\pm\\\n \\sqrt{\\\
    frac{2^{j_n}}n}\\frac{z_\\alpha+b_n}{a_n},\\qquad x\\in[0,1], \\tag{6.122}\n\\]\nhas the printed exactness conclusion\n\
    \\[\n \\inf_{f\\in F}|P_f^Y\\{f\\in C_n\\}-(1-\\alpha)|=o(1),\n\\]\nand its \\(L^\\infty\\)-diameter is\n\\\
    [\n |C_n|_\\infty\n =O_P\\!\\left((\\log n/n)^{r/(2r+1)}2^{u_n/2}\\right) \\tag{6.123}\n\\]\nuniformly over\
    \ \\(F\\)."
  hypotheses:
    explicit:
    - The Haar approximation estimate is used, restricting the displayed result to 0<r≤1.
    - The integer sequences satisfy the exact asymptotic relations displayed.
    - The Gaussian maxima are formed from 2^{j_n} independent N(0,1) coordinates.
    implicit: []
  quantifier_order:
  - ∀B>0, 0<r≤1 and t∈R, the uniform distributional convergence holds; for each 0<α<1 choose z_α by the Gumbel CDF
    and obtain the band conclusions.
  constants:
  - ∀B>0, 0<r≤1 and t∈R, the uniform distributional convergence holds; for each 0<α<1 choose z_α by the Gumbel CDF
    and obtain the band conclusions.
  dependencies:
    earlier_book:
    - Theorem 2.7.1
    - Proposition 4.3.8
    - Theorem 6.3.5
    chapter_local:
    - 6.4.1
    - 6.4.haar_projection
    later_book_uses:
    - Corollary 6.4.5 undersmoothing pattern
    - general projection/sampling analogues discussed immediately after the proof
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Finite Gaussian-coordinate reduction plus an explicit bias-negligibility estimate and the extreme-value
      limit for maxima of absolute Gaussians.
    blockers: &id003
    - The exactness conclusion again uses the book's infimum of absolute coverage errors rather than a supremum.
    - The displayed band width is a pointwise interval; formal membership means a simultaneous inequality for all
      x.
    reusable_primitives:
    - Gumbel confidence band
    - undersmoothing bias removal

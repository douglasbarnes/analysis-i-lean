- id: 6.4.multivariate_cdf_tube
  kind: operative_example
  book:
    number: Rademacher confidence tube (6.124)
    pages:
    - 527
    - 528
    section: 6.4.2
    equations: []
  title: Multivariate Cdf Rademacher Tube
  statement: "For i.i.d. observations from a distribution function \\(F\\) on\n\\(\\mathbb R^d\\), let\n\\[\n F_n(x)=\\\
    frac1n\\sum_{i=1}^n\\mathbf1_{(-\\infty,x]}(X_i)\n\\]\nand, for independent Rademacher variables \\(\\varepsilon_i\\\
    ), define\n\\[\n R_n=\\frac2n\\sup_{x\\in\\mathbb R^d}\n \\left|\\sum_{i=1}^n\\varepsilon_i\\mathbf1_{(-\\infty,x]}(X_i)\\\
    right|\n +3\\sqrt{\\frac{2\\log(4/\\alpha)}n}.\n\\]\nThen the tube \\(C_n(x)=[F_n(x)\\pm R_n]\\) satisfies,\
    \ for every \\(n\\),\n\\[\n P_F^N\\{F\\in C_n\\}\n =1-P_F^N\\{\\|F_n-F\\|_\\infty>R_n\\}\\ge1-\\alpha. \\tag{6.124}\n\
    \\]\nThe random Rademacher term may be replaced by its conditional expectation\n\\(E_\\varepsilon R_n\\). Moreover\
    \ \\(E_FR_n\\lesssim n^{-1/2}\\), so the diameter\nhas the minimax order."
  hypotheses:
    explicit:
    - The class of lower orthants is measurable/separable or outer probabilities are used.
    - The Rademacher variables are independent of the sample.
    - 0<α<1.
    implicit: []
  quantifier_order:
  - ∀d,n,F and 0<α<1, the nonasymptotic coverage bound holds; the expectation order is uniform over F.
  constants:
  - ∀d,n,F and 0<α<1, the nonasymptotic coverage bound holds; the expectation order is uniform over F.
  dependencies:
    earlier_book:
    - Theorem 3.4.5
    - Theorem 3.1.21
    - Example 3.7.19
    - Proposition 6.3.4 / Exercise 6.3.1
    chapter_local:
    - 6.4.1
    - 6.4.diameter
    later_book_uses:
    - kernel-density Rademacher confidence bands
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:
    mathlib:
      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: Apply a data-dependent empirical-process concentration theorem to the VC class of lower orthants; requires
      conditional Rademacher expectation.
    blockers: &id004

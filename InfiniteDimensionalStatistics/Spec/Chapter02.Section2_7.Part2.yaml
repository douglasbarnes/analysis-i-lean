  title: Gumbel limit for stationary Gaussian-process suprema
  statement: 'Under the normalised centred stationary continuous-path assumptions, r(t)<1 for t>0, r(t)=1−C|t|^α+o(|t|^α)
    at zero, and r(t)log t→0 at infinity, for every x∈ℝ: Pr(a_T(sup_{t∈[0,T]}|ξ(t)|−b_T)≤x)→exp(−e^{-x}).'
  hypotheses:

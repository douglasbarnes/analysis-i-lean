  title: Log-concavity of centred Gaussian measures
  statement: 'Every centred Gaussian measure μ on ℝⁿ is log-concave: μ(λA+(1−λ)B)≥μ(A)^λμ(B)^{1−λ}.'
  hypotheses:
    explicit:
    - μ may be degenerate.
    - A,B Borel.
    - 0<λ<1.
    implicit:
    - The measure is represented on its linear support if covariance is singular.

- id: ch8.minimax_testing_rate_8_56_57
  kind: definition
  book:
    number: (8.56)–(8.57)
    pages:
    - 636
    section: 8.3.1
    equations:
    - '8.56'
    - '8.57'
  title: Abstract minimax testing rate
  statement: 'A positive sequence ρ_n^* is a minimax testing rate if: (a) for every β>0 there are L(β) and tests
    with sup_{Θ₀}E_fφ_n+sup_{Θ̃(Lρ_n^*)}E_f(1−φ_n)≤β; (b) for some β′>0 and every ρ_n′=o(ρ_n^*), liminf_n inf_{φ_n}[sup_{Θ₀}E_fφ_n+sup_{Θ̃(ρ_n′)}E_f(1−φ_n)]≥β′.'
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - positive rate sequence
    - nonempty null model
    implicit:
    - Infima range over measurable tests.
  quantifier_order:
  - 'Upper: ∀β ∃L ∃tests ∀n'
  - 'Lower: ∃β′ ∀sub-rate sequences liminf inf-tests ≥β′'
  constants:
  - L depends only on β and fixed problem data.
  dependencies:
    earlier_book:
    - Chapter 6 testing-rate definition
    chapter_local:

- id: ch8.theorem_8_3_5
  kind: theorem
  book:
    number: Theorem 8.3.5
    pages:
    - 634
    section: 8.3.1
    equations:
    - '8.3'
  title: Sharp separation window for adaptive L2 confidence balls
  statement: (a) If a confidence set satisfies (8.48)–(8.50) with any r_n=o(n^{-r/(2r+1/2)}), then necessarily liminf_n
    ρ_n/n^{-r/(2r+1/2)}>0. (b) With smooth-class target n^{-s/(2s+1)}, such confidence sets exist either when s≤2r
    with ρ_n=0, or when s>2r and ρ_n≥c n^{-r/(2r+1/2)} eventually for c sufficiently large.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - white-noise model
    - known radius B
    - 0<r<s
    implicit:
    - Confidence sets can be constructed from sample splitting and unbiased risk estimation.
  quantifier_order:
  - 'Lower: quantify error levels and sub-rate, then derive necessary separation'
  - 'Upper: split into s≤2r and s>2r cases'
  constants:
  - c and confidence-radius constants depend on model parameters and error levels.
  dependencies:
    earlier_book:
    - Theorem 6.4.8
    - Theorem 6.2.20
    - Theorem 6.2.11(c)
    chapter_local:
    - ch8.l2_confidence_diameter_benchmark_8_46
    - ch8.l2_confidence_criteria_8_48_50
    - ch8.theorem_8_2_2
    - ch8.lemma_8_2_1
    later_book_uses:
    - ch8.theorem_8_3_8
    - ch8.theorem_8_3_11
  proof_status:

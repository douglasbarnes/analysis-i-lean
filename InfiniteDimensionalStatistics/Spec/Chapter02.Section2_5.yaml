  title: Entropy of a nonnegative function
  statement: For a probability μ and f≥0, Ent_μ(f):=∫f log f dμ−(∫f dμ)log(∫f dμ), finite under ∫f log(1+f)<∞ and +∞ otherwise.
  hypotheses:
    explicit:
    - μ probability measure.
    - f measurable nonnegative.
    implicit:
    - 0 log 0:=0; extended-real conventions.
  quantifier_order:
  - No normalization ∫f=1 required.

  title: Tensorisation of entropy
  statement: For P=μ₁⊗⋯⊗μₙ and nonnegative measurable f, Ent_P(f)≤∑_{i=1}^n∫Ent_{μᵢ}(f with all other coordinates fixed)dP.
  hypotheses:
    explicit:
    - Finite product of probability spaces.
    - f nonnegative measurable.
    implicit:
    - Section entropies are measurable and extended integrals are well-defined.
  quantifier_order:
  - Sum over exactly n coordinates.
  constants:
  - Sum over exactly n coordinates.

- id: theorem-2-5-7
  kind: theorem
  book:
    number: 2.5.7
    pages:
    - 64
    section: '2.5'
    equations: []
  title: Herbst concentration for Gaussian Lipschitz functions
  statement: If X∼N(0,I_n) and F:ℝⁿ→ℝ is 1-Lipschitz, then E exp(λF(X))≤exp(λEF(X)+λ²/2) for every λ∈ℝ; hence Pr(F−EF≥t)≤e^{-t²/2}
    and Pr(F−EF≤−t)≤e^{-t²/2}.
  hypotheses:
    explicit:
    - F measurable and 1-Lipschitz.
    - EF finite, automatic.
    - t>0, λ∈ℝ.
    implicit: []
  quantifier_order:
  - Variance proxy 1; scale by L² for L-Lipschitz F.

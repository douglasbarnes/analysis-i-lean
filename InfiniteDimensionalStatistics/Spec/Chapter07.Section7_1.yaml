- id: ch7.thm.7.1.4
  kind: theorem
  book:
    number: Theorem 7.1.4 (officially corrected)
    label: Theorem 7.1.4 (officially corrected)
    pages:
    - 545
    - 546
    section: '7.1'
    equations: []
    section_title: Nonparametric Testing in Hellinger Distance
    source_note: Printed book pagination; statement incorporates official errata where listed.
  title: Tests for Hellinger-separated composite alternatives
  statement: "Let P be a class of μ-densities and p₀ a fixed density. Suppose there are ε₀>0 and a\nnonincreasing N:(0,∞)→(0,∞) such that for every ε>ε₀,\n  N({p∈P: ε<h(p,p₀)≤2ε}, h, ε/4) ≤ N(ε).\nCorrected statement: for every c₀>0 there is K=K(c₀)>0 such that, for every ε>ε₀\nand every n with n ε²≥c₀, there exists a test φₙ of p=p₀ versus\n{p∈P:h(p,p₀)>ε} satisfying\n  E_{P₀} φₙ ≤ (N(ε)/K) exp(-K n ε²),\n  sup_{p∈P:h(p,p₀)>ε} E_P(1-φₙ) ≤ exp(-K n ε²)."
  hypotheses:
    explicit:
    - P is Hellinger-totally-bounded on each shell through the displayed covering condition.
    - N is nonincreasing.
    - ε>ε₀.
    - nε²≥c₀.
    implicit:
    - Covering numbers are finite.
    - Tests and shell covers can be chosen measurably; countable shell union.
  quantifier_order:
  - ∀ c₀>0, ∃ K(c₀)>0, ∀ ε>ε₀, ∀ n with nε²≥c₀, ∃ test φₙ, both bounds.
  constants:
  - K depends on c₀ only; it is not universal uniformly over arbitrarily small nε².
  - Cover radius ε/4.
  dependencies:
    earlier_book:
    - Metric covering numbers
    - geometric shell decomposition
    chapter_local:
    - ch7.cor.7.1.3
    later_book_uses:
    - ch7.thm.7.3.3
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: none
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: No notes-only mathematical declaration is used here.
    used_later_in_book: true
  equivalents:
    mathlib:
      status: none_exact
      candidates: []
      exact_equivalent: false
    repository:
      status: none_found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: A finite/countable union of ball tests indexed by chosen covers. Requires a definition of covering number with witnesses, measurable finite maxima, and extended-real exponential bounds.

  title: Robust one-observation test between Hellinger balls
  statement: "Let h(p,q)=d>0 and B(p)={r:h(r,p)≤d/4}, B(q)={r:h(r,q)≤d/4}.\nThere exists a measurable nonnegative function φ:X→[0,∞) such that, writing dR=r dμ,\n  sup_{r∈B(p)} E_R φ ≤ 1 - d^2/12,\n  sup_{r∈B(q)} E_R (1/φ) ≤ 1 - d^2/12."
  hypotheses:
    explicit:
    - p,q are probability densities with common dominating measure μ.
    - d=h(p,q)>0.
    implicit:
    - The constructed φ is strictly positive where its reciprocal matters, up to every R in B(q).
    - Balls range over all μ-densities.
  quantifier_order:
  - ∀ p,q with d>0, ∃ measurable φ≥0, ∀ r∈B(p), first bound, and ∀ r∈B(q), second bound.
  constants:
  - Ball radius exactly d/4.
  - Loss constant exactly 1/12.
  dependencies:
    earlier_book:
    - Hilbert-space geometry of root densities
    - elementary trigonometric inequalities
    chapter_local:
    - ch7.def.hellinger
    - ch7.def.hellingerAffinity
    later_book_uses:
    - ch7.cor.7.1.3
  proof_status:

  likely_lean_representation:
    sketch: 'A bundled nonnegative measurable function `p : α → ℝ` with `∫ p ∂μ = 1`, or preferably the induced probability measure `μ.withDensity (ENNReal.ofReal ∘ p)` plus a chosen density representative.

      Define the squared distance in `ℝ≥0∞` or `ℝ`; quotient by a.e. equality or prove representative independence.'

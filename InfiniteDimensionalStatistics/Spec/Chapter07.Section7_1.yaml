  title: Hellinger distance
  statement: "For μ-densities p and q, define\n  h(p,q)^2 = ∫_X (√p - √q)^2 dμ.\nThe value is independent of the common dominating measure and satisfies 0 ≤ h(p,q)^2 ≤ 2."
  hypotheses:
    explicit:
    - (X,A) is a measurable space.
    - μ is a σ-finite measure.
    - p and q are μ-densities of probability measures.
    implicit:
    - Square roots are pointwise nonnegative roots.
    - Equalities and the metric are insensitive to μ-a.e. modification of densities.
  quantifier_order:
  - ∀ measurable spaces (X,A), ∀ σ-finite μ, ∀ probability densities p,q.
  constants: []
  dependencies:
    earlier_book:

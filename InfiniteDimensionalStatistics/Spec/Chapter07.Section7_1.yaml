  title: Hellinger affinity
  statement: "Define the Hellinger affinity\n  ρ(p,q) = ∫ √(pq) dμ = 1 - h(p,q)^2/2.\nIf P has density p and Q has density q, then\n  ρ(p,q) = E_P[√(q/p)(X)]\nwith the ratio interpreted on {p>0}; moreover log ρ(p,q) ≤ -h(p,q)^2/2."
  hypotheses:
    explicit:
    - Hypotheses of the Hellinger-distance definition.
    implicit:
    - The likelihood ratio is defined P-a.s.; values on {p=0} are irrelevant.
    - If ρ=0, log ρ=-∞.
  quantifier_order:
  - ∀ p,q as probability densities.
  constants: []
  dependencies:
    earlier_book:
    - Jensen's inequality; log(1-x)≤-x.
    chapter_local:
    - ch7.def.hellinger
    later_book_uses:
    - ch7.def.simpleLikelihoodRatioTest
    - ch7.prop.7.1.1
    - ch7.thm.7.1.2
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: none
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: No notes-only mathematical declaration is used here.
    used_later_in_book: true
  equivalents:

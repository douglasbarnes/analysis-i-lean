  title: Exponential testing errors for two simple hypotheses
  statement: "For the test φₙ of (7.4), for every n∈ℕ,\n  E_P φₙ ≤ exp(-n h(p,q)^2/2),\n  E_Q (1-φₙ) ≤ exp(-n h(p,q)^2/2)."

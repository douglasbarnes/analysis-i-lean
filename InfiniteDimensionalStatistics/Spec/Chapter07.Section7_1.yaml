      status: none_exact
      candidates:
      - MeasureTheory.rnDeriv
      - Real.log inequalities
      exact_equivalent: false
    repository:
      status: none_found
      candidates: []
      exact_equivalent: false
  likely_lean_representation:
    sketch: Define affinity as `∫ x, Real.sqrt (p x * q x) ∂μ`; prove the expectation identity under absolute-continuity conventions and the logarithmic bound.

  title: Square-root trick
  statement: Let σ²:=sup_fPf² and r:=sup_f‖f‖∞. If u>4nσ² and 0<2^{5/2}ρ<√u−2√nσ, put λ:=½(√u−2√nσ−2^{5/2}ρ)². Then for n,m≥1,
    Pr*{‖∑_{i=1}^n f²(X_i)‖𝓕>u}≤4Pr*{N(𝓕,e_{n,2},ρ/√n)>m}+16m e^{−λ/(2r²)}.
  transcription_status: exact-transcription
  hypotheses:
    explicit:
    - pointwise countable approximation
    - finite σ,r
    - printed u,ρ restrictions
    - n,m≥1
    implicit: []

- id: theorem_3_7_52
  kind: theorem
  book:
    number: Theorem 3.7.52
    pages:
    - 273
    - 275
    section: '3.7'
    equations: []
  title: Characterisation of bounded P-Donsker classes by local randomisation
  statement: Let 𝓕 be uniformly bounded and pointwise-countably approximable. Then 𝓕 is P-Donsker iff it is P-pre-Gaussian
    and, for every γ>0, lim_{ε↓0}limsup_{n→∞}Pr*{‖ν_{n,rad}‖_{𝓕′_{ε,n}}≥γ}=0, where 𝓕′_{ε,n}:={f−g:f,g∈𝓕, P(f−g)²≤ε/√n}.
  transcription_status: exact-with-official-correction
  hypotheses:
    explicit:
    - uniformly bounded 𝓕
    - pointwise countable approximation
    - P-pre-Gaussianity for the reverse implication
    implicit: []
  quantifier_order: &id002

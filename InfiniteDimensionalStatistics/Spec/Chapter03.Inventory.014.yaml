  title: Donsker criterion for a class of sets
  statement: Let 𝒞 satisfy pointwise countable approximation. If 𝒞 is P-pre-Gaussian and log C(X₁,…,X_n)/√n→0 in outer probability,
    then 𝒞 is P-Donsker.
  transcription_status: exact-transcription

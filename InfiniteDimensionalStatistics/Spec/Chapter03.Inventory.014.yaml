  title: Donsker criterion for BL₁(ℝ)
  statement: The unit bounded-Lipschitz ball BL₁(ℝ) is P-Donsker iff ∑_{j=1}^∞P{j−1<|x|≤j}^{1/2}<∞; this is also equivalent
    to P-pre-Gaussianity.

  title: Local empirical-entropy criterion for Donsker classes
  statement: A uniformly bounded, pointwise-countably-approximable P-pre-Gaussian class is P-Donsker if the local empirical
    L¹ covering-entropy condition (3.287) holds for 𝓕′_{ε,n}; for indicator classes the condition is also necessary.
  transcription_status: blocking-page-image-transcription

  title: Hellinger posterior contraction from entropy
  statement: "In the setting of Theorem 7.3.1 assume the KL/variance prior-mass condition (7.91),\nthe sieve prior-tail condition (7.92), and\n  log N(Pₙ,h,εₙ)≤nεₙ².\nThen for M sufficiently large,\n  Π(p:h(p,p₀)>Mεₙ | X₁,…,Xₙ)→0\nin P₀^n-probability."
  hypotheses:
    explicit:
    - Hypotheses of Theorem 7.3.1 with d=h.
    - Global sieve covering bound at εₙ.
    implicit:
    - Use Theorem 7.1.4 with ε₀=mεₙ where fixed constants satisfy m<M; this is the corrected proof.
  quantifier_order:
  - ∃M₀, ∀M≥M₀, contraction.

  likely_lean_representation:
    sketch: 'A Markov kernel from data to parameters, using `ProbabilityTheory.posterior` where Standard Borel hypotheses apply; density formulas require `rnDeriv`, `withDensity`, and almost-everywhere equality.

      The conclusion is convergence in probability of a random posterior mass; formalisation needs measurable random kernels and exponential denominator bounds.'

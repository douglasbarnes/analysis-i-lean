  title: General posterior contraction theorem for i.i.d. models
  statement: "Let Π=Πₙ be priors on a density model P, let X₁,…,Xₙ∼p₀, and let d be a metric\nor semimetric. Let εₙ→0 and √n εₙ→∞. For fixed C,L, assume:\n(i) Π{p: -P₀log(p/p₀)≤εₙ², P₀(log(p/p₀))²≤εₙ²} ≥ e^{-Cnεₙ²};\n(ii) Π(P\\Pₙ)≤L e^{-(C+4)nεₙ²};\n(iii) for every sufficiently large fixed M there are tests φₙ with\n      E_{P₀}φₙ→0 and\n      sup_{p∈Pₙ:d(p,p₀)≥Mεₙ}E_P(1-φₙ)≤L e^{-(C+4)nεₙ²}.\nThen, for M sufficiently large,\n  Π(p:d(p,p₀)>Mεₙ | X₁,…,Xₙ)→0\nin P₀^n-probability."
  hypotheses:
    explicit:
    - Officially corrected joint measurability `(x,p)↦p(x)`.
    - All three prior/sieve/testing conditions.
    - εₙ positive, tends to zero, and √n εₙ→∞.
    implicit:
    - Posterior is defined and measurable.
    - d-balls are measurable.
    - The second moment condition is on the log likelihood ratio under P₀.
  quantifier_order:
  - Fix C,L. For every sequence satisfying assumptions, ∃M₀, ∀M≥M₀, posterior contraction in probability.
  constants:
  - The exponent buffer is C+4 exactly in the stated theorem.
  dependencies:
    earlier_book:
    - Testing theory of Chapter 6/§7.1
    chapter_local:
    - ch7.def.iidPosterior
    - ch7.lemma.7.3.2
    - ch7.def.posteriorContractionRate
    later_book_uses:
    - ch7.thm.7.3.3
    - ex7.3.2

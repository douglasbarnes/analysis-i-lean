- id: ch7.def.posteriorContractionRate
  kind: definition
  book:
    number: unnumbered
    pages:
    - 573
    section: 7.3.1
    equations: []
  title: Posterior contraction rate
  statement: "Let d be a metric or semimetric on the parameter space and let εₙ→0.\n\
    The posterior contracts about the true parameter f₀ at rate εₙ in d if,\nfor a\
    \ sufficiently large fixed constant M (or for every sufficiently large\nfixed\
    \ M, according to the theorem being applied),\n  Π({f : d(f,f₀)>M εₙ} | X^{(n)})\
    \ → 0\nin probability under the sampling law at f₀."
  hypotheses:
    explicit:
    - A sequence of experiments/observations indexed by n.
    - A true parameter f₀.
    - A posterior probability kernel.
    - A metric or semimetric d.
    - A deterministic rate sequence εₙ→0.
    implicit:
    - The posterior event is measurable.
    - Convergence is with respect to the true sampling distribution.
    - The multiplier M is fixed in n.
  quantifier_order:
  - Fix f₀ and d; choose εₙ→0; then for sufficiently large fixed M, take n→∞.
  constants:
  - M is a fixed sufficiently large contraction multiplier.
  dependencies:
    earlier_book: []
    chapter_local:
    - ch7.def.iidPosterior
    - ch7.def.whiteNoisePosterior
    later_book_uses: []

  title: White-noise integrated-likelihood denominator bound
  statement: 'Let ν be supported on B={f:||f-f₀||₂²≤ε²/σ²}. For every c>0, the probability

    that the prior-averaged centred white-noise likelihood is at most

    exp(-(1+c)nε²/2) is bounded by a constant of order 1/(c²nε²); in the book''s

    normalisation the displayed bound is 1/(c²nε²).'
  hypotheses:
    explicit:
    - ν is a probability measure supported on the stated L² ball.
    - c,ε,σ>0.
    implicit:
    - Stochastic integrals are jointly measurable in f and W.
    - Exact half-factors follow the book's likelihood normalisation.
  quantifier_order:
  - ∀ν,c,n.
  constants: []
  dependencies:

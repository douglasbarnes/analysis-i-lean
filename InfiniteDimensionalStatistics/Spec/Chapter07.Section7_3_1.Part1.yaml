- id: ch7.lemma.7.3.2
  kind: lemma
  book:
    number: Lemma 7.3.2
    pages:
    - 575
    - 576
    section: 7.3.1
    equations: []
  title: Lower bound for an integrated likelihood denominator
  statement: "Let ν be a probability measure supported on\n  B={p:-P₀log(p/p₀)≤ε²,\
    \ P₀(log(p/p₀))²≤ε²}.\nFor every c>0,\n  P₀^n( ∫_B ∏_{i=1}^n [p(X_i)/p₀(X_i)]\
    \ dν(p)\n          ≤ exp(-(1+c)nε²) )\n  ≤ 1/(c² n ε²)."
  hypotheses:
    explicit:
    - ν(B)=1.
    - n≥1, ε>0, c>0.
    - Joint measurability of the integrand.
    implicit:
    - The exact exponent is obtained by Jensen and Chebyshev; integrability of the
      mixed log-likelihood.
  quantifier_order:
  - ∀ν supported on B, ∀c>0, ∀n.
  constants: []
  dependencies:
    earlier_book:
    - Jensen's inequality
    - Chebyshev's inequality
    - Fubini/Tonelli

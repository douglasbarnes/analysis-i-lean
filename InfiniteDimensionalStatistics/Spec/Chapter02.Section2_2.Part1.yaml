- id: lemma-2-2-2
  kind: lemma
  book:
    number: 2.2.2
    pages:
    - 30
    section: '2.2'
    equations: []
  title: Poincaré limit lemma
  statement: Fix n. If U_{n+m} is uniform on the sphere of radius √(n+m) in ℝ^{n+m}, then its first n coordinates have an
    explicit density converging pointwise to the standard N(0,I_n) density, and the projected laws converge to γ_n on Borel
    sets.
  hypotheses:
    explicit:
    - n fixed.
    - m→∞.
    - Uniform surface measure on √(n+m)S^{n+m−1} (indexing to be matched exactly to the book).
    implicit:
    - Boundary/index convention for Sⁿ versus ambient dimension must match the book.
  quantifier_order:
  - Pointwise density convergence and setwise/weak convergence to γ_n.
  constants: []

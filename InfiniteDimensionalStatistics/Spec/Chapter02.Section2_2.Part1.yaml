- id: theorem-2-2-3
  kind: theorem
  book:
    number: 2.2.3
    pages:
    - 31
    section: '2.2'
    equations: []
  title: Finite-dimensional Gaussian isoperimetry
  statement: For standard Gaussian measure γ_n on ℝⁿ, measurable A, and a half-space H with γ_n(H)=γ_n(A), γ_n(A+εO_n)≥γ_n(H+εO_n)=Φ(Φ⁻¹(γ_n(A))+ε)
    for every ε>0.
  hypotheses:
    explicit:
    - n≥1.
    - A Borel measurable.
    - O_n Euclidean closed unit ball.
    - ε>0.
    implicit:
    - Minkowski enlargement is measurable; use completion/analytic measurability if needed.
  quantifier_order:
  - ∀ε>0; no dimension-dependent constant.
  constants:
  - ∀ε>0; no dimension-dependent constant.

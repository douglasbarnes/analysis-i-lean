- id: theorem-2-2-1
  kind: theorem
  book:
    number: 2.2.1
    pages:
    - 27
    section: '2.2'
    equations: []
  title: Isoperimetric inequality on the sphere
  statement: Let A⊆Sⁿ be measurable and nonempty, and C a spherical cap with μ(C)=μ(A). Then for every ε>0, μ(A^ε)≥μ(C^ε)
    (equivalently μ(C^ε)≤μ(A^ε)).
  hypotheses:
    explicit:
    - n finite.
    - μ uniform probability on Sⁿ.
    - A measurable and nonempty.
    - C a spherical cap of equal μ-measure.
    - ε>0.
    implicit: []
  quantifier_order:
  - ∀ε>0.
  constants:
  - ∀ε>0.

- id: lemma-2-7-3
  kind: lemma
  book:
    number: 2.7.3
    pages:
    - 90
    section: '2.7'
    equations: []
  title: Covariance-sum estimate for Gaussian sequence extremes
  statement: Let sup_n|r_n|<1, r_n log n→0, and positive u_n satisfy sup_n n(1−Ψ(u_n))<∞, where Ψ is the CDF of |N(0,1)|.
    Then ∑_{j=1}^n n|r_j| exp(−u_n²/(1+|r_j|))→0.
  hypotheses:
    explicit:
    - A real sequence r_j.
    - Uniform strict correlation bound.
    - Berman decay r_n log n→0.
    - Positive thresholds u_n with bounded expected exceedance count.
    implicit: []
  quantifier_order:
  - The exact prefactor n and denominator 1+|r_j|.
  constants:
  - The exact prefactor n and denominator 1+|r_j|.

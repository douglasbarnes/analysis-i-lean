- id: theorem-2-7-5
  kind: theorem
  book:
    number: 2.7.5
    pages:
    - 92
    section: '2.7'
    equations: []
  title: Pickands fixed-interval high-excursion asymptotic
  statement: Let ξ be normalised centred stationary Gaussian with continuous paths and r(t)<1 for t>0, r(t)=1−C|t|^α+o(|t|^α)
    as t→0, α∈(0,2], C>0. For h>0, Pr(sup_{t∈[0,h]}ξ(t)>u)/(u^{2/α}h·barΦ(u))→C^{1/α}H_α, where barΦ is the standard normal
    upper tail.
  hypotheses:
    explicit:
    - Continuous sample paths.
    - Local covariance condition (2.97).
    - h>0.
    - u→∞.
    implicit: []
  quantifier_order:
  - C^{1/α}H_α; q(u)=u^{-2/α} in proof.

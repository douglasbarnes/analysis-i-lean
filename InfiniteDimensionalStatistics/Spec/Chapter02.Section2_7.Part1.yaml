  kind: theorem
  book:
    number: 2.7.4
    pages:
    - 90
    section: '2.7'
    equations: []
  title: Gumbel limit for stationary Gaussian sequences
  statement: Let (ξ_n) be stationary standard normal with covariance r_n satisfying r_n log n→0. With a_n,b_n from Theorem
    2.7.1, for every x∈ℝ, Pr(a_n(max_{i≤n}|ξ_i|−b_n)≤x)→exp(−e^{-x}).
  hypotheses:
    explicit:
    - Stationary jointly Gaussian sequence.
    - Every coordinate standard normal.
    - Covariance decay r_n log n→0.
    implicit:
    - The comparison theorem also needs correlations away from ±1; stationarity/nondegeneracy supplies or must separately
      assume the needed bound.
  quantifier_order:

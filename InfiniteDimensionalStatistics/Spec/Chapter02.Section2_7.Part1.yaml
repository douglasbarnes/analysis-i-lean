  title: Stationary Gaussian process on [0,∞)
  statement: A process ξ(t) is stationary when every finite-dimensional law is invariant under common shifts preserving nonnegative
    times. For centred Gaussian ξ this is equivalent to covariance depending only on lag; r(t)=Eξ(0)ξ(t).
  hypotheses:
    explicit:
    - Process indexed by [0,∞).
    implicit: []

  title: Gumbel limit for iid absolute Gaussian maxima
  statement: For iid g_i∼N(0,1), n≥e², a_n=√(2log n), b_n=a_n−(log log n+log π)/(2a_n). For every x∈ℝ, Pr(a_n(max_{i≤n}|g_i|−b_n)≤x)→exp(−e^{-x}).
  hypotheses:
    explicit:
    - iid standard normal sequence.
    - n→∞.
    - x fixed real.
    implicit: []
  quantifier_order:
  - Exact a_n and b_n; Gumbel CDF exp(−e^{-x}).
  constants:
  - Exact a_n and b_n; Gumbel CDF exp(−e^{-x}).

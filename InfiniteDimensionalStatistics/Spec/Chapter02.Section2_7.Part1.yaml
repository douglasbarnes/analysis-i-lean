- id: definition-2-7-2
  kind: definition
  book:
    number: 2.7.2
    pages:
    - 89
    section: '2.7'
    equations: []
  title: Stationary sequence
  statement: A sequence ξ_n is stationary when for every finite n₁,…,n_m and shift k≥0, the joint law of (ξ_{n₁+k},…,ξ_{n_m+k})
    is independent of k. For a centred Gaussian sequence this is equivalent to Eξ_mξ_{m+n} being independent of m; r(n) denotes
    that covariance.
  hypotheses:
    explicit:
    - Sequence of real random variables.
    - Finite-dimensional law equality for all shifts.
    implicit: []
  quantifier_order:
  - ∀m≥1 ∀indices n_i ∀k≥0.
  constants: []

  title: Pickands tangent process and constant
  statement: For α∈(0,2], ζ_α has mean −|t|^α and covariance s^α+t^α−|t−s|^α. With η independent Exp(1), H_α:=lim_{a↓0} a^{-1}Pr(sup_{k∈ℕ}(ζ_α(ak)+η)≤0),
    whose existence, finiteness and positivity are established in Theorem 2.7.5; H_2=1/√π.
  hypotheses:

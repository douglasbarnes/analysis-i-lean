- id: 6.2.11
  kind: theorem
  book:
    number: Theorem 6.2.11
    pages:
    - 492
    - 494
    section: 6.2.3
    equations: []
  title: White Noise signal Detection minimax Rates
  statement: 'In Gaussian white noise, test \(H_0:f=0\).

    (a) Against \(\sup_{t\in[0,1]}|\int_0^t f(s)\,ds|\ge r_n\), the minimax rate is

    \(c/\sqrt n\).

    (b) Against \(f\in L^2\), \(\|f\|_{B^r_{\infty\infty}}\le B\), and

    \(\|f\|_\infty\ge r_n\), the minimax rate is

    \(c(\log n/n)^{r/(2r+1)}\).

    (c) Against \(\|f\|_{B^r_{2q}}\le B\) and \(\|f\|_2\ge r_n\), the minimax

    rate is \(cn^{-r/(2r+1/2)}\).

    The constants depend on the parameters displayed in the theorem, σ and α.'
  hypotheses:
    explicit:
    - Gaussian white-noise model with σ>0.
    - B>0 and 1≤q≤∞ where relevant.
    - Positive smoothness r is mathematically required in parts (b),(c), although the OCR-visible theorem preamble
      does not clearly quantify it.
    implicit: []
  quantifier_order:
  - For each part and every α>0 there exists the stated constant c giving both minimax upper and lower bounds.
  constants:
  - For each part and every α>0 there exists the stated constant c giving both minimax upper and lower bounds.
  dependencies:
    earlier_book:
    - Gaussian white-noise likelihood and KL
    - wavelet projection estimators
    chapter_local:
    - 6.2.1
    - 6.2.3
    - 6.2.6
    - 6.2.7
    - 6.2.9
    - 6.1.1
    - 6.1.gwn_kl
    later_book_uses:
    - Part (b) is used in the impossibility proof for adaptive L∞ confidence sets in Chapter 8.
    - Part (c) is used in Chapter 8 for adaptive L² confidence-set lower bounds.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

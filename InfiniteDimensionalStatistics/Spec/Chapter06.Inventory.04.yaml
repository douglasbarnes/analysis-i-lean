- id: 6.2.9
  kind: theorem
  book:
    number: Theorem 6.2.9
    pages:
    - 489
    - 491
    section: 6.2.2
    equations: []
  title: Density uniformity besov L2 minimax Separation
  statement: 'Let r>0, B>1 and \(1\le q\le\infty\). In the i.i.d. density model on

    [0,1], test the uniform density 1 against bounded densities satisfying

    \[

    \max\{\|f\|_\infty,\|f\|_{B^r_{2q}}\}\le B,\qquad

    \|f-1\|_2\ge r_n.

    \]

    The minimax separation rate is

    \[

    \rho_n=Cn^{-r/(2r+1/2)},

    \]

    where C depends on r,B and α.'
  hypotheses:
    explicit:
    - r>0, B>1, 1≤q≤∞.
    - All alternatives are probability densities on [0,1].
    - The explicit L∞ bound is part of the hypothesis, not inferred silently from the Besov norm.
    implicit: []
  quantifier_order:
  - ∀α>0 ∃C=C(r,B,α)>0 such that ρₙ is a minimax L²-separation rate.
  constants:
  - ∀α>0 ∃C=C(r,B,α)>0 such that ρₙ is a minimax L²-separation rate.
  dependencies:
    earlier_book:
    - Wavelet Besov characterisation
    chapter_local:
    - 6.2.1
    - 6.2.5
    - 6.2.mixtures_lower_bound
    - 6.1.tensor_kl
    later_book_uses:
    - Used as the sampling prototype for Theorem 6.2.11(c); Exercise 6.2.5 treats L¹ separation.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''
  notes_status:
    discussed_or_extended_in_notes: false
    note_summary: ''
    used_later_in_book: true
  equivalents:

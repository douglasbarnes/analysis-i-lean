      exact_equivalent: false
      status: No exact equivalent found in bounded audit.
      candidates: []
    repository:
      exact_equivalent: false
      status: No exact equivalent found on main in bounded audit.
      candidates: []
  likely_lean_representation:
    sketch: A wavelet U-statistic upper bound and a Rademacher-code/mixture lower bound.
    blockers: &id001
    - 'Official hardback errata: the first display on p.490 should read `(1/n)^{r/(2r+1/2)}`; the specification
      states the corrected coherent rate and records this explicitly.'

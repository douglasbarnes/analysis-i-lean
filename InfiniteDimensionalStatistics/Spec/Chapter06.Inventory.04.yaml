- id: 6.2.13
  kind: proposition
  book:
    number: Proposition 6.2.13
    pages:
    - 496
    section: 6.2.4
    equations: []
  title: Test From Estimator composite Null
  statement: 'Suppose \(\sup_{f\in\mathcal F}E_fd(\hat f_n,f)\le r_n\). For

    \(H_0\subseteq\mathcal F\) and

    \(H_1\subseteq\mathcal F\cap\{f:d(f,H_0)\ge c r_n\}\), with \(c\ge4/\alpha\),

    define

    \[

    T_n=d(\hat f_n,H_0),\qquad \phi_n=1\{T_n>2r_n/\alpha\}.

    \]

    Then for every n,

    \[

    \sup_{f\in H_0}E_f\phi_n+\sup_{f\in H_1}E_f(1-\phi_n)\le\alpha.

    \]'
  hypotheses:
    explicit:
    - The distance-to-set map and estimator are measurable.
    - d is a metric/semimetric satisfying the triangle inequality.
    - α>0 and c≥4/α.
    implicit: []
  quantifier_order:
  - ∀α>0, ∀c≥4/α, ∀n, the displayed test has total worst-case error ≤α.
  constants:
  - ∀α>0, ∀c≥4/α, ∀n, the displayed test has total worst-case error ≤α.
  dependencies:
    earlier_book: []
    chapter_local:
    - 6.2.2
    later_book_uses:
    - Used in Chapter 8 confidence-set lower/upper reductions.
  proof_status:
    delegates_to_exercises: []
    contains_omitted_steps: false
    comment: ''

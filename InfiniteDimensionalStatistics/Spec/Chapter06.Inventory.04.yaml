- id: 6.2.infimum_chisq
  kind: operative_example
  book:
    number: Infimum chi-square test (6.54)-(6.58)
    pages:
    - 496
    - 497
    section: 6.2.4
    equations: []
  title: White Noise infimum Chi Square Test
  statement: 'In Gaussian white noise define, for \(h\in H_0\),

    \[

    T_n(h)=\|\hat f_n(j_n)-K_{j_n}h\|_2^2-\sigma^2 2^{j_n}/n,\qquad

    T_n=\inf_{h\in H_0}|T_n(h)|,

    \]

    and reject when \(T_n\ge\tau_n\). The statistic searches for a null element

    whose projected quadratic discrepancy is compatible with noise.'
  hypotheses:
    explicit:
    - H₀ is a subset of L² and K_j is the wavelet projection.
    - A measurable infimum/minimiser exists or a countable dense replacement is used.
    implicit: []
  quantifier_order:
  - For every resolution and threshold define the test; Theorem 6.2.14 supplies its uniform error bound.
  constants:
  - For every resolution and threshold define the test; Theorem 6.2.14 supplies its uniform error bound.
  dependencies:
    earlier_book: []
    chapter_local:
    - 6.2.3
    - 6.2.13
    later_book_uses:
    - Theorem 6.2.14 and Corollaries 6.2.15-6.2.16.
  proof_status:
    delegates_to_exercises:
    - Exercise 6.2.2
    contains_omitted_steps: true
    comment: Exercise 6.2.2 supplies existence and measurability of minimisers/infimum statistics.
  notes_status:

- id: 6.2.composite_ks
  kind: operative_example
  book:
    number: Composite Kolmogorov-Smirnov statistic (6.51)
    pages:
    - 495
    - 496
    section: 6.2.4
    equations: []
  title: Composite Kolmogorov Smirnov Test
  statement: 'For a composite null \(H_0\) of distribution functions, use

    \[

    T_n=\inf_{G\in H_0}\|F_n-G\|_\infty

    \]

    and reject for large T_n. The triangle inequality controls power against

    alternatives separated from \(H_0\) in uniform distance.'
  hypotheses:
    explicit:
    - The infimum statistic is measurable or an explicitly measurable approximation is used.
    - The empirical distribution function is formed from i.i.d. observations.
    implicit: []
  quantifier_order:
  - For every null class H₀ and threshold, define the infimum-distance test; its risk is bounded by the estimator
    reduction.
  constants:
  - For every null class H₀ and threshold, define the infimum-distance test; its risk is bounded by the estimator
    reduction.
  dependencies:

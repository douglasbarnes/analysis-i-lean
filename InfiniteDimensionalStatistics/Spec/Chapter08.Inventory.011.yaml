- id: ch8.lemma_8_3_13
  kind: lemma
  book:
    number: Lemma 8.3.13
    pages:
    - 645
    section: 8.3.3
    equations:
    - '8.3'
  title: Lower-tail control for the L∞ Lepski selector under self-similarity
  statement: Let f∈B^s_{∞,∞} satisfy the self-similarity condition (8.78), let j_n^* and j̄_n be defined by (8.24)
    and (8.25), and let J=[j_min,j_max]∩ℕ with J₀≤j_min<j_max. There exists m depending only on ε,τ,s and a constant
    c′>0 such that, for every j<j_n^*−m, P_f(j̄_n=j)≤(c′)^{-1} exp(−c′ ε² 2^{2ms} j), and P_f(j̄_n<j_n^*−m)≤(c′)^{-1}
    exp(−c′ ε² 2^{2ms} j_min).
  source_fidelity: exact-transcription-with-page-image-flag
  hypotheses:
    explicit:
    - f∈B^s_{∞,∞}
    - f satisfies (8.78) with ε>0 and J₀
    - j_n^* and j̄_n are those of (8.24) and (8.25)
    - J=[j_min,j_max]∩ℕ and J₀≤j_min<j_max
    - τ is in the range required by the selector
    implicit:
    - c′ is positive and uniform in n,f,j once the displayed parameters are fixed.
  quantifier_order:
  - Fix ε,τ,s
  - Choose m=m(ε,τ,s)
  - Choose c′>0
  - For every admissible n and j<j_n^*−m assert the point bound
  - Then assert the lower-tail union bound
  constants:
  - m depends only on ε,τ,s.
  - c′ is independent of n,f,j.
  dependencies:
    earlier_book:
    - Proposition 5.1.12 Gaussian concentration
    chapter_local:
    - ch8.linfty_self_similarity_8_78
    - ch8.linfty_oracle_8_24
    - ch8.linfty_lepski_8_25
    later_book_uses:
    - ch8.smoothness_estimator_8_83_85
    - ch8.theorem_8_3_15

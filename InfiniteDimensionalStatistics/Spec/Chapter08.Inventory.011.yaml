    - 644
    section: 8.3.3
    equations:
    - '8.78'
  title: L∞ self-similarity
  statement: A function f of Hölder smoothness s is self-similar if there exist ε>0 and J₀∈ℕ such that for every
    j≥J₀, ‖K_jf−f‖∞≥ε‖f‖_{B^s_{∞,∞}}2^{-js}.
  source_fidelity: exact-paraphrase
  hypotheses:
    explicit:
    - s=s(f) in the motivating definition
    - fixed projection family K_j
    implicit:
    - The norm is nonzero for nontrivial lower bounds; zero function is excluded unless conventionally handled.
  quantifier_order:
  - There exist ε,J₀
  - For every j≥J₀ assert lower bias bound
  constants:
  - ε and J₀ are model parameters in uniform theorems.

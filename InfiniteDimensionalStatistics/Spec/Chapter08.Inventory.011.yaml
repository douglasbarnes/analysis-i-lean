    - white-noise model
    - r>0
    - 0<α<1/2
    implicit:
    - The precise pointwise quantification of o_P over f is suppressed in the compact statement.
  quantifier_order:
  - Fix α,r and sub-rate r_n
  - Assume coverage for every f and pointwise diameter
  - derive contradiction

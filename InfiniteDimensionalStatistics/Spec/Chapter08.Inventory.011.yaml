  title: No pointwise confidence sets without qualitative radius constraints
  statement: For 0<α<1/2, no random subset C_n of L2 can simultaneously have liminf_nP_f(f∈C_n)≥1−α for every f∈B^r_{2,∞}
    and |C_n|₂=o_{P_f}(r_n) at any sequence r_n=o(n^{-r/(2r+1/2)}).
  source_fidelity: exact-paraphrase

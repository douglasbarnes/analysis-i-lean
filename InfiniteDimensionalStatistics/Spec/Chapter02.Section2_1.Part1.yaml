- id: definition-2-1-1
  kind: definition
  book:
    number: 2.1.1
    pages:
    - 16
    section: '2.1'
    equations: []
  title: Version and strict version
  statement: Processes X and Y indexed by T are versions when every finite vector (X(t₁),…,X(tₙ)) has the same law as (Y(t₁),…,Y(tₙ));
    they are strict versions (modifications) when Pr(X(t)=Y(t))=1 for every t∈T.
  hypotheses:
    explicit:
    - X and Y are real processes on (possibly different for version, common for strict version) probability spaces.
    - n≥1 and t₁,…,tₙ∈T for finite-dimensional-law equality.
    implicit:
    - For strict versions, coordinatewise almost-sure equality implies equal finite-dimensional laws.
  quantifier_order:
  - 'Version: ∀n≥1 ∀t₁…tₙ, law vectors equal.'
  - 'Strict version: ∀t∈T, Pr[X(t)=Y(t)]=1.'
  constants:
  - 'Strict version: ∀t∈T, Pr[X(t)=Y(t)]=1.'

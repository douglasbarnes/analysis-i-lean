- id: definition-2-1-2a
  kind: definition
  book:
    number: 2.1.2a
    pages:
    - 16
    section: '2.1'
    equations: []
  title: Separable process
  statement: 'Let (T,d) be a metric or pseudometric space and X:T×Ω→ℝ a process. The process X is separable when there exist
    a countable set T₀⊆T and a set Ω₀⊆Ω with Pr(Ω₀)=1 such that, for every ω∈Ω₀, every t∈T and every ε>0, X(t,ω) belongs to
    the closure in ℝ of {X(s,ω) : s∈T₀∩B_d(t,ε)}, where B_d(t,ε) is the open d-ball.'
  hypotheses:
    explicit:
    - (T,d) is a metric or pseudometric space.
    - X:T×Ω→ℝ is a stochastic process on (Ω,𝒜,Pr).
    implicit:
    - Closure is taken in ℝ.
    - One common full-probability set Ω₀ works simultaneously for every t and ε.
    - The countable separant T₀ need not be prescribed in advance.
  quantifier_order:
  - ∃ T₀⊆T, Countable T₀, ∃ Ω₀⊆Ω, Pr(Ω₀)=1, ∀ ω∈Ω₀, ∀ t∈T, ∀ ε>0, X(t,ω)∈closure {X(s,ω) | s∈T₀∩B_d(t,ε)}.
  constants:
  - ∃ T₀⊆T, Countable T₀, ∃ Ω₀⊆Ω, Pr(Ω₀)=1, ∀ ω∈Ω₀, ∀ t∈T, ∀ ε>0, X(t,ω)∈closure {X(s,ω) | s∈T₀∩B_d(t,ε)}.

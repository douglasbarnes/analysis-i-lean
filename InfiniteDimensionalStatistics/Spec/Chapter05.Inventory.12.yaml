- id: ch5.thm.5_3_9
  kind: theorem
  book:
    number: Theorem 5.3.9
    pages:
    - 460
    - 461
    section: 5.3.2
    equations: []
  title: Theorem 5.3.9
  statement: 'Under Lemma 5.3.5, both deconvolution estimators satisfy E‖fₙ−Efₙ‖²₂≤C2^j/(δ_j²n), with C=1/(2π) in
    the wavelet case and C=‖K‖²₂/(2π) in the convolution case. For the Besov ball B(s,L): (a) under |F[ϕ](t)|≥C
    exp(−c₀|t|^α) and jₙ=α^{-1}log₂(ν log n), c₀a^αν<1/2, sup_f E‖fₙ−f‖²₂≤L′(log n)^{-2s/α}; (b) under |F[ϕ](t)|≥C(1+t²)^{-w/2}
    and 2^{jₙ}≈(n/log n)^{1/(2s+2w+1)}, sup_f E‖fₙ−f‖²₂≤L″n^{-2s/(2s+2w+1)}.'
  source_fidelity: *id004
  hypotheses:
    explicit:
    - Lemma 5.3.5 assumptions.
    - f ranges over the stated B^s_{2∞} ball.
    - Severe or moderate error Fourier lower bound.
    - s>0 for wavelets; 0<s<S for convolution kernels.
    implicit:
    - The displayed part (b) rate intentionally has no log factor although the integer resolution is described using
      n/log n; preserve the text.
  quantifier_order:
  - Uniformly over f in B(s,L), for all n≥1.
  constants:
  - Exact C values, L′,L″.
  dependencies:
    earlier_book:
    - Plancherel theorem and Besov L² approximation
    chapter_local:
    - ch5.lem.5_3_5
    - ch5.eq.5_122
    later_book_uses:
    - Exercises 5.3.8, 5.3.10, 5.3.11
  proof_status: *id001
  notes_status: *id002
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Fourier.Convolution
      - Mathlib.MeasureTheory.Measure.CharacteristicFunction.Basic
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: Exact integrated variance calculation via Plancherel, then bias–variance rates.
    blockers:
    - Fourier/Plancherel normalisation and Besov approximation.
  difficulty: major-library

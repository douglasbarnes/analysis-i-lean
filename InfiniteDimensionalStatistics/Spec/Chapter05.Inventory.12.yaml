- id: ch5.prop.5_3_7
  kind: proposition
  book:
    number: Proposition 5.3.7
    pages:
    - 458
    - 459
    section: 5.3.2
    equations: []
  title: Proposition 5.3.7
  statement: For f in a B^s_{∞∞} ball, combine (5.119) with (5.122). If |F[ϕ](t)|≥C exp(−c₀|t|^α), choose jₙ=α^{-1}log₂(ν
    log n) with c₀a^αν<1/2 to obtain sup-norm risk O((log n)^{-s/α}). If |F[ϕ](t)|≥C(1+t²)^{-w/2}, choose 2^{jₙ}≈(n/log
    n)^{1/(2s+2w+1)} to obtain O((log n/n)^{s/(2s+2w+1)}).
  source_fidelity:
    transcription_status: verified_with_constant_review
    author_corrected_reading: null
  hypotheses:
    explicit:
    - Theorem 5.3.6 assumptions.
    - f in the specified Besov ball.
    - Severe or moderate lower bound on the error Fourier transform.
    - s>0 in wavelet case and 0<s<S in convolution case.
    implicit:
    - The risk is expected sup norm, uniformly over the ball.
    - Constants depend on class radius and kernel/error parameters.
  quantifier_order:
  - For all n and uniformly over f in the ball.
  constants:
  - c₀,α,ν,a,w,C.
  dependencies:
    earlier_book:
    - Besov approximation bounds
    chapter_local:
    - ch5.thm.5_3_6
    - ch5.eq.5_122
    later_book_uses:
    - Proposition 5.3.8

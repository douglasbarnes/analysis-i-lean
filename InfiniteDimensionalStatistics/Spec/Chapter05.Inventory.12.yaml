- id: ch5.prop.5_3_8
  kind: proposition
  book:
    number: Proposition 5.3.8
    pages:
    - 459
    - 460
    section: 5.3.2
    equations: []
  title: Proposition 5.3.8
  statement: Let s,α,L,b>0 and β,w≥0. Let f∈A_{α,s}(L), and assume |F[ϕ](t)|≥b(1+t²)^{−w/2}e^{−β|t|^r} for every
    t∈ℝ and some r>0, with β=0 or r=s. Let φ,ψ be the band-limited wavelets of Theorem 4.2.9, with supp F[φ]⊆[−a,a]
    and supp F[ψ]∩[−a′,a′]=∅, and let f_n(·,j) be the deconvolution wavelet density estimator. There exist c′>0
    depending on φ,ψ,α,s and c>0 depending on φ,ψ such that, whenever 2^j j<n, E‖f_n(·,j)−f‖_∞ ≤ c′√L e^{−α(a′)^s2^{js}}2^{j(1−s)/2}
    + [c(‖g‖_∞∨1)/δ_j]√(2^j j/n). Consequently, for 2^{j_n}=[(log n)/(2α(a′)^s+2βa^s)]^{1/s} and n≥e^e, E‖f_n(·,j_n)−f‖_∞
    ≤ C (log n)^{(w+1/2)/s}(log log n)^{1/2} n^{−α(a′)^s/(2α(a′)^s+2βa^s)}, where C depends on φ,ψ,α,β,s,w,b and
    ‖g‖_∞.
  source_fidelity:
    transcription_status: verified
    author_corrected_reading: null
  hypotheses:
    explicit:
    - s>0, α>0, L>0, b>0, β≥0 and w≥0.
    - f∈A_{α,s}(L).
    - '|F[ϕ](t)|≥b(1+t²)^{−w/2}e^{−β|t|^r} for all t and some r>0.'
    - β=0 or r=s.
    - φ and ψ satisfy Theorem 4.2.9, with Fourier support constants a,a′ as stated.
    - f_n(·,j) is the corresponding deconvolution wavelet density estimator.
    - 2^j j<n for the nonasymptotic bound.
    implicit:
    - δ_j is the lower Fourier-modulus constant defined before Lemma 5.3.5.
    - g is the density of the contaminated observation.
    - The displayed j_n is interpreted through an admissible integer rounding without changing the asymptotic rate.
  quantifier_order:
  - Fix all model, smoothness and wavelet parameters.
  - For every n,j with 2^j j<n, apply the first bound.
  - Then choose j=j_n as displayed and take n≥e^e.
  constants:
  - c′ depends on φ,ψ,α,s; c depends on φ,ψ.
  - C depends on φ,ψ,α,β,s,w,b and ‖g‖∞.
  - 2^{j_n}=[(log n)/(2α(a′)^s+2βa^s)]^{1/s}.
  dependencies:
    earlier_book: *id005
    chapter_local:
    - ch5.def.A_alpha_s
    - ch5.thm.5_3_6
    - ch5.eq.5_122
    later_book_uses:
    - Exercises 5.3.9–5.3.10
  proof_status: *id001
  notes_status: *id002
  equivalents:
    mathlib:
      status: no exact declaration found in targeted search
      candidates:
      - Mathlib.Analysis.Fourier.Convolution
      - Mathlib.MeasureTheory.Measure.CharacteristicFunction.Basic
      exact_equivalent: false
    repository: *id003
  likely_lean_representation:
    sketch: Exponential Fourier-tail bias plus Theorem 5.3.6 variance, followed by explicit balancing.
    blockers:
    - Meyer support geometry and exponential-weight estimates.
  difficulty: research-level
  pass: core

- id: ch7.lemma.7.3.4
  kind: lemma
  book:
    number: Lemma 7.3.4
    pages:
    - 576
    - 577
    section: 7.3.1
    equations: []
  title: White-noise integrated-likelihood denominator bound
  statement: "Let ε>0 and let ν be a probability measure on\n  B={f∈F : ||f-f₀||₂²≤ε²/σ²}.\nFor every c>0 and n≥1,\n  P^W(\
    \ ∫_B exp{(√n/σ)∫₀¹(f-f₀)dW - (n/(2σ²))||f-f₀||₂²} dν(f)\n       ≤ exp{-(1+c)nε²/σ²} )\n  ≤ σ²/(c² n ε²)."
  hypotheses:
    explicit:
    - ε>0, σ>0, c>0 and n≥1.
    - ν is a probability measure supported on B={f:||f-f₀||₂²≤ε²/σ²}.
    - The stochastic integral and the ν-integral are measurable.
    implicit:
    - The proof in the book sets σ=1 only to simplify notation; the displayed statement retains the exact σ-dependent constants.
    - The Gaussian isometry and Jensen bound the variance of the ν-averaged stochastic integral.
  quantifier_order:
  - ∀ ε,σ,c>0, ∀n≥1, ∀ probability measures ν supported on B, the probability bound holds.
  constants:
  - 'Support radius squared: ε²/σ².'
  - 'Likelihood threshold exponent: -(1+c)nε²/σ².'
  - 'Right-hand side: σ²/(c²nε²).'
  dependencies:
    earlier_book:
    - Gaussian isometry
    - Chebyshev's inequality
    chapter_local:
    - ch7.def.whiteNoisePosterior

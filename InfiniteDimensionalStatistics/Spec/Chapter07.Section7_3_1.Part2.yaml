    section: 7.3.1
    equations: []
  title: L² contraction from approximation-kernel sieves
  statement: "Let K_j satisfy Conditions 5.1.1 on [0,1]. Under the white-noise setup, assume the\nprior L²-small-ball condition\
    \ and sieve-tail condition of Theorem 7.3.5. Choose jₙ\nwith 2^{jₙ}≍nεₙ² and assume\n  Π(f:||K_{jₙ}f-f||₂>εₙ)≤L e^{-(C+4)nεₙ²},\n\
    \  ||K_{jₙ}f₀-f₀||₂≤εₙ.\nThen the posterior contracts around f₀ in L² at rate εₙ."
  hypotheses:
    explicit:
    - Approximation kernel satisfies Chapter 5 conditions.
    - All prior mass/tail conditions.
    - Resolution balance.
    - True and prior approximation bounds.
    implicit:
    - Corollary 6.2.15 supplies tests on the approximation sieve.
  quantifier_order:
  - For M sufficiently large, posterior L² mass outside Mεₙ tends to zero.

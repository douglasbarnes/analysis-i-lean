  title: General posterior contraction theorem in Gaussian white noise
  statement: "Let F⊂L² be Borel, dY∼P^Y_{f₀}, and Π=Πₙ. Let εₙ→0 and √nεₙ→∞.\nFor fixed C,L assume:\n(i) Π(||f-f₀||₂≤εₙ)≥e^{-Cnεₙ²} (officially corrected from εₙ² on the norm);\n(ii) Π(F\\Fₙ)≤L e^{-(C+4)nεₙ²};\n(iii) tests φₙ satisfy E_{f₀}φₙ→0 and\n      sup_{f∈Fₙ:d(f,f₀)≥Mεₙ}E_f(1-φₙ)≤L e^{-(C+4)nεₙ²}.\nThen the posterior contracts at rate εₙ in d."
  hypotheses:
    explicit:
    - F Borel in L².
    - White-noise posterior exists.
    - Prior mass, sieve tail, and tests as displayed.
    implicit:
    - d-balls are measurable.
  quantifier_order:
  - For M sufficiently large, posterior outside the Mεₙ ball tends to zero in P^Y_{f₀}-probability.

name: Repair Chapter 8 Rate Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-chapter8-rate-labels.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Relabel unnumbered rate definitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('InfiniteDimensionalStatistics/Spec/Chapter08.Inventory.001.yaml'): (
                  'number: Theorem 8.1.1 rate',
                  'number: unnumbered rate preceding Theorem 8.1.1',
              ),
              Path('InfiniteDimensionalStatistics/Spec/Chapter08.Inventory.003.yaml'): (
                  'number: Theorem 8.1.3 rate',
                  'number: unnumbered rate preceding Theorem 8.1.3',
              ),
          }
          changed = False
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
                  changed = True
          if not changed:
              raise SystemExit('No Chapter 8 rate labels required repair')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add InfiniteDimensionalStatistics/Spec/Chapter08.Inventory.001.yaml \
                  InfiniteDimensionalStatistics/Spec/Chapter08.Inventory.003.yaml
          git commit -m 'Disambiguate Chapter 8 rate labels'
          git push origin HEAD:main

name: Normalise Chapter 1 Labels

on:
  pull_request:
    paths:
      - '.github/workflows/normalise-chapter01-labels.yml'
      - 'InfiniteDimensionalStatistics/Spec/Chapter01.yaml'

permissions:
  contents: write
  pull-requests: write

jobs:
  normalise:
    if: github.head_ref == 'repair/chapter01-canonical-schema'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Separate declaration labels from equation references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          path = Path('InfiniteDimensionalStatistics/Spec/Chapter01.yaml')
          doc = yaml.safe_load(path.read_text(encoding='utf-8'))
          pattern = re.compile(r'^(Definition|Lemma|Proposition|Theorem|Corollary|Example|Remark|Exercise|Item)\s+\d+(?:\.\d+){1,2}\*?')
          labels = []
          for entry in doc['inventory']:
              raw = str(entry['book']['number'])
              match = pattern.match(raw)
              if match:
                  label = match.group(0)
                  entry['book']['number'] = label
                  equations = list(entry['book'].get('equations') or [])
                  for equation in re.findall(r'\((1\.\d+)\)', raw[len(label):]):
                      if equation not in equations:
                          equations.append(equation)
                  entry['book']['equations'] = equations
                  labels.append(label)
          doc['completeness_check']['expected_numbered_labels'] = labels
          doc['completeness_check']['found_numbered_labels'] = labels
          doc['completeness_check']['missing_numbered_labels'] = []
          path.write_text(yaml.safe_dump(doc, sort_keys=False, allow_unicode=True, width=120), encoding='utf-8')
          print('Numbered labels:', labels)
          PY
      - name: Validate Chapter 1 strictly in isolation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/chapter01-label-validation"
          mkdir -p "$root/scripts" "$root/InfiniteDimensionalStatistics/Spec"
          cp scripts/validate_ids_specs.py "$root/scripts/"
          cp InfiniteDimensionalStatistics/BookManifest.yaml "$root/InfiniteDimensionalStatistics/"
          cp InfiniteDimensionalStatistics/Spec/Chapter01.yaml "$root/InfiniteDimensionalStatistics/Spec/"
          cd "$root"
          python scripts/validate_ids_specs.py --allow-missing 2>&1 | tee validation.log
      - name: Commit label normalisation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add InfiniteDimensionalStatistics/Spec/Chapter01.yaml
          git commit -m 'Normalise Chapter 1 declaration labels'
          git push origin HEAD:${{ github.head_ref }}
      - name: Post validation summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          root="$RUNNER_TEMP/chapter01-label-validation"
          {
            echo '### Chapter 1 declaration-label normalisation'
            echo
            echo '```text'
            if [ -f "$root/validation.log" ]; then cat "$root/validation.log"; else echo 'Validation did not run.'; fi
            echo '```'
          } > "$RUNNER_TEMP/chapter01-label-comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/chapter01-label-comment.md"

name: Import Chapter 7 specification

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: read

jobs:
  import:
    if: >-
      github.actor == 'douglasbarnes' &&
      github.event.issue.title == 'IDS Chapter 7 YAML upload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct verified YAML
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const parts = new Map();
            for (const comment of comments) {
              const match = comment.body.match(/^CH7PART (\d{2})\/20\n([A-Za-z0-9+/=]+)$/s);
              if (match) parts.set(Number(match[1]), match[2]);
            }
            if (parts.size !== 20) {
              throw new Error(`Expected 20 chunks, found ${parts.size}`);
            }
            let encoded = '';
            for (let index = 0; index < 20; index += 1) {
              if (!parts.has(index)) throw new Error(`Missing chunk ${index}`);
              encoded += parts.get(index);
            }
            if (encoded.length !== 298408) {
              throw new Error(`Unexpected base64 length ${encoded.length}`);
            }
            const data = Buffer.from(encoded, 'base64');
            const hash = crypto.createHash('sha256').update(data).digest('hex');
            if (hash !== 'c0860a96c6dbd0c3cec8cddc88ecda3b3b9f273b37b9b610c10c8bf06d180826') {
              throw new Error(`SHA-256 mismatch: ${hash}`);
            }
            fs.mkdirSync('InfiniteDimensionalStatistics/Spec', {recursive: true});
            fs.writeFileSync('InfiniteDimensionalStatistics/Spec/Chapter07.yaml', data);

      - name: Commit specification and remove importer
        run: |
          rm .github/workflows/import-chapter07-spec.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InfiniteDimensionalStatistics/Spec/Chapter07.yaml .github/workflows/import-chapter07-spec.yml
          git commit -m "Add Chapter 7 declaration specification"
          git push origin HEAD:main

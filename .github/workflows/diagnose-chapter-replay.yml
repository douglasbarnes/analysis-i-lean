name: Diagnose Chapter Replay Repair

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-chapter-replay.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'recovery/chapters05-06-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Replay package files
        run: |
          set -euo pipefail
          git fetch origin recovery/p1-5-chapter05-spec agent/chapter-06-spec-v5
          git checkout origin/recovery/p1-5-chapter05-spec -- 'InfiniteDimensionalStatistics/Spec/Chapter05*.yaml'
          git checkout origin/agent/chapter-06-spec-v5 -- 'InfiniteDimensionalStatistics/Spec/Chapter06*.yaml'
      - name: Diagnose transformations
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY' > "$RUNNER_TEMP/diagnose.log" 2>&1
          from pathlib import Path
          import yaml

          spec = Path('InfiniteDimensionalStatistics/Spec')
          targets = {
              'ch5.cond.K1_K5', 'ch5.def.D_class', 'ch5.prop.5_1_21',
              'ch5.ex.haar_extreme', 'ch5.prop.5_1_22',
              'ch5.ex.convolution_extreme', 'ch5.prop.5_1_23',
          }
          found = {}
          for path in sorted(spec.glob('Chapter05.Inventory.*.yaml')):
              doc = yaml.safe_load(path.read_text(encoding='utf-8'))
              for entry in doc.get('inventory', []):
                  if entry.get('id') in targets:
                      found[entry['id']] = str(path)
          print('Chapter 5 target locations:', found)
          print('Chapter 5 missing targets:', sorted(targets - set(found)))

          print('\nChapter 6 parse failures before repair:')
          failures = []
          for path in sorted(spec.glob('Chapter06.Inventory.*.yaml')):
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              except yaml.YAMLError as exc:
                  failures.append(path)
                  print(path)
                  print(exc)
          print('Failure count:', len(failures))

          validator = Path('scripts/validate_ids_specs.py').read_text(encoding='utf-8')
          old = '''    kind = str(entry.get("kind", "")).replace("_", "-").lower()\n    number = str(nested(entry, "book", "number") or "")\n    if kind == "exercise":\n        if pass_value != "exercise":\n            errors.append(f"{loc}: exercise must use exercise pass")\n        reasons = entry.get("selection_reasons")\n        if not isinstance(reasons, (dict, list)) or not reasons:\n            errors.append(f"{loc}: selected exercise needs selection_reasons")\n    elif pass_value == "exercise":\n        errors.append(f"{loc}: non-exercise may not use exercise pass")\n    if pass_value == "starred" and "*" not in number:\n        errors.append(f"{loc}: starred pass requires an explicit book star")\n    if "*" in number and kind != "exercise" and pass_value != "starred":\n        errors.append(f"{loc}: explicitly starred book item must use starred pass")\n    if not allow_source_blockers:\n        status = str(entry.get("transcription_status", ""))\n'''
          print('\nValidator source-star block found:', old in validator)
          descriptor = '''    chapter, descriptor, inventory, dag = load_chapter(path)\n    errors: list[str] = []\n'''
          print('Validator descriptor block found:', descriptor in validator)

          schema = (spec / 'Schema.md').read_text(encoding='utf-8')
          marker = 'Difficulty must not alter the pass. In the canonical representation, a non-exercise entry may use `starred` only when the book number or label explicitly contains the source star.\n'
          print('Schema marker found:', marker in schema)
          PY
          status=$?
          cat "$RUNNER_TEMP/diagnose.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Post diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Replay repair diagnostics'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/diagnose.log" 2>/dev/null || true
            echo '```'
          } > "$RUNNER_TEMP/diagnose-comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/diagnose-comment.md"

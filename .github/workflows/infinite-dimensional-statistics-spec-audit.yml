# Pull-request trigger used to obtain inspectable package-audit logs.
name: Infinite-Dimensional Statistics Spec Audit

on:
  push:
    branches: [main]
    paths:
      - 'InfiniteDimensionalStatistics/Spec/**'
      - 'InfiniteDimensionalStatistics/BookManifest.yaml'
      - 'scripts/validate_ids_specs.py'
      - '.github/workflows/infinite-dimensional-statistics-spec-audit.yml'
  pull_request:
    paths:
      - 'InfiniteDimensionalStatistics/Spec/**'
      - 'InfiniteDimensionalStatistics/BookManifest.yaml'
      - 'scripts/validate_ids_specs.py'
      - '.github/workflows/infinite-dimensional-statistics-spec-audit.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repair-chapter-8-labels:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/ids-spec-packages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Relabel unnumbered rate definitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('InfiniteDimensionalStatistics/Spec/Chapter08.Inventory.001.yaml'): (
                  'number: Theorem 8.1.1 rate',
                  'number: unnumbered rate preceding Theorem 8.1.1',
              ),
              Path('InfiniteDimensionalStatistics/Spec/Chapter08.Inventory.003.yaml'): (
                  'number: Theorem 8.1.3 rate',
                  'number: unnumbered rate preceding Theorem 8.1.3',
              ),
          }
          changed = False
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
                  changed = True
          print('changed=' + str(changed).lower())
          PY
          if git diff --quiet; then
            echo 'No label repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add InfiniteDimensionalStatistics/Spec/Chapter08.Inventory.001.yaml \
                  InfiniteDimensionalStatistics/Spec/Chapter08.Inventory.003.yaml
          git commit -m 'Disambiguate Chapter 8 rate labels'
          git push origin HEAD:${{ github.head_ref }}

  chapter-package-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter: ['03', '08']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Isolate chapter package
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ids-chapter-${{ matrix.chapter }}"
          mkdir -p "$root/scripts" "$root/InfiniteDimensionalStatistics/Spec"
          cp scripts/validate_ids_specs.py "$root/scripts/"
          cp InfiniteDimensionalStatistics/BookManifest.yaml "$root/InfiniteDimensionalStatistics/"
          cp InfiniteDimensionalStatistics/Spec/Chapter${{ matrix.chapter }}* "$root/InfiniteDimensionalStatistics/Spec/"
      - name: Run canonical migration audit
        id: audit
        continue-on-error: true
        env:
          CHAPTER: ${{ matrix.chapter }}
        shell: bash
        run: |
          set +e
          root="$RUNNER_TEMP/ids-chapter-${{ matrix.chapter }}"
          cd "$root"
          python scripts/validate_ids_specs.py \
            --allow-missing \
            --allow-source-blockers \
            --allow-incomplete-coverage > audit.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python - <<'PY' >> audit.log 2>&1
          import collections
          import os
          from pathlib import Path
          import re
          import yaml

          chapter = os.environ["CHAPTER"]
          spec = Path("InfiniteDimensionalStatistics/Spec")
          descriptor = yaml.safe_load((spec / f"Chapter{chapter}.yaml").read_text())
          inv_meta = descriptor.get("package", {}).get("declaration_inventory", {})
          names = inv_meta.get("files") or [inv_meta.get("file")]
          rows = []
          for name in names:
              if not name:
                  continue
              doc = yaml.safe_load((spec / name).read_text())
              fragments = doc.get("inventory_files")
              if fragments:
                  for fragment in fragments:
                      rows.extend(yaml.safe_load((spec / fragment).read_text())["inventory"])
              else:
                  rows.extend(doc.get("inventory", []))
          pattern = re.compile(r"(?:Definition|Lemma|Proposition|Theorem|Corollary|Example|Remark|Exercise|Item)\s+\d+\.\d+\.\d+")
          grouped = collections.defaultdict(list)
          for entry in rows:
              raw = str(entry.get("book", {}).get("number", ""))
              match = pattern.match(raw)
              if match:
                  grouped[match.group(0)].append((entry.get("id"), raw))
          print("Duplicate numbered-label detail:")
          for label, values in sorted(grouped.items()):
              if len(values) > 1:
                  print(f"  {label}: {values}")
          PY
          fi
          cat audit.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Post diagnostic to pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          root="$RUNNER_TEMP/ids-chapter-${{ matrix.chapter }}"
          {
            echo "### Chapter ${{ matrix.chapter }} package audit"
            echo
            echo "Exit status: \`${{ steps.audit.outputs.status }}\`"
            echo
            echo '```text'
            cat "$root/audit.log"
            echo '```'
          } > "$root/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$root/comment.md"
      - name: Enforce audit result
        if: steps.audit.outputs.status != '0'
        run: exit 1

  strict-gate-status:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run strict eight-chapter gate
        run: python scripts/validate_ids_specs.py

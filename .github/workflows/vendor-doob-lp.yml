name: Vendor Doob Lp

on:
  push:
    branches:
      - 'agent/vendor-doob-lp'
    paths:
      - '.github/workflows/vendor-doob-lp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vendor-doob-lp
      - name: Fetch immutable Lean proof
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location \
            'https://raw.githubusercontent.com/raphaelrrcoelho/formal-mathfin/0445ae8d6fa1d2dbb05c7274ae5f4a9fb2cfb12d/MathFin/Foundations/DoobLp.lean' \
            --output AdvancedProbability/DoobLpImported.lean
          test "$(wc -l < AdvancedProbability/DoobLpImported.lean)" -gt 1000
      - name: Commit vendored proof
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AdvancedProbability/DoobLpImported.lean
          git diff --cached --quiet && exit 0
          git commit -m 'Vendor full Doob Lp proof'
          git push origin HEAD:agent/vendor-doob-lp

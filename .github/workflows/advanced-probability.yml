name: Advanced Probability

on:
  workflow_dispatch:

concurrency:
  group: advanced-probability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan and Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"
      - name: Restore Lean package cache
        id: lean-package-cache
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lean-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Download Mathlib cache
        if: steps.lean-package-cache.outputs.cache-hit != 'true'
        shell: bash
        run: timeout 10m lake exe cache get
      - name: Compile Advanced Probability
        shell: bash
        run: |
          set -o pipefail
          lake build AdvancedProbability 2>&1 | tee advanced-probability-build.log
      - name: Run repository audit
        shell: bash
        run: python3 scripts/check_audit.py
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-probability-build-log
          path: advanced-probability-build.log
          if-no-files-found: warn

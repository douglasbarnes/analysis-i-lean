name: Patch Lp Envelope

on:
  push:
    branches:
      - 'agent/advanced-probability'
    paths:
      - '.github/workflows/patch-lp-envelope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/advanced-probability
      - name: Apply localized Lean repairs
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('AdvancedProbability/LpMartingaleConvergenceResults.lean')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    by_cases hmem : ω ∈ s <;> simp [Set.indicator, hmem, hω]\n',
                  '    by_cases hmem : ω ∈ s\n'
                  '    · simpa [Set.indicator, hmem, Real.norm_eq_abs] using hω\n'
                  '    · simp [Set.indicator, hmem]\n',
              ),
              (
                  '      exact (ENNReal.rpow_lt_top_of_nonneg (by\n'
                  '        rw [ENNReal.toReal_ofReal hp_pos.le]\n'
                  '        positivity) (measure_ne_top μ _)).ne\n',
                  '      rw [ENNReal.toReal_one, ENNReal.toReal_ofReal hp_pos.le]\n'
                  '      exact (ENNReal.rpow_lt_top_of_nonneg\n'
                  '        (sub_nonneg.mpr ((div_le_iff₀ hp_pos).2 (by simpa using hp.le)))\n'
                  '        (measure_ne_top μ _)).ne\n',
              ),
              (
                  '    exact hcompare.trans (mul_le_mul_right (hbdd n) c)\n',
                  "    exact hcompare.trans (mul_le_mul_right' (hbdd n) c)\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-lp-envelope.yml
      - name: Commit repairs
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AdvancedProbability/LpMartingaleConvergenceResults.lean .github/workflows/patch-lp-envelope.yml
          git commit -m 'Repair Lp envelope elaboration'
          git push origin HEAD:agent/advanced-probability

name: Lean

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Probability and Measure source inventory
        shell: bash
        run: python3 scripts/extract_probability_measure_source.py
      - name: Install Elan and Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Update, build, and audit
        shell: bash
        run: |
          set -euo pipefail
          {
            lake update
            lake exe cache get
            lake build ProbabilityAndMeasure
            lake build
            python3 scripts/check_audit.py
            python3 scripts/check_probability_measure_correctness.py --baseline
          } 2>&1 | tee lean-build.log
      - name: Probability and Measure strict correctness test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_probability_measure_correctness.py --strict \
            2>&1 | tee probability-measure-strict.log
      - name: Upload build log and source inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: |
            lean-build.log
            probability-measure-strict.log
            probability-measure-envs.json
          if-no-files-found: warn

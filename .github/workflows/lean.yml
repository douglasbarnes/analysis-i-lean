name: Lean

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Update, build, and audit
        shell: bash
        run: |
          set -o pipefail
          {
            lake update
            lake exe cache get
            lake build
            python3 scripts/check_audit.py
          } 2>&1 | tee lean-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: lean-build.log
          if-no-files-found: warn

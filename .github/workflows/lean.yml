name: Lean

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan and Lean
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Compile Analysis II modules
        shell: bash
        run: |
          set -uo pipefail
          status=0
          {
            lake update
            lake exe cache get
            for file in \
              AnalysisII/UniformConvergence.lean \
              AnalysisII/NormedMetricCore.lean \
              AnalysisII/CalculusCore.lean \
              AnalysisII/CompactnessAndContractions.lean \
              AnalysisII/SequentialTopology.lean \
              AnalysisII/MeanValueAndConstancy.lean
            do
              echo "===== $file ====="
              lake env lean "$file" || status=1
            done
            echo "===== aggregate AnalysisII target ====="
            lake build AnalysisII || status=1
            python3 scripts/check_audit.py || status=1
          } 2>&1 | tee lean-build.log
          exit "$status"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log
          path: lean-build.log
          if-no-files-found: warn

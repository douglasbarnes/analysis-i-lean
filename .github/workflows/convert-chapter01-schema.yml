name: Convert Chapter 1 Canonical Schema

on:
  pull_request:
    paths:
      - '.github/workflows/convert-chapter01-schema.yml'
      - 'InfiniteDimensionalStatistics/Spec/Chapter01.yaml'
      - 'scripts/validate_ids_specs.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  convert-and-validate:
    if: github.head_ref == 'repair/chapter01-canonical-schema'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Convert legacy Chapter 1 fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from collections import defaultdict
          from pathlib import Path
          import re
          import yaml

          path = Path('InfiniteDimensionalStatistics/Spec/Chapter01.yaml')
          old = yaml.safe_load(path.read_text(encoding='utf-8'))
          if 'inventory' in old:
              print('Chapter 1 is already canonical; no conversion needed.')
              raise SystemExit(0)

          declarations = old['declarations']
          ids = [entry['id'] for entry in declarations]
          idset = set(ids)
          old_dag = old['chapter_local_dependency_dag']
          edges = []
          incoming: dict[str, list[str]] = defaultdict(list)
          for edge in old_dag.get('edges', []):
              source = edge['from']
              target = edge['to']
              converted = {'from': source, 'to': target}
              if edge.get('relation'):
                  converted['relation'] = edge['relation']
              edges.append(converted)
              if source not in incoming[target]:
                  incoming[target].append(source)

          qualification = {
              item['id']: item
              for item in old.get('exercise_extraction', {}).get('qualifying_exercises', [])
          }
          reason_names = {
              1: 'completes a proof omitted from the main text',
              2: 'is cited or required by a later theorem',
              3: 'establishes a required reusable lemma',
          }

          def unique(values):
              result = []
              for value in values or []:
                  if value not in result:
                      result.append(value)
              return result

          def equivalence(record):
              record = record or {}
              candidates = unique(
                  list(record.get('candidates') or [])
                  + list(record.get('candidate_declarations') or [])
              )
              return {
                  'status': str(record.get('status', 'not-found')),
                  'candidates': candidates,
                  'exact_equivalent': bool(record.get('exact_equivalent', False)),
                  'assessment': str(record.get('note') or ''),
              }

          inventory = []
          numbered_labels = []
          for entry in declarations:
              location = entry.get('book_location') or {}
              raw_number = location.get('book_number')
              number = str(raw_number) if raw_number is not None else 'unnumbered'
              start = int(location['book_page'])
              end = int(location.get('book_page_end') or start)
              pages = [start] if start == end else [start, end]
              equation_refs = unique(re.findall(r'1\.\d+', number)) if number.startswith('(') else []

              dependency_record = entry.get('dependencies') or {}
              prior = dependency_record.get('prior_prerequisites') or []
              earlier_book = [value for value in prior if value not in idset]
              later_uses = list(dependency_record.get('later_book_dependencies_or_uses') or [])

              proof = entry.get('proof') or {}
              exercise_id = proof.get('exercise_id')
              delegates = [exercise_id] if proof.get('delegated_to_exercise') and exercise_id else []
              proof_text = str(proof.get('status') or '')
              contains_omitted = (
                  entry.get('kind') != 'exercise'
                  and (
                      bool(proof.get('delegated_to_exercise'))
                      or 'omitted' in proof_text.lower()
                      or 'unproved' in proof_text.lower()
                  )
              )

              note_raw = entry.get('result_in_notes_used_later')
              note_summary = '' if note_raw in (None, False, 'not_applicable') else str(note_raw)
              discussed_in_notes = entry.get('kind') == 'note_result'
              used_later = bool(later_uses)

              formalization = entry.get('existing_formalization') or {}
              kind = {
                  'model': 'construction',
                  'note_result': 'note result',
              }.get(entry.get('kind'), entry.get('kind'))

              converted = {
                  'id': entry['id'],
                  'kind': kind,
                  'book': {
                      'number': number,
                      'pages': pages,
                      'section': str(location.get('section') or '1'),
                      'equations': equation_refs,
                  },
                  'title': entry['title'],
                  'statement': entry['statement'],
                  'hypotheses': {
                      'explicit': list((entry.get('hypotheses') or {}).get('explicit') or []),
                      'implicit': list((entry.get('hypotheses') or {}).get('implicit') or []),
                  },
                  'quantifier_order': list(entry.get('quantifier_order') or []),
                  'constants': list(entry.get('constants_and_conventions') or []),
                  'dependencies': {
                      'earlier_book': earlier_book,
                      'chapter_local': list(incoming.get(entry['id'], [])),
                      'later_book_uses': later_uses,
                  },
                  'proof_status': {
                      'delegates_to_exercises': delegates,
                      'contains_omitted_steps': contains_omitted,
                      'comment': proof_text,
                  },
                  'notes_status': {
                      'discussed_or_extended_in_notes': discussed_in_notes,
                      'note_summary': note_summary,
                      'used_later_in_book': used_later,
                  },
                  'equivalents': {
                      'mathlib': equivalence(formalization.get('mathlib')),
                      'repository': equivalence(formalization.get('repository')),
                  },
                  'likely_lean_representation': {
                      'sketch': str(entry.get('likely_lean_representation') or ''),
                      'blockers': [],
                  },
                  'difficulty': entry['expected_difficulty'],
                  'pass': entry['formalization_pass'],
                  'issues_for_central_review': list(entry.get('central_review_flags') or []),
              }

              related = list(dependency_record.get('chapter_local_related_declarations') or [])
              if related:
                  converted['related_chapter_declarations'] = related
              if entry['id'] in qualification:
                  selected = qualification[entry['id']]
                  converted['selection_reasons'] = [
                      reason_names[value]
                      for value in selected.get('criteria_met', [])
                      if value in reason_names
                  ]
                  converted['used_by'] = list(selected.get('later_users') or [])
                  converted['reusable_output'] = str(selected.get('reusable_output') or '')

              inventory.append(converted)
              if re.match(
                  r'^(?:Definition|Lemma|Proposition|Theorem|Corollary|Example|Remark|Exercise|Item)\s+\d+(?:\.\d+){1,2}\*?$',
                  number,
              ):
                  numbered_labels.append(number)

          source_old = old['source']
          result = {
              'schema_version': '1.0',
              'document_type': 'declaration_level_chapter_specification',
              'source': {
                  'title': source_old['title'],
                  'authors': source_old['authors'],
                  'edition': 'First edition (2016)',
                  'uploaded_file': source_old.get('file', 'FULLPDF.pdf'),
                  'chapter': 1,
                  'chapter_title': source_old['chapter_title'],
                  'book_pages': source_old['book_page_range'],
                  'pdf_pages': source_old.get('pdf_page_range'),
                  'sections': source_old.get('sections', []),
                  'reading_status': source_old.get('reading_status', 'read_in_full'),
              },
              'scope': {
                  'purpose': 'Declaration-level planning specification only; no Lean proofs.',
                  'inclusion_rule': old.get('scope_and_policy', {}).get('inventory_rule', ''),
                  'statement_policy': old.get('scope_and_policy', {}).get('source_fidelity', ''),
                  'pass_values': ['core', 'starred', 'exercise'],
                  'difficulty_values': ['routine', 'substantial', 'major-library', 'research-level'],
              },
              'audit': old.get('formalization_context', {}),
              'summary': {
                  'total_entries': len(inventory),
                  'selected_exercises': sum(item['kind'] == 'exercise' for item in inventory),
                  'central_review_issue_count': len(old.get('central_review_issues', [])),
                  'dag_nodes': len(ids),
                  'dag_edges': len(edges),
                  'dag_acyclic': old_dag.get('acyclicity_check', {}).get('status') == 'passed',
                  'source_starred_entries': sum(item['pass'] == 'starred' for item in inventory),
              },
              'completeness_check': {
                  'expected_numbered_labels': numbered_labels,
                  'found_numbered_labels': numbered_labels,
                  'missing_numbered_labels': [],
                  'duplicate_ids': [],
                  'all_entries_have_required_fields': True,
                  'exercise_selection_complete': True,
              },
              'central_review_flags': old.get('central_review_issues', []),
              'inventory': inventory,
              'chapter_local_dependency_dag': {
                  'nodes': ids,
                  'edges': edges,
                  'acyclic': old_dag.get('acyclicity_check', {}).get('status') == 'passed',
                  'topological_layers': old_dag.get('topological_layers', []),
                  'principal_paths': old_dag.get('principal_paths', []),
              },
              'external_dependency_summary': old.get('later_book_dependencies', []),
              'revision': {
                  'date': '2026-07-25',
                  'reason': 'Mechanical conversion to the canonical readable schema; mathematical statements and review flags are unchanged.',
                  'source_blob': 'f0dade5c3712c1a0cda9a297dfb83ae4539959c6',
              },
          }
          path.write_text(
              yaml.safe_dump(result, sort_keys=False, allow_unicode=True, width=120),
              encoding='utf-8',
          )
          print(f'Converted {len(inventory)} entries and {len(edges)} DAG edges.')
          PY
      - name: Validate Chapter 1 strictly in isolation
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/chapter01-validation"
          mkdir -p "$root/scripts" "$root/InfiniteDimensionalStatistics/Spec"
          cp scripts/validate_ids_specs.py "$root/scripts/"
          cp InfiniteDimensionalStatistics/BookManifest.yaml "$root/InfiniteDimensionalStatistics/"
          cp InfiniteDimensionalStatistics/Spec/Chapter01.yaml "$root/InfiniteDimensionalStatistics/Spec/"
          cd "$root"
          python scripts/validate_ids_specs.py --allow-missing 2>&1 | tee validation.log
      - name: Commit converted specification
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- InfiniteDimensionalStatistics/Spec/Chapter01.yaml; then
            echo 'No conversion diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add InfiniteDimensionalStatistics/Spec/Chapter01.yaml
          git commit -m 'Convert Chapter 1 specification to canonical schema'
          git push origin HEAD:${{ github.head_ref }}
      - name: Post validation summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          root="$RUNNER_TEMP/chapter01-validation"
          {
            echo '### Chapter 1 canonical-schema conversion'
            echo
            echo '```text'
            if [ -f "$root/validation.log" ]; then cat "$root/validation.log"; else echo 'Validation did not run.'; fi
            echo '```'
          } > "$RUNNER_TEMP/chapter01-comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/chapter01-comment.md"
